# SPDX-License-Identifier: Apache-2.0
[package]
name = "tan-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/alplabai/tan-cli/tree/main/crates/tan-core"
rust-version.workspace = true
readme = "README.md"
description = "Pure domain logic for the tan CLI: board.yaml model/validate, build-plan + system-manifest contracts, presets, and debug/doctor reports. Shared by the `tan` CLI."
keywords = ["embedded", "firmware", "board-yaml", "zephyr"]
categories = ["embedded", "development-tools", "parser-implementations"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
# `tan size` ELF-section fallback rung: read section headers directly so a real
# elf is measured even with no `arm-zephyr-eabi-size` on PATH. Read-only ELF.
object = { version = "0.36", default-features = false, features = ["read", "std"] }

[dev-dependencies]
# The section-sum unit test synthesises a tiny ELF in-memory (writer feature).
object = { version = "0.36", default-features = false, features = ["read", "write", "std"] }
