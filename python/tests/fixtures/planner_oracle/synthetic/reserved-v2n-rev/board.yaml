# Synthetic planner-oracle input (tan-cli#1424): a V2N board whose hw_rev is
# `status: reserved` in the family hw-revisions table, so every planner mode
# must refuse it with SdkRevisionNotBuildable. Carried in the fixture, not
# read from alp-sdk's examples/, so no example deletion can remove the case.
som:
  sku: E1M-V2N101
  hw_rev: r3
preset: e1m-x-evk
cores:
  m33_sm:
    app: ./src
