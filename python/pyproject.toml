[project]
# DISTRIBUTION name is `alp-tan`, not `tan`: the name `tan` is already taken on
# PyPI ("The compromising code formatter", v23.7.0), so `pip install tan` would
# fetch an unrelated package. The IMPORT package stays `tan` and the console
# script stays `tan`, so a customer still types `tan build` -- only the install
# line differs:
#
#     pip install alp-tan   ->   tan --version
#
# `tan-cli` was also free; `alp-tan` is preferred because the other Alp Lab
# artefacts are `alp-`prefixed.
name = "alp-tan"
version = "0.5.0.dev0"
description = "The Alp Lab build CLI: one board.yaml to firmware, across MCU and MPU cores."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Alp Lab AB" }]
keywords = ["embedded", "firmware", "zephyr", "yocto", "som", "build"]
# 3.12, not 3.11: the floor is what the BUILD needs, not what this package's own
# syntax needs. Zephyr's `cmake/modules/python.cmake` sets
# `PYTHON_MINIMUM_REQUIRED 3.12`, and `tan build` bakes the interpreter it
# resolves into every Zephyr slice as `-DPython3_EXECUTABLE` -- so a `tan` frozen
# against 3.11 hands Zephyr an interpreter its own configure step then rejects,
# and the customer gets an error naming Zephyr rather than tan. Same effective
# floor `tan doctor` enforces (`ZEPHYR_PYTHON_FLOOR`, tan/commands/doctor_cmd.py).
requires-python = ">=3.12"
# `pyyaml` is load-bearing, not optional: `build/system-manifest.yaml` is the ONLY
# input `tan image` and `tan size` have, and it is YAML. Without it declared here
# the PyInstaller build -- which installs exactly this set into a clean venv, see
# scripts/build_binary.sh -- ships a frozen `tan` whose `size`/`image` can never
# read a manifest. Both still degrade to a coded `*.manifest-invalid` envelope
# rather than a traceback if it is somehow absent (`tan.core.system_manifest.
# load_yaml_document`), but that is a safety net, not the plan. It is now doubly
# load-bearing: the relocated planner (`tan.planner`) reads every `metadata/**`
# YAML through it.
#
# `jsonschema` arrived WITH the planner and is the fourth runtime dependency.
# The four-name ceiling (typer, rich, pytest, pyinstaller) was scoped to the
# executor stage; the planner validates every `board.yaml` against
# `metadata/schemas/board.schema.json` under Draft 2020-12 before it plans
# anything (`tan/planner/loader.py`), and that schema is where invariants I-02
# (no top-level `os:`) and I-03 (`core_entry` is closed) are actually ENFORCED.
# Reimplementing the validator to save a dependency would move two enforced
# invariants into hand-written code -- the opposite of consume-what-exists. The
# planner `sys.exit`s with an install hint if it is absent and `tan build` turns
# that into a coded `build.plan-unavailable` envelope, never a traceback.
dependencies = ["typer>=0.12", "rich>=13", "pyyaml>=6", "jsonschema>=4.18"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Embedded Systems",
]

[project.urls]
Homepage = "https://github.com/alplabai/tan-cli"
Repository = "https://github.com/alplabai/tan-cli"
Issues = "https://github.com/alplabai/tan-cli/issues"

[project.scripts]
tan = "tan.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Explicit, so `tests/` can never be shipped by an auto-discovery change and a
# new subpackage is never silently omitted from the wheel.
[tool.setuptools.packages.find]
where = ["."]
include = ["tan*"]

# `tan init`'s scaffold trees are DATA, not code, so nothing in the import graph
# pulls them into a wheel on its own -- and without them five of the six
# templates fail (`init.template-unreadable`). The frozen binary needs the
# equivalent `--add-data`, see `scripts/build_binary.sh`.
[tool.setuptools.package-data]
"tan.templates" = ["vendored/**/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
