# board.yaml -- per-app project configuration for the
# i2c-master example.
#
# Reads the BMP581 barometer on BOARD_I2C_SENSORS via the chip-
# driver header.  Discrete master that talks to a known device at
# a known address -- contrasts with https://github.com/alplabai/alp-sdk/tree/v0.16.0/examples/peripheral-io/i2c-scanner which
# probes every 7-bit address for ACKs.
#
# Customer workflow: `tan init --from-example peripheral-io/i2c-master`, change `som.sku` to
# your MPN, edit the `preset:` (or use an inline board) if you're on a non-EVK board,
# and `tan build`.  CMakeLists.txt invokes alp-sdk's
# scripts/alp_project.py (resolved via ALP_SDK_ROOT, not part of
# this scaffolded project) at configure time + layers the
# generated alp.conf over prj.conf via EXTRA_CONF_FILE.
som:
  sku: E1M-AEN801

preset: e1m-evk
supported_boards:
  - e1m-evk
  - e1m-x-evk

# E1M pads this app uses (subset of the EVK preset's `e1m_routes:`).
pins:
  - { e1m: E1M_I2C0, macro: EVK_I2C_BUS_SENSORS, doc: "Shared sensor + IO-expander + INA236 bus" }
cores:
  m55_hp:
    app: ./src
    # Zephyr peripheral subsystem exercised by this example.  The
    # loader translates the entry to CONFIG_I2C=y in alp.conf.
    peripherals:
      - i2c

# BMP581 is populated on every member of the AEN, V2N, V2N-M1
# families per alp-sdk's metadata/chips/bmp581.yaml (not part of
# this scaffolded project) -- so this example is Ring 2
# (chip-bound, multi-family) per
# alp-sdk's scripts/check_example_portability.py classification
# (also not part of this scaffolded project).
#
# NOTE (#1269): TMP112 was here previously, but TMP112 lives on
# BRD_I2C, not on BOARD_I2C_SENSORS -- see alp-sdk's
# metadata/boards/e1m-evk.yaml i2c_devices: and
# metadata/boards/e1m-x-evk.yaml i2c_devices: (not part of this
# scaffolded project), neither of which lists a TMP112 on the sensor
# bus this example opens. BRD_I2C
# is a SEPARATE controller instance from BOARD_I2C_SENSORS regardless
# (on the E1M-AEN family, BRD_I2C is SoC I2C0, function C -- #1848), so
# repointing the bus_id would still not reach a TMP112 there. BMP581 is
# the part that is actually on BOARD_I2C_SENSORS on both supported
# boards, at the same address (0x47) on each -- see
# https://github.com/alplabai/alp-sdk/tree/v0.16.0/examples/v2n/v2n-temp-sensor for the V2N-only BRD_I2C/TMP112 pattern
# instead.
chips:
  - bmp581

diagnostics:
  log_level: info
