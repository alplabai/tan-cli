# Capture the PLATFORM-BOUND parity fixtures on all three runners (tan-cli#409).
#
# `tests/parity/test_support_bundle_oracle_parity.py`'s two cases compare
# doctor's whole check list and statuses plus the whole `inspect.context`, and
# that surface is decided by the HOST as much as by the binary: `longPaths`
# exists on Windows and nowhere else, a darwin capture freezes
# `macos-aarch64` into a check detail and adds codeLLDBExtension/lldb rows.
# So they are frozen PER PLATFORM (`tests/parity/platform_fixtures.py`), and a
# complete store needs one capture on each `sys.platform` that replays it:
# linux, win32, darwin.
#
# That is the whole reason this workflow exists. The blocker recorded on
# tan-cli#409 was "needs a win32 host, and nobody has one" -- but this
# repository already runs `windows-latest` on every PR. The machine was always
# there; what was missing was a job that captured on it.
#
# WHY THIS DOES NOT COMMIT ANYTHING. Each runner uploads the store AS IT SAW
# IT and a human merges the three. A workflow that pushed fixtures would be
# committing an oracle answer nobody read, into the one directory whose whole
# value is that its contents were reviewed -- and `PROVENANCE.txt` would have
# no author to name. Download the three artifacts and merge them with
# `platform_fixtures.merge_from(<dir>)`, which folds by key so no runner's
# entries overwrite another's.
name: capture platform fixtures

on:
  # Manual, once this file is on the default branch.
  workflow_dispatch:
  # ...and on a PR that touches the store or its reader, so the very PR that
  # introduces a platform-bound case can collect its own captures without
  # waiting for a merge. Path-filtered rather than unconditional: this builds
  # the Rust oracle on three runners, which is not something to spend on a
  # docs typo.
  pull_request:
    paths:
      - "python/tests/parity/platform_fixtures.py"
      - "python/tests/parity/test_support_bundle_oracle_parity.py"
      - "python/tests/parity/oracle_fixtures/platform_bound.json"
      - ".github/workflows/capture-platform-fixtures.yml"

jobs:
  capture:
    name: "capture (${{ matrix.os }})"
    strategy:
      # Never fail-fast: a win32 capture failing must not cancel the linux one
      # that was about to succeed. Collecting two of three is progress; losing
      # a good run to a sibling's failure is not.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout tan-cli
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: "" # keep parity with ci.yml's local-gate rationale

      - name: install alp-tan + pytest
        shell: bash
        working-directory: python
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -e ".[monitor]" pytest

      # Auto-discovered by tests/parity/oracle.py off target/{release,debug}/
      # tan{.exe} -- no TAN_RUST_BINARY needed.
      - name: build the Rust tan (the oracle being captured)
        run: cargo build --locked --bin tan

      - name: capture this platform's keys
        shell: bash
        working-directory: python
        env:
          TAN_PARITY_LIVE: "1"
          TAN_PARITY_CAPTURE: "1"
        run: |
          set -euo pipefail
          python -m pytest -q tests/parity/test_support_bundle_oracle_parity.py

      # The capture is only worth uploading if it actually WROTE this
      # platform's keys. Without this, a run where every case skipped would
      # upload the committed store unchanged and read as a successful capture
      # -- the same "green having measured nothing" shape tan-cli#409 is about.
      - name: assert this platform's keys were written
        shell: bash
        working-directory: python
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, sys
          store = pathlib.Path("tests/parity/oracle_fixtures/platform_bound.json")
          if not store.exists():
              sys.exit("::error::no platform_bound.json was written at all")
          data = json.loads(store.read_text(encoding="utf-8"))
          mine = sorted(k for k in data if k.endswith(f"::{sys.platform}"))
          print(f"captured on {sys.platform}: {mine}")
          if not mine:
              sys.exit(f"::error::nothing was captured for sys.platform={sys.platform!r}")
          PY

      - name: upload this platform's store
        uses: actions/upload-artifact@v4
        with:
          name: platform-bound-${{ matrix.os }}
          path: python/tests/parity/oracle_fixtures/platform_bound.json
          if-no-files-found: error
