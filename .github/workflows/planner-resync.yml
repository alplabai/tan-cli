# SPDX-License-Identifier: Apache-2.0
#
# ADR-0020 remediation, the half that was never built (alp-sdk#855): PROPOSE the
# `tan/planner/` re-sync an alp-sdk planner change owes, instead of waiting for
# a human to discover it.
#
# The DETECTION half already exists and works:
#
#   * alp-sdk `.github/workflows/dispatch-tan-parity.yml` fires a
#     `repository_dispatch` (`alp-sdk-planner-change`) on every push to its
#     dev/main that touches the contract surface;
#   * `parity.yml` here listens for it and runs both seams against the pushed
#     ref, so `python/tests/gates/test_planner_relocation_freshness.py` goes RED
#     within minutes of alp-sdk moving;
#   * `parity.yml`'s "pin freshness (warn only)" step warns on PR runs when
#     `PINNED_SDK_TAG` has fallen behind.
#
# What none of that does is say what the FIX is. Every catch so far
# (tan-cli#320, #485, #543, #493/#591) has been hand-carried: read the upstream
# diff, retype the delta into `tan/planner/`, recompute two sha256 tables by
# hand, move two commit pins. That is the loop this workflow closes.
#
# WHY THIS EXISTS SEPARATELY FROM parity.yml
# ------------------------------------------
# `parity.yml` is a GATE: it must stay read-only and must go red. Giving it
# `contents: write` + `pull-requests: write` so it could also open a PR would
# hand those permissions to every seam1/seam2/python-tests job on every PR,
# including ones that check out and execute an alp-sdk ref chosen by the
# dispatch payload. This job does one thing, holds the write scope for that one
# thing, and runs on triggers a fork cannot reach.
#
# TRIGGERS -- both, deliberately
# -----------------------------
#   * `repository_dispatch` gives LATENCY: the proposal lands minutes after
#     alp-sdk pushes, using the sender that ALREADY EXISTS. No new alp-sdk
#     credential, no new secret anywhere -- alp-sdk's dispatcher mints its own
#     short-lived App token and this repo's side needs only the default
#     GITHUB_TOKEN.
#   * `schedule` is the BACKSTOP, and it is not redundant. The sender's `paths:`
#     filter covers `scripts/alp_orchestrate/**`, `metadata/**`,
#     `examples/**/board.yaml`, `tests/parity/**` -- and MISSES most of the
#     hand-port sources. Measured over alp-sdk's last 400 commits touching a
#     tracked hand-port source: 7 of 29 matched none of those paths and
#     therefore fired NO dispatch at all, including `98807809` (the missing
#     `CONFIG_USE_DT_CODE_PARTITION=y`, one of the two defects tan-cli#279 cites
#     as having shipped before anything noticed) and `cb7f64ae` (alp-sdk
#     #1125/#1126, a path-traversal fix). A companion alp-sdk change widens that
#     list, but a path filter is a thing that can be wrong again, and the
#     dispatch API answers 204 whether or not anything is listening. The cron
#     needs no alp-sdk credential and no path list to be right, so it catches
#     the class rather than the instance.
#
# BOTH TRIGGERS ONLY FIRE FROM THE DEFAULT BRANCH'S COPY OF THIS FILE. That is
# GitHub's rule for `schedule` and `repository_dispatch` alike, and it is the
# #194 failure this repo already ate once (see parity.yml's own note). Measured
# 2026-08-10: `gh api repos/alplabai/tan-cli -q .default_branch` -> `dev`, so
# this goes live when it lands on `dev`. If the default branch ever moves to
# `main`, this workflow silently stops running -- there is no signal for that
# beyond the absence of runs.
#
# WHAT IT PRODUCES
# ----------------
# A PR against `dev` on `auto/planner-resync`, force-pushed so it always
# reflects the CURRENT delta rather than accumulating -- UNLESS that branch
# carries a commit this automation did not write, in which case it is left
# completely untouched and the PR is opened against a diverted branch instead
# (`auto/planner-resync-<sdk-short-sha>`; tan-cli#1002, see
# `planner_resync_branch_guard.py`'s own docstring for the full incident this
# closes -- PR #996's "NEEDS A HUMAN" hand-port work was force-pushed away by
# the next scheduled run because nothing checked what was already there). It
# NEVER merges: a re-sync can carry behavioural change under a clean merge --
# the #608 re-sync changed `-B "."` and silently satisfied tan-cli#561 without
# the subject line mentioning it -- so a human reads the diff, and rewrites
# the machine-written placeholder the script leaves above each moved pin.
#
# WHEN IT CANNOT DO THE JOB
# -------------------------
# It says so and fails, rather than opening a green PR that quietly dropped a
# file. `planner_resync.py` exits 1 when part of the re-sync needs a human
# (a 3-way conflict, a changed hand-port source, a new/removed upstream
# module; the pins covering it stay put) and 2 when the inputs are not fit
# to reason over (a pin disagreeing with its own hash table). Either way
# this job goes red (tan-cli#911: see "Surface the owed work..." below).
#
# TOKEN + THE RECURSION GUARD, stated plainly
# -------------------------------------------
# This uses the default GITHUB_TOKEN. No new secret is required and none is
# committed. The cost is GitHub's own recursion guard: a PR opened by
# GITHUB_TOKEN does not trigger `pull_request` workflows, so the re-sync PR's
# own `ci.yml`/`parity.yml` runs do NOT start by themselves. That is why the
# "Run the freshness gate against the re-synced tree" step below exists and
# why its verdict is written into the PR body: the proposal carries its own
# evidence. A reviewer who wants the full suite closes and reopens the PR (or
# pushes an empty commit), which is a one-click cost paid by a human who was
# going to read the diff anyway -- deliberately preferred over minting a
# longer-lived App/PAT credential for a bot that opens PRs.

name: planner-resync

run-name: >-
  ${{ github.event_name == 'repository_dispatch'
      && format('planner-resync (alp-sdk {0})', github.event.client_payload.sdk_ref)
      || '' }}

on:
  repository_dispatch:
    types: [alp-sdk-planner-change]
  schedule:
    # 05:23 UTC daily. Off the hour on purpose: GitHub's scheduler queues
    # heavily at :00 and a delayed cron is a delayed proposal.
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      sdk_ref:
        description: "alp-sdk ref to re-sync TO (default: origin/dev)"
        type: string
        default: "origin/dev"
      open_pr:
        description: "Open/refresh the PR (uncheck for a dry run in the job summary only)"
        type: boolean
        default: true

concurrency:
  # One proposal at a time. Two runs racing would force-push the same branch
  # from two different alp-sdk refs and the PR would describe neither.
  group: planner-resync
  cancel-in-progress: false

# tan-cli#911: `permissions:` usually lives right here -- it now sits at the
# end of the `propose` job instead (tan-cli#920: job-scoped, not workflow-
# scoped). See the comment down there for why.

jobs:
  propose:
    name: "propose · tan/planner re-sync"
    runs-on: ubuntu-latest
    # tan-cli#855: this job had NO bound at all and inherited GitHub's
    # 360-minute default. Sized against parity.yml's `seam1-plan-shape` (30,
    # "hang catcher, not a budget" -- measured 1 minute on a real run), the
    # closest sibling shape: a checkout of alp-sdk + a pip install + a bounded
    # pytest run against pinned commits. This job does MORE git plumbing on
    # top of that shape (TWO `fetch-depth: 0` checkouts instead of one, three
    # `git worktree add`s, a `git commit` + force-push, a `gh pr create/edit`)
    # but nothing here is a heavy build -- no Zephyr toolchain, no PyInstaller
    # freeze -- so seam1-plan-shape's own bound is the right order of
    # magnitude rather than something narrower.
    timeout-minutes: 30
    steps:
      # THE ONE CHECKOUT IN THIS REPOSITORY THAT KEEPS ITS CREDENTIAL, and it
      # must: the `propose` step below runs `git push -q --force-with-lease` against the
      # `auto/planner-resync` branch (or a diverted stand-in when that branch
      # is occupied -- tan-cli#1002) through the remote THIS checkout leaves
      # configured -- no later step sets up a token remote of its own. Adding
      # `persist-credentials: false` here does not fail the job at checkout
      # time; it fails several minutes later at the push, after the re-sync has
      # already been computed and committed, and the PR is then never opened.
      # Every other checkout in this repository sets it false (tan-cli#435).
      #
      # The `artipacked` ignore travels with this step (tan-cli#899): it used
      # to be a `<file>:<line>` pin in `.github/zizmor.yml`, which rotted once
      # (`140:9` -> `151:9`), pre-merge, on the tan-cli#854/#855 branch when an
      # 11-line `timeout-minutes` block landed above it with no re-pin --
      # `release.yml`'s pin is the one that rotted twice in two days, a
      # different file. Inline, neither can rot -- see `.github/zizmor.yml`'s
      # header for the full inventory and both derivations.
      - name: Check out tan-cli dev (the branch the re-sync targets)
        # tan-cli#929: a stable identity for `.github/zizmor.yml`'s INVENTORY
        # to key on, deliberately separate from this step's `name:` above --
        # renaming the DISPLAY name must not silently untrack the row that
        # excuses this step's `artipacked` suppression. Never rename this
        # without updating the matching `anchor: job=propose
        # id=artipacked-inventory-1` line in `.github/zizmor.yml`.
        id: artipacked-inventory-1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          ref: dev
          fetch-depth: 0

      # fetch-depth 0: the script reads blobs at THREE different pinned
      # commits, the oldest of which (STRICT_LOADERS_PINNED_SDK_COMMIT,
      # 26b0040e) is far older than the other two. A shallow clone makes
      # `git show <pin>:<path>` fail, which the script reports as "the bound
      # checkout cannot be the one this gate was pinned against" -- a correct
      # refusal, but for the wrong reason.
      - name: Check out alp-sdk (full history -- three pins are read)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: alplabai/alp-sdk
          path: alp-sdk
          fetch-depth: 0

      # `client_payload.*` is attacker-controlled by construction -- anyone able
      # to POST a `repository_dispatch` picks every field -- so it is carried in
      # as an ENV VAR, never interpolated into the shell, and then matched
      # against an allow-list pattern before it reaches `git`. Without both,
      # `sdk_ref: "x; curl ... | sh"` executes in a job that holds
      # `contents: write` on this repo. `inputs.sdk_ref` gets the same treatment:
      # `workflow_dispatch` needs only write access, which is a wider set than
      # the people who may push to `dev`.
      - name: Resolve the alp-sdk ref to re-sync to
        id: ref
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PAYLOAD_REF: ${{ github.event.client_payload.sdk_ref }}
          INPUT_REF: ${{ inputs.sdk_ref }}
        run: |
          set -euo pipefail
          case "${EVENT}" in
            repository_dispatch) ref="${PAYLOAD_REF:-}" ;;
            workflow_dispatch)   ref="${INPUT_REF:-}" ;;
            *)                   ref="" ;;
          esac
          [ -n "${ref}" ] || ref='origin/dev'
          # Allow-list, not a deny-list: a git ref needs none of the characters
          # a shell or an argument-injection needs. `origin/dev`, a 40-hex SHA
          # and `v0.15.0-rc1` all match; anything with a space, quote, `$`,
          # backtick, semicolon, or a leading `-` does not.
          # NOT `grep -qE`. grep is LINE-oriented, so `printf '%s' "$ref" |
          # grep -qE '^...$'` returns 0 when ANY line matches: a payload of
          # `dev\nref=attacker` passes on its first line, and the second line
          # then lands in `$GITHUB_OUTPUT` as its own key -- the precise
          # injection this guard exists to refuse. `case` tests the WHOLE
          # string, newline included. Measured both ways before choosing.
          case "${ref}" in
            ""|[!A-Za-z0-9]*|*[!A-Za-z0-9._/-]*)
              echo "::error::refusing an alp-sdk ref that is not a plain git ref: ${ref}"
              exit 1 ;;
          esac
          if [ "${#ref}" -gt 201 ]; then
            echo "::error::refusing an alp-sdk ref longer than 201 characters: ${ref}"
            exit 1
          fi
          # A dispatched SHA lands on alp-sdk dev OR main; both are fetched by
          # the checkout above, but resolve it here so a payload naming a ref
          # this clone cannot see fails HERE, with the ref in the message,
          # rather than inside the script as a per-file "gone from the bound
          # SDK checkout".
          sha="$(git -C alp-sdk rev-parse "${ref}^{commit}")"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "requested=${ref}" >> "$GITHUB_OUTPUT"
          echo "Re-syncing to alp-sdk ${ref} (${sha})"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # tan-cli#1109 fault 2, half one: the "Check out tan-cli dev" step way
      # above ran at JOB START -- if this run sat behind `concurrency:
      # group: planner-resync` for a while (a prior run of this same job, or
      # a maintainer merging a hand-port PR onto `auto/planner-resync` while
      # this run was queued), the checkout below "Propose the re-sync" reads
      # is however old THAT was, not `origin/dev`'s tip right now. That is
      # exactly how the three PRs this issue is about got generated: from the
      # tree as it stood before PR #1103 merged, because nothing re-read
      # `origin/dev` between checkout and regeneration. `-B`, not a bare
      # `checkout dev`: the initial checkout may have left `dev` detached
      # rather than as a local branch, and `git checkout -B dev origin/dev`
      # creates-or-resets the local `dev` branch to point exactly at
      # `origin/dev`'s tip either way -- not a `merge`/`rebase`: nothing has
      # run yet that could have left a local commit worth preserving here.
      - name: Pin the tan-cli dev tip this run regenerates against
        id: devtip
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin dev
          git checkout -q -B dev origin/dev
          sha="$(git rev-parse HEAD)"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "Regenerating against tan-cli dev ${sha} (origin/dev's tip as of just now, not whatever this job's checkout started from)."

      - name: Propose the re-sync
        id: resync
        shell: bash
        # `continue-on-error` is wrong here (it hides the conclusion); the exit
        # code is captured and re-raised by the final step instead, so the PR
        # still gets opened when the answer is "a human must finish this".
        run: |
          set -uo pipefail
          # `set -uo pipefail` alone does NOT clear the `-e` GitHub's bash
          # wrapper applies (`bash --noprofile --norc -e -o pipefail {0}`), so
          # without `set +e` here the script's normal exit 1 ("a re-sync is
          # owed") or exit 2 ("Refused") would kill the step before `rc=$?`
          # ever runs (tan-cli#793). `set +e` for the call, `set -e` after, so
          # `rc=$?` and everything downstream keep expecting normal semantics.
          set +e
          python python/scripts/planner_resync.py \
            --sdk-root "${GITHUB_WORKSPACE}/alp-sdk" \
            --to "${{ steps.ref.outputs.sha }}" \
            --repo-root "${GITHUB_WORKSPACE}" \
            --apply \
            --markdown "${RUNNER_TEMP}/resync.md" \
            --json "${RUNNER_TEMP}/resync.json"
          rc=$?
          set -e
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"
          # `|| echo` rather than relying on `set -e` staying off past this
          # line: an unhandled non-`Refused` exception in the script (rc=1
          # with no markdown written) must not let a bare `cat` kill the step
          # AFTER `rc` is already in `$GITHUB_OUTPUT` -- that would re-create
          # this issue's own "red X with no explanation" and skip both
          # "Open or refresh the proposal PR" and "Verdict" (tan-cli#793).
          cat "${RUNNER_TEMP}/resync.md" >> "$GITHUB_STEP_SUMMARY" || \
            echo "_planner_resync.py wrote no markdown -- see the step log_" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      # The gate is the thing that fails when a re-sync is owed, so running it
      # here is what turns "the script applied something" into "the thing that
      # was red is now green". Its three roots are three DIFFERENT alp-sdk
      # commits (tan-cli#296: two audits with two pins need two checkouts;
      # #485 added a third) -- read back out of the gate file AFTER the apply,
      # so this measures the pins the PR actually proposes, not the ones it
      # started from. Worktrees off the one full clone, so it costs no network.
      - name: Run the freshness gate against the re-synced tree
        id: gate
        if: steps.resync.outputs.rc != '2'
        shell: bash
        run: |
          set -uo pipefail
          gate=python/tests/gates/test_planner_relocation_freshness.py
          pin() { grep -oE "^$1 = \"[0-9a-f]{40}\"" "$gate" | grep -oE '[0-9a-f]{40}'; }
          for spec in "PINNED_SDK_COMMIT:sdk-mirror" \
                      "HAND_PORT_PINNED_SDK_COMMIT:sdk-handport" \
                      "STRICT_LOADERS_PINNED_SDK_COMMIT:sdk-strict"; do
            name="${spec%%:*}"; dir="${spec##*:}"
            # `pin` is a `grep | grep` pipeline; under `pipefail` a no-match
            # makes the whole pipeline (and thus this assignment) exit
            # nonzero, and plain `set -e` would kill the step here -- before
            # the `if [ -z "$sha" ]` guard below ever runs (tan-cli#793).
            # `set +e` around just the assignment keeps that guard reachable.
            set +e
            sha="$(pin "$name")"
            set -e
            if [ -z "$sha" ]; then
              echo "::error::could not read ${name} out of ${gate}"
              echo "verdict=UNKNOWN (could not read ${name})" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git -C alp-sdk worktree add --detach "${GITHUB_WORKSPACE}/${dir}" "$sha" >/dev/null
          done
          python -m pip install --quiet -e ./python
          python -m pip install --quiet pytest
          set +e
          ( cd python && \
            ALP_SDK_ROOT="${GITHUB_WORKSPACE}/sdk-mirror" \
            ALP_SDK_HAND_PORT_ROOT="${GITHUB_WORKSPACE}/sdk-handport" \
            ALP_SDK_STRICT_LOADERS_ROOT="${GITHUB_WORKSPACE}/sdk-strict" \
            python -m pytest tests/gates/test_planner_relocation_freshness.py \
                             tests/gates/test_planner_resync.py -q ) \
            > "${RUNNER_TEMP}/gate.txt" 2>&1
          rc=$?
          set -e
          tail -40 "${RUNNER_TEMP}/gate.txt"
          if [ "$rc" -eq 0 ]; then
            echo "verdict=PASS" >> "$GITHUB_OUTPUT"
          else
            echo "verdict=FAIL (exit ${rc})" >> "$GITHUB_OUTPUT"
          fi
          # The worktrees are inside the repo checkout only by path; remove
          # them so `git status` below sees the re-sync and nothing else.
          for dir in sdk-mirror sdk-handport sdk-strict; do
            git -C alp-sdk worktree remove --force "${GITHUB_WORKSPACE}/${dir}" || true
          done

      - name: Open or refresh the proposal PR
        id: pr
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.open_pr }}
        env:
          GH_TOKEN: ${{ github.token }}
          SDK_SHA: ${{ steps.ref.outputs.sha }}
          RC: ${{ steps.resync.outputs.rc }}
          GATE_VERDICT: ${{ steps.gate.outputs.verdict }}
          RESYNC_VERDICT: ${{ steps.resync.outputs.verdict }}
          DEV_SHA: ${{ steps.devtip.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # tan-cli#1109 fault 2, half two: "Pin the tan-cli dev tip..."
          # above closed the window BEFORE regeneration; this closes the one
          # AFTER it. "Propose the re-sync" and "Run the freshness gate"
          # (this job's slowest step -- a real `pip install` + pytest run)
          # both take real wall-clock time, during which `origin/dev` can
          # move again -- a maintainer merging the very re-sync PR this run
          # is about to open a stale duplicate of, say (PR #1103's own
          # timeline: two of tonight's three junk PRs were created while it
          # sat open). Narrowly scoped to the paths `planner_resync.py`
          # actually reads as `ours`/writes (the mirror dir + the one gate
          # file it re-pins) -- an unrelated commit landing on `dev` in the
          # same window (any other PR, any day) is not this bug and must not
          # turn every ordinary run red. ABORT rather than push: recomputing
          # inline would mean re-running the freshness-gate pytest step too
          # with no bound on how many times `dev` could move again while
          # THAT reruns, whereas a future scheduled/dispatched run
          # regenerates against the fresh tip at no extra cost -- simpler and
          # just as fast in practice.
          git fetch --quiet origin dev
          if ! git diff --quiet "${DEV_SHA}" origin/dev -- python/tan/planner python/tests/gates/test_planner_relocation_freshness.py; then
            latest_dev="$(git rev-parse origin/dev)"
            echo "::error::tan-cli dev's tan/planner/ (or the freshness gate's pins) moved from ${DEV_SHA} to ${latest_dev} while this run was regenerating (tan-cli#1109 fault 2) -- this run's proposal was computed against a base that is no longer current, and pushing it risks exactly the silent revert of landed work tan-cli#1109 was filed over. Aborting without pushing or opening anything; the next scheduled or dispatched run regenerates against the fresh tip."
            echo "opened=false" >> "$GITHUB_OUTPUT"
            echo "stale=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ -z "$(git status --porcelain -- python/)" ]; then
            # tan-cli#1109 review (minor): `planner_resync.py` returns 2
            # (REFUSED) BEFORE it ever writes `verdict=` to $GITHUB_OUTPUT --
            # its `except Refused` branch is above that write. `RESYNC_VERDICT`
            # is therefore EMPTY on this path, and asserting "no file ...
            # changed enough" would claim a measurement the script never made:
            # a refusal means it never got far enough to classify anything at
            # all. `RC` (unlike `RESYNC_VERDICT`) IS set on every path, so
            # branch on that instead of asserting a cause from an empty string.
            if [ "${RC}" = "2" ]; then
              echo "Nothing to propose -- planner_resync.py REFUSED to propose anything for alp-sdk ${SDK_SHA} (a pin disagrees with its own hash table, or the alp-sdk checkout is unusable) -- it never got far enough to classify a single file. See the job summary for the refusal reason."
            else
              echo "Nothing to propose -- planner_resync.py verdict is '${RESYNC_VERDICT}' for alp-sdk ${SDK_SHA}: no file under scripts/alp_orchestrate/ (nor a tracked hand-port source) changed enough to write anything under python/. See the job summary for the full report."
            fi
            echo "opened=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # tan-cli#1109 fault 4: the body built below already carries the
          # UPSTREAM delta (`planner_resync.py`'s own report); this is the
          # delta AGAINST `dev`, which is what actually determines whether
          # merging reverts something -- surfaced explicitly rather than
          # left for a reviewer to `git diff` themselves.
          changed_files="$(git status --porcelain -- python/ | wc -l | tr -d ' ')"
          # tan-cli#1109 review (nit): `awk '{print $2}'` splits on
          # WHITESPACE, so a path containing a space -- or a staged rename's
          # `old -> new` porcelain form, which is itself space-separated --
          # prints truncated. `cut -c4-` instead: `git status --porcelain`
          # lines are exactly two status characters, one space, then the
          # (possibly `old -> new`) path -- column 4 onward is the whole
          # rest of the line, untouched by any space it contains.
          changed_list="$(git status --porcelain -- python/ | cut -c4-)"
          short="${SDK_SHA:0:8}"

          # tan-cli#1006 review (nit): this is the ONE place the automation's
          # commit identity is spelled out in this step -- both the guard
          # invocation below (`--automation-name`/`--automation-email`,
          # explicit rather than relying on the script's argparse defaults
          # matching by coincidence) and the `git config` calls further down
          # read it from here. Before this, the two lived as independent
          # string literals (this step's `git config` vs. the script's own
          # `--automation-name`/`--automation-email` defaults) with nothing
          # tying them together -- a one-sided edit would silently put the
          # guard into "every automation commit reads as foreign" mode
          # (fail-safe, since that only ever over-protects, but silent).
          AUTOMATION_NAME="alp-sdk planner re-sync"
          AUTOMATION_EMAIL="noreply@alplab.ai"

          # tan-cli#1002: never force-push over a commit this automation did
          # not write. `planner_resync_branch_guard.py` inspects the CURRENT
          # `origin/auto/planner-resync` (before this step commits anything
          # on top of it) and picks the branch that is actually safe to
          # force-push -- `auto/planner-resync` itself when it carries only
          # automation-authored history (or does not exist yet), or a
          # diverted `auto/planner-resync-<short>[-N]` name when it carries
          # someone else's commit -- see that script's own docstring for the
          # full incident this closes (PR #996's hand-port work, force-pushed
          # away by the very next scheduled run). `set +e`/`rc=$?`/`set -e`:
          # exit 1 ("diverted, use the branch it named") is a ROUTINE outcome
          # this step must keep running past, the same reason the "Propose
          # the re-sync" step above clears errexit around planner_resync.py's
          # own routine nonzero exits (tan-cli#793) -- only exit 2 ("could not
          # determine whether some candidate is safe") is meant to kill this
          # step outright.
          set +e
          python python/scripts/planner_resync_branch_guard.py \
            --repo-root "${GITHUB_WORKSPACE}" \
            --base-ref dev \
            --branch auto/planner-resync \
            --divert-suffix "${short}" \
            --automation-name "${AUTOMATION_NAME}" \
            --automation-email "${AUTOMATION_EMAIL}"
          rc=$?
          set -e
          if [ "${rc}" -eq 2 ]; then
            echo "::error::planner_resync_branch_guard.py could not determine whether auto/planner-resync is safe to force-push -- refusing to guess (see the step log above for the git failure this raised). This is tan-cli#1002's guard: an ambiguous answer is never treated as 'safe'."
            exit 1
          fi
          # Read back out of $GITHUB_OUTPUT (the guard script writes there
          # itself, same convention planner_resync.py already uses) rather
          # than via a `steps.<id>.outputs` expression -- this call is inline
          # in this step's own `run:` body, not a separate step with an `id:`
          # of its own. `tail -1`: nothing else in this job writes a `branch=`
          # key, but a rerun-safe read should not assume that stays true.
          branch="$(grep '^branch=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)"
          diverted="$(grep '^diverted=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)"
          # tan-cli#1006 review round 2 (blocker): this used to be the ONE key
          # `planner_resync_branch_guard.py` wrote CONDITIONALLY (only `if
          # decision.protected is not None`), while every read down here is
          # unconditional and this step runs under `set -euo pipefail`. On a
          # clean, non-diverted run -- the everyday case -- the key was
          # simply absent, `grep` exited 1, `pipefail` propagated that into
          # this assignment, and the step died right here: `git config`,
          # `checkout -B`, `commit`, and `git push` never ran, and the
          # proposal PR was never opened or refreshed. The guard script now
          # writes `protected_commit=` (and the three `protected_commit_*`
          # keys below it) on EVERY path, empty when there is nothing
          # protected -- the same shape `branch=`/`diverted=`/
          # `observed_tip=`/`occupied_count=` already use, which is what
          # keeps THEM safe against this exact class of bug. Audited every
          # other `grep '^…=' "$GITHUB_OUTPUT"` read in this job against the
          # guard script's writes when this was fixed: `branch=`,
          # `diverted=`, `observed_tip=`, and `occupied_count=` were already
          # unconditional; `occupied_${i}_branch=`/`_commit=`/`_author=`
          # (further down) are written once per `decision.occupied` entry and
          # only ever read for `i` in `1..occupied_count`, so those two counts
          # can't drift apart. `protected_commit=` was the one conditional
          # key in the set.
          protected_commit="$(grep '^protected_commit=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)"
          # tan-cli#1006 review (minor): the sha the guard actually inspected
          # on `origin/${branch}` -- empty when it didn't exist there yet.
          # Passed to `--force-with-lease` below so the guard's approval is
          # atomic with the push instead of merely advisory.
          observed_tip="$(grep '^observed_tip=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)"
          # tan-cli#1006 review (minor, cascaded diversion): EVERY candidate
          # the guard found occupied on its way to `${branch}`, not just
          # `protected_commit` (which only ever names the first) -- a run
          # that diverts past a name a PRIOR run already diverted to must
          # name both, or a reader is told about only one of two branches
          # holding someone else's work.
          occupied_count="$(grep '^occupied_count=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)"

          git config user.name  "${AUTOMATION_NAME}"
          git config user.email "${AUTOMATION_EMAIL}"
          git checkout -q -B "${branch}"
          git add -A python/
          # Commit subject carries NO issue-closing keyword. GitHub builds a
          # squash message out of the COMMITS and parses `fixes #n` inside
          # backticks and code fences alike, so a re-sync that merely MENTIONS
          # the tan issue an upstream fix addresses would close it on merge
          # without anyone deciding to.
          git commit -q -m "chore(planner): propose the re-sync owed to alp-sdk ${short}

          Machine-proposed by python/scripts/planner_resync.py. See the PR body
          for what merged, what was flagged for manual porting, and which pins
          moved. Refs alplabai/alp-sdk#855."
          # tan-cli#1006 review (minor): a bare `git push -q -f` is TOCTOU-stale
          # by the time it lands -- `planner_resync_branch_guard.py` above
          # read `origin/${branch}` before this step's own `git config` x2,
          # `checkout -B`, `add -A`, `commit` ran, and any of those give a
          # commit pushed into that window room to land on `${branch}`
          # unnoticed. `--force-with-lease="${branch}":"${observed_tip}"`
          # (empty `observed_tip` spells "the ref must not already exist",
          # git's own documented form) makes the push itself re-verify the
          # guard's premise instead of trusting it went stale-free.
          git push -q --force-with-lease="${branch}":"${observed_tip}" origin "${branch}"

          {
            # Same fallback as the "Propose the re-sync" step above (tan-cli#911)
            # and the "Surface the owed work..." step below (tan-cli#920): an
            # unhandled traceback in planner_resync.py is rc=1 with no markdown
            # written, and this step's `set -euo pipefail` would otherwise die
            # here -- after the branch is already force-pushed, so the PR would
            # never get opened for a diff that DID get committed.
            cat "${RUNNER_TEMP}/resync.md" || \
              echo "_planner_resync.py wrote no markdown -- see the step log_"
            echo
            echo "---"
            echo
            if [ "${diverted}" = "true" ]; then
              echo "### This proposal was diverted (tan-cli#1002)"
              echo
              if [ "${occupied_count:-0}" -eq 1 ]; then
                echo "\`auto/planner-resync\` carries commit \`${protected_commit}\`,"
                echo "which this automation did not write, and was left completely"
                echo "untouched -- this PR proposes against \`${branch}\` instead. If"
                echo "that commit is hand-port work you (or another re-sync PR) left"
                echo "on \`auto/planner-resync\`, it is still there:"
                echo "<https://github.com/${{ github.repository }}/tree/auto/planner-resync>."
              else
                # tan-cli#1006 review: a cascaded diversion (this run's own
                # primary AND an earlier run's diversion target both already
                # occupied) -- name every branch this run found occupied, not
                # just the primary, so a reader isn't pointed at only one of
                # several branches holding someone else's work.
                echo "This run found **${occupied_count}** branches already"
                echo "occupied by a commit this automation did not write, and"
                echo "left every one of them completely untouched -- this PR"
                echo "proposes against \`${branch}\` instead:"
                echo
                for i in $(seq 1 "${occupied_count}"); do
                  ob="$(grep "^occupied_${i}_branch=" "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)"
                  oc="$(grep "^occupied_${i}_commit=" "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)"
                  oa="$(grep "^occupied_${i}_author=" "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)"
                  # tan-cli#1006 review (minor): `oa` alone reads as the
                  # automation itself on the `--amend`/`fixup!` shape this
                  # round exists to catch -- author identity survives the
                  # amend/autosquash, only the committer changes, so a reader
                  # here would see this protected commit credited to
                  # `alp-sdk planner re-sync <noreply@alplab.ai>`. The guard
                  # already emits `occupied_${i}_committer` and `main()`
                  # already does exactly this for `protected_commit` at
                  # planner_resync_branch_guard.py:476-484 -- this is wiring
                  # an existing key in, not new logic.
                  ocommitter="$(grep "^occupied_${i}_committer=" "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)"
                  credit="${oa}"
                  if [ "${ocommitter}" != "${oa}" ]; then
                    credit="${oa}, committed by ${ocommitter}"
                  fi
                  echo "* \`${ob}\` carries \`${oc}\` (by ${credit}):"
                  echo "  <https://github.com/${{ github.repository }}/tree/${ob}>"
                done
              fi
              echo
              echo "If any of those commits are hand-port work you (or another"
              echo "re-sync PR) left there, reconcile it with this proposal by"
              echo "hand -- do not assume they cover the same delta."
              echo
            fi
            echo "### Diff against \`dev\`"
            echo
            echo "**This PR changes ${changed_files} file(s) relative to \`dev\`** --"
            echo "tan-cli#1109: a clean re-sync can still REVERT work already on"
            echo "\`dev\` (a hand-authored fix to one of these same files, landed"
            echo "after the commit this proposal's base merge read as \"ours\") --"
            echo "read this list before the upstream diffs below, not instead of them."
            echo
            echo '```'
            echo "${changed_list}"
            echo '```'
            echo
            echo "### This proposal's own checks"
            echo
            echo "| check | result |"
            echo "| --- | --- |"
            echo "| \`planner_resync.py\` exit | \`${RC}\` (0 clean · 1 needs a human · 2 refused) |"
            echo "| freshness gate + resync tests, run in the proposing job | ${GATE_VERDICT:-not run} |"
            echo "| branch-clobber guard (tan-cli#1002) | $([ "${diverted}" = "true" ] && echo "diverted -- ${occupied_count:-1} branch(es) occupied, see above" || echo "auto/planner-resync was safe to force-push") |"
            echo "| files changed relative to \`dev\` (tan-cli#1109) | \`${changed_files}\` -- see \"Diff against \`dev\`\" above |"
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "**This PR does not auto-merge and must not be squashed unread.**"
            echo "A clean 3-way merge can still carry behavioural change, and the"
            echo "block above each moved pin is a machine-written placeholder that"
            echo "records only WHAT moved. Replace it with the audited narrative"
            echo "before merging."
            echo
            echo "**\`${branch}\` is force-pushed by this workflow on every run that"
            echo "has something to propose.** If part of this re-sync needs a human"
            echo "(see \"What a human must do\" above, when present), do that work on"
            echo "a branch of your OWN -- \`git checkout -b fix/<topic> ${branch}\` --"
            echo "and open your own PR against \`dev\`, rather than committing"
            echo "directly to \`${branch}\`. A future run that finds \`${branch}\`"
            echo "occupied by a foreign commit diverts to a new branch instead of"
            echo "overwriting it (tan-cli#1002), but that is a safety net, not a"
            echo "place to leave work you intend to keep."
            echo
            echo "Because the PR was opened by \`GITHUB_TOKEN\`, GitHub's recursion"
            echo "guard means its own \`ci.yml\`/\`parity.yml\` runs did not start"
            echo "automatically -- close and reopen the PR, or push an empty commit,"
            echo "to get the full suite."
            echo
            echo "Refs alplabai/alp-sdk#855 (ADR-0020's cross-repo remediation)."
          } > "${RUNNER_TEMP}/body.md"

          existing="$(gh pr list --head "${branch}" --base dev --state open \
                        --json number -q '.[0].number' || true)"
          title="chore(planner): re-sync owed to alp-sdk ${short}"
          if [ -n "${existing}" ]; then
            gh pr edit "${existing}" --title "${title}" --body-file "${RUNNER_TEMP}/body.md"
            echo "url=$(gh pr view "${existing}" --json url -q .url)" >> "$GITHUB_OUTPUT"
          else
            url="$(gh pr create --base dev --head "${branch}" \
                     --title "${title}" --body-file "${RUNNER_TEMP}/body.md")"
