          fi
          echo "opened=true" >> "$GITHUB_OUTPUT"

      # tan-cli#1109 fault 3: the branch-clobber guard above (tan-cli#1002)
      # protects a human's foreign commit on `auto/planner-resync` by
      # DIVERTING to a fresh `auto/planner-resync-<sdk-short-sha>` name --
      # correct, but every diverted run gets its OWN branch, and
      # `gh pr list --head <that one branch>` above never finds a prior run's
      # proposal sitting under a DIFFERENT diverted name. That is exactly how
      # tonight's #1106/#1107/#1108 ended up open at once: three separate
      # dispatches, each protecting the SAME human commit on
      # `auto/planner-resync`, each diverting to its own target-sha-named
      # branch, each therefore opening its own PR. This step is the other
      # half of "supersede rather than accumulate": once the step above has
      # opened or refreshed ONE proposal (on `${{ steps.pr.outputs.branch }}`,
      # whichever name the guard picked), close every OTHER open PR whose
      # head branch starts with `auto/planner-resync` -- there is only ever
      # supposed to be one live proposal from this workflow, diverted or not.
      - name: Close superseded planner-resync proposals (cap at one open PR)
