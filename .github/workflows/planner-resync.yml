# SPDX-License-Identifier: Apache-2.0
#
# ADR-0020 remediation, the half that was never built (alp-sdk#855): PROPOSE the
# `tan/planner/` re-sync an alp-sdk planner change owes, instead of waiting for
# a human to discover it.
#
# The DETECTION half already exists and works:
#
#   * alp-sdk `.github/workflows/dispatch-tan-parity.yml` fires a
#     `repository_dispatch` (`alp-sdk-planner-change`) on every push to its
#     dev/main that touches the contract surface;
#   * `parity.yml` here listens for it and runs both seams against the pushed
#     ref, so `python/tests/gates/test_planner_relocation_freshness.py` goes RED
#     within minutes of alp-sdk moving;
#   * `parity.yml`'s "pin freshness (warn only)" step warns on PR runs when
#     `PINNED_SDK_TAG` has fallen behind.
#
# What none of that does is say what the FIX is. Every catch so far
# (tan-cli#320, #485, #543, #493/#591) has been hand-carried: read the upstream
# diff, retype the delta into `tan/planner/`, recompute two sha256 tables by
# hand, move two commit pins. That is the loop this workflow closes.
#
# WHY THIS EXISTS SEPARATELY FROM parity.yml
# ------------------------------------------
# `parity.yml` is a GATE: it must stay read-only and must go red. Giving it
# `contents: write` + `pull-requests: write` so it could also open a PR would
# hand those permissions to every seam1/seam2/python-tests job on every PR,
# including ones that check out and execute an alp-sdk ref chosen by the
# dispatch payload. This job does one thing, holds the write scope for that one
# thing, and runs on triggers a fork cannot reach.
#
# TRIGGERS -- both, deliberately
# -----------------------------
#   * `repository_dispatch` gives LATENCY: the proposal lands minutes after
#     alp-sdk pushes, using the sender that ALREADY EXISTS. No new alp-sdk
#     credential, no new secret anywhere -- alp-sdk's dispatcher mints its own
#     short-lived App token and this repo's side needs only the default
#     GITHUB_TOKEN.
#   * `schedule` is the BACKSTOP, and it is not redundant. The sender's `paths:`
#     filter covers `scripts/alp_orchestrate/**`, `metadata/**`,
#     `examples/**/board.yaml`, `tests/parity/**` -- and MISSES most of the
#     hand-port sources. Measured over alp-sdk's last 400 commits touching a
#     tracked hand-port source: 7 of 29 matched none of those paths and
#     therefore fired NO dispatch at all, including `98807809` (the missing
#     `CONFIG_USE_DT_CODE_PARTITION=y`, one of the two defects tan-cli#279 cites
#     as having shipped before anything noticed) and `cb7f64ae` (alp-sdk
#     #1125/#1126, a path-traversal fix). A companion alp-sdk change widens that
#     list, but a path filter is a thing that can be wrong again, and the
#     dispatch API answers 204 whether or not anything is listening. The cron
#     needs no alp-sdk credential and no path list to be right, so it catches
#     the class rather than the instance.
#
# BOTH TRIGGERS ONLY FIRE FROM THE DEFAULT BRANCH'S COPY OF THIS FILE. That is
# GitHub's rule for `schedule` and `repository_dispatch` alike, and it is the
# #194 failure this repo already ate once (see parity.yml's own note). Measured
# 2026-08-10: `gh api repos/alplabai/tan-cli -q .default_branch` -> `dev`, so
# this goes live when it lands on `dev`. If the default branch ever moves to
# `main`, this workflow silently stops running -- there is no signal for that
# beyond the absence of runs.
#
# WHAT IT PRODUCES
# ----------------
# A PR against `dev` on the fixed branch `auto/planner-resync`, force-pushed so
# it always reflects the CURRENT delta rather than accumulating. It NEVER
# merges: a re-sync can carry behavioural change under a clean merge -- the
# #608 re-sync changed `-B "."` and silently satisfied tan-cli#561 without the
# subject line mentioning it -- so a human reads the diff, and rewrites the
# machine-written placeholder the script leaves above each moved pin.
#
# WHEN IT CANNOT DO THE JOB
# -------------------------
# It says so and fails, rather than opening a green PR that quietly dropped a
# file. `planner_resync.py` exits 1 when part of the re-sync needs a human
# (a 3-way conflict, a changed hand-port source, a new/removed upstream
# module; the pins covering it stay put) and 2 when the inputs are not fit
# to reason over (a pin disagreeing with its own hash table). Either way
# this job goes red (tan-cli#911: see "Surface the owed work..." below).
#
# TOKEN + THE RECURSION GUARD, stated plainly
# -------------------------------------------
# This uses the default GITHUB_TOKEN. No new secret is required and none is
# committed. The cost is GitHub's own recursion guard: a PR opened by
# GITHUB_TOKEN does not trigger `pull_request` workflows, so the re-sync PR's
# own `ci.yml`/`parity.yml` runs do NOT start by themselves. That is why the
# "Run the freshness gate against the re-synced tree" step below exists and
# why its verdict is written into the PR body: the proposal carries its own
# evidence. A reviewer who wants the full suite closes and reopens the PR (or
# pushes an empty commit), which is a one-click cost paid by a human who was
# going to read the diff anyway -- deliberately preferred over minting a
# longer-lived App/PAT credential for a bot that opens PRs.

name: planner-resync

run-name: >-
  ${{ github.event_name == 'repository_dispatch'
      && format('planner-resync (alp-sdk {0})', github.event.client_payload.sdk_ref)
      || '' }}

on:
  repository_dispatch:
    types: [alp-sdk-planner-change]
  schedule:
    # 05:23 UTC daily. Off the hour on purpose: GitHub's scheduler queues
    # heavily at :00 and a delayed cron is a delayed proposal.
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      sdk_ref:
        description: "alp-sdk ref to re-sync TO (default: origin/dev)"
        type: string
        default: "origin/dev"
      open_pr:
        description: "Open/refresh the PR (uncheck for a dry run in the job summary only)"
        type: boolean
        default: true

concurrency:
  # One proposal at a time. Two runs racing would force-push the same branch
  # from two different alp-sdk refs and the PR would describe neither.
  group: planner-resync
  cancel-in-progress: false

# tan-cli#911: `permissions:` usually lives right here -- it now sits at the
# end of the `propose` job instead (tan-cli#920: job-scoped, not workflow-
# scoped). See the comment down there for why.

jobs:
  propose:
    name: "propose · tan/planner re-sync"
    runs-on: ubuntu-latest
    # tan-cli#855: this job had NO bound at all and inherited GitHub's
    # 360-minute default. Sized against parity.yml's `seam1-plan-shape` (30,
    # "hang catcher, not a budget" -- measured 1 minute on a real run), the
    # closest sibling shape: a checkout of alp-sdk + a pip install + a bounded
    # pytest run against pinned commits. This job does MORE git plumbing on
    # top of that shape (TWO `fetch-depth: 0` checkouts instead of one, three
    # `git worktree add`s, a `git commit` + force-push, a `gh pr create/edit`)
    # but nothing here is a heavy build -- no Zephyr toolchain, no PyInstaller
    # freeze -- so seam1-plan-shape's own bound is the right order of
    # magnitude rather than something narrower.
    timeout-minutes: 30
    steps:
      # THE ONE CHECKOUT IN THIS REPOSITORY THAT KEEPS ITS CREDENTIAL, and it
      # must: the `propose` step below runs `git push -q -f origin` against the
      # `auto/planner-resync` branch through the remote THIS checkout leaves
      # configured -- no later step sets up a token remote of its own. Adding
      # `persist-credentials: false` here does not fail the job at checkout
      # time; it fails several minutes later at the push, after the re-sync has
      # already been computed and committed, and the PR is then never opened.
      # Every other checkout in this repository sets it false (tan-cli#435).
      #
      # The `artipacked` ignore travels with this step (tan-cli#899): it used
      # to be a `<file>:<line>` pin in `.github/zizmor.yml`, which rotted once
      # (`140:9` -> `151:9`), pre-merge, on the tan-cli#854/#855 branch when an
      # 11-line `timeout-minutes` block landed above it with no re-pin --
      # `release.yml`'s pin is the one that rotted twice in two days, a
      # different file. Inline, neither can rot -- see `.github/zizmor.yml`'s
      # header for the full inventory and both derivations.
      - name: Check out tan-cli dev (the branch the re-sync targets)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          ref: dev
          fetch-depth: 0

      # fetch-depth 0: the script reads blobs at THREE different pinned
      # commits, the oldest of which (STRICT_LOADERS_PINNED_SDK_COMMIT,
      # 26b0040e) is far older than the other two. A shallow clone makes
      # `git show <pin>:<path>` fail, which the script reports as "the bound
      # checkout cannot be the one this gate was pinned against" -- a correct
      # refusal, but for the wrong reason.
      - name: Check out alp-sdk (full history -- three pins are read)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: alplabai/alp-sdk
          path: alp-sdk
          fetch-depth: 0

      # `client_payload.*` is attacker-controlled by construction -- anyone able
      # to POST a `repository_dispatch` picks every field -- so it is carried in
      # as an ENV VAR, never interpolated into the shell, and then matched
      # against an allow-list pattern before it reaches `git`. Without both,
      # `sdk_ref: "x; curl ... | sh"` executes in a job that holds
      # `contents: write` on this repo. `inputs.sdk_ref` gets the same treatment:
      # `workflow_dispatch` needs only write access, which is a wider set than
      # the people who may push to `dev`.
      - name: Resolve the alp-sdk ref to re-sync to
        id: ref
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PAYLOAD_REF: ${{ github.event.client_payload.sdk_ref }}
          INPUT_REF: ${{ inputs.sdk_ref }}
        run: |
          set -euo pipefail
          case "${EVENT}" in
            repository_dispatch) ref="${PAYLOAD_REF:-}" ;;
            workflow_dispatch)   ref="${INPUT_REF:-}" ;;
            *)                   ref="" ;;
          esac
          [ -n "${ref}" ] || ref='origin/dev'
          # Allow-list, not a deny-list: a git ref needs none of the characters
          # a shell or an argument-injection needs. `origin/dev`, a 40-hex SHA
          # and `v0.15.0-rc1` all match; anything with a space, quote, `$`,
          # backtick, semicolon, or a leading `-` does not.
          # NOT `grep -qE`. grep is LINE-oriented, so `printf '%s' "$ref" |
          # grep -qE '^...$'` returns 0 when ANY line matches: a payload of
          # `dev\nref=attacker` passes on its first line, and the second line
          # then lands in `$GITHUB_OUTPUT` as its own key -- the precise
          # injection this guard exists to refuse. `case` tests the WHOLE
          # string, newline included. Measured both ways before choosing.
          case "${ref}" in
            ""|[!A-Za-z0-9]*|*[!A-Za-z0-9._/-]*)
              echo "::error::refusing an alp-sdk ref that is not a plain git ref: ${ref}"
              exit 1 ;;
          esac
          if [ "${#ref}" -gt 201 ]; then
            echo "::error::refusing an alp-sdk ref longer than 201 characters: ${ref}"
            exit 1
          fi
          # A dispatched SHA lands on alp-sdk dev OR main; both are fetched by
          # the checkout above, but resolve it here so a payload naming a ref
          # this clone cannot see fails HERE, with the ref in the message,
          # rather than inside the script as a per-file "gone from the bound
          # SDK checkout".
          sha="$(git -C alp-sdk rev-parse "${ref}^{commit}")"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "requested=${ref}" >> "$GITHUB_OUTPUT"
          echo "Re-syncing to alp-sdk ${ref} (${sha})"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Propose the re-sync
        id: resync
        shell: bash
        # `continue-on-error` is wrong here (it hides the conclusion); the exit
        # code is captured and re-raised by the final step instead, so the PR
        # still gets opened when the answer is "a human must finish this".
        run: |
          set -uo pipefail
          # `set -uo pipefail` alone does NOT clear the `-e` GitHub's bash
          # wrapper applies (`bash --noprofile --norc -e -o pipefail {0}`), so
          # without `set +e` here the script's normal exit 1 ("a re-sync is
          # owed") or exit 2 ("Refused") would kill the step before `rc=$?`
          # ever runs (tan-cli#793). `set +e` for the call, `set -e` after, so
          # `rc=$?` and everything downstream keep expecting normal semantics.
          set +e
          python python/scripts/planner_resync.py \
            --sdk-root "${GITHUB_WORKSPACE}/alp-sdk" \
            --to "${{ steps.ref.outputs.sha }}" \
            --repo-root "${GITHUB_WORKSPACE}" \
            --apply \
            --markdown "${RUNNER_TEMP}/resync.md" \
            --json "${RUNNER_TEMP}/resync.json"
          rc=$?
          set -e
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"
          # `|| echo` rather than relying on `set -e` staying off past this
          # line: an unhandled non-`Refused` exception in the script (rc=1
          # with no markdown written) must not let a bare `cat` kill the step
          # AFTER `rc` is already in `$GITHUB_OUTPUT` -- that would re-create
          # this issue's own "red X with no explanation" and skip both
          # "Open or refresh the proposal PR" and "Verdict" (tan-cli#793).
          cat "${RUNNER_TEMP}/resync.md" >> "$GITHUB_STEP_SUMMARY" || \
            echo "_planner_resync.py wrote no markdown -- see the step log_" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      # The gate is the thing that fails when a re-sync is owed, so running it
      # here is what turns "the script applied something" into "the thing that
      # was red is now green". Its three roots are three DIFFERENT alp-sdk
      # commits (tan-cli#296: two audits with two pins need two checkouts;
      # #485 added a third) -- read back out of the gate file AFTER the apply,
      # so this measures the pins the PR actually proposes, not the ones it
      # started from. Worktrees off the one full clone, so it costs no network.
      - name: Run the freshness gate against the re-synced tree
        id: gate
        if: steps.resync.outputs.rc != '2'
        shell: bash
        run: |
          set -uo pipefail
          gate=python/tests/gates/test_planner_relocation_freshness.py
          pin() { grep -oE "^$1 = \"[0-9a-f]{40}\"" "$gate" | grep -oE '[0-9a-f]{40}'; }
          for spec in "PINNED_SDK_COMMIT:sdk-mirror" \
                      "HAND_PORT_PINNED_SDK_COMMIT:sdk-handport" \
                      "STRICT_LOADERS_PINNED_SDK_COMMIT:sdk-strict"; do
            name="${spec%%:*}"; dir="${spec##*:}"
            # `pin` is a `grep | grep` pipeline; under `pipefail` a no-match
            # makes the whole pipeline (and thus this assignment) exit
            # nonzero, and plain `set -e` would kill the step here -- before
            # the `if [ -z "$sha" ]` guard below ever runs (tan-cli#793).
            # `set +e` around just the assignment keeps that guard reachable.
            set +e
            sha="$(pin "$name")"
            set -e
            if [ -z "$sha" ]; then
              echo "::error::could not read ${name} out of ${gate}"
              echo "verdict=UNKNOWN (could not read ${name})" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git -C alp-sdk worktree add --detach "${GITHUB_WORKSPACE}/${dir}" "$sha" >/dev/null
          done
          python -m pip install --quiet -e ./python
          python -m pip install --quiet pytest
          set +e
          ( cd python && \
            ALP_SDK_ROOT="${GITHUB_WORKSPACE}/sdk-mirror" \
            ALP_SDK_HAND_PORT_ROOT="${GITHUB_WORKSPACE}/sdk-handport" \
            ALP_SDK_STRICT_LOADERS_ROOT="${GITHUB_WORKSPACE}/sdk-strict" \
            python -m pytest tests/gates/test_planner_relocation_freshness.py \
                             tests/gates/test_planner_resync.py -q ) \
            > "${RUNNER_TEMP}/gate.txt" 2>&1
          rc=$?
          set -e
          tail -40 "${RUNNER_TEMP}/gate.txt"
          if [ "$rc" -eq 0 ]; then
            echo "verdict=PASS" >> "$GITHUB_OUTPUT"
          else
            echo "verdict=FAIL (exit ${rc})" >> "$GITHUB_OUTPUT"
          fi
          # The worktrees are inside the repo checkout only by path; remove
          # them so `git status` below sees the re-sync and nothing else.
          for dir in sdk-mirror sdk-handport sdk-strict; do
            git -C alp-sdk worktree remove --force "${GITHUB_WORKSPACE}/${dir}" || true
          done

      - name: Open or refresh the proposal PR
        id: pr
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.open_pr }}
        env:
          GH_TOKEN: ${{ github.token }}
          SDK_SHA: ${{ steps.ref.outputs.sha }}
          RC: ${{ steps.resync.outputs.rc }}
          GATE_VERDICT: ${{ steps.gate.outputs.verdict }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- python/)" ]; then
            echo "Nothing to propose -- tan/planner is level with alp-sdk ${SDK_SHA}."
            echo "opened=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch=auto/planner-resync
          git config user.name  "alp-sdk planner re-sync"
          git config user.email "noreply@alplab.ai"
          git checkout -q -B "${branch}"
          git add -A python/
          short="${SDK_SHA:0:8}"
          # Commit subject carries NO issue-closing keyword. GitHub builds a
          # squash message out of the COMMITS and parses `fixes #n` inside
          # backticks and code fences alike, so a re-sync that merely MENTIONS
          # the tan issue an upstream fix addresses would close it on merge
          # without anyone deciding to.
          git commit -q -m "chore(planner): propose the re-sync owed to alp-sdk ${short}

          Machine-proposed by python/scripts/planner_resync.py. See the PR body
          for what merged, what was flagged for manual porting, and which pins
          moved. Refs alplabai/alp-sdk#855."
          git push -q -f origin "${branch}"

          {
            # Same fallback as the "Propose the re-sync" step above (tan-cli#911)
            # and the "Surface the owed work..." step below (tan-cli#920): an
            # unhandled traceback in planner_resync.py is rc=1 with no markdown
            # written, and this step's `set -euo pipefail` would otherwise die
            # here -- after the branch is already force-pushed, so the PR would
            # never get opened for a diff that DID get committed.
            cat "${RUNNER_TEMP}/resync.md" || \
              echo "_planner_resync.py wrote no markdown -- see the step log_"
            echo
            echo "---"
            echo
            echo "### This proposal's own checks"
            echo
            echo "| check | result |"
            echo "| --- | --- |"
            echo "| \`planner_resync.py\` exit | \`${RC}\` (0 clean · 1 needs a human · 2 refused) |"
            echo "| freshness gate + resync tests, run in the proposing job | ${GATE_VERDICT:-not run} |"
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "**This PR does not auto-merge and must not be squashed unread.**"
            echo "A clean 3-way merge can still carry behavioural change, and the"
            echo "block above each moved pin is a machine-written placeholder that"
            echo "records only WHAT moved. Replace it with the audited narrative"
            echo "before merging."
            echo
            echo "Because the PR was opened by \`GITHUB_TOKEN\`, GitHub's recursion"
            echo "guard means its own \`ci.yml\`/\`parity.yml\` runs did not start"
            echo "automatically -- close and reopen the PR, or push an empty commit,"
            echo "to get the full suite."
            echo
            echo "Refs alplabai/alp-sdk#855 (ADR-0020's cross-repo remediation)."
          } > "${RUNNER_TEMP}/body.md"

          existing="$(gh pr list --head "${branch}" --base dev --state open \
                        --json number -q '.[0].number' || true)"
          title="chore(planner): re-sync owed to alp-sdk ${short}"
          if [ -n "${existing}" ]; then
            gh pr edit "${existing}" --title "${title}" --body-file "${RUNNER_TEMP}/body.md"
            echo "url=$(gh pr view "${existing}" --json url -q .url)" >> "$GITHUB_OUTPUT"
          else
            url="$(gh pr create --base dev --head "${branch}" \
                     --title "${title}" --body-file "${RUNNER_TEMP}/body.md")"
            echo "url=${url}" >> "$GITHUB_OUTPUT"
          fi
          echo "opened=true" >> "$GITHUB_OUTPUT"

      # tan-cli#911: the step above's own gate ("is there a mirror diff to
      # commit") is not the same question as "does a human need to act", and
      # rc=1 means the second is true regardless of the first. When the PR
      # step found nothing to commit it prints "Nothing to propose" and sets
      # `opened=false` WITHOUT opening anything -- so on rc=1 the finding
      # would otherwise live only in this red run's job summary, which is
      # what happened for an unbroken streak (measured `gh run list
      # --workflow planner-resync.yml --limit 100`) starting at run
      # `31621375705` (last success before it: `31601765469`) and STILL
      # GROWING as of `32936003033` -- a bare count pinned here would already
      # be stale against a workflow that keeps failing until this fix lands;
      # re-run the same `gh run list` for the current number.
      #
      # `steps.pr.outputs.opened == 'false'` is deliberately narrower than
      # "the PR step didn't open a PR": that output is UNSET (not 'false')
      # both when the PR step was skipped (`open_pr: false` on a
      # `workflow_dispatch` dry run -- this step honours the same flag below
      # so a dry run stays a dry run) and when the PR step FAILED before
      # reaching its own `opened=true` line. The latter happened for real on
      # run `32660981604` (2026-08-23T19:21:33Z): that run DID have a mirror
      # diff, and `gh pr create` was refused with "GitHub Actions is not
      # permitted to create or approve pull requests" -- an org-level policy,
      # since flipped (repo-level `can_approve_pull_request_reviews` read
      # `false` then, reads `true` as of 2026-08-25; no run since has had a
      # diff to prove the PR path clean again). That is a DIFFERENT failure
      # from the one tan-cli#911 is about -- a real diff blocked by policy,
      # not an empty diff nobody surfaced -- so this step does not attempt to
      # cover it; a recurrence is its own issue, not this one. Either way
      # neither case is "an empty diff", so this step only fires for the one
      # case tan-cli#911 names.
      #
      # A tracking ISSUE rather than a second, code-less PR: an empty-diff PR
      # is an odd artifact (nothing to review, and it can confuse merge-queue
      # automation that expects a PR to carry a change), and a fixed,
      # marker-based match lets repeated cron hits refresh ONE issue instead
      # of opening one per day -- the still-growing streak measured above is
      # what daily duplicate-opens would have compounded into, had this been
      # the shape from the start. (It also happens to sidestep the policy failure
      # above for this path specifically, since issue creation isn't gated by
      # "create or approve pull requests" -- a footnote, not the reason: that
      # policy looks resolved already, and the primary argument holds
      # regardless of it.)
      #
      # tan-cli#920 (second-round review of tan-cli#911): the search below
      # used to match on `in:title` and `|| true` past a lookup failure into
      # "no match" -- so a transient `gh issue list` error opened a DUPLICATE
      # issue rather than refusing (the exact "must not create 40 issues"
      # guarantee tan-cli#911 exists for, failing silently). Fixed two ways,
      # matching this file's own established shape for the first and
      # `parity.yml`'s `notify-planner-drift` job's prior art for the second:
      #   * the lookup's own exit code is captured with `set +e; ...; set -e`
      #     (same reason the freshness-gate step above does this for its pin
      #     reads: a `var=$(cmd)` assignment does not reliably trip `set -e`
      #     the way a bare command does) and checked BEFORE `-n "${existing}"`
      #     decides "no match" -- a nonzero lookup now fails the step instead
      #     of falling through to `gh issue create`.
      #   * de-dup now matches a fixed, invisible BODY MARKER
      #     (`RESYNC_ISSUE_MARKER`, job-level `env:` below) rather than the
      #     title: matching `parity.yml`'s own comment on this exact choice,
      #     title wording can be edited by a maintainer without breaking
      #     de-dup, a marker cannot be. `gh issue list --search "in:body ..."`
      #     is not used for the same reason `parity.yml` doesn't use it --
      #     GitHub's search tokenizes on hyphens and ANDs the tokens rather
      #     than matching a phrase, so a hyphenated marker like this one can
      #     match the wrong issue. Filter server-side on the `ci` label this
      #     job creates the issue with, then client-side on the literal
      #     marker string in the body.
      - name: Surface the owed work when there is nothing to propose
        id: issue
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.open_pr) && steps.resync.outputs.rc == '1' && steps.pr.outputs.opened == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SDK_SHA: ${{ steps.ref.outputs.sha }}
          GATE_VERDICT: ${{ steps.gate.outputs.verdict }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "${RESYNC_ISSUE_MARKER}"
            echo
            # Same fallback as the "Propose the re-sync" step above
            # (tan-cli#911) -- an unhandled traceback in planner_resync.py is
            # rc=1 with NO markdown written, and this step's `set -euo
            # pipefail` used to die right here: zero `gh` calls, no issue
            # opened, and (before tan-cli#920 also added `if: always()` to
            # Verdict below) the informative `::error::` annotation skipped
            # too -- the exact "red X with no explanation" tan-cli#911 was
            # filed over, reintroduced on this specific reachable path.
            cat "${RUNNER_TEMP}/resync.md" || \
              echo "_planner_resync.py wrote no markdown -- see the step log_"
            echo
            echo "---"
            echo
            echo "### Why this is an issue and not a PR"
            echo
            echo "\`planner_resync.py\` computed an EMPTY diff against \`python/\`"
            echo "for alp-sdk \`${SDK_SHA}\` -- there is nothing to merge -- but its"
            echo "verdict was still \`partial\` (exit 1): part of the re-sync needs a"
            echo "human (a hand-port source changed upstream, a blocked mirror file,"
            echo "or similar -- see \"What a human must do\" above). A PR with no code"
            echo "change would be an odd artifact, so this finding is surfaced here"
            echo "instead."
            echo
            echo "| check | result |"
            echo "| --- | --- |"
            echo "| \`planner_resync.py\` exit | \`1\` (needs a human) |"
            echo "| freshness gate + resync tests, run in the proposing job | ${GATE_VERDICT:-not run} |"
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "This issue is REFRESHED (not recreated) by \`planner-resync.yml\` on"
            echo "every run that lands in this state -- the body above is replaced with"
            echo "the latest report and a new status comment is posted below noting the"
            echo "run that refreshed it -- and is closed automatically the next time a"
            echo "run reports nothing owed (\`rc=0\`) or a PR ends up covering this delta"
            echo "after all."
            echo
            echo "Refs alplabai/alp-sdk#855 (ADR-0020's cross-repo remediation)."
          } > "${RUNNER_TEMP}/issue-body.md"
          # GitHub's issue-body limit is 65536 characters; a real rc=1/empty-
          # diff run has measured at 27062 (41%) with default --diff-lines --
          # not close today, but `gh issue create`/`edit` fail HARD on an
          # overrun rather than truncating, which would turn a real finding
          # into a red step with no issue at all. Truncate defensively.
          # `head -c 60000` is a byte cut, not a character cut -- measured, byte
          # 59999 of a real oversized body lands mid-character (`0xe2`, the
          # lead byte of a U+2014 em dash), so a bare `head -c` can hand `gh`
          # a body ending in a partial UTF-8 sequence. `gh` doesn't reject
          # that (Go's json encoder just emits one mojibake replacement
          # character), so this is cosmetic, not a failure mode -- but
          # dropping the possibly-partial last line via `sed '$d'` lands on a
          # line boundary at effectively no cost and avoids it anyway.
          if [ "$(wc -c < "${RUNNER_TEMP}/issue-body.md")" -gt 60000 ]; then
            { head -c 60000 "${RUNNER_TEMP}/issue-body.md" | sed '$d'
              printf '\n\n_(truncated: the full report exceeded a safe margin under GitHub'"'"'s issue-body limit -- see this run'"'"'s job summary for the complete markdown)_\n'
            } > "${RUNNER_TEMP}/issue-body.trunc.md"
            mv "${RUNNER_TEMP}/issue-body.trunc.md" "${RUNNER_TEMP}/issue-body.md"
          fi

          # `--limit 100`: `gh issue list` with no `--limit` caps at 30,
          # newest-created-first (measured live on this repo: `gh issue list
          # --state open --json number --jq length` -> 30, `--limit 500` ->
          # 49, with 12 open `ci` issues on top of that on an ordinary day).
          # Past 30 open issues the tracking issue this lookup exists to find
          # ages off page 1, `existing` comes back empty with rc=0 --
          # indistinguishable from "no match" -- and the branch below opens a
          # silent duplicate, which then becomes the new de-dup target and
          # orphans the original open forever. The same fail-open the
          # `lookup_rc` check right below closes for a `gh` error, arriving
          # instead through pagination.
          set +e
          existing="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open \
                        --limit 100 --label ci --json number,body \
                        --jq "[.[] | select(.body | contains(\"${RESYNC_ISSUE_MARKER}\"))][0].number")"
          lookup_rc=$?
          set -e
          if [ "${lookup_rc}" -ne 0 ]; then
            echo "::error::gh issue list failed while searching for an existing planner-resync tracking issue -- refusing to guess whether one already exists, since guessing wrong here means opening a duplicate. See the step log for gh's error."
            exit 1
          fi
          if [ -n "${existing}" ]; then
            # Title deliberately not reset here: `gh issue edit --title` on
            # every refresh would clobber a maintainer-reworded title, the
            # exact case de-dup moved off the title (see the block comment
            # above this step) to stop being sensitive to. The title is set
            # once, on create, below.
            gh issue edit "${existing}" --repo "${GITHUB_REPOSITORY}" \
              --body-file "${RUNNER_TEMP}/issue-body.md"
            gh issue comment "${existing}" --repo "${GITHUB_REPOSITORY}" \
              --body "Refreshed by run ${{ github.run_id }} (alp-sdk \`${SDK_SHA}\`), still nothing to propose."
            echo "url=$(gh issue view "${existing}" --repo "${GITHUB_REPOSITORY}" --json url -q .url)" >> "$GITHUB_OUTPUT"
          else
            url="$(gh issue create --repo "${GITHUB_REPOSITORY}" \
                     --title "${RESYNC_ISSUE_TITLE}" --label ci \
                     --body-file "${RUNNER_TEMP}/issue-body.md")"
            echo "url=${url}" >> "$GITHUB_OUTPUT"
          fi

      # Companion to the step above: once a run reports nothing owed, OR a
      # real diff shows up and the PR step above opens/refreshes a PR for it,
      # any tracking issue a PRIOR rc=1/empty-diff run opened is stale by
      # definition -- close it rather than let it sit open asserting "nothing
      # to merge" while a proposal PR now exists (tan-cli#920: this second
      # case was a gap in the original tan-cli#911 fix -- `rc=1` with a
      # NON-empty diff opened a PR but neither refreshed nor closed the
      # issue, since the original condition here was `rc == '0'` alone). Same
      # marker match as the step above, so it only ever touches the one issue
      # this workflow owns.
      - name: Close the tracking issue once nothing is owed or a PR now covers it
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.open_pr) && (steps.resync.outputs.rc == '0' || steps.pr.outputs.opened == 'true') }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # --limit 100: same fail-open as the "Surface..." step's own lookup
          # above (`gh issue list` defaults to a 30-item, newest-first page;
          # see that step's comment for the measured numbers) -- without it,
          # an old tracking issue can age off page 1 and this step silently
          # does nothing instead of closing it.
          set +e
          existing="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open \
                        --limit 100 --label ci --json number,body \
                        --jq "[.[] | select(.body | contains(\"${RESYNC_ISSUE_MARKER}\"))][0].number")"
          lookup_rc=$?
          set -e
          if [ "${lookup_rc}" -ne 0 ]; then
            echo "::error::gh issue list failed while checking for a stale planner-resync tracking issue to close. See the step log for gh's error."
            exit 1
          fi
          if [ -n "${existing}" ]; then
            if [ '${{ steps.resync.outputs.rc }}' = '0' ]; then
              msg="Nothing owed as of run ${{ github.run_id }} -- \`planner_resync.py\` reported \`rc=0\`. Closing."
            else
              msg="A proposal PR now exists for this delta (${{ steps.pr.outputs.url }}), so this tracking issue's \"nothing to merge\" is stale. Closing -- see the PR for the remaining human follow-up."
            fi
            gh issue comment "${existing}" --repo "${GITHUB_REPOSITORY}" --body "${msg}"
            gh issue close "${existing}" --repo "${GITHUB_REPOSITORY}"
          fi

      # Last, so the PR (or tracking issue) exists before this job goes red.
      # A re-sync that needs a human is a REAL finding and must not be
      # reported as success -- but the proposal is more useful than the red
      # X, so it lands first.
      #
      # `if: !cancelled()` (tan-cli#920): every other step's `if` gets an
      # implicit `&& success()`, so if ANY upstream step in this job fails --
      # most reachably "Surface the owed work..." above, on its own `gh` call
      # -- this step used to be skipped along with it, and the job still went
      # red but WITHOUT the `::error::` annotation that names which of rc 1/2
      # it was and where to look. `!cancelled()` means Verdict still runs (and
      # still reports correctly: `steps.resync.outputs.rc` etc. are set by
      # steps that ran before the point of failure) even when a later,
      # informational step breaks -- but, unlike `always()`, still skips on a
      # cancelled run. `always()` would also fire when an earlier step (the
      # checkout, the SDK clone) fails before `planner_resync.py` ever ran:
      # driven with every step output unset, this step's own `rc=''` falls
      # into the `*)` branch and prints `::error::planner_resync.py did not
      # report an exit code` -- right direction (still red), wrong cause
      # named, since `planner_resync.py` never got the chance to run at all.
      # `${{ }}` expands to a literal empty string before bash sees it, so
      # `set -u` does not additionally trip on the unset outputs here.
      - name: Verdict
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          rc='${{ steps.resync.outputs.rc }}'
          case "${rc}" in
            0) echo "Re-sync clean (or nothing owed)." ;;
            1) echo "::error::a re-sync is owed and part of it needs a human -- see ${{ steps.pr.outputs.url || steps.issue.outputs.url || 'the job summary' }}. The pins covering the unresolved half did NOT move, so the freshness gate stays red until someone ports it."; exit 1 ;;
            2) echo "::error::planner_resync.py REFUSED to propose anything (a pin disagrees with its own hash table, or the alp-sdk checkout is unusable) -- see the job summary."; exit 1 ;;
            *) echo "::error::planner_resync.py did not report an exit code"; exit 1 ;;
          esac
          if [ '${{ steps.gate.outputs.verdict }}' != 'PASS' ] && [ '${{ steps.pr.outputs.opened }}' = 'true' ]; then
            echo "::error::the re-sync applied cleanly but the freshness gate did not pass against it (${{ steps.gate.outputs.verdict }}) -- do not merge the proposal on the strength of a clean apply."
            exit 1
          fi

    # Deliberately placed here rather than near the top of the job (where a
    # `permissions:` block conventionally sits): `.github/zizmor.yml` pins the
    # "Check out tan-cli dev" step's credential-persistence ignore to an exact
    # `planner-resync.yml:151:9` (tan-cli#435), and that file is under
    # parallel edit for tan-cli#899 -- coordinate by reporting a conflict
    # there rather than editing it (this PR's own instructions). Any line
    # added ABOVE that step shifts the ignore stale and reddens `zizmor
    # --min-severity medium`, so this block lives down here instead, after
    # every step, where it cannot move that line. A mapping key's position in
    # a YAML block has no effect on what it grants, at job level exactly as
    # at workflow level.
    #
    # JOB-SCOPED, not workflow-scoped (tan-cli#920, second-round review of
    # tan-cli#911): this was `permissions:` at the workflow's top level,
    # granting `contents`/`pull-requests`/`issues` write to every job this
    # file will ever gain, not just the one that uses them today.
    # `parity.yml`'s `notify-planner-drift` job is this repo's own prior art
    # for scoping a write grant to the job that actually needs it (its
    # comment: "it holds `issues: write`, which is the one token in this file
    # worth bounding on its own account") -- moved here to match, with
    # `contents`/`pull-requests` brought along since this is still the only
    # job in the file and splitting them across levels would buy nothing.
    # Measured: this placement (appended after `steps:`, a job-level mapping
    # key like any other) leaves `planner-resync.yml:151:9` unchanged and
    # `zizmor --min-severity medium .github/workflows/` at rc 0.
    #
    # NOT PERMANENT: the placement (not the job-scoping) exists only because
    # of the line-pinned ignore above. tan-cli#899 (PR #919) moves that same
    # ignore to an inline `# zizmor: ignore[artipacked]` comment on the
    # checkout step itself, which removes the line-number dependency
    # entirely -- once that lands, this block is free to move back up near
    # `steps:` (or stay here) on its own merits, not because a stray line
    # above line 151 would redden the gate. Don't take this comment as an
    # argument for keeping the PLACEMENT; the job-scoping itself is not
    # contingent on #899 either way.
    permissions:
      contents: write
      pull-requests: write
      # tan-cli#911: the tracking-issue fallback below the PR step needs
      # this; neither `contents` nor `pull-requests` covers `gh issue
      # create`/`edit`/`close`.
      issues: write

    # Shared by "Surface the owed work..." and "Close the tracking issue..."
    # above (tan-cli#920, second-round review of tan-cli#911): both used to
    # declare their own copy of `RESYNC_ISSUE_TITLE` with a comment claiming
    # there was "no job-level `env:` here to share it from without adding a
    # line ahead of the `Check out tan-cli dev` step's zizmor line-scoped
    # ignore" -- that claim was false the same way the `permissions:` block
    # above already proves it false: a job-level mapping key appended AFTER
    # `steps:` doesn't move any line above it. Sharing it here means the two
    # steps cannot drift out of sync the way two hand-kept copies eventually
    # do. `RESYNC_ISSUE_MARKER` is new in the same round: the de-dup key
    # itself moved from the (editable) title to a fixed body marker,
    # matching `parity.yml`'s `notify-planner-drift` job -- see the "Surface
    # the owed work..." step's own comment for why.
    env:
      RESYNC_ISSUE_TITLE: "planner-resync: a re-sync is owed and needs a human (no diff to propose)"
      RESYNC_ISSUE_MARKER: "<!-- tan-cli-planner-resync-tracker -->"
