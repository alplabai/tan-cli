# SPDX-License-Identifier: Apache-2.0
#
# tan release pipeline — build per-platform `tan` binaries on a version tag and
# publish them as GitHub release assets for the alp-sdk-vscode downloader.
#
# ===========================================================================
# THE CONTRACT (alp-sdk-vscode's releaseAssetForTarget MUST match this exactly)
# ===========================================================================
#
#   Tag scheme : v<major>.<minor>.<patch>   (SemVer, e.g. v0.1.0)
#                The tag MUST equal the `tan` crate version in the workspace
#                Cargo.toml ([workspace.package] version) — the verify-version
#                job below fails the release if it does not.
#
#   Assets     : one RAW (uncompressed) binary per target triple, named
#                   tan-<target-triple>        (Unix: no extension)
#                   tan-<target-triple>.exe     (Windows)
#                Download URL is therefore deterministic:
#                   https://github.com/alplabai/tan-cli/releases/download/<tag>/<asset>
#                Plus `checksums.txt` (sha256 of every binary),
#                `envelope-contract.json` (the WHOLE issue-code registry, all
#                three statuses and not a frozen-only subset — a consumer reads
#                `status` to decide what each code promises — plus one golden
#                envelope per command family; see contract/README.md), and a
#                GitHub build-provenance attestation covering all of the above —
#                verify with `gh attestation verify <file> --repo alplabai/tan-cli`.
#
#   Targets    : win32  x64   -> tan-x86_64-pc-windows-msvc.exe
#                win32  arm64 -> tan-aarch64-pc-windows-msvc.exe
#                linux  x64   -> tan-x86_64-unknown-linux-gnu      (glibc >= 2.31)
#                linux  arm64 -> tan-aarch64-unknown-linux-gnu     (glibc >= 2.31)
#                linux  x64   -> tan-x86_64-unknown-linux-musl     (static, any libc)
#                linux  arm64 -> tan-aarch64-unknown-linux-musl    (static, any libc)
#                darwin x64   -> tan-x86_64-apple-darwin
#                darwin arm64 -> tan-aarch64-apple-darwin
#                (Windows ships BOTH x64 and arm64 — pick by process.arch.
#                 Linux ships BOTH -gnu and -musl per arch — the -musl asset
#                 runs on any distro/libc, including the -gnu asset's own host.)
#
#   Linux builds cross-build via cargo-zigbuild on ubuntu-latest (issue #6):
#   the -gnu targets are pinned to a glibc 2.31 floor (building on the raw
#   runner links its glibc — 2.39 on ubuntu-24.04 — which breaks consumers on
#   older distros with `GLIBC_2.39 not found`); the -musl targets are fully
#   static. TLS is rustls/ring (no OpenSSL), so musl needs no extra deps.
#
# See docs/release-contract.md for the full contract + the vscode mapping table.
# ===========================================================================

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the release + upload assets (default GITHUB_TOKEN only)

jobs:
  # Fail fast: the tag must match the crate version before we build 8 targets.
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tag == Cargo version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')"
          echo "tag=$tag  cargo=$cargo_version"
          if [ "$tag" != "$cargo_version" ]; then
            echo "::error::tag v$tag does not match [workspace.package] version $cargo_version in Cargo.toml"
            exit 1
          fi
      # #A1: npm-shim/package.json's version drives the ASSET TAG postinstall.js
      # downloads (`TAG = v${pkg.version}`) — independently of everything above,
      # so it can drift behind Cargo.toml/the release tag with nothing here
      # catching it (npm-shim was six releases stale before this check existed).
      # Same style as the check above deliberately: grep the one version line
      # rather than parse the JSON with a tool this job doesn't otherwise need.
      #
      # KEPT WHILE npm PUBLISHING IS OFF, on purpose. `publish_npm` is opt-in
      # (see its own `NPM_PUBLISH_ENABLED`), so as of v0.4.1 this gate keeps a
      # package version in step that nothing consumes — the release cut is a
      # FIVE-file bump for a channel that does not publish. That is deliberate,
      # not an oversight: the day the token is fixed (#233) the shim must already
      # be at the right version, and the alternative is re-discovering the
      # six-releases-stale bug this check exists to prevent. Cheap to keep,
      # expensive to re-earn.
      - name: npm-shim version == Cargo version
        shell: bash
        run: |
          cargo_version="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')"
          shim_version="$(grep -m1 '"version":' npm-shim/package.json | sed -E 's/.*"version": *"([^"]+)".*/\1/')"
          echo "cargo=$cargo_version  npm-shim=$shim_version"
          if [ "$shim_version" != "$cargo_version" ]; then
            echo "::error::npm-shim/package.json version $shim_version does not match [workspace.package] version $cargo_version in Cargo.toml"
            exit 1
          fi

  # The tagged commit must pass the same gates a PR does — a tag can be cut from
  # any commit, so "it was green on main" is an assumption, not a fact.
  gates:
    uses: ./.github/workflows/ci.yml
    # A called workflow inherits the caller's permissions; the gates compile
    # third-party deps and need no write on the release.
    permissions:
      contents: read

  build:
    needs: [verify-version, gates]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset: tan-x86_64-pc-windows-msvc.exe
            ext: .exe
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            asset: tan-aarch64-pc-windows-msvc.exe
            ext: .exe
          # `zigbuild_target` opts a job into cargo-zigbuild; the `.2.31`
          # suffix pins the -gnu builds' glibc floor (zigbuild still writes
          # the output under the bare `target/<target>/release/` dir).
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset: tan-x86_64-unknown-linux-gnu
            ext: ""
            zigbuild_target: x86_64-unknown-linux-gnu.2.31
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            asset: tan-aarch64-unknown-linux-gnu
            ext: ""
            zigbuild_target: aarch64-unknown-linux-gnu.2.31
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            asset: tan-x86_64-unknown-linux-musl
            ext: ""
            zigbuild_target: x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            asset: tan-aarch64-unknown-linux-musl
            ext: ""
            zigbuild_target: aarch64-unknown-linux-musl
          - target: x86_64-apple-darwin
            os: macos-latest
            asset: tan-x86_64-apple-darwin
            ext: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            asset: tan-aarch64-apple-darwin
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
      - name: install cargo-zigbuild
        if: matrix.zigbuild_target != ''
        # Must be a pip --user install, NOT pipx: cargo-zigbuild finds zig via
        # `zig` on PATH or `python3 -m ziglang`, and pipx isolates the ziglang
        # wheel inside its own venv where neither works ("Failed to find zig").
        # --break-system-packages sidesteps PEP 668 on the 24.04 runner; the
        # user site keeps ziglang importable by the system python3.
        run: |
          pip3 install --user --break-system-packages cargo-zigbuild
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: build release binary
        shell: bash
        # --locked: publish binaries built from the exact dep set CI compiled and
        # tested, never a re-resolved one.
        run: |
          if [ -n "${{ matrix.zigbuild_target }}" ]; then
            cargo zigbuild --release --locked --target "${{ matrix.zigbuild_target }}" --bin tan
          else
            cargo build --release --locked --target "${{ matrix.target }}" --bin tan
          fi
      - name: stage asset
        shell: bash
        run: cp "target/${{ matrix.target }}/release/tan${{ matrix.ext }}" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    # id-token/attestations are scoped to this job only (it's the one that
    # attests the binaries); contents:write is re-declared here (an explicit
    # job-level `permissions:` block replaces, not adds to, the workflow-level
    # default) so this job keeps the ability to create the release.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      # The JSON envelope contract, as a downloadable artefact (issue #106).
      # alp-sdk-vscode gates real behaviour on exact issue-code strings and
      # unversioned `data` field names, and every one of those matches fails
      # open — a rename is indistinguishable from "no problem" on the consumer
      # side. Publishing the goldens lets the extension's own contract test
      # diff against THIS instead of a hand-copied fixture that drifts.
      #
      # Pure re-packaging: every input is a committed file already gated by
      # `cargo test -p alp-tan-cli --test contract`, so there is no fact here
      # that can be right in the repo and wrong in the asset. Run it locally
      # with `python3` from the repo root to see exactly what ships.
      - name: Bundle the envelope contract
        shell: bash
        run: |
          python3 - "${GITHUB_REF_NAME#v}" > assets/envelope-contract.json <<'PY'
          import json, pathlib, sys

          root = pathlib.Path("contract")
          registry = json.loads((root / "issue-codes.json").read_text(encoding="utf-8"))
          envelopes = {}
          for case in sorted(p for p in (root / "envelopes").iterdir() if p.is_dir()):
              envelopes[case.name] = {
                  "args": [
                      line.strip()
                      for line in (case / "args.txt").read_text(encoding="utf-8").splitlines()
                      if line.strip()
                  ],
                  "exitCode": int((case / "expected.exit").read_text(encoding="utf-8").strip()),
                  "envelope": json.loads((case / "expected.json").read_text(encoding="utf-8")),
              }
          json.dump(
              {
                  "schemaVersion": 1,
                  "tanVersion": sys.argv[1],
                  "issueCodes": registry["issueCodes"],
                  "envelopes": envelopes,
              },
              sys.stdout,
              indent=2,
          )
          PY
          python3 -c "import json,sys; d=json.load(open('assets/envelope-contract.json')); \
            assert d['envelopes'] and d['issueCodes'], 'empty bundle'; \
            print('bundled', len(d['envelopes']), 'envelopes,', len(d['issueCodes']), 'issue codes')"
      - name: Generate checksums.txt
        shell: bash
        working-directory: assets
        run: sha256sum * > checksums.txt
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: assets/*
      - name: Slice CHANGELOG section for the release notes
        shell: bash
        run: |
          # The tag is vX.Y.Z; the CHANGELOG header is `## [X.Y.Z]` (no v-prefix,
          # em-dash date). Extract that one section as the GitHub Release body.
          VERSION="${GITHUB_REF_NAME#v}"
          python3 - "$VERSION" <<'PY' > release_notes.md
          import sys, re
          version = sys.argv[1]
          out, capturing, found = [], False, False
          for line in open("CHANGELOG.md", encoding="utf-8"):
              if re.match(rf"^## \[{re.escape(version)}\]", line):
                  capturing = found = True
                  continue
              if capturing and line.startswith("## ["):
                  break
              if capturing:
                  out.append(line)
          body = "".join(out).strip()
          # #212: this used to `print(body if body else f"See CHANGELOG.md for
          # {version}.")` and exit 0, so a tag whose section was never written
          # published a release whose entire body was that one sentence -- and
          # nothing anywhere said so. The failure mode is not hypothetical: the
          # version bump renames `## [Unreleased]` to `## [X.Y.Z]`, and a bump
          # that edits the version files but forgets the CHANGELOG header leaves
          # exactly this state. Checked against dev before this change: a v0.4.1
          # tag would have found no section and shipped the stub.
          #
          # A release with no notes is not a degraded release, it is a broken
          # one -- the notes are the only human-readable record of what changed,
          # and the tag is immutable once pushed. Fail before publishing, not
          # after. `shell: bash` runs with `-eo pipefail`, so a non-zero exit
          # here stops the job.
          if not found:
              sys.exit(
                  f"::error::CHANGELOG.md has no `## [{version}]` section, so this "
                  f"release would publish with an empty body. The version bump "
                  f"renames `## [Unreleased]` to `## [{version}] -- <date>`; that "
                  f"edit is missing. Fix CHANGELOG.md on the release branch, then "
                  f"re-tag."
              )
          if not body:
              sys.exit(
                  f"::error::CHANGELOG.md's `## [{version}]` section is empty. A "
                  f"release body has to say what changed; write the section, then "
                  f"re-tag."
              )
          print(body)
          PY
          cat >> release_notes.md <<'NOTES'

          ## Release assets

          - `-gnu` Linux binaries are cross-built with a pinned **glibc 2.31**
            floor -- they run on Debian 11 (bullseye) / Ubuntu 20.04 and newer.
            `-musl` Linux binaries are fully static and run on any distro/libc.
          - Every binary + `checksums.txt` carries a GitHub build-provenance
            attestation. Verify with:
            `gh attestation verify <downloaded-file> --repo alplabai/tan-cli`
          NOTES
          echo "----- release_notes.md -----"; cat release_notes.md
      # A SemVer pre-release tag carries a hyphen in its version (`v0.4.0-rc1`);
      # a real release never does. Both flags are derived from that one fact so
      # they cannot disagree with each other or with the tag.
      #
      # This is load-bearing, not hygiene. Both installers resolve what `latest`
      # means through GitHub, and GitHub excludes a release from `latest` ONLY
      # when it is marked `prerelease`. Publishing an rc without these flags
      # therefore hands it to every customer running the documented install
      # command. Neither flag was set before, so the classification rested
      # entirely on the action's default -- an unacceptable place for that blast
      # radius to live.
      #
      # The two scripts ask two different endpoints -- `install.sh` follows the
      # `/releases/latest` redirect, `install.ps1` reads the API's `tag_name`
      # (see each script for why its host needs that one). Both exclude
      # prereleases on the same flag, so they agree; verified against this repo
      # with v0.4.0 marked prerelease, where both resolve `latest` to v0.3.1
      # rather than to the higher version number.
      #
      # `make_latest` is spelled as an explicit "true"/"false" string because the
      # action takes a string, not a boolean.
      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          fail_on_unmatched_files: true
          body_path: release_notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}

  # crates.io — `cargo install alp-tan-cli` (the crate is `alp-tan-cli` because
  # `tan`/`tan-cli` are already taken on crates.io; the built binary is still
  # `tan`). Publishes tan-core THEN alp-tan-cli (core first — `cargo publish`
  # waits for it to appear on the index before publishing the crate that
  # path-depends on it). Gated on
  # CARGO_REGISTRY_TOKEN; skipped (not failed) when the secret is unset so a
  # fork/CI run without publish credentials still goes green.
  #
  # A pre-release tag is deliberately NOT published to crates.io. crates.io
  # allows a SemVer pre-release version and `cargo install` / `^` ranges do skip
  # one by default, so this is a conservative call rather than a forced one --
  # but a crates.io publish can only ever be YANKED, never deleted, while a
  # GitHub pre-release can be removed outright. Keeping an rc off crates.io
  # keeps it fully retractable, which is the whole point of cutting one. Relax
  # this the day we want an rc installable via `cargo install --version`.
  publish_crates:
    name: publish · crates.io
    needs: release
    if: ${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: "" # keep parity with the local gates (see ci.yml's lint job)

      # This job ONLY runs on a final tag -- the `if:` above excludes every
      # pre-release -- so a missing token here is not "an optional channel we
      # skipped", it is a release advertising `cargo install alp-tan-cli` when
      # that command does not resolve. v0.4.0 shipped exactly that: this job
      # reported `success`, the `::warning::` went unread, and crates.io
      # answered `crate 'alp-tan-cli' does not exist` (#151).
      - name: Refuse to "publish" with no token
        if: ${{ env.CARGO_REGISTRY_TOKEN == '' }}
        run: |
          echo "### crates.io: NOT PUBLISHED" >> "$GITHUB_STEP_SUMMARY"
          echo "\`CARGO_REGISTRY_TOKEN\` is not set, so \`cargo install alp-tan-cli\` will not resolve for this release." >> "$GITHUB_STEP_SUMMARY"
          echo "::error::CARGO_REGISTRY_TOKEN is not set. A FINAL release must not report a successful crates.io publish it did not perform (#151). Add the secret, or drop the crates.io install path from the docs and this job."
          exit 1

      - name: Publish tan-core then alp-tan-cli
        # tan-core first; cargo publish waits for it to hit the index before
        # alp-tan-cli (which depends on it) is published.
        run: |
          cargo publish --package tan-core --locked
          cargo publish --package alp-tan-cli --locked

      # The run summary, not just an annotation. An annotation is the weakest
      # signal GitHub has and #151 is the proof: the skip warning was emitted
      # correctly on v0.4.0 and still read as a publish.
      - name: Record the crates.io outcome
        run: |
          echo "### crates.io: published \`alp-tan-cli@${GITHUB_REF_NAME#v}\`" >> "$GITHUB_STEP_SUMMARY"

  # npm shim — `npm i -g @alplabai/tan` / `npx @alplabai/tan`. One release tag
  # scheme (v*), one workflow. Gated on NPM_TOKEN; on a FINAL tag a missing
  # token FAILS rather than skipping, mirroring the crates.io job above (#151).
  #
  # A pre-release tag is skipped here too, and this path was the sharpest of the
  # three: `npm publish` below passes no `--tag`, so npm defaults the release to
  # the `latest` dist-tag. An unguarded rc would therefore become plain
  # `npm i -g @alplabai/tan` for every consumer -- and npm unpublish is far more
  # restricted than a crates.io yank (72-hour window, refused outright once
  # anything depends on it).
  #
  # The relaxation, when we want an rc installable: publish it with
  # `--tag next` so `npm i @alplabai/tan@next` reaches it while `latest` stays
  # on the last real release. Skipping is the smaller change and keeps the rc
  # fully retractable, which is the point of cutting one.
  publish_npm:
    name: publish · npm shim
    needs: release
    if: ${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: npm-shim
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      # Publishing is OPT-IN, off by default. Set the repository VARIABLE
      # `TAN_NPM_PUBLISH` to `true` to arm it (Settings -> Secrets and variables
      # -> Actions -> Variables). A variable, not a secret: the value is not
      # sensitive, and a secret that gates behaviour is invisible in the UI.
      #
      # WHY off (#233): v0.4.1's publish failed with `npm error code EOTP` --
      # `NPM_TOKEN` is a classic/publish token on a 2FA account, so `npm publish`
      # demands an interactive one-time password no CI run can answer. Only an
      # npm AUTOMATION (or granular) token is exempt. That is an account-side
      # fix, so the failure recurs on every final tag until it is made.
      #
      # A permanently-red job on the release workflow is worse than no job. It is
      # the mirror of a gate that cannot fail: a job that can only fail teaches
      # everyone to stop reading the one board where ignoring red is least
      # affordable. So this is gated OFF rather than left red -- and the OFF path
      # is LOUD (see `npm publishing is disabled` below), because the other
      # failure this repo spent the week removing is a channel that quietly
      # reports success while shipping nothing (#151).
      NPM_PUBLISH_ENABLED: ${{ vars.TAN_NPM_PUBLISH == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      # Runs whether or not publishing is armed. The shim is still a shipped
      # artefact of this repo, and a shim that stops packing is worth catching
      # while it is cheap rather than on the day the token is fixed.
      - name: Pack (smoke — confirm the shim packs with its bin + postinstall)
        run: |
          npm pack --dry-run
          node -e "const p=require('./package.json'); if(!p.bin||!p.bin.tan) throw new Error('shim missing bin.tan')"

      # The OFF path, and it says so out loud in the run summary rather than
      # passing silently. Exits 0: not publishing is the DECISION here, not a
      # failure, and the release itself is unaffected.
      - name: npm publishing is disabled
        if: ${{ env.NPM_PUBLISH_ENABLED != 'true' }}
        run: |
          {
            echo "### npm: NOT PUBLISHED — deliberately disabled"
            echo
            echo "\`@alplabai/tan@${GITHUB_REF_NAME#v}\` was **not** published. The shim packed cleanly; publishing is gated off."
            echo
            echo "Reason: the configured \`NPM_TOKEN\` requires an interactive one-time password (\`npm error code EOTP\`), which no CI run can supply. It needs replacing with an npm **automation** token — see [#233](https://github.com/alplabai/tan-cli/issues/233)."
            echo
            echo "To arm this job once that is done, set the repository variable \`TAN_NPM_PUBLISH\` to \`true\`."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::npm publish is gated off (TAN_NPM_PUBLISH is not 'true'). @alplabai/tan was NOT published for this tag; see #233."

      # Same rule as the crates.io job, and for the same reason: this job only
      # runs on a final tag, so a missing token means the release advertises
      # `npm i -g @alplabai/tan` for a package that does not exist. v0.4.0 did
      # (#151). The pack smoke above still runs first, so a genuinely broken
      # shim is reported as a broken shim rather than as a missing secret.
      # The three ARMED steps below all carry the same gate. Left individually
      # conditional rather than split into a second job, so the token refusal,
      # the publish and the outcome record stay next to the pack smoke they
      # belong with.
      - name: Refuse to "publish" with no token
        if: ${{ env.NPM_PUBLISH_ENABLED == 'true' && env.NPM_TOKEN == '' }}
        run: |
          echo "### npm: NOT PUBLISHED" >> "$GITHUB_STEP_SUMMARY"
          echo "\`NPM_TOKEN\` is not set, so \`npm i -g @alplabai/tan\` will not resolve for this release. The shim packed cleanly." >> "$GITHUB_STEP_SUMMARY"
          echo "::error::NPM_TOKEN is not set, but TAN_NPM_PUBLISH is 'true'. A FINAL release must not report a successful npm publish it did not perform (#151). Add the secret, or unset TAN_NPM_PUBLISH."
          exit 1

      - name: Publish to npm
        if: ${{ env.NPM_PUBLISH_ENABLED == 'true' }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Record the npm outcome
        if: ${{ env.NPM_PUBLISH_ENABLED == 'true' }}
        run: |
          echo "### npm: published \`@alplabai/tan@${GITHUB_REF_NAME#v}\`" >> "$GITHUB_STEP_SUMMARY"
