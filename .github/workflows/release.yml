# SPDX-License-Identifier: Apache-2.0
#
# tan release pipeline — freeze per-platform `tan` binaries on a version tag and
# publish them as GitHub release assets for the alp-sdk-vscode downloader.
#
# ===========================================================================
# THE CONTRACT (alp-sdk-vscode's releaseAssetForTarget MUST match this exactly)
# ===========================================================================
#
#   Tag scheme : v<major>.<minor>.<patch>   (SemVer, e.g. v0.1.0)
#                The tag MUST equal `TAN_VERSION` in python/tan/version.py —
#                the string the shipped binary prints — with pyproject.toml
#                (PEP 440 rendering) and npm-shim/package.json reconciled
#                against it. The verify-version job below fails the release if
#                they disagree. There is no longer a workspace Cargo.toml to
#                read at all — tan-cli#269 deleted `crates/` — but this note
#                stays because an earlier revision of this header said the tag
#                had to equal that Cargo.toml's version, and an operator
#                acting on it bumped a version no gate reads. Exactly the
#                stale opposite-of-the-code comment tan-cli#259 warns about.
#
#   Assets     : one ARCHIVE per target triple (tan-cli#349 — was one raw
#                uncompressed binary; see below), named
#                   tan-<target-triple>.tar.gz  (Unix)
#                   tan-<target-triple>.zip     (Windows)
#                Download URL is therefore deterministic:
#                   https://github.com/alplabai/tan-cli/releases/download/<tag>/<asset>
#                Plus `checksums.txt` (sha256 of every archive),
#                `envelope-contract.json` (the WHOLE issue-code registry, all
#                three statuses and not a frozen-only subset — a consumer reads
#                `status` to decide what each code promises — plus one golden
#                envelope per command family; see contract/README.md), and a
#                GitHub build-provenance attestation covering all of the above —
#                verify with `gh attestation verify <file> --repo alplabai/tan-cli`.
#
#   The binaries are PyInstaller --onedir freezes of `python/` (the Python
#   port), archived for distribution, NOT cargo builds of `crates/` —
#   tan-cli#271 (the Python port) / tan-cli#349 (onedir + archive). --onedir,
#   not --onefile: --onefile re-extracts its ~14 MB runtime into a fresh temp
#   dir on EVERY invocation, and on macOS each extracted .dylib is unsigned
#   (the parent's ad-hoc signature does not cover extracted copies), so the OS
#   re-verifies every one of them on every launch — measured 13.25-19.74 s for
#   `--version` on the published v0.5.0-rc4 macOS asset, which TIMED OUT
#   against alp-sdk-vscode's own 3 s version-probe budget
#   (vscodeAdapter.ts:1406). The old "REQUIRED, not a preference" reasoning
#   here — that the extension downloads a raw binary to ONE cached path with
#   no unpack step anywhere in it (service.ts:295) — is exactly the stale
#   opposite-of-the-code comment tan-cli#259 warns about now that this
#   pipeline emits an archive; unpacking it on the extension side is a
#   SEPARATE unit of #349 landing independently in that repo. The ASSET NAMES
#   keep the RUST target triples because service.ts:34-46 hardcodes them and
#   builds the download URL from them; python/scripts/build_binary.sh
#   documents the same rename-on-upload from its own side.
#
#   Targets    : win32  x64   -> tan-x86_64-pc-windows-msvc.zip
#                darwin x64   -> tan-x86_64-apple-darwin.tar.gz
#                darwin arm64 -> tan-aarch64-apple-darwin.tar.gz
#                linux  x64   -> tan-x86_64-unknown-linux-gnu.tar.gz
#
#   DELIBERATELY NOT PUBLISHED — an accepted 404 on those two hosts, not an
#   oversight: tan-aarch64-pc-windows-msvc.zip and
#   tan-aarch64-unknown-linux-musl.tar.gz (or -gnu). PyInstaller cannot cross-compile:
#   every asset must be frozen on its own architecture (build_binary.sh:36).
#   The reason is NOT "no arm64 runner exists" — `windows-11-arm` and
#   `ubuntu-24.04-arm` are current hosted labels — it is that adding two more
#   runner types was out of scope for this tag. Nor is it billing: this repo is
#   PUBLIC (`gh repo view alplabai/tan-cli --json isPrivate` → false), so arm64
#   minutes are not a barrier. An earlier revision of this comment said they
#   were "billed and plan-gated on a PRIVATE repo" — true once, false now, and
#   exactly the kind of stale reason this block warns about. Recorded precisely
#   because a wrong reason is what stops anyone revisiting: the blocker is a
#   decision, not a platform limit, and it can be revisited whenever arm64
#   assets are wanted.
#
#   The LINUX asset is `-gnu`, and that name is deliberate. It is frozen in
#   python:3.12-slim-bullseye (Debian 11, glibc 2.31), so it IS a glibc binary;
#   calling it `-musl` would bake a lie into a filename we support for years.
#   Two rejected alternatives, both on MEASUREMENT rather than taste:
#     * Alpine/musl — PyInstaller's musllinux bootloader
#       (bootloader/Linux-64bit-intel-musl/run) carries ELF interpreter
#       /lib/ld-musl-x86_64.so.1, so a musl freeze runs ONLY on musl distros.
#       It is not the "static, runs on any libc" artefact the Rust -musl target
#       produced, and shipping it would have broken every Ubuntu/Debian/Fedora
#       user.
#     * manylinux2014 — ships a STATIC-only CPython
#       (`sysconfig.get_config_var("Py_ENABLE_SHARED")` is 0, no
#       libpython3.12*.so anywhere in the image) and PyInstaller requires a
#       shared libpython: "ERROR: Python was built without a shared library,
#       which is required by PyInstaller." The whole Linux leg dies, and with
#       `needs: build` the release job never runs — zero assets under a tag
#       that is already pushed and irreversible.
#   Debian 11's 2.31 is also exactly the floor the retired cargo-zigbuild pin
#   (`x86_64-unknown-linux-gnu.2.31`) targeted, so nothing is lost against the
#   Rust asset.
#
#   The floor in the release notes is MEASURED over the PAYLOAD, inside the
#   build container, and never off the outer ELF. `readelf -V dist/tan/tan`
#   reads only PyInstaller's vendored bootloader, whose own floor is
#   GLIBC_2.14 no matter what image built it (measured: bullseye and trixie
#   both report 2.14 there while the real floors are 2.30 and 2.38) — a
#   constant that cannot detect the image regressing to a newer glibc, which
#   is the entire point of measuring. The real floor lives in the collected
#   onedir payload: libpython plus the extension modules, enumerated by walking
#   `dist/tan/` (the launcher plus `_internal/`) and probing every file as an
#   ELF. An earlier revision enumerated `.build/tan/PKG-00.toc` and claimed it
#   was "unchanged by --onedir vs --onefile"; that was false and it cost the
#   v0.5.0 tag — under --onedir the natives are collected into `_internal/`
#   rather than appended, so the TOC listed 2 entries, the floor step refused
#   to guess, `build` failed, and `release` was skipped under a pushed tag.
#
#   service.ts:34-46 still maps linux/x64 to the MUSL triple, so the extension
#   cannot download this asset. Deliberate, for this tag: SUPPORTED_CLI_VERSION
#   is still pinned to the last Rust release, so the extension never reaches an
#   RC at all and keeps using what it already has; RC testers install by hand.
#   Repointing that entry travels with the pin move at GA (#268).
#
#   SIZE: build_binary.sh fails the build above the per-class ceiling in
#   python/scripts/artifact_ceilings.env — TAN_MAX_ARTIFACT_BYTES_DEFAULT=
#   16500000 (glibc, what every asset THIS release publishes uses) and
#   TAN_MAX_ARTIFACT_BYTES_MUSL=18000000 (musl links libc statically and runs
#   larger; not published here, see the Linux section above) — and prints
#   what it measured. The TIGHTEST measurement to date is the Windows freeze
#   at 14047624 B (tan-cli#304 added `truststore` + `certifi`'s bundled
#   `cacert.pem` — a prior measurement of 13717947 B predates both) — about
#   2.3 MB of headroom against the DEFAULT ceiling — so
#   the next runtime dependency added to python/pyproject.toml is plausibly
#   the one that trips it, under a tag. (build_binary.sh and
#   tests/conformance/test_packaged_binary.py both source/parse this one file
#   rather than each carrying its own number — see artifact_ceilings.env's own
#   header: a single flat 15000000 B ceiling used to REJECT a correct
#   arm64-alpine build before it was split in two.) Raising a ceiling further
#   is not the fix: it is the only thing that detects a dirty-interpreter
#   build.
#
# See docs/release-contract.md for the full contract + the vscode mapping table.
# ===========================================================================

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  # Least privilege by default (tan-cli#435) -- only the `release` job (the
  # one that actually creates the GitHub Release + uploads assets) overrides
  # this to `write` via its own job-level `permissions:` block below. Every
  # other job here only checks out, builds, or reads another job's outputs.
  contents: read

jobs:
  # Fail fast, before the matrix freezes anything: the tag must equal
  # `TAN_VERSION` in python/tan/version.py, with pyproject.toml and
  # npm-shim/package.json reconciled against it. This line named the workspace
  # Cargo.toml version and a target count off the retired cargo pipeline until
  # tan-cli#383 -- neither survived the port, and it outlived the fix that
  # corrected every markdown file, because a comment is the one piece of
  # documentation nobody re-reads while editing the code beneath it. By the
  # time the step below contradicts it the tag is already pushed and immutable.
  verify-version:
    runs-on: ubuntu-latest
    # Read-only: this job only compares version strings across files/tag; it
    # never writes to the repo. Explicit job-level block (tan-cli#435) so a
    # future workflow-level default change can't silently grant it more.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing in this job pushes; don't leave a git credential helper
          # configured with write-capable creds for a job that never uses it.
          persist-credentials: false
      # THE SOURCE OF TRUTH IS `python/tan/version.py`'s `TAN_VERSION` — the
      # string the shipped binary PRINTS, and the one alp-sdk-vscode compares
      # against its SUPPORTED_CLI_VERSION. This step used to gate the tag on
      # `grep -m1 '^version = ' Cargo.toml`, which versions the RUST crates: with
      # the release assets now frozen from the Python package, that made a
      # correct `v0.5.0` tag fail before a single asset was built (Cargo.toml
      # said 0.4.1-dev while tan/version.py and pyproject.toml both said 0.5.0).
      #
      # A python script, not a grep, because two of the three files spell the
      # same version differently: SemVer `0.5.0-dev` vs PEP 440 `0.5.0.dev0`. A
      # string compare across that boundary is either a false failure or, worse,
      # a false pass on a version nobody agreed to. The mapping is explicit and
      # has its own `--selftest`. It keeps the npm-shim check the old step
      # carried, because postinstall.js derives the asset tag as
      # `TAG = v${pkg.version}` (npm-shim/postinstall.js:25) and the shim was six
      # releases stale before that check existed.
      #
      # No `pip install` before it: the script imports only the stdlib, so this
      # gate cannot fail for a reason unrelated to versions.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: tag == TAN_VERSION == pyproject == npm-shim
        shell: bash
        run: python python/scripts/version_check.py --selftest --tag "$GITHUB_REF_NAME"

  # The tagged commit must pass the same gates a PR does — a tag can be cut from
  # any commit, so "it was green on main" is an assumption, not a fact.
  gates:
    uses: ./.github/workflows/ci.yml
    # `sdk_parity: true` used to be deliberately off here, on the grounds that
    # `tan/planner/manifest.py:93,118` wrote `firmware_path: null`
    # unconditionally while alp-sdk's own manifest emitter omits the key when
    # unset -- a real divergence that would have redded every tag for a defect
    # a tag cannot fix.
    #
    # That citation no longer matches the file: `tan/planner/manifest.py` is
    # 104 lines (no line 118), and line 93 IS
    # `if firmware_path is not None:` -- the write-only-when-set rule, not its
    # absence. Fixed in abdd6f1 ("resync the relocated planner with the
    # alp-sdk it actually ships"), which also closed the four other deltas
    # from the same stale-relocation root cause (`sdk_compat.py` missing
    # entirely, the dropped `"TBD"` note, the legacy `on_module.*` fallback).
    # Re-measured here against a pinned alp-sdk checkout: the planner/manifest
    # parity tests (`-k "manifest or system_manifest"`) pass in full, and
    # `python/tests/gates` (the five files armed by parity.yml's seam1 job,
    # jlink freshness deselected) passes clean against the exact alp-sdk
    # commit tan/planner/ is audited against. One unrelated pre-existing
    # failure was found while re-measuring
    # (`test_bootstrap_command.py::test_the_fallback_constants_match_the_real_manifest_field_for_field`,
    # a `prerequisites_posix` mismatch) -- it fails identically with or
    # without `ALP_SDK_ROOT` bound, so it is not a `sdk_parity` regression and
    # not this input's concern; it already reddens `ci.yml`'s `python` job
    # today regardless of this flag and needs its own fix.
    #
    # A gate that cannot go green is not a gate, and one that is on-but-ignored
    # is worse -- flipped on now that the divergence it was off for is closed.
    with:
      sdk_parity: true
    # A called workflow inherits the caller's permissions; the gates compile
    # third-party deps and need no write on the release.
    permissions:
      contents: read

  # ci.yml's own `python` job runs the general `python/tests` suite (see
  # `gates` above), but only with `ALP_SDK_ROOT` bound when THIS caller passes
  # `sdk_parity: true` — enabled above — and even then it never ran
  # `python/tests/gates` against the alp-sdk commit tan/planner/ was actually
  # audited against (it checks out alp-sdk's default branch, not a pinned
  # audit SHA). `python_only: true` is what actually confines parity.yml's
  # `workflow_call` run here to skipping seam2/first-blink and most of
  # seam1-plan-shape's own steps (they read that input, negated, in their
  # `if:`, not `github.event_name`: inside a called workflow `github` is the
  # CALLER's context (this file's own `push` trigger), so
  # `github.event_name != 'workflow_call'` is always true and cannot gate
  # anything — an explicit input is the only way this caller can tell
  # parity.yml which jobs/steps to skip). seam1-plan-shape's tests/gates block
  # (audit-commit byte-hash gate + live jlink-freshness) is deliberately NOT
  # gated on that input and always runs here too — it is the only place in
  # either workflow that runs `python/tests/gates` against the commit
  # tan/planner/ was actually audited against, so this job is what puts it on
  # the release tag's vote. seam2/first-blink and seam1's OTHER steps already
  # gate every commit on `main` as tan-cli's own PR check, so a release tag
  # (cut from an already-green commit) gains nothing re-running THOSE here;
  # see parity.yml's `workflow_call:` comment.
  python-gates:
    uses: ./.github/workflows/parity.yml
    with:
      python_only: true
    permissions:
      contents: read

  # One PyInstaller freeze of `python/` per runner. There is no cross-build step
  # and there cannot be one: PyInstaller freezes the interpreter it is running
  # under, so the runner IS the target. That is why two of the six triples the
  # extension knows about are not published here — see the header for the real
  # reason (it is a scope/plan decision, NOT the absence of arm64 runners).
  build:
    needs: [verify-version, gates, python-gates]
    # Read-only: each leg freezes a binary and uploads it as a workflow
    # artifact (actions/upload-artifact -- a run-scoped blob, not a
    # repository write). None of these legs create commits, tags, or
    # releases. Explicit job-level block (tan-cli#435).
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # asset now carries the archive extension directly (tan-cli#349):
          # the release ships one archive per target, not a raw binary, so
          # `matrix.asset` is already the final filename and needs no rename
          # step beyond staging it out of `dist/`.
          - os: windows-latest
            asset: tan-x86_64-pc-windows-msvc.zip
            archive_ext: zip
          # macos-15-intel / macos-15, NOT macos-13 / macos-14: the macOS 13
          # image is retired (gone from actions/runner-images, so `runs-on:
          # macos-13` matches no runner and the job never schedules) and macOS
          # 14 is flagged deprecated there. These two are the current Intel and
          # Apple-silicon labels of the SAME OS version, which is what keeps the
          # two darwin assets comparable.
          - os: macos-15-intel
            asset: tan-x86_64-apple-darwin.tar.gz
            archive_ext: tar.gz
          - os: macos-15
            asset: tan-aarch64-apple-darwin.tar.gz
            archive_ext: tar.gz
          # `container` both routes this leg through the docker step below AND
          # is the single place the build image is named.
          - os: ubuntu-latest
            asset: tan-x86_64-unknown-linux-gnu.tar.gz
            archive_ext: tar.gz
            container: python:3.12-slim-bullseye
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing in this job pushes; don't persist write-capable creds a
          # PyInstaller build + its resolved deps never need (tan-cli#435).
          persist-credentials: false

      # 3.12 is the floor python/pyproject.toml declares, and the floor is what
      # ships: `tan build` bakes the interpreter into every Zephyr slice and
      # Zephyr's own python.cmake rejects anything older.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: ${{ !matrix.container }}
        with:
          python-version: "3.12"

      # A CLEAN venv, not the runner's shared interpreter: PyInstaller bundles
      # whatever its hooks can see, and the hosted images ship numpy/Pillow/
      # pywin32 — measured 34349423 B dirty vs ~13.7 MB clean, against the
      # 15000000 B ceiling scripts/build_binary.sh asserts. Deps come from
      # `pip install .` (pyproject is the one dependency list) rather than a
      # hand-copied set that can drift from it.
      #
      # `.[monitor]`, WITH the extra. An extra is optional for a wheel because a
      # wheel user can add it later; a customer holding a frozen binary never
      # can, and `tan monitor` is a command that binary advertises. Omitting it
      # ships a dead command whose own error text says so
      # (`monitor.pyserial-missing`: "A frozen `tan` binary bundles it at build
      # time, so a binary built without that extra cannot gain it here"). Costs
      # +73392 B measured, against >=1.2 MB of headroom in
      # python/scripts/artifact_ceilings.env.
      - name: freeze tan (PyInstaller, clean venv)
        if: ${{ !matrix.container }}
        shell: bash
        working-directory: python
        run: |
          set -euo pipefail
          python -m venv .venv-build
          VENV_PY=.venv-build/bin/python
          [ -x "$VENV_PY" ] || VENV_PY=.venv-build/Scripts/python.exe
          "$VENV_PY" -m pip install --quiet --upgrade pip
          "$VENV_PY" -m pip install --quiet ".[monitor]" "pyinstaller>=6.10"
          PYTHON="$VENV_PY" bash scripts/build_binary.sh
          # pytest AFTER the freeze, never before: the artifact is already built,
          # so this cannot inflate it. tests/conformance/test_packaged_binary.py
          # is the extension's own acceptance test (one file, <3 s --version,
          # the --add-data scaffold templates) and it self-skips unless dist/
          # exists -- which is exactly what the step above just produced. A
          # compile used to prove the asset ran; a freeze proves nothing until
          # it is executed, so it is executed here.
          "$VENV_PY" -m pip install --quiet pytest
          "$VENV_PY" -m pytest tests/conformance/test_packaged_binary.py -q

      # The Linux freeze runs in an OLD-glibc container so the binary's floor is
      # the CONTAINER's glibc, not the runner's. Freezing on bare ubuntu-latest
      # links its glibc (2.39 on 24.04) and hands users `GLIBC_2.39 not found`
      # — the exact defect the retired cargo-zigbuild `.2.31` pin existed to
      # avoid. PyInstaller has no equivalent flag, so an old distro IS the
      # mechanism. See the header for why this is neither Alpine/musl nor
      # manylinux2014 (both were tried and both are disqualified by
      # measurement, not preference).
      #
      # `docker run` from a normal job, NOT a job-level `container:`: checkout
      # and upload-artifact then keep running on the host where their bundled
      # Node works, and the image needs no git.
      #
      # The floor is measured HERE, in the image that produced the binary, over
      # the PAYLOAD rather than the outer ELF: `readelf -V dist/tan/tan` reads
      # only PyInstaller's vendored bootloader, whose own floor is GLIBC_2.14
      # under any build image, so it is a lower bound and cannot detect the
      # image regressing to a newer glibc — which is the entire point of
      # measuring.
      #
      # The scan walks the COLLECTED ONEDIR TREE (`dist/tan/`, i.e. the
      # launcher plus `_internal/`), not `.build/tan/PKG-00.toc`. An earlier
      # revision of this step read that TOC, and the comment here asserted it
      # was "unchanged by --onedir vs --onefile — PyInstaller writes this TOC
      # before the final packaging step either way". That is FALSE, and it cost
      # the v0.5.0 tag: under --onedir (tan-cli#349) PyInstaller collects the
      # natives into `_internal/` instead of appending them, so the TOC listed
      # `2` BINARY/EXTENSION entries where --onefile listed dozens, and this
      # step correctly refused with "payload scan found 2 native files / 3
      # GLIBC_ versions -- refusing to guess a floor". `build` failed, `release`
      # (needs: build) was skipped, and the tag was left spent with no Release
      # behind it.
      #
      # Walking `dist/tan/` is also strictly better than any build intermediate:
      # it measures the bytes that actually ship. Every file is probed as an ELF
      # and non-ELF files (the .pyc payload, data files) are skipped.
      #
      # It refuses (exit non-zero) rather than guessing if the scan yields
      # implausibly few native files or no GLIBC_ version at all — a wrong
      # number here becomes a compatibility promise in the release notes.
      - name: freeze tan (PyInstaller in ${{ matrix.container }}) + measure the glibc floor
        if: ${{ matrix.container }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/src" -w /src/python "${{ matrix.container }}" bash -euc '
            # binutils, for objdump. PyInstaller shells out to it on Linux to
            # walk each binary dependency and refuses outright without it:
            # "ERROR: On Linux, objdump is required. It is typically provided by
            # the '"'"'binutils'"'"' package". The -slim images do not carry it, and
            # nothing before this line would notice -- the whole Linux leg dies
            # at freeze time, and with `needs: build` the release job never runs,
            # leaving zero assets under a tag that is already pushed. That is
            # exactly what v0.5.0-rc1 hit on its first tag.
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends binutils
            python -m venv /tmp/venv
            /tmp/venv/bin/pip install --quiet --upgrade pip
            /tmp/venv/bin/pip install --quiet ".[monitor]" "pyinstaller>=6.10"
            PYTHON=/tmp/venv/bin/python bash scripts/build_binary.sh
            /tmp/venv/bin/pip install --quiet pytest pyelftools
            /tmp/venv/bin/python -m pytest tests/conformance/test_packaged_binary.py -q
            /tmp/venv/bin/python - <<"PY"
          import pathlib, sys
          from elftools.common.exceptions import ELFError
          from elftools.elf.elffile import ELFFile
          from elftools.elf.gnuversions import GNUVerNeedSection

          # The shipped onedir tree, not a build intermediate: dist/tan/tan plus
          # everything under dist/tan/_internal/ (libpython, the extension
          # modules, and their .so dependencies).
          root = pathlib.Path("dist/tan")
          if not root.is_dir():
              sys.exit("dist/tan/ is missing -- the onedir freeze did not produce "
                       "the tree this floor scan measures")
          paths, vers = [], set()
          for p in sorted(root.rglob("*")):
              if not p.is_file():
                  continue
              try:
                  with open(p, "rb") as f:
                      if f.read(4) != b"\x7fELF":
                          continue
                      f.seek(0)
                      elf = ELFFile(f)
                      paths.append(str(p))
                      for sec in elf.iter_sections():
                          if isinstance(sec, GNUVerNeedSection):
                              for _, auxes in sec.iter_versions():
                                  vers.update(a.name for a in auxes
                                              if a.name.startswith("GLIBC_"))
              except (ELFError, OSError):
                  continue
          if len(paths) < 5 or not vers:
              sys.exit("payload scan found %d native files / %d GLIBC_ versions under "
                       "dist/tan/ -- refusing to guess a floor" % (len(paths), len(vers)))
          floor = max(vers, key=lambda v: tuple(int(n) for n in v.split("_")[1].split(".")))
          open("dist/glibc-floor.txt", "w").write(floor + "\n")
          print("payload floor over %d native files: %s (saw: %s)"
                % (len(paths), floor, " ".join(sorted(vers))))
          PY
          '

      # Its own artifact, NOT part of the asset set -- the release job pulls the
      # binaries with `pattern: tan-*` so this can never leak into assets/ and
      # be published as a release asset.
      - name: upload the measured glibc floor
        if: ${{ matrix.container }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: glibc-floor
          path: python/dist/glibc-floor.txt
          if-no-files-found: error

      - name: stage asset
        shell: bash
        run: cp "python/dist/tan.${{ matrix.archive_ext }}" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    # id-token/attestations are scoped to this job only (it's the one that
    # attests the binaries); contents:write is re-declared here (an explicit
    # job-level `permissions:` block replaces, not adds to, the workflow-level
    # default) so this job keeps the ability to create the release.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # This job creates the Release/uploads assets through the GitHub
          # API (softprops/action-gh-release, actions/attest-build-provenance
          # -- both use the job's GITHUB_TOKEN, not a persisted git remote),
          # not by `git push`ing from a later step, so it doesn't need a
          # credential helper left configured either (tan-cli#435).
          persist-credentials: false
      # `pattern: tan-*` and not "everything": assets/ is published verbatim
      # (`files: assets/*`), so anything else this workflow uploads must be
      # fetched separately or it becomes a release asset by accident.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: tan-*
          path: assets
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: glibc-floor
          path: meta
      # The JSON envelope contract, as a downloadable artefact (issue #106).
      # alp-sdk-vscode gates real behaviour on exact issue-code strings and
      # unversioned `data` field names, and every one of those matches fails
      # open — a rename is indistinguishable from "no problem" on the consumer
      # side. Publishing the goldens lets the extension's own contract test
      # diff against THIS instead of a hand-copied fixture that drifts.
      #
      # Pure re-packaging of committed `contract/envelopes/*` files -- but
      # "committed" is not "matches what ships". Every case is gated by
      # `python -m pytest tests/conformance` against the actual shipping Python
      # CLI, which AUTO-DISCOVERS every directory under `contract/envelopes/`
      # (`test_contract_envelopes.py`'s `CONTRACT.iterdir()`) rather than
      # listing them -- so adding a case gates it, with nothing to remember to
      # update. Until tan-cli#269 a second gate, `cargo test -p alp-tan-cli
      # --test contract`, listed the same 17 cases by hand against the frozen
      # Rust v0.4.1 oracle; deleting it left the discovery gate covering
      # exactly the same set.
      #
      # The five `debug-config-preview-*` goldens used to be the one gap: they
      # were `pytest.mark.xfail(strict=True)` in the conformance suite, and this
      # step re-packaged their frozen-oracle `expected.json` verbatim, so the
      # asset's five `envelopes["debug-config-preview-*"]` entries did NOT
      # reflect what `tan` emits for `data.configuration`/`issues[]`. tan-cli#502
      # re-recorded all five against the shipping CLI and dropped the xfails, so
      # they are gated like every other case now (see contract/README.md, "Why
      # the five `debug-config-preview-*` goldens were re-recorded").
      # `validate-offline-clean` is the one remaining xfail'd entry, and so the
      # one entry this asset still advertises inaccurately (tan-cli#498 -- see
      # contract/README.md, "Residual limitation").
      # Run it locally with `python3` from the repo root to see exactly what
      # ships.
      - name: Bundle the envelope contract
        shell: bash
        run: |
          python3 - "${GITHUB_REF_NAME#v}" > assets/envelope-contract.json <<'PY'
          import json, pathlib, sys

          root = pathlib.Path("contract")
          registry = json.loads((root / "issue-codes.json").read_text(encoding="utf-8"))
          envelopes = {}
          for case in sorted(p for p in (root / "envelopes").iterdir() if p.is_dir()):
              envelopes[case.name] = {
                  "args": [
                      line.strip()
                      for line in (case / "args.txt").read_text(encoding="utf-8").splitlines()
                      if line.strip()
                  ],
                  "exitCode": int((case / "expected.exit").read_text(encoding="utf-8").strip()),
                  "envelope": json.loads((case / "expected.json").read_text(encoding="utf-8")),
              }
          json.dump(
              {
                  "schemaVersion": 1,
                  "tanVersion": sys.argv[1],
                  "issueCodes": registry["issueCodes"],
                  "envelopes": envelopes,
              },
              sys.stdout,
              indent=2,
          )
          PY
          python3 -c "import json,sys; d=json.load(open('assets/envelope-contract.json')); \
            assert d['envelopes'] and d['issueCodes'], 'empty bundle'; \
            print('bundled', len(d['envelopes']), 'envelopes,', len(d['issueCodes']), 'issue codes')"
      - name: Generate checksums.txt
        shell: bash
        working-directory: assets
        run: sha256sum * > checksums.txt
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: assets/*
      - name: Slice CHANGELOG section for the release notes
        shell: bash
        run: |
          # Measured by the build leg, inside the image that produced the
          # binary, over the appended payload -- see that step. It cannot be
          # measured HERE: `readelf -V` on a onefile reads only the vendored
          # bootloader (a container-invariant GLIBC_2.14), and the payload is
          # inside the archive where the outer ELF's .gnu.version_r cannot see
          # it. `|| true` because this step runs under `bash -eo pipefail`,
          # where a failing substitution would abort before the guard below
          # could ever print its reason.
          GLIBC_FLOOR="$(cat meta/glibc-floor.txt 2>/dev/null || true)"
          if [ -z "$GLIBC_FLOOR" ]; then
            echo "::error::meta/glibc-floor.txt is missing or empty -- the Linux build leg did not report a measured floor, and the notes must not state one nothing measured."
            exit 1
          fi
          echo "measured glibc floor of the published Linux asset: ${GLIBC_FLOOR}"

          # The tag is vX.Y.Z; the CHANGELOG header is `## [X.Y.Z]` (no v-prefix,
          # em-dash date). Extract that one section as the GitHub Release body.
          VERSION="${GITHUB_REF_NAME#v}"
          python3 - "$VERSION" <<'PY' > release_notes.md
          import sys, re
          version = sys.argv[1]
          out, capturing, found = [], False, False
          for line in open("CHANGELOG.md", encoding="utf-8"):
              if re.match(rf"^## \[{re.escape(version)}\]", line):
                  capturing = found = True
                  continue
              if capturing and line.startswith("## ["):
                  break
              if capturing:
                  out.append(line)
          body = "".join(out).strip()
          # #212: this used to `print(body if body else f"See CHANGELOG.md for
          # {version}.")` and exit 0, so a tag whose section was never written
          # published a release whose entire body was that one sentence -- and
          # nothing anywhere said so. The failure mode is not hypothetical: the
          # version bump renames `## [Unreleased]` to `## [X.Y.Z]`, and a bump
          # that edits the version files but forgets the CHANGELOG header leaves
          # exactly this state. Checked against dev before this change: a v0.4.1
          # tag would have found no section and shipped the stub.
          #
          # A release with no notes is not a degraded release, it is a broken
          # one -- the notes are the only human-readable record of what changed,
          # and the tag is immutable once pushed. Fail before publishing, not
          # after. `shell: bash` runs with `-eo pipefail`, so a non-zero exit
          # here stops the job.
          if not found:
              sys.exit(
                  f"::error::CHANGELOG.md has no `## [{version}]` section, so this "
                  f"release would publish with an empty body. The version bump "
                  f"renames `## [Unreleased]` to `## [{version}] -- <date>`; that "
                  f"edit is missing. Fix CHANGELOG.md on the release branch, then "
                  f"re-tag."
              )
          if not body:
              sys.exit(
                  f"::error::CHANGELOG.md's `## [{version}]` section is empty. A "
                  f"release body has to say what changed; write the section, then "
                  f"re-tag."
              )
          print(body)
          PY
          cat >> release_notes.md <<'NOTES'

          ## Release assets

          Four archives, each a PyInstaller --onedir freeze of the Python
          `tan` (tan-cli#349 -- was a single-file --onefile freeze; --onedir
          fixes a 13-19s macOS startup regression caused by --onefile
          re-extracting its runtime on every invocation). Unpack the archive
          and run the `tan`/`tan.exe` inside; `install.sh`/`install.ps1` do
          this for you.

          - `tan-x86_64-pc-windows-msvc.zip` -- Windows x64
          - `tan-x86_64-apple-darwin.tar.gz` / `tan-aarch64-apple-darwin.tar.gz` -- macOS
          - `tan-x86_64-unknown-linux-gnu.tar.gz` -- Linux x64, frozen on Debian 11.
            It requires **__GLIBC_FLOOR__** or newer -- measured from the
            binary's own bundled payload at build time, not assumed from the
            build image. Debian 11+ / Ubuntu 20.04+ / RHEL 9+ are comfortably
            above it.

          There is no arm64 Windows and no arm64 Linux asset in this release,
          and no `-musl` asset. A frozen binary has to be built on the
          architecture it runs on, and this release builds on four runners; if
          you need an arm64 Linux or arm64 Windows `tan`, install from source
          (`pip install ./python`) and say so on the issue tracker.

          - Every archive + `checksums.txt` carries a GitHub build-provenance
            attestation. Verify with:
            `gh attestation verify <downloaded-file> --repo alplabai/tan-cli`
          NOTES
          # The heredoc above is quoted (no expansion -- it is full of backticks
          # that would otherwise be command substitution), so the measured floor
          # is substituted here instead.
          sed -i "s/__GLIBC_FLOOR__/${GLIBC_FLOOR}/" release_notes.md
          echo "----- release_notes.md -----"; cat release_notes.md
      # A SemVer pre-release tag carries a hyphen in its version (`v0.4.0-rc1`);
      # a real release never does. Both flags are derived from that one fact so
      # they cannot disagree with each other or with the tag.
      #
      # This is load-bearing, not hygiene. Both installers resolve what `latest`
      # means through GitHub, and GitHub excludes a release from `latest` ONLY
      # when it is marked `prerelease`. Publishing an rc without these flags
      # therefore hands it to every customer running the documented install
      # command. Neither flag was set before, so the classification rested
      # entirely on the action's default -- an unacceptable place for that blast
      # radius to live.
      #
      # The two scripts ask two different endpoints -- `install.sh` follows the
      # `/releases/latest` redirect, `install.ps1` reads the API's `tag_name`
      # (see each script for why its host needs that one). Both exclude
      # prereleases on the same flag, so they agree; verified against this repo
      # with v0.4.0 marked prerelease, where both resolve `latest` to v0.3.1
      # rather than to the higher version number.
      #
      # `make_latest` is spelled as an explicit "true"/"false" string because the
      # action takes a string, not a boolean.
      - name: publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: assets/*
          fail_on_unmatched_files: true
          body_path: release_notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}

  # The crates.io job is GONE (tan-cli#271). It published `alp-tan-cli` from
  # `crates/`, and no asset in this release comes from `crates/` any more -- the
  # four archives above are PyInstaller freezes of `python/`. Keeping it behind
  # a false `if:` would have left a `cargo publish` in the release path shipping
  # a different program under the same name; deleting it is the only version of
  # "must not run" that is actually true. The PyPI equivalent (`pip install
  # alp-tan`, the name python/pyproject.toml already reserves) is a separate
  # decision and deliberately not smuggled in here.

  # npm shim — `npm i -g @alplabai/tan` / `npx @alplabai/tan`. One release tag
  # scheme (v*), one workflow. Gated on NPM_TOKEN; on a FINAL tag a missing
  # token FAILS rather than skipping, mirroring the crates.io job above (#151).
  #
  # A pre-release tag is skipped here too, and this path was the sharpest of the
  # three: `npm publish` below passes no `--tag`, so npm defaults the release to
  # the `latest` dist-tag. An unguarded rc would therefore become plain
  # `npm i -g @alplabai/tan` for every consumer -- and npm unpublish is far more
  # restricted than a crates.io yank (72-hour window, refused outright once
  # anything depends on it).
  #
  # The relaxation, when we want an rc installable: publish it with
  # `--tag next` so `npm i @alplabai/tan@next` reaches it while `latest` stays
  # on the last real release. Skipping is the smaller change and keeps the rc
  # fully retractable, which is the point of cutting one.
  publish_npm:
    name: publish · npm shim
    needs: release
    if: ${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: npm-shim
    # What this job actually DID, for `release_gate` to compare against what was
    # declared (#237). Deliberately OBSERVED rather than re-derived from
    # `NPM_PUBLISH_ENABLED`: re-reading the declaration would make the gate
    # circular — it would assert the declaration equals itself and pass even if
    # the job had done the opposite. `published=true` is written only AFTER
    # `npm publish` returns, and `false` only by the branch that declines.
    #
    # Two step ids because exactly one of them runs; a skipped step contributes
    # nothing, so the `||` picks whichever fired.
    outputs:
      published: ${{ steps.published.outputs.published || steps.declined.outputs.published }}
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      # Publishing is OPT-IN, off by default. Set the repository VARIABLE
      # `TAN_NPM_PUBLISH` to `true` to arm it (Settings -> Secrets and variables
      # -> Actions -> Variables). A variable, not a secret: the value is not
      # sensitive, and a secret that gates behaviour is invisible in the UI.
      #
      # WHY off (#233): v0.4.1's publish failed with `npm error code EOTP` --
      # `NPM_TOKEN` is a classic/publish token on a 2FA account, so `npm publish`
      # demands an interactive one-time password no CI run can answer. Only an
      # npm AUTOMATION (or granular) token is exempt. That is an account-side
      # fix, so the failure recurs on every final tag until it is made.
      #
      # A permanently-red job on the release workflow is worse than no job. It is
      # the mirror of a gate that cannot fail: a job that can only fail teaches
      # everyone to stop reading the one board where ignoring red is least
      # affordable. So this is gated OFF rather than left red -- and the OFF path
      # is LOUD (see `npm publishing is disabled` below), because the other
      # failure this repo spent the week removing is a channel that quietly
      # reports success while shipping nothing (#151).
      NPM_PUBLISH_ENABLED: ${{ vars.TAN_NPM_PUBLISH == 'true' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # `npm publish` authenticates via NODE_AUTH_TOKEN (npm registry
          # token), not a persisted git remote; nothing here pushes to the
          # repo (tan-cli#435).
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      # Runs whether or not publishing is armed. The shim is still a shipped
      # artefact of this repo, and a shim that stops packing is worth catching
      # while it is cheap rather than on the day the token is fixed.
      - name: Pack (smoke — confirm the shim packs with its bin + postinstall)
        run: |
          npm pack --dry-run
          node -e "const p=require('./package.json'); if(!p.bin||!p.bin.tan) throw new Error('shim missing bin.tan')"

      # The OFF path, and it says so out loud in the run summary rather than
      # passing silently. Exits 0: not publishing is the DECISION here, not a
      # failure, and the release itself is unaffected.
      - name: npm publishing is disabled
        id: declined
        if: ${{ env.NPM_PUBLISH_ENABLED != 'true' }}
        run: |
          echo "published=false" >> "$GITHUB_OUTPUT"
          {
            echo "### npm: NOT PUBLISHED — deliberately disabled"
            echo
            echo "\`@alplabai/tan@${GITHUB_REF_NAME#v}\` was **not** published. The shim packed cleanly; publishing is gated off."
            echo
            echo "Reason: the configured \`NPM_TOKEN\` requires an interactive one-time password (\`npm error code EOTP\`), which no CI run can supply. It needs replacing with an npm **automation** token — see [#233](https://github.com/alplabai/tan-cli/issues/233)."
            echo
            echo "To arm this job once that is done, set the repository variable \`TAN_NPM_PUBLISH\` to \`true\`."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::npm publish is gated off (TAN_NPM_PUBLISH is not 'true'). @alplabai/tan was NOT published for this tag; see #233."

      # Same rule as the crates.io job, and for the same reason: this job only
      # runs on a final tag, so a missing token means the release advertises
      # `npm i -g @alplabai/tan` for a package that does not exist. v0.4.0 did
      # (#151). The pack smoke above still runs first, so a genuinely broken
      # shim is reported as a broken shim rather than as a missing secret.
      # The three ARMED steps below all carry the same gate. Left individually
      # conditional rather than split into a second job, so the token refusal,
      # the publish and the outcome record stay next to the pack smoke they
      # belong with.
      - name: Refuse to "publish" with no token
        if: ${{ env.NPM_PUBLISH_ENABLED == 'true' && env.NPM_TOKEN == '' }}
        run: |
          echo "### npm: NOT PUBLISHED" >> "$GITHUB_STEP_SUMMARY"
          echo "\`NPM_TOKEN\` is not set, so \`npm i -g @alplabai/tan\` will not resolve for this release. The shim packed cleanly." >> "$GITHUB_STEP_SUMMARY"
          echo "::error::NPM_TOKEN is not set, but TAN_NPM_PUBLISH is 'true'. A FINAL release must not report a successful npm publish it did not perform (#151). Add the secret, or unset TAN_NPM_PUBLISH."
          exit 1

      - name: Publish to npm
        if: ${{ env.NPM_PUBLISH_ENABLED == 'true' }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Reached only if `npm publish` above returned 0 -- a failure fails the job
      # before this runs, so `published=true` is an observation, not a claim.
      - name: Record the npm outcome
        id: published
        if: ${{ env.NPM_PUBLISH_ENABLED == 'true' }}
        run: |
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "### npm: published \`@alplabai/tan@${GITHUB_REF_NAME#v}\`" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # #237: a tag must not be able to skip its own publishes silently.
  #
  # v0.4.1 proved it could. One flaky unit test failed `gates`, so `build`,
  # `release` and both publish jobs were marked SKIPPED, and the tag existed --
  # immutably -- with no Release, no assets, and `releases/latest` still pointing
  # at the previous version. The only signal was a red check on a run nobody was
  # necessarily watching. `skipped` is the right semantic for a conditional job
  # and the wrong one for the publish leg of a tag, because a tag is a commitment:
  # the version number is spent and `install.sh` resolves it the moment a Release
  # appears.
  #
  # This is NOT an exemption list. An exemption list grows -- npm today, some
  # future channel tomorrow -- and every addition is a place the invariant quietly
  # stops covering something. The invariant is DECLARATION-RELATIVE instead, the
  # same mechanism #219 used for issue codes: declare the intent, then assert the
  # outcome against the declaration.
  #
  #   1. HARD, unconditional: a pushed `v*` tag MUST produce a Release with its
  #      assets. Nothing legitimately skips that, rc or final.
  #   2. PER CHANNEL: the outcome must match the channel's declared intent.
  #      crates.io has no gate variable, so its intent is "always". npm's intent
  #      is `TAN_NPM_PUBLISH`; unset means it must decline and exit 0, armed means
  #      it must publish or fail.
  #
  # So a disarmed npm channel is not an exemption -- it SATISFIES the invariant,
  # because declaration and outcome agree. And arming it changes the declaration,
  # after which this gate demands a publish with no edit here. That is also why
  # this cannot re-create the permanently-red board #239 removed.
  release_gate:
    name: release outcome matches intent
    needs: [release, publish_npm]
    # `always()`, or a skipped dependency skips the gate too and the whole point
    # is lost. Tag-only: this workflow has no other trigger today, but the guard
    # makes the scope explicit rather than inherited.
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    # No checkout, no GitHub API call -- this job only reads the two upstream
    # jobs' `needs.*.result`/`outputs` context and writes to
    # $GITHUB_STEP_SUMMARY / $GITHUB_OUTPUT (local runner files, ungated by
    # any permission). `contents: read` kept explicit anyway (tan-cli#435),
    # matching every other job here rather than inheriting the workflow
    # default.
    permissions:
      contents: read
    steps:
      - name: assert the release and every channel matched its declared intent
        shell: bash
        env:
          RELEASE_RESULT: ${{ needs.release.result }}
          NPM_RESULT: ${{ needs.publish_npm.result }}
          NPM_PUBLISHED: ${{ needs.publish_npm.outputs.published }}
          NPM_DECLARED: ${{ vars.TAN_NPM_PUBLISH == 'true' }}
        run: |
          set -euo pipefail
          fail=0
          note() { echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          bad() { echo "::error::$1"; note "- FAIL: $1"; fail=1; }

          note "### Release outcome vs declared intent"
          note ""
          note "| leg | declared | result | published |"
          note "|---|---|---|---|"
          note "| release | always | \`${RELEASE_RESULT}\` | - |"
          note "| npm | \`TAN_NPM_PUBLISH=${NPM_DECLARED}\` | \`${NPM_RESULT}\` | \`${NPM_PUBLISHED:-<none>}\` |"
          note ""

          # 1. Unconditional. A tag with no Release behind it is the v0.4.1 state.
          if [ "$RELEASE_RESULT" != "success" ]; then
            bad "no GitHub Release was published for ${GITHUB_REF_NAME} (release job: ${RELEASE_RESULT}). A pushed tag must always produce a Release with its assets; the tag is now spent with nothing behind it."
          fi

          # A prerelease tag (a hyphen in the version) declares that the registry
          # channels do not run at all, which is what their own `if:` encodes. Both
          # being `skipped` is then the CORRECT outcome, so stop here.
          case "${GITHUB_REF_NAME}" in
            *-*)
              note "Prerelease tag: registry channels declared not-run, both \`skipped\` as expected."
              [ "$fail" -eq 0 ] || exit 1
              echo "prerelease: release asserted, registry channels correctly skipped."
              exit 0
              ;;
          esac

          # 2b. npm against its declaration. The job must not have FAILED either
          # way -- a disarmed channel still has to exit 0 having said so.
          if [ "$NPM_RESULT" != "success" ]; then
            bad "the npm job did not complete cleanly (job: ${NPM_RESULT}). Disarmed it must report NOT PUBLISHED and exit 0; armed it must publish."
          # The job succeeded, so `published` MUST be one of the two values it
          # writes. Anything else means the outputs wiring between `publish_npm`
          # and this gate is broken, and the comparisons below would be reading
          # nothing.
          #
          # This is the one hole `always()` + a declaration check cannot close by
          # itself. An unresolvable `needs.publish_npm.outputs.published` --
          # renamed step id, removed `outputs:` block, a context GitHub does not
          # populate -- evaluates to the EMPTY STRING; it does not error. And ''
          # satisfies `!= "true"`, which is the disarmed-expected branch, which is
          # the state tan is in today. So a broken wiring would pass GREEN on every
          # disarmed tag and only surface at ARMING time, reported as "npm did not
          # publish" when npm may have published fine and the gate is describing
          # its own broken input. Arming is the moment this gate most needs to be
          # trustworthy; it must not be the moment it starts lying.
          #
          # A gate that reads an empty input and reports "matched declared intent"
          # is #151's silent success one level up, which is what this job exists to
          # remove.
          #
          # STRUCTURAL PRECONDITION -- do not merge the publish jobs.
          #
          # "Empty means the wiring is broken" is only true because each channel is
          # a SEPARATE JOB with its own `needs: release`. A failed `release` or a
          # failed `publish_crates` cannot blank npm's self-report, because npm's
          # job either ran and reported, or was skipped and is caught by the
          # `NPM_RESULT` check above. So an empty `published` from a job that
          # reports `success` really does mean the outputs wiring is broken, and
          # nothing else.
          #
          # Collapse the channels into ordered STEPS of one job -- the obvious
          # refactor, for speed or for a shared checkout -- and that stops holding:
          # an earlier step failing aborts the job before the later channel's
          # reporting step runs, its output comes back empty for a reason that has
          # nothing to do with wiring, and this check fires a FALSE "wiring is
          # broken" beside the true error.
          #
          # Not hypothetical. alp-sdk-vscode ported this gate, merged its four
          # publish legs into one job's steps, and hit exactly that: a Marketplace
          # failure aborted before the Open VSX steps, and their port reported a
          # broken wiring next to the real failure -- misdiagnosing the one scenario
          # the gate was built for.
          #
          # There is no test that catches this: the assertion still passes on every
          # green tag, and only lies on a failing one. Hence the comment.
          #
          # Kept in the SAME elif chain rather than a separate `case`, so a broken
          # wiring reports exactly one cause: a garbage value would otherwise also
          # trip a declaration comparison it has nothing to compare against.
          elif [ "$NPM_PUBLISHED" != "true" ] && [ "$NPM_PUBLISHED" != "false" ]; then
            bad "the npm job reported published='${NPM_PUBLISHED:-<empty>}', which is neither true nor false. The outputs wiring between publish_npm and this gate is broken, so the declaration checks are comparing against nothing. Check publish_npm's \`outputs:\` block and the \`declined\`/\`published\` step ids."
          elif [ "$NPM_DECLARED" = "true" ] && [ "$NPM_PUBLISHED" != "true" ]; then
            bad "TAN_NPM_PUBLISH is 'true' but the npm job did not publish (published=${NPM_PUBLISHED:-<none>}). An armed channel that ships nothing is the silent-success failure #151 removed."
          elif [ "$NPM_DECLARED" != "true" ] && [ "$NPM_PUBLISHED" = "true" ]; then
            bad "npm published while TAN_NPM_PUBLISH is not 'true'. The channel shipped something nobody declared."
          fi

          if [ "$fail" -ne 0 ]; then
            note ""
            note "This tag did NOT ship as declared. See the annotations above."
            exit 1
          fi
          note "All legs matched their declared intent."
          echo "release + every channel matched its declared intent."
