# SPDX-License-Identifier: Apache-2.0
#
# The pin-move-verify SENDER (tan-cli#820, ADR-0029 clause 5's contract): on
# any PR that MOVES a cross-repo alp-sdk-ref pin VALUE, propose the
# (tan_ref, sdk_ref, soms) tuple that PR is asking for and dispatch it to
# `alplabai/alp-e2e`'s receiver (`.github/workflows/pin-move-verify.yml` +
# `alpe2e/pinverify.py`, alp-e2e PR #1). The receiver builds the tuple on a
# clean machine and posts a Check Run back HERE, on the commit that proposed
# it. This job polls for that Check Run and turns it into this job's own
# pass/fail, so "does this pin move actually build" can be a required status
# check instead of a spelling agreement (ADR-0029's whole point: observation
# 4 -- `SUPPORTED_CLI_VERSION = "0.5.1"` named a published tan release that
# could not build ANY Renesas or Alif SoM, and its gate was green throughout).
#
# WHICH FILES ARE "A PIN SITE" HERE, AND WHICH ARE NOT
#
# See `python/scripts/pin_move_verify.py`'s own module docstring for the full
# sweep and the reasoning -- `PIN_SITES` there is the single source this
# workflow reads (`detect`, below), so the file list is not duplicated here.
#
# TOUCHING ONE OF THOSE FILES IS NOT ENOUGH TO DISPATCH. ADR-0029 keys its
# acceptance clauses on VALUE MOVEMENT ("no pin entry moves without a green
# run on the new value", clause 2; "a manifest edit that CHANGES A VALUE is
# rejected unless it carries a proof reference", clause 3), so `detect`
# reports two flags and this job gates on the second: `touched` (the diff
# includes a pin-bearing FILE) and `moved` (that file's extracted pin VALUE
# differs between base and head). A comment reflow, a CI step removal, or a
# rename inside `parity.yml` is `touched` but not `moved`, and dispatches
# nothing -- tan-cli PR #848 is the case that exposed the old behaviour.
# `moved` fails toward TRUE in every uncertain shape (no extractor for a
# site, an extraction that raises at either revision, a file added or
# deleted), so the narrowing can only ever dispatch too often, never too
# little.
#
# THE MOST IMPORTANT THING ABOUT THIS WORKFLOW, READ BEFORE TRUSTING A GREEN
# RUN
#
# As of this PR, NEITHER side of the contract has its secrets provisioned:
# `alplabai/tan-cli` (this repo) has no `ALP_CI_APP_ID` / `ALP_CI_APP_PRIVATE_KEY`
# (checked 2026-09-03: `gh secret list` shows only `PYPI_TOKEN`, itself
# unreferenced and slated for revocation -- `CARGO_REGISTRY_TOKEN` and
# `NPM_TOKEN` are both gone with their jobs),
# so this job cannot even MINT a token to call alp-e2e's dispatches endpoint;
# and `alplabai/alp-e2e` does not have them either (its own receiver's header
# says so), so even a successful dispatch could not get a Check Run posted
# back here. Until a human provisions both, ANY PR that moves a pin value
# will fail this job at the "is the App provisioned?" step -- by design (see
# the "fail closed" step below), not a bug. Do NOT add this job as a required
# status check until that provisioning has happened and at least one real
# dispatch has been observed to post a Check Run here.
#
# PROVISIONING DOES NOT FIX A FORK PR, AND NEVER WILL. This repo is public,
# so a `pull_request` run whose head is a fork never receives
# `ALP_CI_APP_ID` / `ALP_CI_APP_PRIVATE_KEY` regardless of whether they are
# provisioned on `alplabai/tan-cli` -- GitHub Actions does not expose repo
# secrets to fork PRs, full stop. ADR-0029 clause 5 mandates exactly this
# ("no secret exposed to fork PRs"), so this is a PERMANENT property of this
# job, not a transitional gap the provisioning step above closes. A fork PR
# that moves a pin value fails closed at the same "is the App provisioned?"
# step, with its own distinct message naming the fork condition rather than
# the missing-secret one -- see that step below. This is also a second,
# independent reason this job must never become a required status check: a
# required check that can structurally never pass on a fork PR blocks every
# contribution from one, forever.
#
# THE TUPLE THIS SENDER PROPOSES, STATED HONESTLY
#
# `tan_ref` is always the latest PUBLISHED tan-cli release (the receiver's
# own journey installs it through `install.sh`, which cannot fetch an
# unreleased PR branch) -- it does NOT test the code this PR itself changed.
# `sdk_ref` is read live from `.github/workflows/parity.yml`'s
# `PINNED_SDK_TAG` at the PR's own head, i.e. the PROPOSED value, which is
# the one this sender actually needs to prove. See
# `python/scripts/pin_move_verify.py`'s module docstring, "WHAT tan_ref MEANS
# FOR THESE PINS", for the full reasoning and its honest limits, and its
# per-`PIN_SITES`-entry "CERTIFIABILITY" notes for which pins this dispatch
# can and cannot actually certify. This caveat is not just filed here and in
# that docstring, either: `judge_polled_check_run`'s own PASS message
# restates it in the `judge` step's `$GITHUB_STEP_SUMMARY` line below, so a
# reader of a green check sees it without having to find this comment.
#
# COST -- read the receiver's own header before changing the trigger scope.
# One dispatch costs the receiver roughly 10 runner-minutes (two SoMs, ~5 min
# each) and up to a 60-minute worst case; this job's own poll loop adds
# little compute but can occupy an ubuntu-latest runner for up to
# DEADLINE_MINUTES below. That is why this fires only on a PR that actually
# moves a pin value, never on every push -- see the receiver's own comment:
# "NOT on every push, where it would be resented and then disabled."
#
# STATIC NAME, ON PURPOSE (the trap this avoids is real -- see
# `pr-bootstrap-distro-install.yml` in alp-sdk, `summary` job, and the
# alp-sdk#1474 incident its own comment documents: a required context whose
# name contains `${{ matrix.* }}` reports under its literal, UNRESOLVED
# string the moment the job that would resolve it skips, permanently
# blocking every PR that doesn't touch a watched path). This workflow has
# exactly ONE job, with no matrix, precisely so its `name:` never needs
# runtime interpolation to be legible -- the string below,
# `pin-move-verify · sender`, is what a `gh api .../branches/<b>/protection`
# call should require, once it is safe to.
name: pin-move-verify

on:
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      tan_ref:
        description: "tan-cli ref to dispatch (default: the latest published release)"
        required: false
        default: ""
      sdk_ref:
        description: "alp-sdk ref to dispatch (default: parity.yml's live PINNED_SDK_TAG)"
        required: false
        default: ""
      soms:
        description: "comma-separated SoM SKUs (default: E1M-V2N101,E1M-AEN801)"
        required: false
        default: ""

# Keyed on the commit under test: a fast-follow push to the same PR should
# supersede its predecessor's in-flight (up to 90-minute) poll, not race it.
# `merge_group` and `workflow_dispatch` get their own group members so they
# never cancel a PR's own run or each other.
concurrency:
  group: pin-move-verify-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # Read-only, and only to poll THIS repo's own check runs on the commit
  # under test (the "poll for the receiver's Check Run" step). Writing a
  # Check Run on alp-e2e's behalf never happens from here -- that is the
  # receiver's own job, using its own App-minted token scoped to THIS repo.
  checks: read

jobs:
  verify:
    name: pin-move-verify · sender
    runs-on: ubuntu-latest
    # Roughly the receiver's own worst case (plan 10m + verify up to 60m +
    # report 15m) plus headroom for this job's own setup and poll overhead.
    # Not a target -- a healthy dispatch resolves in well under 15 minutes.
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # One place decides base/head/source facts per event, so every later
      # step reads a plain step output instead of re-deriving the same
      # event-shape switch. Every event value is read through `env:`, never
      # interpolated directly into the shell -- `client_payload`-adjacent
      # data from `pull_request`/`merge_group` is attacker-shaped in
      # general, even though the three fields used here (a SHA, an integer,
      # a ref name) are GitHub-validated formats, not free text.
      - name: resolve event facts
        id: facts
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          MG_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MG_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)
              echo "base=$PR_BASE_SHA" >> "$GITHUB_OUTPUT"
              echo "head=$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"
              echo "source_sha=$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"
              echo "source_pr=$PR_NUMBER" >> "$GITHUB_OUTPUT"
              # `secrets.*` is never exposed to a fork PR's `pull_request` run
              # regardless of provisioning (GitHub Actions platform behaviour,
              # ADR-0029 clause 5's own mandate) -- recorded here so the
              # "refuse to proceed without the App" step can tell that
              # PERMANENT condition apart from "not provisioned yet".
              echo "is_fork=${PR_IS_FORK:-false}" >> "$GITHUB_OUTPUT"
              ;;
            merge_group)
              echo "base=$MG_BASE_SHA" >> "$GITHUB_OUTPUT"
              echo "head=$MG_HEAD_SHA" >> "$GITHUB_OUTPUT"
              echo "source_sha=$MG_HEAD_SHA" >> "$GITHUB_OUTPUT"
              echo "source_pr=" >> "$GITHUB_OUTPUT"
              echo "is_fork=false" >> "$GITHUB_OUTPUT"
              ;;
            workflow_dispatch)
              # No diff to detect against -- a manual dispatch always means
              # "verify this deliberately", so `detect` (below) is skipped
              # entirely for this event, not fed a synthetic base/head.
              echo "base=" >> "$GITHUB_OUTPUT"
              echo "head=" >> "$GITHUB_OUTPUT"
              echo "source_sha=$RUN_SHA" >> "$GITHUB_OUTPUT"
              echo "source_pr=" >> "$GITHUB_OUTPUT"
              echo "is_fork=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::unhandled event_name=$EVENT_NAME"
              exit 1
              ;;
          esac

      # Cheap: one `git diff --name-only`, plus a `git show base:<path>` /
      # `git show head:<path>` pair per touched pin site -- all local, no
      # receiver contacted yet. Skipped outright on workflow_dispatch (see the
      # `facts` step above); the `relevant` step below treats a manual dispatch
      # as always relevant.
      - name: detect whether this run moves a pin value
        id: detect
        if: github.event_name != 'workflow_dispatch'
        working-directory: python
        env:
          BASE: ${{ steps.facts.outputs.base }}
          HEAD: ${{ steps.facts.outputs.head }}
        run: |
          set -euo pipefail
          python scripts/pin_move_verify.py detect --base "$BASE" --head "$HEAD" --repo-root ..

      # Folds `detect`'s result and the workflow_dispatch override into one
      # flag every later step gates on. `detect` legitimately does not run on
      # workflow_dispatch (see above) -- reading its output as `!= 'true'` in
      # that case would read a MISSING output as "not relevant" and silently
      # skip a dispatch a human explicitly asked for, which is the same
      # fail-OPEN shape this workflow's other gates are built to avoid.
      - name: is this run relevant?
        id: relevant
        env:
          EVENT_NAME: ${{ github.event_name }}
          DETECT_MOVED: ${{ steps.detect.outputs.moved }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            value=true
          else
            value="$DETECT_MOVED"
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"

      # Two DIFFERENT reasons land here and a reader must be able to tell them
      # apart from the log alone, without opening `pin_move_verify.py`: the
      # diff went nowhere near a pin site, versus it edited one but left every
      # pin VALUE byte-identical (the tan-cli PR #848 shape). Only the second
      # is new behaviour, and it is the one someone will want to double-check.
      - name: nothing to verify -- no pin value moved
        if: steps.relevant.outputs.value != 'true'
        env:
          TOUCHED: ${{ steps.detect.outputs.touched }}
          SITES: ${{ steps.detect.outputs.sites }}
        run: |
          set -euo pipefail
          if [ "$TOUCHED" = "true" ]; then
            echo "pin site(s) TOUCHED but no pin VALUE moved: ${SITES}. Every pin value at those sites is byte-identical between base and head, and ADR-0029 clause 2/3 gate on movement, not on file membership -- so there is no new (tan_ref, sdk_ref) tuple to prove and nothing to dispatch. See python/scripts/pin_move_verify.py's PIN_VALUE_EXTRACTORS for what was compared."
          else
            echo "no tracked pin site changed in this diff -- see python/scripts/pin_move_verify.py's PIN_SITES for the tracked list. Nothing to dispatch."
          fi

      # --- everything from here on only runs when `relevant` -----------------

      # `inputs.tan_ref` is a workflow_dispatch text field -- attacker-shaped
      # by anyone with dispatch access, the same class of input
      # `.github/workflows/parity.yml`'s "resolve alp-sdk ref" step guards
      # (tan-cli#435: `zizmor`'s high-confidence `template-injection`,
      # already fixed there once; not yet exercised here because this step
      # never fires until the App is provisioned -- but the shape check
      # itself is free and belongs at the boundary regardless). Carried in
      # via `env:` already; the missing half was checking its SHAPE before
      # it reaches `$GITHUB_OUTPUT`/`::notice::` -- an unshaped value
      # containing a newline writes a second `ref=` key and can forge a
      # workflow command. `case`, not `grep -qE`: grep is LINE-oriented, so
      # a payload of `v1\nref=attacker` would pass grep on its first line
      # and still smuggle its second. Same allow-list `parity.yml` uses.
      - name: resolve tan_ref (latest published tan-cli release, or the manual override)
        id: tanref
        if: steps.relevant.outputs.value == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.tan_ref || '' }}
        run: |
          set -euo pipefail
          if [ -n "$OVERRIDE" ]; then
            ref="$OVERRIDE"
          else
            ref="$(gh api repos/alplabai/tan-cli/releases/latest --jq .tag_name)"
          fi
          if [ -z "$ref" ]; then
            echo "::error::could not resolve a tan_ref -- no published release found, and no workflow_dispatch override given"
            exit 1
          fi
          case "${ref}" in
            ""|[!A-Za-z0-9]*|*[!A-Za-z0-9._/-]*)
              echo "::error::refusing a tan_ref that is not a plain git ref: ${ref}"
              exit 1 ;;
          esac
          if [ "${#ref}" -gt 201 ]; then
            echo "::error::refusing a tan_ref longer than 201 characters: ${ref}"
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "::notice::tan_ref = $ref"

      # Same guard, same reason -- `inputs.sdk_ref` is the other
      # workflow_dispatch text field that reaches `$GITHUB_OUTPUT`/`::notice::`
      # unshaped.
      - name: resolve sdk_ref (parity.yml's live PINNED_SDK_TAG, or the manual override)
        id: sdkref
        if: steps.relevant.outputs.value == 'true'
        working-directory: python
        env:
          OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.sdk_ref || '' }}
        run: |
          set -euo pipefail
          if [ -n "$OVERRIDE" ]; then
            ref="$OVERRIDE"
          else
            ref="$(python scripts/pin_move_verify.py sdk-ref --parity-yml ../.github/workflows/parity.yml)"
          fi
          case "${ref}" in
            ""|[!A-Za-z0-9]*|*[!A-Za-z0-9._/-]*)
              echo "::error::refusing an sdk_ref that is not a plain git ref: ${ref}"
              exit 1 ;;
          esac
          if [ "${#ref}" -gt 201 ]; then
            echo "::error::refusing an sdk_ref longer than 201 characters: ${ref}"
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "::notice::sdk_ref = $ref"

      # Validates + shapes the exact POST body in tested code (mirrors
      # alpe2e.pinverify.check_body's own rationale: "the one artefact the
      # sender actually SEES is produced by code with tests behind it").
      # A malformed tuple fails HERE, before any network call.
      - name: build + validate the dispatch payload
        id: payload
        if: steps.relevant.outputs.value == 'true'
        working-directory: python
        env:
          TAN_REF: ${{ steps.tanref.outputs.ref }}
          SDK_REF: ${{ steps.sdkref.outputs.ref }}
          SOURCE_SHA: ${{ steps.facts.outputs.source_sha }}
          SOURCE_PR: ${{ steps.facts.outputs.source_pr }}
          SOMS_CSV: ${{ github.event_name == 'workflow_dispatch' && inputs.soms || '' }}
          # Not hardcoded `alplabai/tan-cli` (PR #823 review, finding 10) --
          # `${{ github.repository }}` so a fork of this repo running the
          # same workflow does not silently claim to BE alplabai/tan-cli in
          # its own dispatch payload's `source_repo`.
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          args=(dispatch-body --tan-ref "$TAN_REF" --sdk-ref "$SDK_REF" --source-sha "$SOURCE_SHA" --source-repo "$REPO")
          if [ -n "$SOURCE_PR" ]; then
            args+=(--source-pr "$SOURCE_PR")
          fi
          if [ -n "$SOMS_CSV" ]; then
            IFS=',' read -ra soms <<< "$SOMS_CSV"
            for s in "${soms[@]}"; do
              args+=(--som "$s")
            done
          fi
          python scripts/pin_move_verify.py "${args[@]}" > ../dispatch-body.json
          cat ../dispatch-body.json

      # `secrets` is not usable in an `if:` expression, only in `env:` --
      # same reason the receiver's own "is the App provisioned?" step reads
      # this way. Presence is decided here, not baked into any later `if:`.
      - name: is the App provisioned?
        id: secrets
        if: steps.relevant.outputs.value == 'true'
        env:
          APP_ID: ${{ secrets.ALP_CI_APP_ID }}
        run: |
          set -euo pipefail
          if [ -n "${APP_ID:-}" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
          fi

      # `permission-contents: write` narrows the minted token to the ONE
      # grant `repository_dispatch` actually needs (alp-sdk's own
      # dispatch-tan-parity.yml header: "repository_dispatch needs
      # Contents:write on the TARGET. That is the whole grant."), instead of
      # the token inheriting the App's full installation permissions on
      # alp-e2e -- zizmor's `github-app` audit (High) flags the unscoped
      # form by design.
      - name: mint a short-lived App token, scoped to alp-e2e
        id: apptoken
        if: steps.relevant.outputs.value == 'true' && steps.secrets.outputs.have == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ALP_CI_APP_ID }}
          private-key: ${{ secrets.ALP_CI_APP_PRIVATE_KEY }}
          owner: alplabai
          repositories: alp-e2e
          permission-contents: write

      # THE hard-constraint step. A missing secret, a network failure, or a
      # dispatch the API rejects must FAIL this job, never wave a pin move
      # through on the strength of "we tried". Two DIFFERENT reasons land
      # here, and they get two different messages (PR #823 review, finding
      # 8): "not provisioned yet" is transitional (fixed by provisioning the
      # two secrets, see this file's own header) and WILL fire on every
      # pin-touching PR until that happens; "this PR's head is a fork" is
      # PERMANENT (ADR-0029 clause 5 mandates no secret reaches a fork PR,
      # and GitHub Actions enforces that itself regardless of provisioning)
      # and provisioning the secrets never fixes it. Both are the correct,
      # honest state either way: an unverified pin move must not pass
      # (ADR-0029 clause 2), and "the receiver is unreachable" -- for
      # whichever reason -- is explicitly one of the shapes that must fail,
      # not skip.
      - name: refuse to proceed without the App (fail closed)
        if: steps.relevant.outputs.value == 'true' && steps.secrets.outputs.have != 'true'
        env:
          MOVED_SITES: ${{ steps.detect.outputs.moved_sites }}
          IS_FORK: ${{ steps.facts.outputs.is_fork }}
        run: |
          if [ "$IS_FORK" = "true" ]; then
            echo "::error title=pin-move-verify: cannot dispatch from a fork::This PR's head is a fork, so GitHub Actions never exposes ALP_CI_APP_ID / ALP_CI_APP_PRIVATE_KEY to it -- regardless of whether those secrets are provisioned on alplabai/tan-cli. ADR-0029 clause 5 mandates this ('no secret exposed to fork PRs'), so it is PERMANENT, not something provisioning the secrets fixes. This run moves a pin value (${MOVED_SITES:-a manually dispatched tuple}), so the proposed tuple's buildability is UNVERIFIED. This job is NOT on branch protection for exactly this reason among others (see this file's header) -- a maintainer can verify the same tuple after the PR lands (a push to a branch of this repo, or a workflow_dispatch run with the same tan_ref/sdk_ref) once it is safe to merge on its other merits."
            exit 1
          fi
          echo "::error title=pin-move-verify: cannot dispatch::ALP_CI_APP_ID / ALP_CI_APP_PRIVATE_KEY are not provisioned on alplabai/tan-cli, so no token can be minted to call alp-e2e's repository_dispatch endpoint. This run moves a pin value (${MOVED_SITES:-a manually dispatched tuple}), so the proposed tuple's buildability is UNVERIFIED. Per ADR-0029 clause 2, an unverified pin move must not pass -- this is a hard failure, not a skip. Provision the two secrets on this repo (and on alplabai/alp-e2e, and merge alp-e2e#1) to unblock."
          exit 1

      # `dispatched_at` is captured BEFORE the POST, not derived after --
      # PR #823 review, finding 1. Without a lower bound tying the poll to
      # THIS dispatch, `poll` (below) can read a STALE Check Run: `on:
      # pull_request` re-fires on `synchronize`/`reopened`, and "Re-run
      # failed jobs" re-fires on an UNCHANGED head SHA, so a previous
      # dispatch's completed Check Run (same `check_name`, same
      # `source_sha`) is still sitting on `GET .../check-runs` throughout
      # the NEW dispatch's whole 10-90 minute build -- `poll`'s first
      # iteration would match it, see `status == "completed"`, and stop,
      # handing `judge` a stale conclusion (fail-open on an old `success`;
      # fail-stuck if the stale conclusion is `neutral`, since nothing ever
      # clears it). Recorded here so `poll` can refuse anything that
      # completed before this dispatch existed.
      - name: dispatch pin-move-verify to alp-e2e
        id: dispatch
        if: steps.relevant.outputs.value == 'true' && steps.secrets.outputs.have == 'true'
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token }}
          CHECK_NAME: ${{ steps.payload.outputs.check_name }}
        run: |
          set -euo pipefail
          dispatched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "dispatched_at=${dispatched_at}" >> "$GITHUB_OUTPUT"
          gh api repos/alplabai/alp-e2e/dispatches \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            --input dispatch-body.json
          # Read through env:, not interpolated into the script (this
          # file's own rule at "resolve event facts" above) -- `check_name`
          # is built from `tan_ref`/`sdk_ref`, which on a workflow_dispatch
          # run trace back to unshaped `inputs.*` text before the guards
          # added above run again downstream of here.
          echo "::notice::dispatched pin-move-verify to alp-e2e for check '${CHECK_NAME}' at ${dispatched_at}"

      # The dispatch API answers 204 whether or not anything is listening, so
      # "the call succeeded" is not evidence a Check Run will ever appear --
      # poll for it, bounded, and fail closed on the deadline rather than
      # trusting the 204.
      - name: poll for the receiver's Check Run
        id: poll
        if: steps.relevant.outputs.value == 'true' && steps.secrets.outputs.have == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.facts.outputs.source_sha }}
          CHECK_NAME: ${{ steps.payload.outputs.check_name }}
          DISPATCHED_AT: ${{ steps.dispatch.outputs.dispatched_at }}
          DEADLINE_MINUTES: "90"
          POLL_SECONDS: "30"
        run: |
          set -uo pipefail
          deadline=$(( $(date +%s) + DEADLINE_MINUTES * 60 ))
          found=""
          while [ "$(date +%s)" -lt "$deadline" ]; do
            resp="$(gh api "repos/${REPO}/commits/${SHA}/check-runs" --paginate 2>/dev/null)"
            # `select((.completed_at // .started_at) >= $since)` is the
            # fix for finding 1 above: without it, a completed Check Run
            # from a PREVIOUS dispatch under the same name on the same SHA
            # (a fast-follow push's predecessor, or a "Re-run failed jobs"
            # on an unchanged head) matches on this loop's FIRST iteration
            # and reports as this dispatch's own verdict. ISO-8601 UTC
            # timestamps sort lexicographically the same as chronologically,
            # so a plain string compare is exact, not an approximation.
            run="$(printf '%s' "$resp" | jq -c --arg n "$CHECK_NAME" --arg since "$DISPATCHED_AT" '
                [ (.check_runs // [])[] | select(.name == $n) | select((.completed_at // .started_at) >= $since) ]
                | sort_by(.started_at // "")
                | last // empty
              ' 2>/dev/null)"
            if [ -n "$run" ] && [ "$run" != "null" ]; then
              status="$(printf '%s' "$run" | jq -r '.status')"
              if [ "$status" = "completed" ]; then
                found="$run"
                break
              fi
            fi
            sleep "$POLL_SECONDS"
          done
          if [ -n "$found" ]; then
            printf '%s' "$found" > check-run.json
            echo "timed_out=false" >> "$GITHUB_OUTPUT"
            echo "::notice::found a completed Check Run named '$CHECK_NAME' (started/completed at or after $DISPATCHED_AT)"
          else
            printf '{}' > check-run.json
            echo "timed_out=true" >> "$GITHUB_OUTPUT"
            echo "::warning::no completed Check Run named '$CHECK_NAME' appeared on $SHA at or after $DISPATCHED_AT within ${DEADLINE_MINUTES} minutes"
          fi

      # The ONLY step that decides pass/fail for a dispatched run. Fail
      # closed on every shape but a literal `success` conclusion from a
      # Check Run whose OWN name/head_sha match this dispatch -- see
      # `judge_polled_check_run`'s own docstring for why this is deliberately
      # stricter than GitHub's own required-check semantics (a `neutral`
      # conclusion satisfies a required check by GitHub's own rules; it must
      # not satisfy this one), and for the identity check (`check_name` does
      # not encode `soms`, so name+SHA alone is not unique to this dispatch's
      # SoM set -- PR #823 review, finding 7).
      - name: judge the receiver's verdict (fail closed)
        if: steps.relevant.outputs.value == 'true' && steps.secrets.outputs.have == 'true'
        working-directory: python
        env:
          TIMED_OUT: ${{ steps.poll.outputs.timed_out }}
          CHECK_NAME: ${{ steps.payload.outputs.check_name }}
          SOURCE_SHA: ${{ steps.facts.outputs.source_sha }}
          TAN_REF: ${{ steps.tanref.outputs.ref }}
        run: |
          set -euo pipefail
          args=(judge --check-run ../check-run.json \
            --expected-check-name "$CHECK_NAME" \
            --expected-source-sha "$SOURCE_SHA" \
            --tan-ref "$TAN_REF")
          if [ "$TIMED_OUT" = "true" ]; then
            args+=(--timed-out)
          fi
          python scripts/pin_move_verify.py "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
