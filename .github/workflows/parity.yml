# SPDX-License-Identifier: Apache-2.0
#
# ADR-0020 (alp-sdk#855 amendment) two-seam parity gate + cross-repo trigger.
# See tests/parity/README.md for the full rationale (frozen build-plan oracle
# SHA, the checkout-root/sdkCommit normalization, the allowed debug.probe
# delta). NOTE: "oracle" throughout this file means the FROZEN alp-sdk
# `--emit build-plan` captures under `tests/parity/oracle/`, not the retired
# Rust `tan` binary -- tan-cli#269 deleted `crates/` and every step here now
# runs the Python `tan` installed from `python/`.
#
#   seam1-plan-shape : live `--emit build-plan` vs. the frozen oracle,
#                       toolchain-free. Implemented.
#   seam2            : materialise + real build. Implemented.
#                       alp-sdk plans it, TAN executes it, the artefact is a
#                       real cross-compiled ARM ELF. The toolchain (west /
#                       Zephyr SDK) installs in-job on stock ubuntu-latest --
#                       alp-sdk#976 proved that, retiring this job's old
#                       "needs a self-hosted runner" blocker.
#                       Deliberately builds through `tan build`, NOT plain
#                       `west`: routing around the executor would test Zephyr
#                       and assert nothing about the seam.
#
# Runs on every tan PR as a self-check of this repo's vendored oracle +
# comparator against a pinned alp-sdk ref. (Plan-shape drift on the alp-sdk
# side is caught in alp-sdk's own CI -- alplabai/alp-sdk parity-seam1.yml --
# where it surfaces on the alp-sdk PR itself; no cross-repo dispatch needed.)

name: parity

# tan-cli#213: surface `client_payload.sdk_ref` in the Actions API's own
# `display_title` (what `run-name` sets) rather than only a job-log `::notice::`
# (see the "resolve alp-sdk ref" step below) -- alp-sdk's dispatch-confirmation
# poll can then filter on the exact ref it sent instead of "any run created
# after our dispatch epoch", which a concurrent push or other sender also
# satisfies. Only `repository_dispatch` carries `client_payload`; the other
# three triggers below (`push`, `pull_request`, and `workflow_call` from
# release.yml) render an empty string instead, which is NOT a blank/broken
# title -- GitHub's own rule is that an omitted-or-whitespace-only `run-name`
# falls back to the event-specific default (the commit message on `push`, the
# PR title on `pull_request`), and that default is strictly more informative
# than a constant `parity (push)` string would be. Same empty-string-means-
# "use the default" idiom as the `ref:` step below.
run-name: ${{ github.event_name == 'repository_dispatch' && format('parity (sdk {0})', github.event.client_payload.sdk_ref) || '' }}

on:
  # Direct pushes to `main` (an admin merge, a hotfix, a back-merge) open no PR,
  # so without this the three jobs below never ran on those commits at all --
  # and release.yml's `python-gates` call then skipped them a SECOND time, on
  # the belief they already had. `ci.yml` has always carried
  # `push: branches: [main]` for its own gates; this is the seam side of the
  # same guarantee, and it is what makes the `python_only` comment below true.
  push:
    branches: [main]
  pull_request:
  # ADR-0020's cross-repo trigger. alp-sdk fires this on every push that touches
  # its contract surface, and the payload carries the SHA to test against --
  # which is the whole point: a `pull_request` run checks tan against a PINNED
  # alp-sdk, so it cannot see an alp-sdk change that breaks tan until someone
  # bumps the pin by hand. alp-sdk's own `parity-seam1.yml` cannot see it either:
  # that job diffs alp-sdk's emit against alp-sdk's own frozen oracle and never
  # runs tan at all.
  #
  # THIS BLOCK MUST EXIST ON THE DEFAULT BRANCH (#194). GitHub triggers
  # `repository_dispatch` from the DEFAULT branch's copy of a workflow and
  # nowhere else, so while this lived only on `dev`, alp-sdk dispatched
  # successfully and nothing ever ran -- lifetime run count 0, with a 204 and no
  # body on every send. Do not "tidy" it onto a feature branch only.
  repository_dispatch:
    types: [alp-sdk-planner-change]
  # A `dev` merge queue is coming online: without this
  # trigger, a queued PR would wait forever on the three required contexts
  # this file produces (`python -- pytest across python/ (ubuntu-latest|
  # windows-latest|macos-latest)`) and on `seam1 -- plan-shape parity`, none
  # of which GitHub raises a `merge_group` event for otherwise. Checked every
  # `if:` in this file against a `merge_group` event before adding this:
  # `seam1-plan-shape` carries no job-level `if:` (always runs); its
  # emit/kconfig/bootstrap/toolchain/scaffold steps gate on
  # `!inputs.python_only`, which is `null`/falsy outside a `workflow_call`
  # run, same as it already is on `pull_request` today, so they still run;
  # `python-tests-shard`/`python-tests` carry no `pull_request`-specific
  # gating either. `seam2`/`first-blink` (not required contexts) share the
  # same `!inputs.python_only` gate and also run unchanged.
  merge_group:
  # release.yml's `python-gates` job calls this workflow so a release tag is
  # gated on the Python suite too, not just ci.yml's own `python` job -- a release tag
  # can be cut from any green-on-main commit, and until this existed the Python
  # port (python/tests) had no vote on whether `v0.5.0-rc.1` ships. See the
  # `python-tests` job below for the collected-test counts and the condition
  # they were measured under -- they move with the worktree and the SDK pin, so
  # they are not repeated here. Deliberately reuses this workflow rather than
  # duplicating python-tests into release.yml: PINNED_SDK_TAG + the alp-sdk
  # checkout steps live here. seam2/first-blink, and MOST of seam1's own
  # steps, are gated on the `python_only` input below -- with the
  # `push: branches: [main]` trigger above they now genuinely run on every
  # commit that LANDS on `main`, by PR or by direct push, so re-running them
  # for a tag cut from `main` would add matrix minutes and no coverage;
  # python-tests is the one job a release has never run before, so it is one
  # of the things this trigger adds.
  #
  # seam1's tests/gates block is the OTHER thing this trigger adds, and is
  # deliberately NOT gated on `python_only` (see that input's own comment) --
  # unlike the rest of seam1/seam2/first-blink, it always runs under a
  # `python_only: true` call, so a release tag gets tests/gates coverage
  # regardless of whether its commit ever landed on `main`.
  #
  # The residual assumption, narrowed rather than removed: a tag cut from a
  # commit that is NOT on `main` still gets no seam2/first-blink vote, and no
  # vote from seam1's emit/kconfig/bootstrap/toolchain/scaffold parity steps
  # (it does now get seam1's tests/gates vote, unconditionally). release.yml:90
  # refuses the analogous assumption and re-runs ci.yml
  # unconditionally. Tag from `main` and the two agree; tag from anywhere else
  # and the Python side is still the weaker of the two, just less weak than it
  # was. If tags ever get cut off-main, delete the remaining `python_only`
  # skips rather than re-deriving this.
  #
  # `github.event_name != 'workflow_call'` looks like the obvious guard for
  # "skip on workflow_call" but is wrong for a REUSABLE workflow: inside a
  # called workflow, the `github` context is the CALLER's, not the callee's --
  # `github.event_name` here is release.yml's own trigger (`push`), never
  # `workflow_call` itself. That expression is therefore always true and never
  # suppresses anything; a release tag would run seam1/seam2/first-blink in
  # full regardless. The actual signal has to travel as an explicit input.
  workflow_call:
    inputs:
      # Set true only by release.yml's `python-gates` job. Absent (null, which
      # is falsy) on both `pull_request` and `repository_dispatch`, so those
      # two paths are unaffected by this input's existence.
      python_only:
        description: "release.yml's python-gates call: skip seam2/first-blink and seam1's emit/kconfig/bootstrap/toolchain/scaffold parity steps, all of which the push+pull_request triggers already ran for this commit on main. Does NOT skip seam1's tests/gates block (audit-commit byte-hash gate + live jlink-freshness) -- that block is the only place tests/gates runs at all, and a tag cut from a commit that never landed on main (the residual case below) would otherwise get zero tests/gates coverage."
        type: boolean
        default: false

# A newer push to a PR supersedes the run in flight -- the rule ci.yml:78 and
# clean-host.yml:170 already state. The GROUP KEY deviates from theirs on
# purpose: neither of those carries a `repository_dispatch` trigger, and this
# workflow does.
#
# A flat `parity-${{ github.ref }}` would put every dispatched run in ONE group.
# GitHub raises `repository_dispatch` from the default branch, so `github.ref`
# is the same `refs/heads/dev` for all of them, however different the
# `client_payload.sdk_ref` under test. And grouping is not only about
# cancel-in-progress: per GitHub's documented concurrency semantics a run that
# arrives while another in its group is in progress WAITS, and a third arrival
# cancels the one that was waiting. Three alp-sdk contract pushes in quick
# succession would therefore leave the middle `sdk_ref` with no parity run at
# all -- silently dropping drift coverage for exactly the SHA that asked for it.
# tan-cli#485 records what six unnoticed red dispatch runs cost; a run that
# never happens is worse than one nobody looked at, because there is no red left
# to find.
#
# So group ONLY the runs meant to supersede each other. `pull_request` keys on
# the PR's ref; every other trigger keys on its own `github.run_id`, unique per
# run, which leaves push-to-main, `merge_group`, `workflow_call` (release.yml's
# `python-gates`) and `repository_dispatch` behaving exactly as they do today.
#
# `github.run_id` and NOT `github.event.client_payload.sdk_ref`, which is the
# other way to keep dispatched runs apart: a `repository_dispatch` payload is
# attacker-supplied, and a group key is a workflow-level expression evaluated
# before any job starts. `run_id` is GitHub's own, distinguishes the runs just
# as well, and puts no untrusted string in that position.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('parity-{0}', github.ref) || format('parity-{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Fallback alp-sdk ref for a plain `pull_request` run (no dispatch payload).
  # It MUST be a ref at or after the oracle SHA (97ad481b) -- an OLDER ref
  # (e.g. the last release v0.11.1, which predates the Phase-1 fields) lacks
  # envAppendPath/executionPolicy and would fail seam1 on missing-field diffs,
  # not real drift. Pinned to an exact alp-sdk `dev` commit SHA rather than a
  # tag: `actions/checkout`'s `ref:` takes any git ref, and a full SHA is
  # exactly as immutable as a tag without waiting on alp-sdk to cut one.
  # Carries the Phase-1 fields, the one allowed delta (debug.probe
  # openocd->null), the tokened-plan reconciliation branch `normalize_plan`
  # exercises, alp-sdk#893/#894/#897 (the `--emit kconfig` fixture), and
  # alp-sdk#917/#928 (the `metadata/bootstrap.json` manifest + its
  # `manualInstallHints` split). Bumped past #917 to alp-sdk#961 (Arm-toolchain
  # scoping, merged a27757b8f654b2d8d32a1a2a3f3ce640e9bade0c) and #967
  # (dtc/gperf settled, merged at this very SHA), which together rewrote
  # `manualInstallHints.windows.note` from one sentence to five elements and
  # bumped `zephyr.version` to v4.4.1 -- the re-vendor that let tan-cli#82
  # delete `optional_libs_block`'s duplicate hardcoded Arm/Zephyr-SDK block.
  # Now a RELEASED TAG, which is what this comment previously asked for ("to a
  # released tag once alp-sdk cuts one at or after this SHA"). alp-sdk v0.14.0
  # contains the old dev pin plus 19 commits (`compare` reports
  # `status=ahead, behind_by=0`), so it is a clean forward move, and a tag
  # reproduces where a dev tip does not -- the same reason
  # `wizard/vendored/MANIFEST.md` gives for pinning its vendor point to one.
  #
  # All FOUR parity gates were re-verified locally against this tag before the
  # bump, in WSL because the scaffold gate re-runs a live SDK emit and needs a
  # Linux host: toolchain-lock PASS, bootstrap-manifest PASS, kconfig-fixture
  # PASS, scaffold byte-parity PASS across all 9 (template, sku) pairs. The
  # first three passed only after re-vendoring the bootstrap manifest fixture
  # (5577 -> 7498 bytes) and the last only after re-vendoring 7 scaffold
  # READMEs, so this bump is NOT a lone one-line edit -- see the release commit.
  #
  # Re-bump on every alp-sdk change this repo's parity gate should track, and
  # re-run all three CI-wired byte-parity gates locally first (kconfig-fixture,
  # toolchain-lock, scaffold): this pin drives all of them, and the scaffold
  # one cannot be checked on Windows. `bootstrap_manifest_parity.py` is a manual
  # tool only (see the note below) and this pin does not drive it.
  #
  # v0.14.0 -> v0.15.0-rc1: alp-sdk#1057 (`jlink_flash_device` -> `flash_args`)
  # already lived in `python/tan/planner/` (tan-cli#275's re-sync target
  # 0f3cefbe, an alp-sdk `dev` commit past v0.14.0), so every
  # `test_planner_emit_parity.py::test_every_mode_is_byte_identical` case was
  # comparing tan's planner against a STALE live oracle that had not caught up
  # yet -- 72 identical failures on PR #252, all naming the same
  # `system-manifest` `flash_args` line. v0.15.0-rc1 contains #1057 (and #1025/
  # #1054, also already carried); moving the pin onto it removes the staleness
  # rather than papering over the diff.
  #
  # Re-verified all gates locally against this tag: kconfig-fixture and
  # toolchain-lock PASS unchanged (neither vendored file moved between
  # `0f3cefbe` and v0.15.0-rc1). Two gates needed re-scoping first, per
  # `docs/ROADMAP.md`'s Standing Rule that a frozen tree is measured at its
  # OWN freeze vendor point while a shipped Python surface is measured at
  # this pin:
  #
  # - scaffold byte-parity now defaults to `python/tan/templates/vendored/`
  #   (`scaffold_byte_parity.py`'s own default) -- the tree the shipped
  #   Python `tan` actually reads. It WAS re-vendored to v0.15.0-rc1 (see
  #   that tree's `MANIFEST.md`) and PASSES. (The Rust oracle's own second
  #   copy of this tree was the other half of this split; tan-cli#269 deleted
  #   it with `crates/`, so `python/tan/templates/vendored/` is now the only
  #   vendored scaffold tree in the repo.)
  # - bootstrap-manifest byte-parity is REMOVED (see the seam1 job below):
  #   the shipped Python `tan` carries no vendored copy of
  #   `metadata/bootstrap.json` to diff -- `tan.core.bootstrap` reads it
  #   live off the bound SDK root. `contract/fixtures/bootstrap/
  #   manifest.json` was written for the Rust oracle and guarded by that
  #   crate's own `cargo test`, which tan-cli#269 deleted along with
  #   `crates/` -- but it is NOT unguarded, and never was: the Python
  #   `test_the_fallback_constants_match_the_real_manifest_field_for_field`
  #   asserts `tan.core.bootstrap.fallback_facts` equals it field for field,
  #   and since tan-cli#585 with no exemption, alongside
  #   `test_no_instruction_in_the_vendored_manifest_names_a_refused_
  #   subcommand`. That fixture TRACKS `PINNED_SDK_TAG` since #585 (it had
  #   gone stale enough to send a customer to `tan sdk switch`, which this
  #   build refuses), so bump it with the pin.
  #   `tests/parity/bootstrap_manifest_parity.py` survives as a manual
  #   diagnostic tool (see its module doc), not run in CI.
  #
  # HELD at f4d87a1f from tan-cli#425 through tan-cli#485 (moved again below,
  # to `53557a60`, in #485's own fix). The `2bc6b400` bump #425 tried and
  # REVERTED stays recorded here as the precedent the #485 bump was checked
  # against: it reds 77 SDK-bound tests on all three OS legs, e.g.
  #
  #   test_planner_emit_parity.py::test_the_breadth_layer_still_covers_every_board
  #     AssertionError: only 2194 artefacts were compared byte for byte
  #     assert 2194 >= 2900
  #
  # The four contract-gate SCRIPTS (scaffold byte-parity, kconfig golden,
  # toolchain lock, seam1) all pass against `2bc6b400` -- which is what made
  # the bump look safe -- but they are not the whole gate. `python -- pytest
  # across python/` binds ALP_SDK_ROOT to this tag and runs the emit-parity
  # breadth layer against it, and THAT is what the bump breaks. Bumping needs
  # that breadth layer re-measured and its fixtures re-captured first; it is
  # not a one-line refresh. See tan-cli#425.
  #
  # v0.15.0-rc1 -> f4d87a1f (tan-cli#320): `python/tests/gates/
  # test_planner_relocation_freshness.py`'s own PINNED_SDK_COMMIT moved to
  # this exact commit when `tan/planner/` was re-synced against
  # `scripts/alp_orchestrate/` (alp-sdk#1080's `raw_shmem` cross-core
  # CONFIG_DCACHE=n and alp-sdk#1025's `SdkRevisionNotBuildable` status
  # half). Left at v0.15.0-rc1, this job's `python-tests` job (which
  # `--ignore=tests/gates` but NOT `tests/parity` -- see that job's own
  # comment) would diff the newly-fixed planner's
  # `tests/parity/test_planner_emit_parity.py` cases against the OLD,
  # pre-fix `scripts/alp_orchestrate/` and reopen the exact divergence #320
  # closes. `ci.yml`'s `sdk_parity` checkout `ref:` moved to the same commit
  # for the same reason -- the two MUST agree (see that file's comment).
  #
  # NOT a tag: alp-sdk had not cut one past v0.15.0-rc1 at the time of this
  # port. Re-pin to a real tag once alp-sdk cuts one at or after this SHA,
  # the same deferred-tag pattern this pin's own v0.14.0 -> v0.15.0-rc1
  # history used.
  #
  # Re-verified the other three CI-wired byte-parity gates locally against
  # this commit before the bump (same discipline the v0.14.0 -> v0.15.0-rc1
  # move used): kconfig-fixture PASS (814 bytes, unchanged --
  # `tests/fixtures/kconfig-contract/emit-kconfig.golden.json` did not move
  # between v0.15.0-rc1 and this commit), toolchain-lock PASS (6592 bytes,
  # unchanged -- `metadata/toolchains.json` did not move either), scaffold
  # byte-parity PASS across all 9 (template, sku) pairs (verified from a
  # Windows host this time -- none of the vendored templates' SDK inputs
  # changed in this range, so the Windows-only limitation this comment
  # elsewhere notes did not block the check for THIS bump specifically).
  #
  # f4d87a1f -> 53557a60 (tan-cli#485, #320 recurred): this is #485's own
  # suggested step 1, and NOT the same trap #425 hit bumping toward
  # `2bc6b400` -- that bump broke the emit-parity breadth-layer artefact-count
  # floor (`>= 2900`); this one does not (measured: 766 passed / 1 failed / 8
  # skipped against `python/tests/parity/test_planner_emit_parity.py`'s whole
  # module at `53557a60`, well clear of the floor -- the one failure is
  # `test_an_unresolvable_board_preset_is_a_coded_envelope`, a pre-existing
  # fixture defect this same tan-cli#485 change surfaces and fixes in the same
  # diff, unrelated to this pin). Left at `f4d87a1f`, `python-tests` and this
  # job's own steps are ref-independent-red on every PR and push instead of
  # just the dispatch-tested ref: alp-sdk `53557a60` (the SAME commit
  # `PINNED_SDK_COMMIT` above now targets) is also where alp-sdk dropped
  # `cacheable: true` from `examples/multicore/rpmsg-aen/board.yaml` -- the
  # exact field this tan-cli#485 change's `loader.py` refusal now rejects.
  # Bound to the OLD `f4d87a1f`, tan correctly refuses alp-sdk's OWN fixture
  # (which at that ref still carries the flag `53557a60` deleted), a 31-test
  # failure with nothing wrong on either side, just two repos measured a
  # half-step apart. `ci.yml`'s `sdk_parity` checkout re-pinned to the same
  # `53557a60` in the matching tan-cli commit, for the same reason -- the two
  # MUST agree (see that file's comment) -- and the CI-wired byte-parity gate
  # SCRIPTS (kconfig-fixture, toolchain-lock, scaffold) were re-verified PASS
  # against `53557a60` locally before this bump too.
  #
  # 53557a60 -> f30f4d4b (tan-cli#425, closing out the "held by inaction"
  # state that issue names). THIS pin is a THIRD, separate audit from the two
  # in `python/tests/gates/test_planner_relocation_freshness.py` -- it is the
  # SDK checkout the SHIPPED Python surface is measured against (the four
  # byte-parity gate scripts + the emit-parity breadth layer), not a hash of
  # upstream sources. All three move together in tan-cli#543's PR because a
  # port without the bump, or a bump without the port, reds a seam either way.
  #
  # #425's body is STALE and is corrected here rather than inherited: it
  # reports the pin as `f4d87a1f` (tan-cli#485 moved it to `53557a60` since),
  # and reports `seam1_field_diff.py` failing with `FAIL multicore_rpmsg-imx93:
  # alp-sdk refuses but tan does not`. RE-MEASURED against alp-sdk `f30f4d4b`
  # with this change's tree: that case now reports `PASS multicore_rpmsg-imx93
  # (alp-sdk and tan both refuse this board)`, both sides quoting the same
  # `SoM E1M-NX9101 hw_rev 'r1' exists but is not buildable (status: 'tbd').`
  # tan-cli#485 had already forward-ported alp-sdk#1025's status half into
  # `project_loader.py:196`, which is what closed it; the whole script is rc 0,
  # every other case PASS (several with the already-allowed `debug.probe`
  # delta). So option 1 of #425's three ("bump and fix the divergence") is
  # taken, and there was no divergence left to fix.
  #
  # The `2bc6b400` precedent above still stands as the warning it was written
  # to be, and was re-checked rather than assumed: the breadth-layer artefact
  # floor is NOT tripped by this bump.
  #
  # The bump is ATOMIC across the vendored artefacts, as #425 warns and this
  # file's history repeats. Re-measured against `f30f4d4b` before landing:
  #   - kconfig-fixture  PASS (814 bytes, byte-identical -- no re-vendor)
  #   - toolchain-lock   PASS (6592 bytes, byte-identical -- no re-vendor)
  #   - scaffold         PASS 9/9 (template, sku) pairs, but ONLY after
  #     re-vendoring `python/tan/templates/vendored/` (11 files) and RETIRING
  #     tan-cli#384's seven `DELIBERATE_EDITS` entries in
  #     `tests/parity/scaffold_byte_parity.py` -- alp-sdk has since cut the
  #     real `v0.15.0` tag (`e2928b9f`), so the emit's own doc links resolve
  #     and that divergence is healed. See that tree's `MANIFEST.md`.
  #   - seam1_field_diff PASS, rc 0 (above)
  # `bootstrap_manifest_parity.py` is not run in CI, but since tan-cli#585
  # `contract/fixtures/bootstrap/manifest.json` DOES track this pin -- so a
  # `DIFFERS` reported against the ref named here is a re-vendor prompt, not
  # the expected answer it used to be. Bumping this pin means: run
  # `python3 tests/parity/bootstrap_manifest_parity.py --sdk alp-sdk`, and on
  # a `DIFFERS` copy the SDK's `metadata/bootstrap.json` over the fixture,
  # then re-run `python/tests/commands/test_bootstrap_command.py` (the
  # field-for-field gate over `fallback_facts`, no exemptions since #585, plus
  # the check that no note names a subcommand in
  # `sdk_cmd.NOT_PORTED_SDK_SUBCOMMANDS`). The fixture went stale for exactly
  # as long as this block said not to bother: it was still telling customers
  # to run `tan sdk switch`, which this build refuses.
  #
  # `f30f4d4b` -> `ccd34f06` (tan-cli#552/#553/#554/#555/#557/#558/#559/#562/
  # #563). Three upstream commits touch `scripts/alp_orchestrate/` in this
  # range -- alp-sdk#1345 (two-pass carve-out/partition placement +
  # `access_windows:`), #1347 (the family-table reader stops failing open; the
  # per-family `boot.method:` default) and #1348 (Hawkbit URI/units, the
  # log-level choice-symbol form, the core-scoped library layer) -- plus
  # #1347's other half in `scripts/alp_project_loader.py`, a HAND_PORT file.
  # All four pin sites move in this one change: this tag, `ci.yml`'s
  # `sdk_parity` checkout `ref:`, and BOTH `PINNED_SDK_COMMIT` and
  # `HAND_PORT_PINNED_SDK_COMMIT` in
  # `python/tests/gates/test_planner_relocation_freshness.py`.
  # `STRICT_LOADERS_PINNED_SDK_COMMIT` does NOT move and is not stale:
  # `scripts/strict_loaders.py` is byte-identical between `26b0040e` and
  # `ccd34f06` (re-hashed, not assumed -- `29cd2c62...`, the value
  # `STRICT_LOADERS_HASH` already carries), so its audit still holds at its
  # own, deliberately separate, pin.
  #
  # alp-sdk#1344 is deliberately NOT picked up: still OPEN and CONFLICTING
  # upstream, so tan-cli#550/#551 stay open and are not claimed here.
  #
  # ATOMIC across the vendored artefacts, as this file's history repeats.
  # Re-measured against `ccd34f06` before landing:
  #   - kconfig-fixture  PASS (814 bytes, byte-identical -- no re-vendor)
  #   - toolchain-lock   PASS (6592 bytes, byte-identical -- no re-vendor)
  #   - scaffold         PASS 9/9 (template, sku) pairs, NO re-vendor: nothing
  #     under `examples/`, `metadata/catalog*` or the scaffold templates moved
