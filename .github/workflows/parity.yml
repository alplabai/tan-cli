  #     `_NESTED_ARTIFACT_TAILS` allowance above
  #
  # Still not a tag: alp-sdk's newest tag is `v0.15.0` (`e2928b9f`), which
  # predates every commit this bump exists to pick up.
  #
  # `88318e75` -> `94378a05` (tan-cli#846). This RETIRES the `88318e75` hold
  # recorded in `test_planner_relocation_freshness.py`'s `PINNED_SDK_COMMIT`
  # comment, by the exit that comment's own reasoning implies rather than the
  # one it named. The hold was never about `v0.16.0` being CUT -- it was about
  # a pin past alp-sdk's `v0.16.0` version bump making the scaffold emit
  # `https://github.com/alplabai/alp-sdk/blob/v0.16.0/docs/...` links while no
  # such tag exists. alp-sdk#1535 (`94378a05`) makes `_docs_ref()` require the
  # tag to RESOLVE before pinning to it, so that checkout degrades to `main`
  # instead of shipping a 404, and the hold has nothing left to protect.
  # tan-cli#846 ports the same `_tag_resolves()` guard into
  # `tan/planner/template.py`, so tan's own emit agrees rather than diverging.
  #
  # `PINNED_SDK_COMMIT` and `ci.yml`'s `sdk_parity` `ref:` move to the same
  # commit in this change. `HAND_PORT_PINNED_SDK_COMMIT` deliberately does
  # NOT -- alp-sdk#1471's `scripts/alp_cli/doctor.py` delta is unported, and
  # re-pinning would freeze that drift as reviewed; see that pin's own
  # comment. `STRICT_LOADERS_PINNED_SDK_COMMIT` does not move either:
  # `scripts/strict_loaders.py` does not appear in the `88318e75..94378a05`
  # diff at all.
  #
  # ATOMIC across the vendored artefacts, as this file's history repeats.
  # Re-measured against `94378a05` before landing:
  #   - kconfig-fixture  PASS (814 bytes, byte-identical -- no re-vendor)
  #   - bootstrap        RE-VENDORED, 8345 -> 8643 bytes: alp-sdk#1464/#1471
  #     land in this range and `metadata/bootstrap.json`'s `install.linux`
  #     gains the package-manager level (`{"apt": {...}, "dnf": {...}}`).
  #     `tan.core.bootstrap` already reads both shapes (tan-cli#760), and
  #     `test_the_fallback_constants_match_the_real_manifest_field_for_field`
  #     had a self-cancelling `dnf` exemption for exactly this day -- it
  #     fired, and the comparison is narrowed back to blanket field-for-
  #     field. MATCH (8643 bytes, byte-identical) after.
  #   - scaffold         RE-VENDORED, 7 READMEs (`v0.15.0` -> `main` doc
  #     links, the #1535 degradation above) -- 7 FAIL / 2 PASS before, 9/9
  #     PASS rc 0 after. See `python/tan/templates/vendored/MANIFEST.md`.
  #   - seam1_field_diff PASS, rc 0 -- all 6 boards
  PINNED_SDK_TAG: 94378a056549c7377d714a7f2b68878aca8fea01

  # THE FROZEN PLANNER ORACLE (tan-cli#509). Deliberately its OWN pin, and
  # deliberately one that does NOT track `PINNED_SDK_TAG` above.
  #
  # tan-cli#270 deletes `scripts/alp_orchestrate/` from alp-sdk. It does not
  # rewrite history, so a pre-#270 ref still ships the planner and can still be
  # cloned -- that is what makes the byte-parity layer survive at all. But the
  # two pins answer different questions and must be free to diverge:
  #
  #   PINNED_SDK_TAG                 the alp-sdk tan TRACKS. Moves forward.
  #   PINNED_PLANNER_ORACLE_SDK_REF  the last alp-sdk that HAD a planner. Stops.
  #
  # Bumping this one past #270 does not degrade the gate gracefully -- it
  # removes it. `tests/fixtures/planner_oracle/PROVENANCE.txt` records the ref
  # these goldens were captured from; the two must name the same commit, and
  # `test_planner_oracle_regression.py` fails loudly rather than quietly if the
  # bound checkout is not that one.
  PINNED_PLANNER_ORACLE_SDK_REF: 94378a056549c7377d714a7f2b68878aca8fea01

permissions:
  # Least privilege by default (tan-cli#435). Every job here READS: this
  # repository, plus `alplabai/alp-sdk`, which is public, so the default
  # token reads it with no extra grant. Nothing in this workflow writes to
  # either repository -- the planner RE-SYNC, which does push, is a separate
  # workflow (`planner-resync.yml`) with its own `contents: write`.
  contents: read

jobs:
  seam1-plan-shape:
    name: "seam1 -- plan-shape parity"
    # NOT job-gated on `python_only` (it used to be, in full -- that was the
    # bug: it took this job's tests/gates block down with it). This job now
    # ALWAYS runs; `python_only: true` (release.yml's `python-gates` call)
    # instead marks the individual emit/kconfig/bootstrap/toolchain/scaffold
    # parity steps below `if: ${{ !inputs.python_only }}` -- see each step --
    # because THOSE are what the `push`/`pull_request` triggers above already
    # ran for this commit on `main`, and a tag cut from `main` gains nothing
    # re-running them. The tests/gates block (audit-commit checkout + jlink
    # freshness, further down) carries no such `if:` and always runs: it is
    # the only place in this workflow tests/gates runs at all, and skipping it
    # under `python_only` was the hole where a release tag got zero
    # tests/gates coverage even though seam1's OTHER steps looked like they
    # covered it. See the `python_only` input's own comment for the off-main
    # tag case this still cannot see (the tag's own commit was never pushed to
    # `main`, so nothing upstream of this job ran either).
    runs-on: ubuntu-latest
    # Measured 1 minute on a `pull_request` run (run 32039025829). 30 is a hang
    # catcher, not a budget -- it exists so a wedged leg on a REQUIRED context
    # (`seam1 -- plan-shape parity` is one of the five) fails in bounded time
    # instead of holding the PR for GitHub's 360-minute job default.
    timeout-minutes: 30
    steps:
      - name: checkout tan-cli
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # On a `repository_dispatch` the workflow FILE has to come from the
          # DEFAULT branch -- that is GitHub's rule and why #195 put the trigger
          # on `main`. But what we CHECK OUT and test is a separate choice, and
          # the default (`main`) is the wrong one here.
          #
          # Everything that tracks alp-sdk lands on `dev`: the vendored scaffold
          # fixtures, PINNED_SDK_TAG, the comparator. `main` only receives them
          # at a release. So testing `main` against the newest alp-sdk is red for
          # the entire interval between releases, and its redness says nothing
          # actionable -- it reports "the last release predates this SDK change",
          # which is true by construction and not a defect.
          #
          # The question worth asking on a dispatch is "can tan's integration
          # branch consume this alp-sdk change?", so test `dev`. A `pull_request`
          # run keeps checkout's default (the PR head) by passing an empty ref.
          ref: ${{ github.event_name == 'repository_dispatch' && 'dev' || '' }}

      # `client_payload.*` is attacker-controlled by construction -- anyone able
      # to POST a `repository_dispatch` picks every field -- so it is carried in
      # as an ENV VAR, never interpolated into the shell, and then matched
      # against an allow-list before it reaches `git` or `$GITHUB_OUTPUT`.
      # `planner-resync.yml`, the OTHER consumer of this same dispatch, has
      # done it this way since it was written; this file interpolated the field
      # straight into four `run:` blocks, which `zizmor` reports as
      # high-confidence `template-injection` (tan-cli#435). Single quotes were
      # not a defence: a payload containing one closes the string, and the
      # double-quoted twin in `first-blink` expanded `$(...)` outright.
      # `PINNED_SDK_TAG` is a workflow-level `env:`, so the fallback is already
      # an ordinary environment variable here and needs no expansion.
      - name: resolve alp-sdk ref
        id: sdk_ref
        shell: bash
        env:
          PAYLOAD_REF: ${{ github.event.client_payload.sdk_ref }}
        run: |
          set -euo pipefail
          # A dispatch carries the alp-sdk SHA that just landed; a plain PR run
          # has no payload and falls back to the pin. Written as one expression
          # so the two paths cannot drift apart.
          dispatched="${PAYLOAD_REF:-}"
          ref="${dispatched:-${PINNED_SDK_TAG}}"
          # Allow-list, not a deny-list: a git ref needs none of the characters
          # a shell or an argument injection needs. Same expression as
          # `planner-resync.yml`'s. It also protects `$GITHUB_OUTPUT` below --
          # a payload carrying a newline would otherwise write extra keys.
          # NOT `grep -qE`. grep is LINE-oriented, so `printf '%s' "$ref" |
          # grep -qE '^...$'` returns 0 when ANY line matches: a payload of
          # `dev\nref=attacker` passes on its first line, and the second line
          # then lands in `$GITHUB_OUTPUT` as its own key -- the precise
          # injection this guard exists to refuse. `case` tests the WHOLE
          # string, newline included. Measured both ways before choosing.
          case "${ref}" in
            ""|[!A-Za-z0-9]*|*[!A-Za-z0-9._/-]*)
              echo "::error::refusing an alp-sdk ref that is not a plain git ref: ${ref}"
              exit 1 ;;
          esac
          if [ "${#ref}" -gt 201 ]; then
            echo "::error::refusing an alp-sdk ref longer than 201 characters: ${ref}"
            exit 1
          fi
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          if [ -n "${dispatched}" ]; then
            echo "::notice::DISPATCHED by alp-sdk -- comparing against the ref that just landed: ${ref}"
          else
            echo "::notice::comparing against the pinned alp-sdk ref: ${ref}"
          fi

      - name: clone alp-sdk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: alplabai/alp-sdk
          ref: ${{ steps.sdk_ref.outputs.ref }}
          path: alp-sdk

      # ADR-0020 mandates a `repository_dispatch` alp-sdk -> tan on every planner
      # change. That needs a PAT/App secret this repo does not have, so the pin
      # is bumped by hand -- and a hand-bumped pin ROTS SILENTLY. The gate stays
      # green against a months-old alp-sdk while `dev` moves underneath it, which
      # is the exact "green means nothing" failure the two-seam gate exists to
      # prevent.
      #
      # This is the token-free half: no dispatch, but the pin cannot drift
      # unnoticed. alp-sdk is public, so the default GITHUB_TOKEN reads it.
      #
      # WARN, never fail. A pin legitimately lags -- an alp-sdk change the
      # planner did not touch should not red every tan PR, and a gate that
      # reddens for something the author cannot fix in their own PR is a gate
      # people learn to ignore. What it must never do is stay quiet.
      # Skipped on a dispatch run: that run deliberately IGNORES the pin and
      # tests the ref alp-sdk just pushed, so reporting the pin as stale would
      # describe something this run did not use. The dispatch is the thing that
      # makes the pin matter less; the warning stays for PR runs, which still
      # depend on it entirely.
      - name: pin freshness (warn only)
        if: ${{ github.event_name != 'repository_dispatch' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          pinned='${{ env.PINNED_SDK_TAG }}'
          head="$(gh api repos/alplabai/alp-sdk/commits/dev -q .sha 2>/dev/null || true)"
          if [ -z "${head}" ]; then
            echo "::warning::could not read alp-sdk dev to check pin freshness -- skipping this check only"
            exit 0
          fi
          if [ "${head}" = "${pinned}" ]; then
            echo "pin is alp-sdk dev tip (${pinned}) -- fresh."
            exit 0
          fi
          # Count only commits touching the CONTRACT surface. Total commit count
          # would flag a docs-only week and train everyone to ignore the warning.
          cd alp-sdk
          git fetch -q --depth=200 origin dev || true
          behind="$(git rev-list --count "${pinned}..origin/dev" --                       scripts/alp_orchestrate metadata tests/parity 2>/dev/null || echo '?')"
          if [ "${behind}" = "0" ]; then
            echo "pin is behind alp-sdk dev, but by NOTHING on the contract surface. Fine."
            exit 0
          fi
          echo "::warning::PINNED_SDK_TAG is ${behind} contract-surface commit(s) behind alp-sdk dev (${head}). Both seams are green against a pin that no longer reflects the planner. Re-bump PINNED_SDK_TAG in .github/workflows/parity.yml."

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      # alp_orchestrate's emit path hard-requires PyYAML and jsonschema (it
      # aborts with "<pkg> is required" otherwise). setup-python ships a bare
      # interpreter, so install them explicitly — without this, seam1 fails
      # every example with an emit error, not a real plan-shape diff. `pytest`
      # runs the comparator's own unit tests, below.
      # Installs `python/` itself rather than hand-listing names. The hand-list
      # (`pyyaml jsonschema pytest`) drifted the moment tests/gates began
      # importing `tan.commands` -- collection died on `ModuleNotFoundError: No
      # module named 'typer'`, and `--deselect` does not save it, because a
      # deselect happens AFTER the import. Installing from pyproject cannot
      # drift: `dependencies = ["typer>=0.12", "rich>=13", "pyyaml>=6",
      # "jsonschema>=4.18", "click>=8.1"]` covers the emit path's PyYAML and
      # jsonschema too. `pytest` stays explicit -- it is a test-only dep, not a
      # runtime one.
      - name: install SDK emit + test deps
        run: |
          python3 -m pip install --upgrade pip pytest
          python3 -m pip install ./python

      # These five steps (through scaffold byte-parity) are the ones the
      # `push`/`pull_request` triggers above already ran for this exact commit
      # once it landed on `main` -- re-running them under `python_only: true`
      # (a tag cut from that same commit) adds minutes, not coverage. Skipped
      # ONLY there; the tests/gates block below carries no such condition.
      #
      # The comparator judges every live alp-sdk emit against the frozen
      # oracle -- a broken comparator (e.g. a tolerance that silently waves
      # through a dropped command) must be caught here, before it is trusted
      # to judge alp-sdk below.
      - name: seam1 comparator self-test (test_seam1_field_diff.py)
        if: ${{ !inputs.python_only }}
        run: python3 -m pytest tests/parity/test_seam1_field_diff.py -q

      # tan-cli#320: covers _tan_reconciled_refusal, the one piece of
      # seam1_field_diff.py that is NOT vendored-identical with alp-sdk's
      # copy (see that module's docstring). Its own step/file rather than
      # folded into the self-test above, which stays byte-identical with
      # alp-sdk's copy of test_seam1_field_diff.py.
      - name: seam1 comparator self-test (tan reconciliation, tan-cli-only)
        if: ${{ !inputs.python_only }}
        run: python3 -m pytest tests/parity/test_seam1_tan_reconciliation.py -q

      - name: seam1 field diff (live emit vs. frozen oracle)
        if: ${{ !inputs.python_only }}
        run: >
          python3 tests/parity/seam1_field_diff.py
          --sdk alp-sdk
          --oracle tests/parity/oracle

      - name: kconfig fixture byte-parity (vendored vs. pinned alp-sdk)
        if: ${{ !inputs.python_only }}
        run: python3 tests/parity/kconfig_fixture_parity.py --sdk alp-sdk

      # `tan bootstrap` reads the SDK's metadata/bootstrap.json (alp-sdk#917)
      # live off the bound SDK root -- no baked-in copy of it SHIPS, so there
      # is no released artefact for a byte-parity step to guard here.
      # (`contract/fixtures/bootstrap/manifest.json` is a test fixture, not a
      # shipped file. tan-cli#269 deleted the `cargo test` that guarded it,
      # but not the guarantee: `python/tests/commands/test_bootstrap_command.py`
      # asserts `tan.core.bootstrap.fallback_facts` equals it field for field
      # -- every field since tan-cli#585 -- and that no note in it names a
      # subcommand this build refuses. Since #585 it tracks `PINNED_SDK_TAG`;
      # re-vendor it when that pin moves.) See `tests/parity/bootstrap_
      # manifest_parity.py`'s module doc for why the script itself is kept as
      # a manual tool rather than deleted.

      # `tan doctor`'s zephyrSdk check (tan-cli#160) prints a hand-ported copy
      # of alp-sdk's metadata/toolchains.json zephyrSdk.version (the retired
      # Rust oracle spelled the same constant
      # `crates/tan-core/src/host_env.rs::ZEPHYR_SDK_INSTALL_VERSION`).
      # scripts/check_toolchain_lock.py guards every CI *workflow* copy of
      # that pin but cannot see this checkout (tan-cli#172) -- this is the
      # tan-side half, reusing this job's alp-sdk checkout rather than a
      # second clone.
      - name: toolchain lock byte-parity (vendored vs. pinned alp-sdk)
        if: ${{ !inputs.python_only }}
        run: python3 tests/parity/toolchain_lock_parity.py --sdk alp-sdk

      # `python/tan/templates/vendored/` (the script's default -- the tree
      # the shipped Python `tan` reads) vs. the pinned alp-sdk's live
      # `--emit scaffold`. Reuses this job's alp-sdk checkout + emit deps (same
      # as the kconfig step above) rather than a second clone. The vendored tree
      # is captured at this exact pin, so a re-vendor that drifts from the SDK
      # fails here instead of shipping silently (the drift that hid the stale
      # `minimal` README before this gate ran in CI). The frozen Rust oracle's
      # own second copy of this tree went with `crates/` in tan-cli#269, so
      # this is the only vendored scaffold tree left to measure.
      - name: scaffold byte-parity (vendored tree vs. pinned alp-sdk --emit scaffold)
        if: ${{ !inputs.python_only }}
        run: python3 tests/parity/scaffold_byte_parity.py --sdk alp-sdk

      # `python/tests/gates/test_planner_relocation_freshness.py` pins its own
      # audit ref (`PINNED_SDK_COMMIT`), separate from this job's `PINNED_SDK_TAG`.
      # Binding ALP_SDK_ROOT to the job's `alp-sdk` checkout (pinned to
      # PINNED_SDK_TAG) fed the gate whichever ref happens to be newer or OLDER
      # than PINNED_SDK_COMMIT with no guarantee the two agree -- and for a
      # stretch they did not: PINNED_SDK_TAG=cdfe1368 was an ANCESTOR of
      # PINNED_SDK_COMMIT=ef79eab0, so the gate reddened on every run comparing
      # an older planner against hashes audited from a newer one, telling the
      # reader to port a BACKWARDS delta. Read the gate's own pin instead of
      # duplicating it as a second hand-maintained SHA here (that duplication is
      # the same drift, one layer up).
      - name: resolve planner audit commit (from the gate's own pin)
        id: planner_audit
        shell: bash
        run: |
          set -euo pipefail
          # ANCHORED at line start on purpose. The gate also declares
          # `HAND_PORT_PINNED_SDK_COMMIT` (the separate pin the hand-ported
          # emitters are audited against), and an unanchored pattern matches
          # that line too because it CONTAINS the substring
          # `PINNED_SDK_COMMIT = "..."`. That returned two SHAs, so
          # `commit=${commit}` wrote a second bare line into $GITHUB_OUTPUT and
          # the step died with `Invalid format '<sha>'` -- a grep standing in
          # for a parse, which is what the second pin quietly broke.
          gate=python/tests/gates/test_planner_relocation_freshness.py
          commit=$(grep -oE '^PINNED_SDK_COMMIT = "[0-9a-f]{40}"' "$gate" \
              | grep -oE '[0-9a-f]{40}')
          # Exactly one, or say so here rather than emitting a malformed output
          # that fails three steps later with nothing naming the cause.
          n=$(printf '%s\n' "$commit" | grep -c .)
          if [ "$n" -ne 1 ]; then
            echo "::error::expected exactly ONE ^PINNED_SDK_COMMIT in ${gate}, found ${n}: ${commit}"
            exit 1
          fi
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          echo "::notice::planner-relocation-freshness audited against alp-sdk ${commit}"

      - name: clone alp-sdk at the planner audit commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: alplabai/alp-sdk
          ref: ${{ steps.planner_audit.outputs.commit }}
          path: alp-sdk-planner-audit

      # tan-cli#296: the gate file carries a SECOND pin, HAND_PORT_PINNED_SDK_COMMIT,
      # for a DIFFERENT audit (the hand-ported `tan/planner/` modules, e.g.
      # `zephyr_board.py` <- `scripts/gen_zephyr_board.py`) at a DIFFERENT alp-sdk
      # commit than PINNED_SDK_COMMIT above. Binding both audits to the SAME
      # checkout (`alp-sdk-planner-audit`) is exactly the bug this step exists to
      # not repeat: `test_hand_ported_planner_modules_match_their_pinned_sdk_source`
      # reddened on PR #296 comparing HAND_PORT_HASHES (audited at v0.15.0-rc1,
      # 996937ac) against `alp-sdk-planner-audit`'s tree (PINNED_SDK_COMMIT,
      # 0f3cefbe -- an OLDER alp-sdk `dev` commit), reporting drift that was
      # really just the wrong oracle. Two audits, two pins, two checkouts -- see
      # docs/ROADMAP.md's Standing Rule and the gate file's own tan-cli#296 note.
      - name: resolve hand-port audit commit (from the gate's own pin)
        id: hand_port_audit
        shell: bash
        run: |
          set -euo pipefail
          # ANCHORED at line start, same reason as the `resolve planner audit
          # commit` step above: an unanchored pattern also matches
          # `PINNED_SDK_COMMIT = "..."` (this file declares BOTH pins), so it
          # would return two SHAs and die on `Invalid format '<sha>'` three
          # steps later with nothing naming the cause.
          gate=python/tests/gates/test_planner_relocation_freshness.py
          commit=$(grep -oE '^HAND_PORT_PINNED_SDK_COMMIT = "[0-9a-f]{40}"' "$gate" \
              | grep -oE '[0-9a-f]{40}')
          # Exactly one, or say so here rather than emitting a malformed output
          # that fails three steps later with nothing naming the cause.
          n=$(printf '%s\n' "$commit" | grep -c .)
          if [ "$n" -ne 1 ]; then
            echo "::error::expected exactly ONE ^HAND_PORT_PINNED_SDK_COMMIT in ${gate}, found ${n}: ${commit}"
            exit 1
          fi
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          echo "::notice::hand-port-relocation-freshness audited against alp-sdk ${commit}"

      - name: clone alp-sdk at the hand-port audit commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: alplabai/alp-sdk
          ref: ${{ steps.hand_port_audit.outputs.commit }}
          path: alp-sdk-hand-port-audit

      # tan-cli#485: a THIRD pin, STRICT_LOADERS_PINNED_SDK_COMMIT, for
      # `strict_loaders.py` alone -- see the gate file's own STRICT_LOADERS_*
      # comment for why it could not join HAND_PORT_HASHES (that bundle's
      # other three files carry unrelated, unaudited drift including alp-sdk
      # #1069's dual-M55 boot memory layout; folding strict_loaders.py in
      # would force re-freezing HAND_PORT_HASHES past that unaudited, or
      # porting an unrelated hardware-sensitive feature as a drive-by).
      - name: resolve strict-loaders audit commit (from the gate's own pin)
        id: strict_loaders_audit
        shell: bash
        run: |
          set -euo pipefail
          gate=python/tests/gates/test_planner_relocation_freshness.py
          commit=$(grep -oE '^STRICT_LOADERS_PINNED_SDK_COMMIT = "[0-9a-f]{40}"' "$gate" \
              | grep -oE '[0-9a-f]{40}')
          n=$(printf '%s\n' "$commit" | grep -c .)
          if [ "$n" -ne 1 ]; then
            echo "::error::expected exactly ONE ^STRICT_LOADERS_PINNED_SDK_COMMIT in ${gate}, found ${n}: ${commit}"
            exit 1
          fi
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          echo "::notice::strict-loaders-relocation-freshness audited against alp-sdk ${commit}"

      - name: clone alp-sdk at the strict-loaders audit commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: alplabai/alp-sdk
          ref: ${{ steps.strict_loaders_audit.outputs.commit }}
          path: alp-sdk-strict-loaders-audit

      # `python/tests/gates/` (dependency-declaration, frozen issue-codes,
      # hardware-facts allowlist, planner-relocation self-consistency) does not
      # run in ANY CI workflow today. The freshness gate in particular
      # `pytest.skip`s -- exit 0, invisible as a CI status -- whenever
      # ALP_SDK_ROOT is unset, so it has never actually compared `tan/planner/`
      # against an alp-sdk checkout in CI. This job already installs pytest
      # above, so pointing ALP_SDK_ROOT at the audit-commit checkout resolved
      # above arms all four gates for the cost of one step: no package install,
      # no extra clone beyond the sparse one above, ~1s measured locally.
      #
      # Bound to the audit commit -- NOT this job's `alp-sdk` (pinned to
      # PINNED_SDK_TAG, a different ref that can legitimately sit on either
      # side of the audit commit) -- this step proves the narrower, always
      # in-scope thing: PINNED_HASHES in the test file are actually what
      # PINNED_SDK_COMMIT's tree contains, i.e. tan-cli and its own pin have
      # not drifted apart. Live drift detection (has alp-sdk moved PAST that
      # commit since the last audit) is a separate, warn-only step below --
      # see its comment for why blocking on that question is the wrong shape.
      #
      # ALP_SDK_HAND_PORT_ROOT is bound alongside it, to the SEPARATE
      # `alp-sdk-hand-port-audit` checkout resolved above (HAND_PORT_PINNED_SDK_COMMIT,
      # not PINNED_SDK_COMMIT) -- tan-cli#296. Before this, only ALP_SDK_ROOT was
      # bound here, so `test_hand_ported_planner_modules_match_their_pinned_sdk_source`
      # read the SAME `alp-sdk-planner-audit` tree the relocated-planner test
      # above reads, even though HAND_PORT_HASHES is pinned at a DIFFERENT alp-sdk
      # commit -- two audits sharing one root, which is what actually reddened
      # PR #296 (a real hash mismatch against the wrong tree, not real drift).
      # The gate file itself never falls back from one root to the other
      # (`_hand_port_sdk_root()` skips rather than reusing `_sdk_root()`), so
      # leaving ALP_SDK_HAND_PORT_ROOT unbound here would silently mis-measure
      # the hand-port test the OLD way, not fail it -- it would just SKIP, same
      # as any other unbound run. The node-id PASSED assertion in the step
      # below (tan-cli#308) is what turns that silent skip into a hard failure
      # of THIS job specifically, which is exactly why this line has to be
      # here and not merely nice to have.
      #
      # Deliberately NOT the full `python/tests` suite here (ports + parity,
      # minutes not seconds, needs its own alp-sdk checkout) -- that now runs
      # in the `python-tests` job further down this file, which deliberately
      # `--ignore=tests/gates`: this JOB already arms all five gate files (9
      # collected tests, tan-cli#485 added the STRICT_LOADERS_* one) across the
      # three steps below -- five of them in this
      # step against the FROZEN audit commit(s), `test_jlink_aen_device_freshness`
      # live and blocking in its own step, and `test_planner_relocation_freshness`
      # additionally live and warn-only on `repository_dispatch`. Each is bound
      # to the ref that makes its verdict mean something.
      # Running them again in `python-tests` against PINNED_SDK_TAG -- a THIRD,
      # uncoordinated ref that can legitimately sit on either side of the audit
      # commit -- would reintroduce a false positive, not add coverage. This
      # step's job is only to arm the always-must-run gates subset that was
      # silently unwired everywhere before it existed.
      - name: python/tests/gates (dependency, issue-code, hardware-fact, planner self-consistency)
        working-directory: python
        env:
          ALP_SDK_ROOT: ${{ github.workspace }}/alp-sdk-planner-audit
          ALP_SDK_HAND_PORT_ROOT: ${{ github.workspace }}/alp-sdk-hand-port-audit
          ALP_SDK_STRICT_LOADERS_ROOT: ${{ github.workspace }}/alp-sdk-strict-loaders-audit
        run: |
          set -euo pipefail
          python3 -m pytest tests/gates -v --deselect tests/gates/test_jlink_aen_device_freshness.py | tee /tmp/gates.log
          # Both roots above are bound in THIS job -- the one place this whole
          # workflow arms them -- so neither freshness test in
          # test_planner_relocation_freshness.py has an excuse to skip here. A
          # skip does not fail pytest's exit code (only a FAIL does), so the
          # `set -e`/pipefail above is not itself the enforcement -- it would
          # let an invisible skip straight through green, which is the exact
          # tan-cli#275 defect this gate file exists to prevent, one job
          # later. `-v` prints "<nodeid> PASSED"/"SKIPPED" per test; assert
          # PASSED by full node id rather than trusting the summary count, so
          # a skip here is a hard job failure rather than a silent no-op
          # (tan-cli#308: an earlier revision made the test's unbound branch
          # itself hard-fail instead, which broke ci.yml's `python` job --
          # see that test's own comment for why the enforcement belongs here,
          # not there).
          for t in test_relocated_planner_modules_match_the_pinned_sdk_audit \
                   test_hand_ported_planner_modules_match_their_pinned_sdk_source \
                   test_strict_loaders_matches_its_pinned_sdk_source; do
            if ! grep -qF "test_planner_relocation_freshness.py::${t} PASSED" /tmp/gates.log; then
              echo "::error::${t} did not PASS in this job -- ALP_SDK_ROOT, ALP_SDK_HAND_PORT_ROOT and ALP_SDK_STRICT_LOADERS_ROOT are all bound here, so a SKIP means the oracle checkout this job cloned did not resolve (or the test regressed to fail-open), not an absent root."
              exit 1
            fi
          done

          # tan-cli#778's gate lives in its OWN file, so the loop above cannot
          # reach it -- it greps one fixed module name. Its symbol-parity test
          # is the only one there needing ALP_SDK_HAND_PORT_ROOT, and this job
          # is the only one that binds it, so an unasserted SKIP exits 0 and
          # passes silently: verbatim the tan-cli#308 shape that gate's own
          # docstring invokes.
          if ! grep -qF "test_hand_port_tan_side.py::test_explain_hand_port_still_agrees_with_its_upstream_symbols PASSED" /tmp/gates.log; then
            echo "::error::test_explain_hand_port_still_agrees_with_its_upstream_symbols did not PASS in this job -- ALP_SDK_HAND_PORT_ROOT is bound here, so a SKIP means the oracle checkout this job cloned did not resolve (or the test regressed to fail-open), not an absent root."
            exit 1
          fi

      # test_jlink_aen_device_freshness asks a question the FROZEN audit checkout
      # cannot answer: does tan's JLINK_AEN_DEVICE fallback still agree with the
      # part number alp-sdk ships TODAY. Binding it to the audit commit like the
      # step above would pin it to the very snapshot it exists to detect drift
      # from -- it would pass forever. So it runs against the live checkout, and
      # it BLOCKS: unlike planner staleness, a stale part number here is tan's
      # own constant, in tan's own file, fixable in this PR.
      - name: jlink device freshness vs live alp-sdk (blocking)
        working-directory: python
        env:
          ALP_SDK_ROOT: ${{ github.workspace }}/alp-sdk
        run: python3 -m pytest tests/gates/test_jlink_aen_device_freshness.py -q

      # Companion to the blocking step above and THE actual staleness alarm:
      # does live alp-sdk (this job's `alp-sdk` checkout -- PINNED_SDK_TAG on a
      # `pull_request` run, or the SHA a dispatch just landed) still match the
      # hashes tan/planner/ was last audited against, or has
      # scripts/alp_orchestrate moved since? By its own docstring this gate
      # fires exactly when alp-sdk lands a planner change tan has not
      # re-absorbed yet -- and it fires hardest on a `repository_dispatch` run,
      # whose entire premise is "alp-sdk just moved". Wiring that as a
      # hard-failing check would red every such PR/dispatch for a move its
      # author did not cause and cannot fix inside tan-cli -- exactly the
      # failure mode the `pin freshness (warn only)` step above already
      # legislates against for PINNED_SDK_TAG. Same shape here:
      # `continue-on-error` plus an explicit `::warning::`, never a red X. Runs
      # on a dispatch too (unlike the pin-freshness step above), because
      # dispatch is when this alarm matters most.
      # Dispatch ONLY. On a `pull_request` run the `alp-sdk` checkout is
      # PINNED_SDK_TAG -- a deliberately frozen parity pin that may legitimately
      # sit BEHIND the audit commit (it does today), so comparing the two there
      # answers nothing and fires on every PR. An alarm that cries wolf on every
      # run trains everyone to ignore it, which is worse than not having it.
      # `repository_dispatch` is the case this exists for: alp-sdk just moved,
      # and `sdk_ref` is the SHA it moved to.
      #
      # Scoped to `::test_relocated_planner_modules_match_the_pinned_sdk_audit`
      # ONLY (tan-cli#296) -- this step binds ONLY `ALP_SDK_ROOT` (to `alp-sdk`,
      # PINNED_SDK_TAG/the dispatched ref), which is the correct oracle for that
      # one test but not for its sibling
      # `test_hand_ported_planner_modules_match_their_pinned_sdk_source`, which
      # now requires its own `ALP_SDK_HAND_PORT_ROOT` and fails loudly without
      # it. Running the whole file here would make the hand-port test fail on
      # EVERY dispatch for a reason unrelated to live drift (its dedicated root
      # is deliberately not bound in this step), which is exactly the
      # cry-wolf failure mode this step's own comment above rejects for
      # PINNED_SDK_TAG.
      - name: planner relocation freshness vs live alp-sdk (alarm, warn only)
        if: github.event_name == 'repository_dispatch'
        continue-on-error: true
        working-directory: python
        env:
          ALP_SDK_ROOT: ${{ github.workspace }}/alp-sdk
        run: |
          # KEYED ON `<nodeid> PASSED`, NOT ON rc (tan-cli#500 review). Both
          # freshness tests SKIP rather than fail when their root does not
          # resolve -- the resolver accepts a root only if
          # `<root>/scripts/alp_project.py` is a file, and the test's own
          # comment says "Skip, not fail" -- and a skip leaves pytest at rc=0.
          # Keying on rc therefore made this alarm silent for any path or
          # marker change: no ::warning::, step exits 0, nothing in the log.
          # That is the fail-open shape this file's other steps exist to close,
          # inside the alarm itself. Same cure the `python/tests/gates` step
          # above already uses.
          set +e
          python3 -m pytest tests/gates/test_planner_relocation_freshness.py::test_relocated_planner_modules_match_the_pinned_sdk_audit -v 2>&1 | tee /tmp/relocation-alarm.log
          set -e
          if ! grep -qF "test_planner_relocation_freshness.py::test_relocated_planner_modules_match_the_pinned_sdk_audit PASSED" /tmp/relocation-alarm.log; then
            echo "::warning::tan/planner/ has not been re-audited against alp-sdk ${{ steps.sdk_ref.outputs.ref }}, OR this alarm could not run at all -- either scripts/alp_orchestrate DIFFERS from the pinned audit commit, or ALP_SDK_ROOT did not resolve and the test SKIPPED. Read the pytest output above to tell which. The gate compares hashes, not history, so it does not say which side moved. Non-blocking by design: diff and port the delta, then re-pin PINNED_HASHES/PINNED_SDK_COMMIT in python/tests/gates/test_planner_relocation_freshness.py."
          fi
          exit 0

      # The HAND-PORT half of the same alarm, which did not exist (tan-cli#500).
      #
      # `test_hand_ported_planner_modules_match_their_pinned_sdk_source` is
      # structurally incapable of detecting upstream drift as wired: the
      # `resolve hand-port audit commit` step greps HAND_PORT_PINNED_SDK_COMMIT
      # out of the gate file and clones alp-sdk at exactly that SHA, so the
      # always-run job compares the pin's tree against hashes taken FROM the
      # pin's tree. It can fail on table self-inconsistency and on nothing else.
      # NO DRIFT COUNT IS QUOTED HERE ON PURPOSE. An earlier revision said
      # "three of the nine pinned sources had moved" -- both numbers taken from
      # tan-cli#500's report and both already wrong when this landed:
      # HAND_PORT_HASHES held TEN entries by then (`da72634` added
      # `scripts/alp_template.py`), and the same commit re-pinned to
      # `7d58ef32`, which zeroed the drift the "three" described. A count in a
      # comment measures the day it was typed and nothing after it. The test
      # names the files that actually moved; read that instead.
      #
      # Its sibling above already has the missing half -- a live-oracle arm --
      # and was scoped to exclude this test precisely because THIS step's root
      # was not bound there. So bind it here, to the LIVE checkout rather than
      # the frozen audit one, and the comparison finally has two different
      # trees in it.
      #
      # Same three deliberate constraints as its sibling, and for the same
      # reasons argued above: dispatch ONLY (on a `pull_request` run `alp-sdk`
      # is PINNED_SDK_TAG, which may legitimately sit behind the audit commit,
      # so the comparison would answer nothing and fire on every PR),
      # `continue-on-error`, and a `::warning::` rather than a red X. The
      # blocking question belongs to tan-cli#509, not to this step.
      #
      # NOT a replacement for the always-run job's version of this test: that
      # one still proves the table is internally consistent, which is the check
      # that catches a mis-typed hash. This one catches the other side.
      - name: hand-port freshness vs live alp-sdk (alarm, warn only)
        if: github.event_name == 'repository_dispatch'
        continue-on-error: true
        working-directory: python
        env:
          ALP_SDK_HAND_PORT_ROOT: ${{ github.workspace }}/alp-sdk
        run: |
          # `<nodeid> PASSED`, not rc -- see the sibling step above for why.
          # `_resolve_hand_port_sdk_root()` skips when ALP_SDK_HAND_PORT_ROOT
          # does not resolve, and a skip is rc=0: keying on rc made this alarm
          # report nothing at all in exactly the case it must shout about.
          set +e
          python3 -m pytest tests/gates/test_planner_relocation_freshness.py::test_hand_ported_planner_modules_match_their_pinned_sdk_source -v 2>&1 | tee /tmp/hand-port-alarm.log
          set -e
          if ! grep -qF "test_planner_relocation_freshness.py::test_hand_ported_planner_modules_match_their_pinned_sdk_source PASSED" /tmp/hand-port-alarm.log; then
            echo "::warning::the HAND-PORTED planner modules no longer match their sources at alp-sdk ${{ steps.sdk_ref.outputs.ref }}, OR this alarm could not run -- either a source listed in HAND_PORT_HASHES moved upstream, or ALP_SDK_HAND_PORT_ROOT did not resolve and the test SKIPPED. Read the pytest output above to tell which; it names the file(s). The always-run job cannot see the drift case: it binds ALP_SDK_HAND_PORT_ROOT to HAND_PORT_PINNED_SDK_COMMIT, so it compares the pin against itself. Non-blocking by design: port the delta, then re-pin HAND_PORT_PINNED_SDK_COMMIT/HAND_PORT_HASHES in python/tests/gates/test_planner_relocation_freshness.py. NOTE tan's copy may be AHEAD of the pin rather than behind -- a forward-port that lands in tan before the pin moves reads identically to upstream drift here -- so diff before assuming which side owes the change."
          fi
          exit 0

      # THE THIRD PIN'S ALARM (tan-cli#761). Until this step existed,
      # `STRICT_LOADERS_PINNED_SDK_COMMIT` was the only one of the three pins
      # with no live-vs-`dev` counterpart, and its always-run sibling
      # (`test_strict_loaders_matches_its_pinned_sdk_source`, asserted PASSED
      # by node id above) is a TAUTOLOGY on its own: the `resolve strict-loaders
      # audit commit` / `clone alp-sdk at the strict-loaders audit commit`
      # steps check out alp-sdk at the very SHA the hash was taken from, so the
      # only failure that check can produce is a hand-typed hash typo. Real
      # upstream drift in `scripts/strict_loaders.py` was unreachable by
      # anything in this file.
      #
      # THE DISPATCH ALARM IS THE REAL DRIFT SIGNAL -- for all three pins, not
      # just this one. Every one of the three always-run assertions binds its
      # root to its OWN pin and therefore compares a pin against itself; each
      # proves its table is internally consistent (the mis-typed-hash case) and
      # nothing about whether upstream moved. A green `pull_request` run is
      # NOT drift coverage, and reading it as such is the specific mistake this
      # comment exists to prevent. Only `repository_dispatch` runs bind
      # `${{ github.workspace }}/alp-sdk` -- the ref alp-sdk just pushed -- and
      # only these three warn-only steps look at it.
      #
      # Warn, not fail, and deliberately so: this pin is FROZEN at the commit
      # that introduced alp-sdk#1127 (see the gate file's own STRICT_LOADERS_*
      # block), so a difference here means "upstream moved, re-audit the
      # hand-port", never "this PR is broken". Whether the warn-only posture
      # should change at all is tan-cli#509's decision, not this step's.
      #
      # Costs nothing today: `scripts/strict_loaders.py` has had exactly one
      # commit in alp-sdk's history and live `dev` still hashes to
      # STRICT_LOADERS_HASH. That is the argument FOR adding it now rather than
      # after -- the thing it guards is a security-shaped hand-port (the
      # duplicate-key-rejecting loaders wired into `tan/planner/loader.py`'s
      # `_load_yaml`/`_load_json` to close the silent-SKU-retarget hazard), so
      # a silent divergence re-opens that hazard in tan while alp-sdk believes
      # it is closed.
      - name: strict-loaders freshness vs live alp-sdk (alarm, warn only)
        if: github.event_name == 'repository_dispatch'
        continue-on-error: true
        working-directory: python
        env:
          ALP_SDK_STRICT_LOADERS_ROOT: ${{ github.workspace }}/alp-sdk
        run: |
          # `<nodeid> PASSED`, not rc -- see the two sibling steps above for
          # why. The test skips when ALP_SDK_STRICT_LOADERS_ROOT does not
          # resolve, and a skip is rc=0.
          set +e
          python3 -m pytest tests/gates/test_planner_relocation_freshness.py::test_strict_loaders_matches_its_pinned_sdk_source -v 2>&1 | tee /tmp/strict-loaders-alarm.log
          set -e
          if ! grep -qF "test_planner_relocation_freshness.py::test_strict_loaders_matches_its_pinned_sdk_source PASSED" /tmp/strict-loaders-alarm.log; then
            echo "::warning::scripts/strict_loaders.py no longer matches STRICT_LOADERS_HASH at alp-sdk ${{ steps.sdk_ref.outputs.ref }}, OR this alarm could not run -- either the file moved upstream, or ALP_SDK_STRICT_LOADERS_ROOT did not resolve and the test SKIPPED. Read the pytest output above to tell which. The always-run job cannot see the drift case: it binds ALP_SDK_STRICT_LOADERS_ROOT to STRICT_LOADERS_PINNED_SDK_COMMIT, so it compares the pin against itself. Non-blocking by design: re-audit tan/planner/strict_loaders.py against the new upstream, then re-pin STRICT_LOADERS_PINNED_SDK_COMMIT/STRICT_LOADERS_HASH in python/tests/gates/test_planner_relocation_freshness.py. This one guards a security-shaped hand-port (alp-sdk#1127's duplicate-key-rejecting loaders, tan-cli#485) -- diff before assuming the divergence is cosmetic."
          fi
          exit 0

  # seam2 -- the half of ADR-0020's parity contract seam1 cannot reach.
  #
  # seam1 proves the PLAN's SHAPE is stable. It never runs tan and never
  # compiles anything, so it cannot catch an executor that reads a correct plan
  # and does the wrong thing with it. seam2 closes that: alp-sdk plans it, TAN
  # executes it, and the artefact is a real cross-compiled ARM ELF.
  #
  # The build MUST go through `tan build`, not plain `west` -- routing around
  # tan would test Zephyr and assert nothing about the seam.
  #
  # This was a documented no-op placeholder until the toolchain recipe landed,
  # on the stated grounds that it "needs a Linux runner with the toolchain
  # installed". alp-sdk#976 disproved that: the Zephyr SDK installs on a stock
  # ubuntu-latest runner in-job. The blocker had expired.
  #
  # A fourth stage used to boot the ELF under Renode. Renode is retired
  # repo-wide -- `tan renode` is gone from this repo, and alp-sdk deleted its
  # four `pr-renode-*` workflows and the `aen-sim-vision` example -- so that
  # stage went with it. Stages 1-3 still cover seam 2's own definition: "a
  # plan that looks right but doesn't build, or an executor that mishandles a
  # correct plan" (tests/parity/README.md).
  seam2:
    name: "seam2 -- materialise + real build"
    # Skipped only under release.yml's `python_only: true` call -- see
    # seam1-plan-shape's `if:` comment above for why `github.event_name`
    # cannot express this.
    if: ${{ !inputs.python_only }}
    runs-on: ubuntu-latest
    # Measured 3 minutes (run 32039025829), but this job pays for `west init -l`
    # + `west update` + a Zephyr SDK install + a real `tan build`, all of it
    # network-bound. Same 60-minute budget
    # getting-started.yml:94 and release-combination.yml:176 already give the
    # comparable toolchain-and-build legs.
    timeout-minutes: 60
    steps:
      - name: checkout tan-cli
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # On a `repository_dispatch` the workflow FILE has to come from the
          # DEFAULT branch -- that is GitHub's rule and why #195 put the trigger
          # on `main`. But what we CHECK OUT and test is a separate choice, and
          # the default (`main`) is the wrong one here.
          #
          # Everything that tracks alp-sdk lands on `dev`: the vendored scaffold
          # fixtures, PINNED_SDK_TAG, the comparator. `main` only receives them
          # at a release. So testing `main` against the newest alp-sdk is red for
          # the entire interval between releases, and its redness says nothing
          # actionable -- it reports "the last release predates this SDK change",
          # which is true by construction and not a defect.
          #
          # The question worth asking on a dispatch is "can tan's integration
          # branch consume this alp-sdk change?", so test `dev`. A `pull_request`
          # run keeps checkout's default (the PR head) by passing an empty ref.
          ref: ${{ github.event_name == 'repository_dispatch' && 'dev' || '' }}

      # Env var + allow-list, not interpolation -- see seam1's comment above.
      - name: resolve alp-sdk ref
        id: sdk_ref
        shell: bash
        env:
          PAYLOAD_REF: ${{ github.event.client_payload.sdk_ref }}
        run: |
          set -euo pipefail
          dispatched="${PAYLOAD_REF:-}"
          ref="${dispatched:-${PINNED_SDK_TAG}}"
          # NOT `grep -qE`. grep is LINE-oriented, so `printf '%s' "$ref" |
          # grep -qE '^...$'` returns 0 when ANY line matches: a payload of
          # `dev\nref=attacker` passes on its first line, and the second line
          # then lands in `$GITHUB_OUTPUT` as its own key -- the precise
          # injection this guard exists to refuse. `case` tests the WHOLE
          # string, newline included. Measured both ways before choosing.
          case "${ref}" in
            ""|[!A-Za-z0-9]*|*[!A-Za-z0-9._/-]*)
              echo "::error::refusing an alp-sdk ref that is not a plain git ref: ${ref}"
              exit 1 ;;
          esac
          if [ "${#ref}" -gt 201 ]; then
            echo "::error::refusing an alp-sdk ref longer than 201 characters: ${ref}"
            exit 1
          fi
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          if [ -n "${dispatched}" ]; then
            echo "::notice::seam2 DISPATCHED by alp-sdk -- building against the ref that just landed: ${ref}"
          else
            echo "::notice::seam2 building against the pinned alp-sdk ref: ${ref}"
          fi

      - name: clone alp-sdk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: alplabai/alp-sdk
          ref: ${{ steps.sdk_ref.outputs.ref }}
          path: alp-sdk

      # Pinned, NOT `3.x`: `python/pyproject.toml` floors at 3.12 and the
      # `tan` under test IS this interpreter now (tan-cli#269 retired the
      # self-contained cargo binary), so a floating newest-3.x would decide
      # what the seam executes.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: host deps
        run: |
          set -euo pipefail
          bash scripts/ci/apt-bounded.sh update
          bash scripts/ci/apt-bounded.sh install -y --no-install-recommends \
              ninja-build device-tree-compiler gperf ca-certificates curl gnupg xz-utils

      - name: west + SDK python deps
        run: python3 -m pip install --upgrade pip west pyyaml jsonschema pyelftools

      # The `tan generate` live-run e2e that used to sit here was
      # `crates/tan-cli/tests/live_run_generate.rs`, deleted with the rest of
      # `crates/` by tan-cli#269. Nothing is lost by dropping the step: its
      # whole claim -- spawn a REAL `tan generate` against a pinned alp-sdk
      # checkout and assert what lands on disk -- is superseded, and widened,
      # by `python/tests/parity/test_planner_emit_parity.py`, which spawns
      # `tan generate --output <path>` once per `board.yaml` in the SDK's
      # `examples/` and byte-compares the written file against
      # `alp_project.py`'s own front door, across all twelve relocated emit
      # targets. That module runs in this file's own `python-tests` matrix,
      # on all three platforms, with `ALP_SDK_ROOT` bound to this same
      # `PINNED_SDK_TAG`. Do not re-add a narrower shell copy of it here.

      # Zephyr itself. `west init -l` against alp-sdk's own manifest is what a
      # customer's `tan bootstrap` does, so the tree under test is the pinned
      # one rather than whatever Zephyr happens to be newest.
      - name: west workspace (alp-sdk manifest)
        run: |
          set -euo pipefail
          west init -l alp-sdk
          west update --narrow -o=--depth=1
          west zephyr-export

      # Single source for the SDK pin: alp-sdk's own metadata/toolchains.json,
      # gated on the alp-sdk side by check_toolchain_lock.py.
      - name: read Zephyr SDK pin
        run: |
          set -euo pipefail
          # Bind to plain locals before formatting. Inlining the subscripts as
          # f"...{sdk[\"version\"]}..." needs backslash escapes inside the
          # f-string expression, which is a SyntaxError -- and it is what broke
          # this step on its first run. Keep the plain locals; do not
          # re-compress this into inline f-string subscripts.
          python3 -c '
          import json
          d = json.load(open("alp-sdk/metadata/toolchains.json"))
          sdk = d["zephyrSdk"]
          art = next(a for a in sdk["artifacts"]
                     if a["host"] == "linux-x86_64" and a["component"] == "minimal-sdk")
          version = sdk["version"]
          url = sdk["baseUrl"] + art["filename"]
          sha256 = art["sha256"]
          print(f"ZEPHYR_SDK_VERSION={version}")
          print(f"ZEPHYR_SDK_URL={url}")
          print(f"ZEPHYR_SDK_SHA256={sha256}")
          ' >> "$GITHUB_ENV"

      - name: install Zephyr SDK (arm-zephyr-eabi)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/zephyr-sdk.tar.xz "${ZEPHYR_SDK_URL}"
          ACTUAL="$(sha256sum /tmp/zephyr-sdk.tar.xz | awk '{print $1}')"
          if [ "${ACTUAL}" != "${ZEPHYR_SDK_SHA256}" ]; then
            echo "::error::Zephyr SDK sha256 mismatch: expected ${ZEPHYR_SDK_SHA256}, got ${ACTUAL}"
            exit 1
          fi
          mkdir -p "$HOME/zephyr-sdk"
          tar -xJf /tmp/zephyr-sdk.tar.xz -C "$HOME/zephyr-sdk" --strip-components=1
          "$HOME/zephyr-sdk/setup.sh" -t arm-zephyr-eabi -c
          echo "ZEPHYR_SDK_INSTALL_DIR=$HOME/zephyr-sdk" >> "$GITHUB_ENV"

      # `tan` under test is the PYTHON package, installed from this checkout
      # (tan-cli#269). `pip install -e ./python` puts the `tan` console script
      # on PATH, which is what the steps below invoke -- no absolute path into
      # a build directory any more, and no second copy of the resolution rule.
      - name: install tan (the executor under test)
        run: python3 -m pip install -e ./python

      # ---- the seam itself -------------------------------------------------

      # 1. MATERIALISE. tan reads alp-sdk's `--emit build-plan` and writes the
      #    per-slice artefacts. Failing here means the plan and the executor
      #    disagree about the plan's own contents -- the drift seam1 is blind to.
      # `build --materialise` is the primitive seam2's own definition names:
      # "consume the plan, write its generated files (shared artefacts +
      # per-slice config) to disk". Not `generate`, which emits a single target
      # rather than the plan's whole artefact set.
      #
      # Verified locally against alp-sdk 3ffd8774 before this landed -- it needs
      # no toolchain, so it is the one seam2 stage reproducible off-runner:
      #   ok=true, data.written = [build/generated/alp/system_ipc.h,
      #   build/generated/dts-reservations.dtsi, build/generated/dts-partitions.dtsi,
      #   build/a32_cluster-yocto/local.conf, build/m55_he-zephyr/alp.conf,
      #   build/m55_hp-zephyr/alp.conf]
      - name: materialise (tan build --materialise)
        working-directory: alp-sdk/examples/peripheral-io/hello-world
        env:
          ZEPHYR_BASE: ${{ github.workspace }}/zephyr
        run: |
          set -euo pipefail
          tan \
              --sdk-root "${GITHUB_WORKSPACE}/alp-sdk" \
              --format json build --materialise > /tmp/seam2-materialise.json
          python3 -c '
          import json, sys
          e = json.load(open("/tmp/seam2-materialise.json"))
          if not e.get("ok"):
              print("::error::seam2 materialise: tan reported not-ok:",
                    json.dumps(e.get("issues"), indent=2))
              sys.exit(1)
          written = (e.get("data") or {}).get("written") or []
          if not written:
              print("::error::seam2 materialise: `data.written` is empty -- tan "
                    "reported success having produced no artefacts. An empty "
                    "write list is exactly the silent-pass shape this seam exists "
                    "to catch, so it is a failure here, not a pass.")
              sys.exit(1)
          print("materialised", len(written), "artefacts:")
          for w in written: print("   ", w)
          '

      # 2. REAL BUILD, through tan. Not `west` -- routing around the executor
      #    would test Zephyr and assert nothing about the seam.
      - name: real build (tan build)
        working-directory: alp-sdk/examples/peripheral-io/hello-world
        env:
          ZEPHYR_BASE: ${{ github.workspace }}/zephyr
        run: |
          set -euo pipefail
          tan \
              --sdk-root "${GITHUB_WORKSPACE}/alp-sdk" \
              build --native 2>&1 | tee /tmp/seam2-build.log
          # `tee` would mask a non-zero tan exit without this; the whole point
          # of the job is that a failed build fails the gate.
          rc="${PIPESTATUS[0]}"
          if [ "$rc" -ne 0 ]; then
            echo "::error::seam2 real build: tan build exited ${rc}."
            exit "$rc"
          fi

      # 3. The artefact must EXIST, and be an ARM image. `tan build` reporting
      #    ok while producing no ELF is exactly the #97 defect class, one layer
      #    up; producing a HOST binary is that same defect reaching the
      #    artefact.
      # Pick the M55-HP slice EXPLICITLY. `-print -quit` takes whichever slice
      # `find` reaches first, which on the first run was m55_he -- the wrong
      # core. The selection cannot be whichever-comes-first.
      - name: locate the built ELF (m55_hp slice)
        run: |
          set -euo pipefail
          BUILD="${GITHUB_WORKSPACE}/alp-sdk/examples/peripheral-io/hello-world/build"
          ELF="${BUILD}/m55_hp-zephyr/build/zephyr/zephyr.elf"
          if [ ! -f "${ELF}" ]; then
            echo "::error::seam2: tan build reported success but produced no ${ELF}. Tree:"
            find "${BUILD}" -maxdepth 3 -type d || true
            find "${BUILD}" -name 'zephyr.elf' || true
            exit 1
          fi
          file "${ELF}"
          # A host x86-64 binary here is the #97 defect reaching the artefact.
          if ! file "${ELF}" | grep -q "ARM"; then
            echo "::error::seam2: ${ELF} is not an ARM image -- a zephyr slice produced a host binary."
            exit 1
          fi
          echo "seam2: materialise -> tan build -> ARM ELF, all asserted."

      - name: upload seam2 logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seam2-logs
          path: |
            /tmp/seam2-materialise.json
            /tmp/seam2-build.log
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # tan-cli#A6: until this job existed, NO workflow in either repo ran `tan
  # bootstrap`, `tan init` or `tan build` at all -- grepping .github for them
  # returned three COMMENT lines and no `run:` step. seam2 above hand-assembles
  # the workspace itself (`west init -l` / `west update` / `west zephyr-export`)
  # and then builds an EXISTING example, so it exercises the loader seam but
  # never the commands a customer actually types. Every regression in the venv
  # phase, the west phase, the prerequisite gate or the workspace guard reached
  # customers with a green board.
  #
  # This job is the customer path and nothing else: bootstrap -> doctor ->
  # init -> build, in that order, on a machine that starts with none of it.
  first-blink:
    name: "first blink -- tan bootstrap -> init -> build"
    # Skipped only under release.yml's `python_only: true` call -- see
    # seam1-plan-shape's `if:` comment above for why `github.event_name`
    # cannot express this.
    if: ${{ !inputs.python_only }}
    runs-on: ubuntu-latest
    # Measured 2 minutes (run 32039025829). 60 rather than 30 for the same
    # reason getting-started.yml:94 uses 60 on the job with this exact shape:
    # `tan bootstrap` -> `init` -> a real toolchain-backed build, where the
    # slow parts are downloads whose bad day is much worse than their median.
    timeout-minutes: 60
    steps:
      - name: checkout tan-cli
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'repository_dispatch' && 'dev' || '' }}

      # Env var + allow-list, not interpolation -- see seam1's comment above.
      # This one was DOUBLE-quoted, so a payload's `$(...)` ran outright.
      - name: resolve alp-sdk ref
        id: sdk_ref
        shell: bash
        env:
          PAYLOAD_REF: ${{ github.event.client_payload.sdk_ref }}
        run: |
          set -euo pipefail
          ref="${PAYLOAD_REF:-${PINNED_SDK_TAG}}"
          # NOT `grep -qE`. grep is LINE-oriented, so `printf '%s' "$ref" |
          # grep -qE '^...$'` returns 0 when ANY line matches: a payload of
          # `dev\nref=attacker` passes on its first line, and the second line
          # then lands in `$GITHUB_OUTPUT` as its own key -- the precise
          # injection this guard exists to refuse. `case` tests the WHOLE
          # string, newline included. Measured both ways before choosing.
          case "${ref}" in
            ""|[!A-Za-z0-9]*|*[!A-Za-z0-9._/-]*)
              echo "::error::refusing an alp-sdk ref that is not a plain git ref: ${ref}"
              exit 1 ;;
          esac
          if [ "${#ref}" -gt 201 ]; then
            echo "::error::refusing an alp-sdk ref longer than 201 characters: ${ref}"
            exit 1
          fi
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "::notice::first-blink building against alp-sdk ref: ${ref}"

      # Into `ws/alp-sdk`, NOT `alp-sdk`, and the nesting is load-bearing.
      # `west init -l <checkout>` forces the west topdir to be the checkout's
      # PARENT (alp-sdk#769), so tan-cli#185's workspace guard refuses to
      # bootstrap when that parent holds anything besides the checkout. At
      # $GITHUB_WORKSPACE the parent also holds the whole tan-cli tree, so a
      # flat `path: alp-sdk` would make `tan bootstrap --non-interactive` exit
      # 2 by design. A dedicated parent is what the guard asks for and what
      # README tells customers to do -- this job runs the documented layout.
      - name: clone alp-sdk into a dedicated workspace parent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: alplabai/alp-sdk
          ref: ${{ steps.sdk_ref.outputs.ref }}
          path: ws/alp-sdk

      # Pinned, NOT `3.x`, for the same reason seam2 pins it: `tan` IS this
      # interpreter now (tan-cli#269), and `python/pyproject.toml` floors at
      # 3.12.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Deliberately NOT pip-installing west here: `tan bootstrap` creating the
      # venv and installing west into it is one of the things under test.
      # pkg-config + libusb-1.0-0-dev + libudev-dev are NOT decoration: this job's own second
      # run proved `hidapi` builds from source inside bootstrap's Zephyr
      # requirements install and fails without them
      # (`Exception: pkg-config package 'libusb-1.0 >= 1.0.9' not found`).
      # bootstrap warns and continues by design, so the workspace looks
      # complete and `tan init` dies later instead. Installing them here keeps
      # the rest of the customer path under test; the warning itself is
      # asserted below, so removing them turns this job red rather than green.
      - name: host deps
        run: |
          set -euo pipefail
          bash scripts/ci/apt-bounded.sh update
          bash scripts/ci/apt-bounded.sh install -y --no-install-recommends \
              ninja-build device-tree-compiler gperf ca-certificates curl xz-utils \
              pkg-config libusb-1.0-0-dev libudev-dev

      # `tan` under test is the PYTHON package from this checkout
      # (tan-cli#269), on PATH as the `tan` console script. Installed with
      # `--user`-free plain pip into the runner's own interpreter, NOT into
      # the workspace venv `tan bootstrap` is about to create -- that venv is
      # the thing under test, and installing tan inside it would let the
      # bootstrap step's own product decide which tan runs.
      - name: install tan (the customer's binary)
        run: python3 -m pip install -e ./python

      # THE STEP THAT DID NOT EXIST. Exit 0 is necessary but not sufficient --
      # a bootstrap that "succeeds" without creating the workspace is exactly
      # the silent failure this job is for, so the artefacts are asserted.
      - name: tan bootstrap (the customer's first command)
        working-directory: ws/alp-sdk
        run: |
          set -euo pipefail
          tan bootstrap --non-interactive \
              2>&1 | tee /tmp/first-blink-bootstrap.log
          for p in ../.west/config ../.venv ../zephyr ../modules; do
            if [ ! -e "$p" ]; then
              echo "::error::tan bootstrap exited 0 but did not create $p"
              exit 1
            fi
          done
          # tan-cli#220's verdict, end to end. The rule itself is unit-tested
          # (`verdict`), but `run` spawns real processes and cannot be driven
          # from a unit test, so nothing else proves `run` USES it -- proven by
          # mutation: replacing the call with a hardcoded success left the whole
          # suite green. This step is what covers that wiring. A runner with the
          # native headers installed is the clean path, so `complete.` is the
          # correct verdict here and its ABSENCE would mean the rule fired when
          # it should not have.
          if ! grep -qF 'bootstrap: complete.' /tmp/first-blink-bootstrap.log; then
            echo "::error::a clean bootstrap did not report 'bootstrap: complete.' (#220 verdict inverted?)"
            exit 1
          fi
          if grep -qF 'bootstrap: INCOMPLETE' /tmp/first-blink-bootstrap.log; then
            echo "::error::a clean bootstrap reported INCOMPLETE -- a dependency install failed on a runner that has the headers"
            exit 1
          fi
          echo "bootstrap created .west/, .venv/, zephyr/ and modules/, and reported complete."

      # BEFORE the toolchain exists, doctor must FAIL and must say why. This is
      # the half a customer hits first: bootstrap has just succeeded, and the
      # host still cannot build. Measured on this job's own first run -- doctor
      # exits 4 here, because #159/#166 made a missing Zephyr SDK a hard Fail
      # rather than a warning. Asserting the exit alone would pass for any
      # failing check, so the zephyrSdk row itself is asserted.
      - name: tan doctor reports the missing toolchain (expected to fail)
        working-directory: ws/alp-sdk
        run: |
          set -euo pipefail
          set +e
          tan doctor --format json \
              > /tmp/first-blink-doctor-before.json
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "::error::doctor exited 0 with no Zephyr SDK installed -- the hard Fail from #159/#166 is gone"
            exit 1
          fi
          python3 -c '
          import json, sys
          d = json.load(open("/tmp/first-blink-doctor-before.json"))
          checks = {c["name"]: c for c in d["data"]["checks"]}
          row = checks.get("zephyrSdk")
          if row is None:
              sys.exit("zephyrSdk missing from checks[]; got: " + ", ".join(sorted(checks)))
          status = row["status"]
          if status != "fail":
              sys.exit("zephyrSdk status is " + status + ", expected fail")
          print("doctor correctly fails on the missing toolchain:", row["detail"])
          '
          echo "doctor exit was ${code} (non-zero), and zephyrSdk is a hard fail."

      # Pinned + sha256-verified, same source of truth as seam2: alp-sdk's own
      # metadata/toolchains.json, never a hardcoded version (see that file's
      # comment on check_toolchain_lock.py).
      - name: read Zephyr SDK pin
        run: |
          set -euo pipefail
          python3 -c '
          import json
          d = json.load(open("ws/alp-sdk/metadata/toolchains.json"))
          sdk = d["zephyrSdk"]
          art = next(a for a in sdk["artifacts"]
                     if a["host"] == "linux-x86_64" and a["component"] == "minimal-sdk")
          version = sdk["version"]
          url = sdk["baseUrl"] + art["filename"]
          sha256 = art["sha256"]
          print(f"ZEPHYR_SDK_VERSION={version}")
          print(f"ZEPHYR_SDK_URL={url}")
          print(f"ZEPHYR_SDK_SHA256={sha256}")
          ' >> "$GITHUB_ENV"

      - name: install Zephyr SDK (arm-zephyr-eabi)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/zephyr-sdk.tar.xz "${ZEPHYR_SDK_URL}"
          ACTUAL="$(sha256sum /tmp/zephyr-sdk.tar.xz | awk '{print $1}')"
          if [ "${ACTUAL}" != "${ZEPHYR_SDK_SHA256}" ]; then
            echo "::error::Zephyr SDK sha256 mismatch: expected ${ZEPHYR_SDK_SHA256}, got ${ACTUAL}"
            exit 1
          fi
          mkdir -p "$HOME/zephyr-sdk"
          tar -xJf /tmp/zephyr-sdk.tar.xz -C "$HOME/zephyr-sdk" --strip-components=1
          "$HOME/zephyr-sdk/setup.sh" -t arm-zephyr-eabi -c
          echo "ZEPHYR_SDK_INSTALL_DIR=$HOME/zephyr-sdk" >> "$GITHUB_ENV"

      # AFTER the install, the same command must now pass. Without this half the
      # job would only prove doctor can fail, never that the remedy it names
      # actually resolves the thing it complained about.
      - name: tan doctor passes once the toolchain is installed
        working-directory: ws/alp-sdk
        run: |
          set -euo pipefail
          tan doctor --format json \
              > /tmp/first-blink-doctor-after.json
          python3 -c '
          import json, sys
          d = json.load(open("/tmp/first-blink-doctor-after.json"))
          row = {c["name"]: c for c in d["data"]["checks"]}["zephyrSdk"]
          if row["status"] != "pass":
              sys.exit("zephyrSdk still " + row["status"] + " after install: " + row["detail"])
          print("zephyrSdk passes after the pinned install:", row["detail"])
          '

      # `--from-example` is the path tan-cli#164 exists to make discoverable;
      # `peripheral-io/hello-world` is the id that issue names as the one a
      # customer could not find because `tan examples` printed only a count.
      - name: tan init --from-example
        working-directory: ws
        run: |
          set -euo pipefail
          # NO `--sdk-root`, deliberately. This step is the regression test for
          # tan-cli#218: run from the workspace topdir with `alp-sdk/` sitting
          # right there, `tan init` used to report "alp-sdk root is unresolved"
          # because discovery checked the root, its siblings and its ancestors
          # but never a CHILD (util.rs `discover_sdk_root`). Passing the flag
          # here again would hide the bug it was found by.
          tan init \
              --from-example peripheral-io/hello-world \
              --name my-app --non-interactive
          test -f my-app/board.yaml || { echo "::error::tan init wrote no board.yaml"; exit 1; }

      - name: tan build
        working-directory: ws/my-app
        run: |
          set -euo pipefail
          tan build 2>&1 | tee /tmp/first-blink-build.log
          echo "first blink: bootstrap -> doctor -> init -> build, all from the commands a customer types."

      - name: upload first-blink logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: first-blink-logs
          path: |
            /tmp/first-blink-bootstrap.log
            /tmp/first-blink-doctor-before.json
            /tmp/first-blink-doctor-after.json
            /tmp/first-blink-build.log
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # `python/tests` ran on NO CI machine at all before this job (see the collect
  # counts a few lines down -- collection depends on ALP_SDK_ROOT and
  # --ignore=tests/gates; this job runs with both bound). `ci.yml` ALSO runs
  # its own `python` job (`python -m pytest tests -q`, no --ignore) -- grep for
  # `pytest` in that file does NOT return zero hits -- but that job only binds
  # `ALP_SDK_ROOT` when called with `sdk_parity: true`, which release.yml's
  # `gates` job does not do (see that job's own comment for the open
  # divergence), so this job's per-push, always-bound run is not redundant
  # with it. BEFORE d9a22c0 no slice of
  # insertions-only (87/0 on this file): it CREATED the gate step rather than
  # narrowing an existing one. SINCE d9a22c0/ecab9da, `tests/gates` is the only
  # slice any workflow invokes (the five gate files armed by seam1
  # above). Every OTHER test in the port -- unit, command, oracle-parity,
  # planner byte-parity, INCLUDING the flash-path refusals standing between a
  # customer and an unrecoverable MRAM write -- merged with zero gate value: a
  # regression in any of them could not turn CI red.
  #
  # Wired with BOTH oracles armed, not the bare interpreter alone, because a
  # job that leaves most of its tests silently skipped reports green having
  # checked nothing -- worse than no job:
  #   * `ALP_SDK_ROOT` -- this job's own alp-sdk checkout, the same
  #     PINNED_SDK_TAG seam1/seam2 already use, so the planner/conformance
  #     suites execute instead of self-skipping. Also changes what pytest
  #     COLLECTS, not just what runs: several suites parametrize over the
  #     checkout's own `metadata/**`/`examples/**`, so an unset root
  #     under-collects too.
  #
  #     NO absolute collected count is recorded here, deliberately. One prior
  #     revision of this comment cited a single figure that stopped matching
  #     either input; the figures that replaced IT then moved by 26 within a
  #     single session. An absolute here rots every time either tree moves, so
  #     only the stable facts are kept: binding `ALP_SDK_ROOT` strictly
  #     INCREASES collection, and `--ignore=tests/gates` removes exactly 8
  #     tests (the five gate files) -- the one figure that does not rot,
  #     because it depends on this repo alone. Need an absolute? Measure it:
  #     `python -m pytest --collect-only -q` from `python/`. Do not write the
  #     answer back into this comment.
  #   The SECOND oracle this job used to arm -- a locally built Rust `tan`,
  #   auto-discovered off `target/{release,debug}/` -- is gone with `crates/`
  #   (tan-cli#269). Nothing in the suite resolves or spawns a Rust binary any
  #   more, so `ALP_SDK_ROOT` is the only binding left that changes what this
  #   job measures.
  #
  # `--ignore=tests/gates`: NOT because those tests don't matter, but because
  # they already run, correctly, in seam1 above -- all five files, each bound
  # to the specific ref that makes its verdict mean something: the frozen audit
  # commit for four of them, the live checkout for
  # `test_jlink_aen_device_freshness`, plus a live warn-only re-run of
  # `test_planner_relocation_freshness` on dispatch. Running them again here
  # against a THIRD, uncoordinated ref would reintroduce the exact
  # false-positive d9a22c0/ecab9da exists to prevent (PINNED_SDK_TAG can sit on
  # either side of the audit commit with no guarantee the two agree).
  #
  # No Zephyr SDK / west workspace here -- that stays seam2/
  # first-blink's job. `native_sim` e2e and the west-real-build parity cases
  # already self-skip, loudly, with a named reason when the toolchain is
  # absent (see their own docstrings); this job proves that skip still fires
  # for the right reason on all three platforms, not that it never fires.
  #
  # The `monitor` extra is installed, not left absent: without pyserial,
  # `_run_monitor`'s own `import serial` precheck (tan/commands/monitor_cmd.py)
  # raises before six `test_monitor_command.py` cases ever reach the
  # miniterm-spawn/exit-code behaviour they name, so every one of them fails as
  # `monitor.pyserial-missing` instead. Installing the extra is cheaper than
  # rewriting those cases to skip, and it is the only way any of `tan
  # monitor`'s non-hardware-gated logic gets checked in CI at all.
  #
  # Matrix runs all three platforms for the reason ci.yml's retired Rust
  # `test` job gave: `tan`'s path handling (os.pathsep env append, `.venv`
  # discovery, `.exe` suffixes) differs per host. With that job gone
  # (tan-cli#269) this matrix is the ONLY cross-platform check in the repo.
  #
  # SHARDED four ways per OS. Measured on a real green run
  # (31532426909): the pytest step alone is 1550s/1353s/1010s of a
  # 26m/22m/17m job on windows/ubuntu/macos respectively -- ~97% of the wall
  # clock is this one step, and everything else in the job (checkout, SDK
  # clone, pip install) is 12-41s, i.e. negligible per-shard overhead. Root
  # cause (not fixed here, sharding is parallelisation only): ~4300 tests
  # spawn a fresh interpreter via subprocess.run/Popen at ~150 call sites to
  # re-exercise `tan` as a customer would invoke it, and process creation is
  # far more expensive on windows-latest than on the other two runners.
  #
  # This job is renamed to `python-tests-shard` and carries `shard` in its
  # matrix -- deliberately NOT the job branch protection requires. GitHub
  # appends every matrix dimension to a job's evaluated `name:`, so adding
  # `shard` to the job protection already pins by string
  # ("python -- pytest across python/ (<os>)", see ci.yml's header, tan-cli#392)
  # would silently rename all three required contexts to something like
  # "python -- pytest across python/ (ubuntu-latest, 1)" -- three phantom
  # contexts protection would wait on FOREVER, since nothing produces the old
  # strings any more. tan-cli#392 already lived through exactly this once
  # (the cargo-job rename at tan-cli#269); this job is named apart from that
  # trap on purpose. The `python-tests` job below reproduces the three pinned
  # strings byte-for-byte and is what protection stays pointed at.
  python-tests-shard:
    name: "python -- pytest shard (${{ matrix.os }} ${{ matrix.shard == 'parity' && 'parity, whole' || format('{0}/4', matrix.shard) }})"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # pytest-shard is 0-INDEXED (--shard-id runs 0..num-shards-1). The
        # matrix values here ARE the --shard-id args passed below, unmodified
        # -- deliberately NOT [1,2,3,4] with a subtraction applied later,
        # which is exactly the shape that makes an off-by-one easy to
        # introduce and easy to miss (one shard would run nothing, another
        # would never run, and the suite would still report green). The job
        # `name:` above therefore shows "0/4".."3/4", not "1/4".."4/4" --
        # a 0-based label that matches the flag it comes from, not a
        # human-friendly renumbering.
        #
        # `parity` is a FIFTH leg, not a fifth shard: it runs `tests/parity`
        # WHOLE while 0..3 shard everything else. It rides this matrix rather
        # than a separate job so the aggregate below still has exactly one
        # `needs:` to check -- adding a second job would mean a second result
        # to roll up, and a missed one there is a required context that goes
        # green while a whole suite did not run.
        shard: [0, 1, 2, 3, parity]
    runs-on: ${{ matrix.os }}
    # 45, not the 30 tan-cli#812 suggested, and the measurement is why. On run
    # 32039025829 the 0..3 legs took 1-3 minutes but the three `parity, whole`
    # legs took 11 (macos), 15 (ubuntu) and 16 (windows); #812's own worst
    # observed whole-workflow wall clock was 22.8 minutes. A 30-minute cap
    # leaves the windows `parity, whole` leg under 2x headroom, and a false
    # timeout HERE lands on a required context -- `python-tests` below fails on
    # anything but `success`, including a cancellation. 45 keeps the property
    # that matters (bounded instead of 360) without putting a required check one
    # slow runner away from red.
    timeout-minutes: 45
    steps:
      - name: checkout tan-cli
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Same rule as every other job in this file -- see seam1's comment.
          ref: ${{ github.event_name == 'repository_dispatch' && 'dev' || '' }}

      # Env var + allow-list, not interpolation -- see seam1's comment above.
      - name: resolve alp-sdk ref
        id: sdk_ref
        shell: bash
        env:
          PAYLOAD_REF: ${{ github.event.client_payload.sdk_ref }}
        run: |
          set -euo pipefail
          ref="${PAYLOAD_REF:-${PINNED_SDK_TAG}}"
          # NOT `grep -qE`. grep is LINE-oriented, so `printf '%s' "$ref" |
          # grep -qE '^...$'` returns 0 when ANY line matches: a payload of
          # `dev\nref=attacker` passes on its first line, and the second line
          # then lands in `$GITHUB_OUTPUT` as its own key -- the precise
          # injection this guard exists to refuse. `case` tests the WHOLE
          # string, newline included. Measured both ways before choosing.
          case "${ref}" in
            ""|[!A-Za-z0-9]*|*[!A-Za-z0-9._/-]*)
              echo "::error::refusing an alp-sdk ref that is not a plain git ref: ${ref}"
              exit 1 ;;
          esac
          if [ "${#ref}" -gt 201 ]; then
            echo "::error::refusing an alp-sdk ref longer than 201 characters: ${ref}"
            exit 1
          fi
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: clone alp-sdk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: alplabai/alp-sdk
          ref: ${{ steps.sdk_ref.outputs.ref }}
          path: alp-sdk

      # tan-cli#509. A SECOND alp-sdk checkout, at the frozen planner-oracle
      # ref -- the same shape as the three audit-commit clones in the seam1 job
      # above (`alp-sdk-planner-audit`, `alp-sdk-hand-port-audit`,
      # `alp-sdk-strict-loaders-audit`), for the same reason: two questions,
      # two refs, one of which must not move.
      #
      # This supplies only the INPUTS -- `examples/**/board.yaml` and
      # `metadata/**`. The expected OUTPUT is checked in, at
      # `python/tests/fixtures/planner_oracle/`, so the comparison survives
      # alp-sdk deleting the planner, rewriting history, or being unreachable.
      # Pinning the inputs too is what keeps a red repairable: the fixture can
      # only ever be regenerated from a pre-#270 ref, so tracked inputs against
      # a freezable-only fixture would be a gate with no repair path.
      #
      # NOT vendored: ADR-0017 / I-26 keeps hardware facts in alp-sdk, and
      # copying `metadata/**` in here would make a second, staling copy of the
      # data whose late binding caused tan-cli#485.
      - name: clone alp-sdk at the frozen planner-oracle commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: alplabai/alp-sdk
          ref: ${{ env.PINNED_PLANNER_ORACLE_SDK_REF }}
          path: alp-sdk-planner-oracle

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: install alp-tan[monitor] + pytest
        shell: bash
        working-directory: python
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -e ".[monitor]" pytest pytest-shard

      # The `python-tests` job below (the one wired into branch protection --
      # see .github/workflows/ci.yml's header for the full tan-cli#392 note and
      # the exact three strings that job's matrix reproduces) only rolls up
      # THIS job's per-shard result; it runs no pytest itself. That note
      # stopped being advisory at tan-cli#269, which deleted the five cargo
      # contexts protection actually requires; this shard matrix (via its
      # aggregate) HAS to be wired in before anything can merge. Nothing in
      # this file can change branch protection; it can only make sure the
      # aggregate is worth requiring, which is what the guard below is for --
      # a shard that silently checked nothing would make the aggregate's
      # "success" meaningless too.
      #
      # The binding is ASSERTED before pytest runs, against the variable
      # actually exported rather than a re-derived path. This job's whole value
      # over ci.yml's `python` job is that it runs the suite with an alp-sdk
      # bound, and `tests/conftest.py`'s `sdk_root()` accepts the root ONLY when
      # `scripts/alp_project.py` is a file under it -- for every other outcome
      # (a renamed variable, a checkout that landed at a different path, a
      # partial clone) it returns `None`, which is a per-module SKIP: exit 0,
      # green, and invisible unless someone reads the skip count. That is the
      # exact "reports green having checked nothing -- worse than no job"
      # failure this job's own header above argues against but nothing
      # enforced. Same shape as seam1's node-id PASSED assertion (tan-cli#308).
      - name: pytest (python/tests, excluding tests/gates -- see seam1 above)
        shell: bash
        working-directory: python
        env:
          ALP_SDK_ROOT: ${{ github.workspace }}/alp-sdk
          # tan-cli#509. Its OWN variable, NOT ALP_SDK_ROOT/ALP_SDK_PARITY_ROOT:
          # fifteen other test modules read those two to track live metadata
          # FORWARD, and pointing either at a frozen ref would silently repoint
          # all of them at a snapshot.
          ALP_PLANNER_ORACLE_ROOT: ${{ github.workspace }}/alp-sdk-planner-oracle
        run: |
          set -euo pipefail
          if [ ! -f "${ALP_PLANNER_ORACLE_ROOT}/metadata/catalog.json" ]; then
            echo "::error::ALP_PLANNER_ORACLE_ROOT is bound to ${ALP_PLANNER_ORACLE_ROOT}, which has no metadata/catalog.json -- test_planner_oracle_regression.py would SKIP all 702 of its cases while this job reported green. Fix the 'clone alp-sdk at the frozen planner-oracle commit' step above."
            exit 1
          fi
          if [ ! -f "${ALP_SDK_ROOT}/scripts/alp_project.py" ]; then
            echo "::error::ALP_SDK_ROOT is bound to ${ALP_SDK_ROOT}, which has no scripts/alp_project.py -- tests/conftest.py::sdk_root() would return None and every SDK-gated module would SKIP while this job still reported green. Fix the 'clone alp-sdk' step above."
            exit 1
          fi
          # ...and that guard is NOT sufficient, which is what the node-id
          # assertion below is for (tan-cli#500). It checks `alp_project.py`,
          # while `test_planner_emit_parity.py`'s own skip mark reads a
          # DIFFERENT file -- `scripts/alp_orchestrate/__init__.py`. A checkout
          # satisfying this guard and shipping no `scripts/alp_orchestrate/`
          # drops all 775 of that module's cases to SKIP at exit 0, taking its
          # in-module canary with them, and this job stays green having
          # compared nothing. alp-sdk retiring that package is the relocation's
          # STATED end state, so this is a scheduled event, not a hypothetical.
          #
          # Run FIRST and by node id, for the same reason seam1 asserts PASSED
          # by node id: a SKIP does not fail pytest's exit code, so neither
          # `set -e` nor pipefail is the enforcement here. Running it ahead of
          # the suite also fails in seconds rather than after the full round.
          GUARD=tests/parity/test_planner_parity_actually_ran.py::test_a_bound_sdk_root_still_ships_the_planner_oracle
          # `set +e` around the run, so the tailored message below is REACHABLE.
          # With `set -e` still armed, the package-less case -- where the guard
          # FAILS rather than skips -- killed the step at this pipeline and the
          # branch below never executed: correct verdict, raw traceback, and
          # none of the explanation an operator needs at 2am (tan-cli#500
          # review). The message now covers both outcomes it can see.
          set +e
          python -m pytest -v "${GUARD}" 2>&1 | tee /tmp/parity-guard.log
          set -e
          if ! grep -qF "${GUARD#tests/parity/} PASSED" /tmp/parity-guard.log; then
            echo "::error::${GUARD} did not PASS in this job. ALP_SDK_ROOT is bound here, so this is one of two things, and the pytest output above says which: a FAIL means the bound checkout cannot answer the byte-parity suite (no scripts/alp_orchestrate/); a SKIP means the guard itself regressed to fail-open. Either way the planner byte-parity layer is about to compare NOTHING while this job reports green. Do not silence it by widening the guard's skip."
            exit 1
          fi
          # The guard run above is NOT sharded (a bare node-id invocation,
          # no --shard-id/--num-shards) -- it is one fast canary and every
          # shard should independently prove ALP_SDK_ROOT resolves here, not
          # just whichever shard happens to collect that one test. The suite
          # itself IS sharded: pytest-shard partitions the collected test set
          # before running, so each of the 4 (os, shard) legs below covers a
          # disjoint quarter and the 4 legs' union is the full collection --
          # verified locally with --collect-only across all
          # four --shard-id values before this landed.
          # `--ignore=tests/parity`: that suite CANNOT be sharded, and the
          # reason is deliberate rather than incidental.
          # `test_the_breadth_layer_still_covers_every_board` is a cross-test
          # ACCUMULATOR -- the parametrised cases feed `_ARTEFACTS_COMPARED`
          # and it then asserts `len(...) >= 90`, so it exists precisely to
          # FAIL when the suite runs as a subset ("the floor on the total is
          # what catches a mode disappearing from GENERATE_MODES"). Split four
          # ways, each shard sees ~37 boards and it fails -- correctly.
          # Lowering the floor to 90/num_shards would convert a real guard
          # into one that cannot fail, the exact defect class this repo keeps
          # paying for. So parity runs WHOLE, in `python-tests-parity` below.
          if [ "${{ matrix.shard }}" = "parity" ]; then
              # WHOLE, unsharded, and nothing else -- the accumulator needs
              # every parametrised case in one process to reach its floor.
              python -m pytest -q tests/parity
          else
              python -m pytest -q --ignore=tests/gates --ignore=tests/parity \
                  --shard-id=${{ matrix.shard }} --num-shards=4
          fi

  # THE required context. `python-tests-shard` above is NOT
  # wired into branch protection -- its `name:` carries `shard`, so it moves
  # every time the shard count does, and GitHub required-context strings are
  # matched literally (tan-cli#392). This job runs no pytest itself; its only
  # job is to reproduce, byte-for-byte, the three strings protection on `dev`
  # already pins (see ci.yml's header):
  #
  #   python -- pytest across python/ (ubuntu-latest)
  #   python -- pytest across python/ (windows-latest)
  #   python -- pytest across python/ (macos-latest)
  #
  # A trailing-space or dash difference here silently orphans a required
  # context forever -- verify the evaluated `name:` against the list above
  # before trusting this job, don't just read the template string.
  #
  # `needs: python-tests-shard` alone is NOT a verdict: GitHub SKIPS a
  # dependent job when its upstream fails, it does not fail it, so a bare
  # `needs:` with no `if:` would leave this job PENDING/skipped rather than
  # red on a shard failure -- a skipped required context does not block a
  # merge the way a red one does, so that shape is silently worse than no
  # gate. `if: always()` forces this job to run regardless of the shard
  # matrix's outcome, and the step below then reads
  # `needs.python-tests-shard.result` explicitly and `exit 1`s on anything
  # that is not `success` (failure, cancelled, OR skipped) -- so this job can
  # never report green off the back of a shard job that did not cleanly pass.
  #
  # `needs.<job>.result` for a MATRIX job is ONE rolled-up result across the
  # WHOLE matrix (12 legs: 3 os x 4 shards), not per-os -- GitHub exposes no
  # per-leg `needs` result. DELIBERATE CHOICE, spelled out rather than left
  # for a reader to guess: accept that a shard failure on ANY os reds all
  # THREE aggregate legs below, rather than build a per-os signal (e.g. one
  # intermediate rollup job per os, or a status artefact written by each
  # shard and read back here by os). This is imprecise -- a windows-only
  # shard failure will also red the macos/ubuntu required contexts -- but it
  # is the simplest shape that cannot silently pass, which is the one
  # invariant that actually matters: the aggregate must never be green while
  # any shard was not green. Revisit only if the imprecision itself becomes
  # the complaint (PRs redded on an os they didn't touch often enough that
  # per-os attribution earns the added machinery).
  python-tests:
    name: "python -- pytest across python/ (${{ matrix.os }})"
    needs: python-tests-shard
    if: always()
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    # Always ubuntu-latest regardless of `matrix.os`: this job does no
    # OS-specific work (no checkout, no pytest, no pip install) -- `matrix.os`
    # exists ONLY to reproduce the three required `name:` strings above, one
    # job instance per string. Running it on `matrix.os` itself would pay for
    # a windows/macos runner just to evaluate one `if` and would leave the
    # three legs racing three different runner queues for zero benefit.
    runs-on: ubuntu-latest
    # tan-cli#812 did not list this job, and it is the one its own impact
    # paragraph is about: THREE of the five required contexts are these legs'
    # `name:` strings, so a wedged instance here is precisely the "blocks the PR
    # for the 360-minute default" case. The job checks out nothing, installs
    # nothing and runs one `if` -- measured 0 minutes on run 32039025829 -- so
    # anything it cannot finish in 5 is stuck, not slow.
    timeout-minutes: 5
    steps:
      - name: verify every python-tests-shard leg succeeded
        shell: bash
        run: |
          set -euo pipefail
          result="${{ needs.python-tests-shard.result }}"
          echo "python-tests-shard rolled-up result: ${result}"
          if [ "${result}" != "success" ]; then
            echo "::error::python-tests-shard did not report success (result: ${result}) -- at least one (os, shard) leg failed, was cancelled, or the whole matrix was skipped. This job exists only to reproduce the required-context name; treating anything but 'success' here as green would report a passing gate for a Python suite that did not fully pass."
            exit 1
          fi

  # tan-cli#485 (#320 recurred): the ONE signal that actually catches
  # tan/planner/ drift -- this `python-tests` job, dispatched by an alp-sdk
  # push and bound to the ref that just landed rather than PINNED_SDK_TAG --
  # was red on SIX CONSECUTIVE alp-sdk pushes before #485 was filed, and
  # nothing acted on any of them: a `repository_dispatch` run has no PR to
  # post a red X on, so the failure sat in the Actions tab unseen. #485's own
  # framing: "the pin bump that closed #320 held two days" -- because the
  # warn-only pin-freshness step (seam1, below) had already said the pin was
  # stale, and nobody was looking. This job turns the ALREADY-RED signal into
  # something a human is notified about, without touching that step's
  # deliberately-warn-only design (parity.yml's own comment above it argues
  # that rationale is sound, and #485 does not propose changing it -- the
  # open question of whether the WARNING itself should become blocking is
  # #509's decision to make, not this job's).
  #
  # Deliberately narrow: files or refreshes ONE tracking issue (never a new
  # one per failing push -- six failures should read as one incident, not
  # six), only on `repository_dispatch` (a `pull_request`/`push` failure
  # already has a natural PR/commit to notice it on), and only turns
  # green->red edges and red->red repeats into a comment -- it does not
  # relabel, close, or otherwise manage the issue's lifecycle, which stays a
  # human decision.
  notify-planner-drift:
    name: "file/refresh a tracking issue when the dispatched suite is red"
    needs: python-tests
    if: always() && github.event_name == 'repository_dispatch' && needs.python-tests.result == 'failure'
    runs-on: ubuntu-latest
    # Also absent from tan-cli#812's list. One `gh` search plus one create-or-
    # comment; it holds `issues: write`, which is the one token in this file
    # worth bounding on its own account.
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - name: file or refresh the tan/planner drift issue
        env:
          GH_TOKEN: ${{ github.token }}
          SDK_REF: ${{ github.event.client_payload.sdk_ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="tan/planner drift: the dispatched parity suite is red against alp-sdk"
          # A fixed, grep-able marker rather than matching on the free-text
          # title -- title wording can be edited by a maintainer without
          # breaking de-dup.
          marker="<!-- tan-cli-planner-drift-tracker -->"
          body=$(cat <<EOF
          $marker

          The \`python-tests\` job (\`python -- pytest across python/\`) failed on a
          \`repository_dispatch\` run triggered by an alp-sdk push -- this run tests
          \`tan/planner/\` against the ref alp-sdk just pushed
          (\`${SDK_REF:-<unknown, see run>}\`), not the pinned
          \`PINNED_SDK_TAG\`/\`PINNED_SDK_COMMIT\` this repo's own PRs are measured
          against. That distinction is the point: a \`pull_request\` run staying
          green here proves nothing about whether \`tan/planner/\` still matches
          alp-sdk's current \`scripts/alp_orchestrate/\` -- only this job does.

          Run: ${RUN_URL}

          Next step: diff \`scripts/alp_orchestrate/\` between
          \`python/tests/gates/test_planner_relocation_freshness.py\`'s
          \`PINNED_SDK_COMMIT\` and the ref above, port the behavioural delta into
          \`tan/planner/\`, add a test that fails against the unported code, then
          re-pin \`PINNED_HASHES\`/\`PINNED_SDK_COMMIT\` (see tan-cli#485 for the
          worked example). A bump with no matching port re-freezes the hashes and
          buys about two days (#320's own history).

          This issue is filed/refreshed automatically by \`parity.yml\`'s
          \`notify-planner-drift\` job; it does not self-close on a green run --
          close it by hand once the port lands.
          EOF
          )
          # NOT `gh issue list --search "... in:body"`: GitHub's search
          # tokenizes on hyphens and ANDs the tokens, so a multi-word marker
          # like this one is not an exact-phrase match -- measured live,
          # `--search "alp-sdk-planner-change in:body"` returned 5 issues
          # (only one of which actually contains that string), because
          # "alp", "sdk", "planner" and "change" each independently appear
          # across several unrelated open issues and GitHub ANDs the token
          # set, not the phrase. `.[0].number` on that result comments on
          # whichever issue happens to sort first, forever, silently
          # de-duping against the wrong issue. Server-side filter on the
          # LABEL set this job itself creates the issue with -- exact match,
          # no tokenizing -- to keep the candidate list small, then filter
          # CLIENT-SIDE on the literal marker string for the exact match.
          existing=$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open \
              --label bug,ci,python-port --json number,body \
              --jq '[.[] | select(.body | contains("tan-cli-planner-drift-tracker"))][0].number' \
              || true)
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --repo "${GITHUB_REPOSITORY}" --body "${body}"
            echo "::notice::updated existing drift-tracking issue #${existing}"
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "${title}" \
                --body "${body}" --label bug,ci,python-port
            echo "::notice::filed a new drift-tracking issue"
          fi
