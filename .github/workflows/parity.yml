  # `scripts/alp_template.py`).
  #
  # `seam1_field_diff.py` gains a third hand-reviewed allowance
  # (`_NESTED_ARTIFACT_TAILS`) for the #1360 relocation, mirroring
  # alp-sdk's own `tests/parity/seam1_field_diff.py` -- without it every
  # zephyr-slice board in the frozen 97ad481b oracle reports 6 disallowed
  # diffs (one per artifact field) against a live emit at this pin.
  #
  # ATOMIC across the vendored artefacts, as this file's history repeats.
  # Re-measured against `d00dbdc124491c89f68f404cd7ac9d26127f038f` before
  # landing:
  #   - kconfig-fixture  PASS (814 bytes, byte-identical -- no re-vendor)
  #   - toolchain-lock   PASS (6592 bytes, byte-identical -- no re-vendor)
  #   - bootstrap        MATCH (8345 bytes, byte-identical -- no re-vendor)
  #   - scaffold         PASS 9/9 (template, sku) pairs, but ONLY after
  #     re-vendoring the four `edge-ai`/`minimal` `CMakeLists.txt` files
  #     `_scaffold_cmakelists`'s new comment rewrite touches -- see
