  #     multicore_rpmsg-v2n: 4 disallowed diff(s)`.
  #
  # Still not a tag: alp-sdk's newest tag is `v0.15.0` (`e2928b9f`), which
  # predates every commit this bump exists to pick up.
  #
  # `7d58ef32` -> `1a9f753c` (tan-cli#657/#661/#662): moves in lockstep with
  # `PINNED_SDK_COMMIT` / `HAND_PORT_PINNED_SDK_COMMIT` in
  # `tests/gates/test_planner_relocation_freshness.py` -- see that file's
  # comment for the ported behavioural delta (the SW-DP IDR preflight pair,
  # the helper_mcu three-axis projection, `flash_args.slot0_load_address`).
  #
  # ATOMIC across the vendored artefacts, as this file's history repeats.
  # Re-measured against `1a9f753c` before landing:
  #   - kconfig-fixture  PASS (814 bytes, byte-identical -- no re-vendor)
  #   - toolchain-lock   PASS (6592 bytes, byte-identical -- no re-vendor)
  #   - bootstrap        MATCH (8345 bytes, byte-identical -- no re-vendor)
  #   - scaffold         PASS 9/9 (template, sku) pairs, NO re-vendor: none of
  #     the three drifted commits touch `examples/**`, `metadata/catalog*` or
  #     the scaffold templates, so `python/tan/templates/vendored/` stays at
  #     its `f30f4d4b` vendor point.
  #   - seam1_field_diff PASS, rc 0 -- all 6 boards, including
  #     `multicore_rpmsg-imx93` (alp-sdk and tan both still refuse it)
  #
  # `a317330595f744d35f4d785869517110f3678f70` -> `d00dbdc124491c89f68f404c
  # d7ac9d26127f038f` (tan-cli#560): moves in lockstep with `ci.yml`'s
  # `sdk_parity` checkout `ref:` and both `PINNED_SDK_COMMIT` /
  # `HAND_PORT_PINNED_SDK_COMMIT` in `test_planner_relocation_freshness.py`
  # -- see that file's `PINNED_SDK_COMMIT` comment for the ported
  # behavioural delta (alp-sdk#1360/#1401's `build/` level on a zephyr
  # slice's `artifacts` paths; alp-sdk#1373/#1407's AEN LOG_MODE_MINIMAL
  # default; alp-sdk#1394/#1399's pin-doc collision guard and #1400's
