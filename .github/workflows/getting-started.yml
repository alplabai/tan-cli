# SPDX-License-Identifier: Apache-2.0
#
# The first-install gate (tan-cli#207).
#
# Every other workflow here tests `tan` from a cargo checkout. `ci.yml` runs the
# four cargo gates; `parity.yml` builds a `target/debug/tan` and points it at a
# west workspace it assembled BY HAND (`west init -l` / `west update` /
# `west zephyr-export`), then builds an example that already existed in the SDK.
# Neither ever ran `install.sh`, `tan bootstrap` or `tan init` -- before this
# file, a grep for tan subcommand invocations across `.github` returned three
# COMMENT lines (`parity.yml`) and no `run:` step at all.
#
# So the entire environment-provisioning path a first-install customer walks had
# no signal: installer -> venv -> west workspace -> scaffold -> build. A
# regression in any phase of it reached customers with an otherwise-green board.
#
# This job walks the README Quickstart in order, on a stock ubuntu-latest image:
#
#   shellcheck install.sh    <- never linted by any workflow in either repo
#   ./install.sh             <- real release download, sha256 verify, install
#   tan bootstrap            <- venv + west workspace + SDK Python deps
#   west sdk install         <- the remedy tan's own build-readiness check PRINTS
#   tan init --name my-app   <- default template (zephyr-app) + default SoM
#   tan build                <- real ARM build of what `tan init` just scaffolded
#
# Deliberately NOT `paths`-filtered. A gate that skips itself on a "docs-only"
# PR reports green for a run that checked nothing, and the classifier that
# decides which diffs can break bootstrap does not exist.

name: getting-started

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Same rule as ci.yml: a newer push to a PR supersedes the run in flight, but a
# push-to-main run is never cancelled -- a rapid second merge would otherwise
# leave the first commit with no status.
concurrency:
  group: getting-started-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  first-install:
    name: "first install -- install.sh -> bootstrap -> init -> build"
    runs-on: ubuntu-latest
    # The west update is shallow+narrow (~30 MB) but `west sdk install` pulls the
    # arm-zephyr-eabi toolchain and the Zephyr build itself is a real one.
    timeout-minutes: 60
    steps:
      - name: checkout tan-cli
        uses: actions/checkout@v4

      # ---- 1. the installer, as a shell script ----------------------------

      # `install.sh` is `#!/usr/bin/env sh` -- POSIX, not bash. Say so
      # explicitly rather than leaning on shebang detection, so a future
      # `#!/bin/bash` change has to be a deliberate edit here too. shellcheck is
      # preinstalled on ubuntu-latest.
      - name: shellcheck install.sh
        run: shellcheck --shell=sh install.sh

      # ---- 2. host prerequisites ------------------------------------------

      # `tan bootstrap` NAMES missing prerequisites and refuses; it never
      # installs system packages itself (that is ADR 0021 Tier A -- zero
      # elevation). This is the customer following the apt-get line bootstrap
      # would print, so it belongs here rather than being something tan is
      # expected to do. ubuntu-latest already ships git/cmake/python3/curl.
      - name: host prerequisites (what bootstrap refuses without)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              ninja-build device-tree-compiler gperf xz-utils

      # Pinned, NOT `3.x` like parity.yml's. `3.x` floats to whatever is newest
      # -- 3.14.6 on the first run of this job -- and bootstrap's Zephyr
      # requirements install failed there, which is what left `patoolib` absent
      # and killed `west sdk install` two steps later. parity.yml gets away with
      # `3.x` because it never installs Zephyr's requirements at all (just west,
      # pyyaml, jsonschema, pyelftools).
      #
      # 3.12 is a version a customer plausibly has (Ubuntu 24.04 LTS ships it)
      # and that Zephyr v4.4.1's requirements are built against. This gate is
      # about the documented path working on a realistic host; "does Zephyr
      # v4.4.1 support the newest CPython released this month" is a different
      # question and does not belong on this job's critical path.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ---- 3. install.sh, for real ----------------------------------------

      # Runs THIS checkout's install.sh, not the documented
      # `curl -fsSL .../main/install.sh | sh` -- that pipe fetches `main`'s copy
      # and would give the PR editing install.sh no signal whatsoever. The bytes
      # are the same file; only the transport differs.
      #
      # This does a genuine GitHub Releases download of the LATEST published
      # release and verifies it against that release's checksums.txt, so the
      # sha256 path (#176's four refusals live on the other side of it) is
      # exercised for real rather than mocked.
      - name: install tan via install.sh
        run: |
          set -euo pipefail
          ./install.sh
          if [ ! -x "$HOME/.local/bin/tan" ]; then
            echo "::error::install.sh reported success but $HOME/.local/bin/tan is missing or not executable."
            ls -la "$HOME/.local/bin" || true
            exit 1
          fi
          "$HOME/.local/bin/tan" --version

      # install.sh appends the PATH line to the login shell's rc file and tells
      # the user to open a NEW shell. A workflow step is not a login shell and
      # never sources an rc file, so this is that new shell -- it is NOT covering
      # for the installer, whose own placement was asserted above.
      - name: put the installed tan on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Cheap, offline, and it is the one refusal that needs no network: an
      # unknown flag must exit 2, not install something.
      - name: install.sh refuses an unknown argument
        run: |
          set -uo pipefail
          set +e
          ./install.sh --definitely-not-a-flag >/tmp/gs-badflag.log 2>&1
          rc=$?
          set -e
          cat /tmp/gs-badflag.log
          if [ "$rc" -ne 2 ]; then
            echo "::error::install.sh --definitely-not-a-flag exited ${rc}, expected 2."
            exit 1
          fi

      # ---- 4. the binary under test ---------------------------------------

      # install.sh installs the last RELEASE. That is exactly what it should do,
      # and it is exactly why the rest of this job cannot use the result: every
      # step below would test a binary that predates the PR, and a bootstrap or
      # init regression in the diff would sail through green.
      #
      # So: the installer is verified for real above, and then the binary UNDER
      # TEST replaces it at the path install.sh chose. Everything after this
      # point runs the PR's `tan`, resolved off PATH the way a customer's shell
      # resolves it.
      #
      # Frozen via `python/scripts/build_binary.sh` -- the SAME script
      # release.yml's Linux leg runs -- NOT `cargo build --bin tan` (tan-cli#278).
      # The release assets are PyInstaller --onefile freezes of `python/`, not
      # cargo builds of `crates/` (tan-cli#271).
      #
      # Built INSIDE `python:3.12-slim-bullseye`, via `docker run`, exactly like
      # release.yml's Linux leg -- NOT against the bare-runner `actions/
      # setup-python` interpreter this step used before (tan-cli#296). That
      # interpreter is a different BUILD of CPython, not just a different
      # version: measured on this job, `/opt/hostedtoolcache/Python/3.12.13/
      # x64/lib/libpython3.12.so.1.0` froze a 28485720 B `dist/tan` (ceiling
      # 16500000) from the SAME source that freezes to 14042352 B inside this
      # container (artifact_ceilings.env's own x86_64-unknown-linux-gnu
      # measurement). No new dependency and no new import produced that --
      # PyInstaller bundles the interpreter it runs under, and a hosted-runner
      # CPython build carries more into the freeze than slim-bullseye's does.
      # Building the SAME artifact release.yml ships, instead of a differently
      # -built lookalike, is also what tan-cli#278 asked this job to do in the
      # first place ("getting-started.yml smoke-tests the RUST tan, so 'first
      # blink' and 'first install' never exercise the shipped freeze").
      #
      # `docker run` here, not a job-level `container:`, for the same reason
      # release.yml uses it: every step before and after this one (install.sh,
      # `tan bootstrap`, `west`, `tan build`) needs the host runner, and
      # `actions/checkout`/`upload-artifact` need the host's bundled Node.
      # binutils is installed INSIDE the container (PyInstaller shells out to
      # `objdump` on Linux and slim-bullseye lacks it) rather than on the host,
      # since the host no longer runs PyInstaller at all.
      - name: freeze tan from this checkout in python:3.12-slim-bullseye (python/scripts/build_binary.sh) and swap it in
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/python:/src" -w /src python:3.12-slim-bullseye bash -euc '
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends binutils
            python -m venv /tmp/venv
            /tmp/venv/bin/pip install --quiet --upgrade pip
            /tmp/venv/bin/pip install --quiet ".[monitor]" "pyinstaller>=6.10"
            PYTHON=/tmp/venv/bin/python bash scripts/build_binary.sh
          '
          install -m 0755 python/dist/tan "$HOME/.local/bin/tan"
          command -v tan
          tan --version

      # ---- 5. the SDK checkout --------------------------------------------

      # Single source for the alp-sdk pin: parity.yml's PINNED_SDK_TAG, whose
      # comment block explains what the SHA has to carry. A second hardcoded SHA
      # here would rot independently, and this gate would then quietly exercise a
      # different SDK than the parity gate does while both reported green.
      #
      # Hard-fail when the line is not where this expects. A fallback default
      # would make the pin meaningless in exactly the case where somebody moved
      # it and did not know this file was reading it.
      - name: resolve the pinned alp-sdk ref (from parity.yml)
        id: sdk_ref
        run: |
          set -euo pipefail
          ref="$(sed -n 's/^[[:space:]]*PINNED_SDK_TAG:[[:space:]]*//p' \
                 .github/workflows/parity.yml | head -1)"
          if [ -z "${ref}" ]; then
            echo "::error::could not read PINNED_SDK_TAG out of .github/workflows/parity.yml -- the pin moved or was reshaped. Point this step at its new home; do NOT add a second copy of the SHA here."
            exit 1
          fi
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "::notice::first-install running against pinned alp-sdk ${ref}"

      # `alp-workspace/` holds the checkout and NOTHING else, on purpose.
      # `west init -l` builds the workspace in the checkout's PARENT, so
      # bootstrap guards a parent that holds any other entry -- and under a CI
      # runner's non-terminal stdio that guard REFUSES outright rather than
      # offering to relocate. Cloning into $GITHUB_WORKSPACE (which already holds
      # this repo) would hit that refusal and the job would never reach
      # bootstrap's real work. A dedicated parent is also what the guard's own
      # remedy tells a customer to create.
      - name: clone alp-sdk into a dedicated workspace parent
        uses: actions/checkout@v4
        with:
          repository: alplabai/alp-sdk
          ref: ${{ steps.sdk_ref.outputs.ref }}
          path: alp-workspace/alp-sdk

      # ---- 6. tan bootstrap ------------------------------------------------

      # README Quickstart line 1, verbatim except for `--format json`: the text
      # run prints its outcome for a human, and this job needs the same outcome
      # as a value it can assert on and read `venvDir` out of. `--format json`
      # also implies non-interactive, which a CI runner's stdio would select
      # anyway.
      - name: tan bootstrap (venv + west workspace + SDK python deps)
        working-directory: alp-workspace
        run: |
          set -euo pipefail
          # stderr is captured AND echoed: in `--format json` the envelope is the
          # only thing on stdout, so when a phase degrades, the reason is on
          # stderr or nowhere. The first run of this job hit exactly that -- a
          # `bootstrap.zephyr-requirements` warning with no visible cause.
          tan bootstrap --sdk-root ./alp-sdk --format json \
              > /tmp/gs-bootstrap.json 2> >(tee /tmp/gs-bootstrap.stderr >&2)
          python3 - <<'PY'
          import json, os, sys
          e = json.load(open("/tmp/gs-bootstrap.json"))
          if not e.get("ok"):
              print("::error::tan bootstrap reported not-ok:",
                    json.dumps(e.get("issues"), indent=2))
              sys.exit(1)

          # `ok` alone is NOT the assertion. bootstrap's Zephyr-requirements
          # phase reports a WARNING and still exits 0 -- and on this job's first
          # run that warning was the whole story: the requirements install
          # failed, `patoolib` was never installed, `ok: true` was reported, and
          # the failure surfaced two steps later as an unrelated-looking
          # ModuleNotFoundError inside `west sdk install`. A degraded bootstrap
          # that reports success is precisely the silent-pass shape this gate
          # exists to catch, so any warning-or-worse issue fails it HERE, where
          # the diagnosis is one line long.
          # ONE code is exempt, and only this one. `bootstrap.python-floor-skew`
          # reports that alp-sdk's `metadata/bootstrap.json` declares
          # `pythonMinVersion 3.10` while the pinned Zephyr's
          # `cmake/modules/python.cmake` sets `PYTHON_MINIMUM_REQUIRED 3.12`.
          # That warning is CORRECT and it is about the SDK's manifest, not
          # about the environment this job just built -- the workspace is fine.
          # It is deliberately unresolved (alp-sdk#1078): raising the shared key
          # would make `tan doctor --build` refuse a 3.10/3.11 host for a
          # Yocto-only project, because `build_readiness.rs:401` checks Python
          # BEFORE any `os_set` branch, and 3.12 is unreachable via the remedy
          # tan echoes back (`sudo apt-get install -y python3`) on the Ubuntu
          # 22.04 hosts the docs recommend.
          #
          # It surfaces here for the first time because tan-cli#278 swapped the
          # PYTHON tan into this job; the Rust tan never made this check. Exempt
          # by CODE, never by severity -- any other warning still fails, which
          # is the whole point of this gate.
          EXPECTED_WARNINGS = {"bootstrap.python-floor-skew"}
          issues = e.get("issues") or []
          bad = [i for i in issues
                 if i.get("severity") in ("warning", "error")
                 and i.get("code") not in EXPECTED_WARNINGS]
          for i in issues:
              if i.get("code") in EXPECTED_WARNINGS:
                  print("::notice::expected, exempt:", i.get("code"),
                        "--", i.get("message"))
          if bad:
              print("::error::tan bootstrap exited 0 but reported",
                    len(bad), "warning/error issue(s) -- the environment it just "
                    "built is degraded, and the next documented command is the one "
                    "that will fail:")
              print(json.dumps(bad, indent=2))
              sys.exit(1)

          d = e.get("data") or {}
          for key in ("workspaceDir", "venvDir", "zephyrBase"):
              if not d.get(key):
                  print(f"::error::tan bootstrap reported ok but left `data.{key}` empty.")
                  sys.exit(1)
          # A success envelope naming a path that was never created is exactly
          # the silent-pass shape this gate exists to catch.
          for key in ("venvDir", "zephyrBase"):
              if not os.path.isdir(d[key]):
                  print(f"::error::tan bootstrap reported {key}={d[key]} but no such "
                        "directory exists.")
                  sys.exit(1)

          # tan-cli#217: these came back CWD-RELATIVE (`.`, `./.venv`,
          # `./zephyr`) while `project.root` in the same envelope was absolute.
          # This step used to call os.path.abspath on them, which papered over
          # the defect; now that #217 is fixed it ASSERTS instead, so a
          # regression fails here rather than exporting a relative PATH entry
          # that works in this step's cwd and silently resolves to nothing from
          # `alp-workspace/my-app` two steps later.
          for key in ("sdkRoot", "workspaceDir", "venvDir", "zephyrBase"):
              if not os.path.isabs(d[key]):
                  print(f"::error::tan bootstrap reported a RELATIVE data.{key}={d[key]} "
                        "-- the tan-cli#217 regression. A consumer reading it from any "
                        "other directory resolves nothing.")
                  sys.exit(1)
          with open(os.environ["GITHUB_ENV"], "a") as fh:
              fh.write("ZEPHYR_BASE=%s\n" % d["zephyrBase"])
          # The workflow equivalent of the `source <venv>/bin/activate` line
          # `tan bootstrap --print-env` prints -- a customer runs it, so this job
          # runs it. It is not here to cover for tan's own venv discovery; that
          # has its own tests (crates/tan-cli/src/venv.rs), and the subject of
          # THIS job is the documented customer path.
          with open(os.environ["GITHUB_PATH"], "a") as fh:
              fh.write(os.path.join(d["venvDir"], "bin") + "\n")
          print("bootstrap ok -- workspace", d["workspaceDir"])
          PY

      # `--print-env` is the documented way to learn what to export, and nothing
      # ran it either. This asserts the block tan tells customers to paste into
      # their shell profile actually parses as a shell script; the
      # venv-activation line it emits is a comment, so the venv is sourced from
      # `venvDir` below rather than from here.
      - name: tan bootstrap --print-env is a parseable shell block
        working-directory: alp-workspace
        run: |
          set -euo pipefail
          # A PLAIN pipe, deliberately -- no `2>&1`. The block is on stdout as
          # of tan-cli#227, so this step is now that fix's gate: if it ever
          # returns to stderr, the capture is empty again and the size check
          # below fails. It was that empty capture -- with `sh -n` passing,
          # because an empty file is a valid shell script -- that had this step
          # reporting green while asserting nothing at all. Never assert on a
          # file without first proving something reached it.
          tan bootstrap --sdk-root ./alp-sdk --print-env | tee /tmp/gs-print-env.sh
          if [ ! -s /tmp/gs-print-env.sh ]; then
            echo "::error::tan bootstrap --print-env produced no output at all."
            exit 1
          fi
          sh -n /tmp/gs-print-env.sh
          # tan-cli#217: these exports are what a customer pastes into a shell
          # profile, which is sourced from $HOME -- a relative path there is
          # silently wrong. Every value must be absolute.
          if grep -E '^export [A-Z_]+="\.' /tmp/gs-print-env.sh; then
            echo "::error::--print-env emitted a relative export (lines above). A shell profile is sourced from \$HOME, where a './...' path resolves to nothing -- this is the tan-cli#217 regression."
            exit 1
          fi

      # ---- 7. the Zephyr SDK, via tan's own printed remedy ------------------

      # tan does not run this itself -- `west sdk install` needs an initialised
      # west workspace, and build_readiness.rs prints it as the `fix` string
      # instead (`west sdk install --version <v> -t arm-zephyr-eabi`). Running
      # exactly that command here is the only way the printed remedy gets tested.
      #
      # The version comes from the SDK's own metadata/toolchains.json, the same
      # read parity.yml's seam2 does and the same file
      # tests/parity/toolchain_lock_parity.py holds host_env.rs's
      # ZEPHYR_SDK_INSTALL_VERSION against. Hardcoding it here would be a third
      # copy of a pin that already has one authority.
      - name: install the Zephyr SDK (west sdk install, the printed remedy)
        working-directory: alp-workspace
        env:
          # `west sdk install` lists the SDK releases through the GitHub API, and
          # unauthenticated calls are rate-limited PER IP -- shared across every
          # hosted runner in the region, so this fails on someone else's traffic,
          # not ours. Observed on this job:
          #
          #   fetch_releases API rate limit exceeded. Try executing install
          #   script with --personal-access-token argument or use a .netrc file
          #
          # followed by a traceback out of `sdk.py`'s `fetch_releases`, and four
          # skipped steps behind it. The workflow's own GITHUB_TOKEN lifts the
          # limit to the authenticated per-repo quota and needs no new secret --
          # `contents: read` is enough to list public releases.
          #
          # Passed via env rather than inlined into the command so the token is
          # not part of an argv that gets echoed.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # bootstrap's venv is already on PATH (see the step above), so this is
          # the venv's own west -- the one the printed remedy means.
          command -v west
          version="$(python3 -c 'import json; print(json.load(open("alp-sdk/metadata/toolchains.json"))["zephyrSdk"]["version"])')"
          echo "Zephyr SDK pin from alp-sdk metadata/toolchains.json: ${version}"
          # NOTE: `--personal-access-token` is an authentication detail of THIS
          # runner, not part of the remedy tan prints. The command under test is
          # still `west sdk install --version <v> -t arm-zephyr-eabi`; a customer
          # on a home IP has their own unauthenticated quota and needs no token.
          west sdk install --version "${version}" -t arm-zephyr-eabi \
              --personal-access-token "${GH_TOKEN}"

      # ---- 8. tan init ------------------------------------------------------

      # README Quickstart line 2. No `--template`, no `--som`: the point is that
      # the DEFAULTS work (zephyr-app / E1M-AEN801) on a runner with no TTY to
      # prompt on -- the #187/#198 hang class.
      - name: tan init --name my-app (defaults, no TTY)
        working-directory: alp-workspace
        run: |
          set -euo pipefail
          tan init --name my-app
          if [ ! -f my-app/board.yaml ]; then
            echo "::error::tan init reported success but wrote no my-app/board.yaml. Tree:"
            find my-app -maxdepth 2 || true
            exit 1
          fi
          echo "----- generated board.yaml -----"
          cat my-app/board.yaml

      # README Quickstart line 3 (`tan validate`), run from the scaffolded
      # project so the sibling `../alp-sdk` resolution the Quickstart promises is
      # what resolves the SDK -- no `--sdk-root` here, deliberately.
      - name: tan validate (sibling ../alp-sdk resolution)
        working-directory: alp-workspace/my-app
        run: tan validate

      # ---- 9. tan build -----------------------------------------------------

      - name: tan build (real ARM build of the scaffolded project)
        working-directory: alp-workspace/my-app
        run: |
          set -euo pipefail
          tan build 2>&1 | tee /tmp/gs-build.log
          # `tee` would mask a non-zero tan exit without this.
          rc="${PIPESTATUS[0]}"
          if [ "$rc" -ne 0 ]; then
            echo "::error::first-install: tan build exited ${rc}."
            exit "$rc"
          fi

      # `tan build` reporting ok while producing no ELF is the tan-cli#97 defect
      # class; a HOST binary where an ARM one belongs is that same defect
      # reaching the artefact. Both are assertions parity.yml's seam2 already
      # makes -- on an example that shipped in the SDK. This makes them on the
      # project `tan init` wrote sixty seconds earlier, which is the part no gate
      # covered.
      - name: the scaffolded project produced an ARM ELF
        working-directory: alp-workspace/my-app
        run: |
          set -euo pipefail
          ELF="build/m55_hp-zephyr/build/zephyr/zephyr.elf"
          if [ ! -f "${ELF}" ]; then
            echo "::error::first-install: tan build reported success but produced no ${ELF}. Tree:"
            find build -maxdepth 3 -type d || true
            find build -name 'zephyr.elf' || true
            exit 1
          fi
          file "${ELF}"
          if ! file "${ELF}" | grep -q "ARM"; then
            echo "::error::first-install: ${ELF} is not an ARM image -- a zephyr slice produced a host binary."
            exit 1
          fi
          echo "first-install: install.sh -> bootstrap -> init -> validate -> build -> ARM ELF, all asserted."

      - name: upload first-install logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-install-logs
          path: |
            /tmp/gs-bootstrap.json
            /tmp/gs-bootstrap.stderr
            /tmp/gs-print-env.sh
            /tmp/gs-badflag.log
            /tmp/gs-build.log
          if-no-files-found: warn
