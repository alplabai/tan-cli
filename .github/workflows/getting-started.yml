# SPDX-License-Identifier: Apache-2.0
#
# The first-install gate (tan-cli#207).
#
# Every other workflow here tests `tan` from a SOURCE checkout. `ci.yml` runs
# the pytest suite; `parity.yml` pip-installs `python/` and points the `tan`
# console script at a west workspace it assembled BY HAND (`west init -l` /
# `west update` / `west zephyr-export`), then builds an example that already
# existed in the SDK. (Until tan-cli#269 both did the same thing with a
# `cargo build --bin tan`; only the provenance of the binary changed.) Neither
# ever ran `install.sh`, `tan bootstrap` or `tan init` -- before this file, a
# grep for tan subcommand invocations across `.github` returned three COMMENT
# lines (`parity.yml`) and no `run:` step at all.
#
# So the entire environment-provisioning path a first-install customer walks had
# no signal: installer -> venv -> west workspace -> scaffold -> build. A
# regression in any phase of it reached customers with an otherwise-green board.
#
# This job walks the README Quickstart in order, on a stock ubuntu-latest image:
#
#   shellcheck install.sh    <- never linted by any workflow in either repo
#   ./install.sh             <- real release download, sha256 verify, install
#   tan bootstrap            <- venv + west workspace + SDK Python deps
#   west sdk install         <- the remedy tan's own build-readiness check PRINTS
#   tan init --name my-app   <- default template (zephyr-app) + default SoM
#   tan build                <- real ARM build of what `tan init` just scaffolded
#
# Deliberately NOT `paths`-filtered. A gate that skips itself on a "docs-only"
# PR reports green for a run that checked nothing, and the classifier that
# decides which diffs can break bootstrap does not exist.
#
# ---------------------------------------------------------------------------
# Section 10 below (dirty-host coverage) exists because even THIS job proves
# only the happy path: install -> bootstrap -> init -> build never leaves
# `west` off bare PATH, because bootstrap's own venv is on PATH the moment it
# finishes (the step above appends it to $GITHUB_PATH). Yet "west resolvable
# from the workspace venv but ABSENT from bare PATH" is the GUARANTEED state
# right after any real `tan bootstrap` (it deliberately does not put `west` on
# PATH -- its own next-steps text tells the user to activate the venv) and the
# permanent state of a GUI-launched VS Code (tan-cli#289). v0.5.0-rc2 shipped
# `tan doctor` exiting 4 on every fresh install because no gate anywhere ever
# constructed that state; the fix for it (tan-cli#299) then shipped its own
# false-pass (`west` absent EVERYWHERE reporting exit 0) for the same reason.
# Four more defects in this class shipped the same cycle, including tan-cli#301
# (a stale `$ZEPHYR_BASE` or `~/.alp/sdk-default` naming a DIFFERENT tree than
# the one a report was actually about). All of them needed a dirty host by
# hand; none of them could have been caught by a clean-runner job, however
# thorough.
#
# These steps are EXTRA STEPS in THIS job, not a sibling job with its own
# `tan bootstrap` -- deliberately. The expensive part (install.sh's real
# download, `tan bootstrap`'s venv + west workspace + SDK deps, `west sdk
# install`'s real toolchain fetch) is already paid for by the time execution
# reaches here; re-paying it in a second job costs ~8 minutes of runner time
# for zero additional coverage, since the dirty states below are constructed
# by editing PATH/env/files on the SAME real tree, not by bootstrapping a
# different one. A sibling job would also need `upload-artifact`/
# `download-artifact` to hand off the multi-hundred-MB Zephyr workspace, which
# a `needs:`-chained job in the SAME workflow gets for free by just being
# later steps of the one job that built it. Each new step scopes its dirty
# state to its OWN `run:` shell (PATH is only ever exported inline, never
# written to $GITHUB_PATH; anything moved aside or written under $HOME is
# restored via `trap ... EXIT`) so it cannot leak into a step after it.
# ---------------------------------------------------------------------------

name: getting-started

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Same rule as ci.yml: a newer push to a PR supersedes the run in flight, but a
# push-to-main run is never cancelled -- a rapid second merge would otherwise
# leave the first commit with no status.
concurrency:
  group: getting-started-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  # Least privilege by default (tan-cli#435). The install step's own comment
  # already states the requirement verbatim -- "`contents: read` is enough to
  # list public releases" -- it just had no block to say it in. The token is
  # there to lift the UNAUTHENTICATED per-IP rate limit, not to write.
  contents: read

jobs:
  first-install:
    name: "first install -- install.sh -> bootstrap -> init -> build"
    runs-on: ubuntu-latest
    # The west update is shallow+narrow (~30 MB) but `west sdk install` pulls the
    # arm-zephyr-eabi toolchain and the Zephyr build itself is a real one.
    timeout-minutes: 60
    steps:
      - name: checkout tan-cli
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ---- 1. the installer, as a shell script ----------------------------

      # `install.sh` is `#!/usr/bin/env sh` -- POSIX, not bash. Say so
      # explicitly rather than leaning on shebang detection, so a future
      # `#!/bin/bash` change has to be a deliberate edit here too. shellcheck is
      # preinstalled on ubuntu-latest.
      - name: shellcheck install.sh
        run: shellcheck --shell=sh install.sh

      # scripts/tan-surface/*.sh (tan-cli#475) is bash, not the installer's
      # POSIX sh -- same "nothing lints this" gap install.sh had before the
      # step above, closed the same way. Not driven end-to-end here (it needs
      # a real alp-sdk checkout, an optionally-bootstrapped west workspace,
      # and a real build, well beyond what this job's own steps already set
      # up); this only proves the shell itself stays clean.
      - name: shellcheck scripts/tan-surface
        run: shellcheck -S warning scripts/tan-surface/*.sh

      # ---- 2. host prerequisites ------------------------------------------

      # `tan bootstrap` NAMES missing prerequisites and refuses; it never
      # installs system packages itself (that is ADR 0021 Tier A -- zero
      # elevation). This is the customer following the apt-get line bootstrap
      # would print, so it belongs here rather than being something tan is
      # expected to do. ubuntu-latest already ships git/cmake/python3/curl.
      - name: host prerequisites (what bootstrap refuses without)
        run: |
          set -euo pipefail
          bash scripts/ci/apt-bounded.sh update
          bash scripts/ci/apt-bounded.sh install -y --no-install-recommends \
              ninja-build device-tree-compiler gperf xz-utils

      # Pinned, NOT `3.x` like parity.yml's. `3.x` floats to whatever is newest
      # -- 3.14.6 on the first run of this job -- and bootstrap's Zephyr
      # requirements install failed there, which is what left `patoolib` absent
      # and killed `west sdk install` two steps later. parity.yml gets away with
      # `3.x` because it never installs Zephyr's requirements at all (just west,
      # pyyaml, jsonschema, pyelftools).
      #
      # 3.12 is a version a customer plausibly has (Ubuntu 24.04 LTS ships it)
      # and that Zephyr v4.4.1's requirements are built against. This gate is
      # about the documented path working on a realistic host; "does Zephyr
      # v4.4.1 support the newest CPython released this month" is a different
      # question and does not belong on this job's critical path.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # ---- 3. install.sh, for real ----------------------------------------

      # Runs THIS checkout's install.sh, not the documented
      # `curl -fsSL .../main/install.sh | sh` -- that pipe fetches `main`'s copy
      # and would give the PR editing install.sh no signal whatsoever. The bytes
      # are the same file; only the transport differs.
      #
      # This does a genuine GitHub Releases download of the LATEST published
      # release and verifies it against that release's checksums.txt, so the
      # sha256 path (#176's four refusals live on the other side of it) is
      # exercised for real rather than mocked.
      - name: install tan via install.sh
        run: |
          set -euo pipefail
          ./install.sh
          if [ ! -x "$HOME/.local/bin/tan" ]; then
            echo "::error::install.sh reported success but $HOME/.local/bin/tan is missing or not executable."
            ls -la "$HOME/.local/bin" || true
            exit 1
          fi
          "$HOME/.local/bin/tan" --version

      # install.sh appends the PATH line to the login shell's rc file and tells
      # the user to open a NEW shell. A workflow step is not a login shell and
      # never sources an rc file, so this is that new shell -- it is NOT covering
      # for the installer, whose own placement was asserted above.
      - name: put the installed tan on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Cheap, offline, and it is the one refusal that needs no network: an
      # unknown flag must exit 2, not install something.
      - name: install.sh refuses an unknown argument
        run: |
          set -uo pipefail
          set +e
          ./install.sh --definitely-not-a-flag >/tmp/gs-badflag.log 2>&1
          rc=$?
          set -e
          cat /tmp/gs-badflag.log
          if [ "$rc" -ne 2 ]; then
            echo "::error::install.sh --definitely-not-a-flag exited ${rc}, expected 2."
            exit 1
          fi

      # ---- 4. the binary under test ---------------------------------------

      # install.sh installs the last RELEASE. That is exactly what it should do,
      # and it is exactly why the rest of this job cannot use the result: every
      # step below would test a binary that predates the PR, and a bootstrap or
      # init regression in the diff would sail through green.
      #
      # So: the installer is verified for real above, and then the binary UNDER
      # TEST replaces it at the path install.sh chose. Everything after this
      # point runs the PR's `tan`, resolved off PATH the way a customer's shell
      # resolves it.
      #
      # Frozen via `python/scripts/build_binary.sh` -- the SAME script
      # release.yml's Linux leg runs -- NOT `cargo build --bin tan` (tan-cli#278).
      # The release assets are PyInstaller --onefile freezes of `python/`, not
      # cargo builds of `crates/` (tan-cli#271).
      #
      # Built INSIDE `python:3.12-slim-bullseye`, via `docker run`, exactly like
      # release.yml's Linux leg -- NOT against the bare-runner `actions/
      # setup-python` interpreter this step used before (tan-cli#296). That
      # interpreter is a different BUILD of CPython, not just a different
      # version: measured on this job, `/opt/hostedtoolcache/Python/3.12.13/
      # x64/lib/libpython3.12.so.1.0` froze a 28485720 B `dist/tan` (ceiling
      # 16500000) from the SAME source that freezes to 14042352 B inside this
      # container (artifact_ceilings.env's own x86_64-unknown-linux-gnu
      # measurement). No new dependency and no new import produced that --
      # PyInstaller bundles the interpreter it runs under, and a hosted-runner
      # CPython build carries more into the freeze than slim-bullseye's does.
      # Building the SAME artifact release.yml ships, instead of a differently
      # -built lookalike, is also what tan-cli#278 asked this job to do in the
      # first place ("getting-started.yml smoke-tests the RUST tan, so 'first
      # blink' and 'first install' never exercise the shipped freeze").
      #
      # `docker run` here, not a job-level `container:`, for the same reason
      # release.yml uses it: every step before and after this one (install.sh,
      # `tan bootstrap`, `west`, `tan build`) needs the host runner, and
      # `actions/checkout`/`upload-artifact` need the host's bundled Node.
      # binutils is installed INSIDE the container (PyInstaller shells out to
      # `objdump` on Linux and slim-bullseye lacks it) rather than on the host,
      # since the host no longer runs PyInstaller at all.
      - name: freeze tan from this checkout in python:3.12-slim-bullseye (python/scripts/build_binary.sh) and swap it in
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/python:/src" -v "$PWD/scripts:/scripts:ro" -w /src python:3.12-slim-bullseye bash -euc '
            bash /scripts/ci/apt-bounded.sh update -qq
            bash /scripts/ci/apt-bounded.sh install -y -qq --no-install-recommends binutils
            python -m venv /tmp/venv
            /tmp/venv/bin/pip install --quiet --upgrade pip
            /tmp/venv/bin/pip install --quiet ".[monitor]" "pyinstaller>=6.10"
            PYTHON=/tmp/venv/bin/python bash scripts/build_binary.sh
          '
          # build_binary.sh always emits a --onedir freeze (tan-cli#349):
          # python/dist/tan/ is a DIRECTORY (tan + _internal/), not a single
          # executable. What the install.sh step above left at
          # $HOME/.local/bin/tan is NOT fixed, though, since tan-cli#356: for
          # the LATEST release right now (v0.4.1) install.sh's own
          # checksums.txt lookup finds no archive asset, takes the raw-binary
          # branch, and installs the raw v0.4.1 executable straight to
          # $HOME/.local/bin/tan with NO tan-cli-lib/ at all -- there is then
          # no launcher to "swap the library tree" of, and the old
          # `cp -r ...tan-cli-lib` + assume-a-launcher-exists version of this
          # step left that raw v0.4.1 binary in place, untouched, on PATH.
          # Every step below would then run v0.4.1, not this PR, with `tan
          # --version` still reporting exit 0 -- the exact silent-pass this
          # job's own file header exists to prevent.
          #
          # So this step no longer assumes a launcher is there to retarget: it
          # (re)writes ONE, unconditionally, mirroring install.sh's own
          # archive-layout launcher byte for byte -- overwriting a raw
          # v0.4.1 executable, a stale launcher, or nothing, alike -- and then
          # PROVES the swap took by comparing `tan --version` against this
          # checkout's own TAN_VERSION rather than merely checking exit 0
          # (which a stale v0.4.1 binary also returns).
          rm -rf "$HOME/.local/bin/tan-cli-lib"
          cp -r python/dist/tan "$HOME/.local/bin/tan-cli-lib"
          chmod +x "$HOME/.local/bin/tan-cli-lib/tan"
          cat >"$HOME/.local/bin/tan" <<'LAUNCHER'
          #!/bin/sh
          # Generated by getting-started.yml, mirroring install.sh's own
          # archive-layout launcher (tan-cli#349) -- do not edit by hand.
          exec "$HOME/.local/bin/tan-cli-lib/tan" "$@"
          LAUNCHER
          chmod +x "$HOME/.local/bin/tan"

          pr_version="$(sed -n 's/^TAN_VERSION = "\(.*\)"$/\1/p' python/tan/version.py)"
          if [ -z "$pr_version" ]; then
            echo "::error::could not read TAN_VERSION out of python/tan/version.py -- the pattern this step's sed matches moved." >&2
            exit 1
          fi
          resolved="$(command -v tan)"
          if [ "$resolved" != "$HOME/.local/bin/tan" ]; then
            echo "::error::'tan' resolves to ${resolved}, not \$HOME/.local/bin/tan -- something earlier on PATH shadows the swapped-in binary, so every step below would still test the wrong tan." >&2
            exit 1
          fi
          actual="$(tan --version)"
          expected="tan ${pr_version}"
          if [ "$actual" != "$expected" ]; then
            echo "::error::the PR-freeze swap did not take: 'tan --version' printed '${actual}', expected '${expected}' (this checkout's python/tan/version.py). Every step below would be exercising a stale release binary instead of this PR -- see tan-cli#356." >&2
            exit 1
          fi
          echo "swapped in: ${actual}"

      # ---- 5. the SDK checkout --------------------------------------------

      # Single source for the alp-sdk pin: parity.yml's PINNED_SDK_TAG, whose
      # comment block explains what the SHA has to carry. A second hardcoded SHA
      # here would rot independently, and this gate would then quietly exercise a
      # different SDK than the parity gate does while both reported green.
      #
      # Hard-fail when the line is not where this expects. A fallback default
      # would make the pin meaningless in exactly the case where somebody moved
      # it and did not know this file was reading it.
      - name: resolve the pinned alp-sdk ref (from parity.yml)
        id: sdk_ref
        run: |
          set -euo pipefail
          ref="$(sed -n 's/^[[:space:]]*PINNED_SDK_TAG:[[:space:]]*//p' \
                 .github/workflows/parity.yml | head -1)"
          if [ -z "${ref}" ]; then
            echo "::error::could not read PINNED_SDK_TAG out of .github/workflows/parity.yml -- the pin moved or was reshaped. Point this step at its new home; do NOT add a second copy of the SHA here."
            exit 1
          fi
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "::notice::first-install running against pinned alp-sdk ${ref}"

      # `alp-workspace/` holds the checkout and NOTHING else, on purpose.
      # `west init -l` builds the workspace in the checkout's PARENT, so
      # bootstrap guards a parent that holds any other entry -- and under a CI
      # runner's non-terminal stdio that guard REFUSES outright rather than
      # offering to relocate. Cloning into $GITHUB_WORKSPACE (which already holds
      # this repo) would hit that refusal and the job would never reach
      # bootstrap's real work. A dedicated parent is also what the guard's own
      # remedy tells a customer to create.
      - name: clone alp-sdk into a dedicated workspace parent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: alplabai/alp-sdk
          ref: ${{ steps.sdk_ref.outputs.ref }}
          path: alp-workspace/alp-sdk

      # ---- 6. tan bootstrap ------------------------------------------------

      # README Quickstart line 1, verbatim except for `--format json`: the text
      # run prints its outcome for a human, and this job needs the same outcome
      # as a value it can assert on and read `venvDir` out of. `--format json`
      # also implies non-interactive, which a CI runner's stdio would select
      # anyway.
      - name: tan bootstrap (venv + west workspace + SDK python deps)
        working-directory: alp-workspace
        run: |
          set -euo pipefail
          # stderr is captured AND echoed: in `--format json` the envelope is the
          # only thing on stdout, so when a phase degrades, the reason is on
          # stderr or nowhere. The first run of this job hit exactly that -- a
          # `bootstrap.zephyr-requirements` warning with no visible cause.
          tan bootstrap --sdk-root ./alp-sdk --format json \
              > /tmp/gs-bootstrap.json 2> >(tee /tmp/gs-bootstrap.stderr >&2)
          python3 - <<'PY'
          import json, os, sys
          e = json.load(open("/tmp/gs-bootstrap.json"))
          if not e.get("ok"):
              print("::error::tan bootstrap reported not-ok:",
                    json.dumps(e.get("issues"), indent=2))
              sys.exit(1)

          # `ok` alone is NOT the assertion. bootstrap's Zephyr-requirements
          # phase reports a WARNING and still exits 0 -- and on this job's first
          # run that warning was the whole story: the requirements install
          # failed, `patoolib` was never installed, `ok: true` was reported, and
          # the failure surfaced two steps later as an unrelated-looking
          # ModuleNotFoundError inside `west sdk install`. A degraded bootstrap
          # that reports success is precisely the silent-pass shape this gate
          # exists to catch, so any warning-or-worse issue fails it HERE, where
          # the diagnosis is one line long.
          # ONE code is exempt, and only this one. `bootstrap.python-floor-skew`
          # reports that alp-sdk's `metadata/bootstrap.json` declares
          # `pythonMinVersion 3.10` while the pinned Zephyr's
          # `cmake/modules/python.cmake` sets `PYTHON_MINIMUM_REQUIRED 3.12`.
          # That warning is CORRECT and it is about the SDK's manifest, not
          # about the environment this job just built -- the workspace is fine.
          # It is deliberately unresolved (alp-sdk#1078): raising the shared key
          # would make `tan doctor --build` refuse a 3.10/3.11 host for a
          # Yocto-only project, because `build_readiness.rs:401` checks Python
          # BEFORE any `os_set` branch, and 3.12 is unreachable via the remedy
          # tan echoes back (`sudo apt-get install -y python3`) on the Ubuntu
          # 22.04 hosts the docs recommend.
          #
          # It surfaces here for the first time because tan-cli#278 swapped the
          # PYTHON tan into this job; the Rust tan never made this check. Exempt
          # by CODE, never by severity -- any other warning still fails, which
          # is the whole point of this gate.
          EXPECTED_WARNINGS = {"bootstrap.python-floor-skew"}
          issues = e.get("issues") or []
          bad = [i for i in issues
                 if i.get("severity") in ("warning", "error")
                 and i.get("code") not in EXPECTED_WARNINGS]
          for i in issues:
              if i.get("code") in EXPECTED_WARNINGS:
                  print("::notice::expected, exempt:", i.get("code"),
                        "--", i.get("message"))
          if bad:
              print("::error::tan bootstrap exited 0 but reported",
                    len(bad), "warning/error issue(s) -- the environment it just "
                    "built is degraded, and the next documented command is the one "
                    "that will fail:")
              print(json.dumps(bad, indent=2))
              sys.exit(1)

          d = e.get("data") or {}
          for key in ("workspaceDir", "venvDir", "zephyrBase"):
              if not d.get(key):
                  print(f"::error::tan bootstrap reported ok but left `data.{key}` empty.")
                  sys.exit(1)
          # A success envelope naming a path that was never created is exactly
          # the silent-pass shape this gate exists to catch.
          for key in ("venvDir", "zephyrBase"):
              if not os.path.isdir(d[key]):
                  print(f"::error::tan bootstrap reported {key}={d[key]} but no such "
                        "directory exists.")
                  sys.exit(1)

          # tan-cli#217: these came back CWD-RELATIVE (`.`, `./.venv`,
          # `./zephyr`) while `project.root` in the same envelope was absolute.
          # This step used to call os.path.abspath on them, which papered over
          # the defect; now that #217 is fixed it ASSERTS instead, so a
          # regression fails here rather than exporting a relative PATH entry
          # that works in this step's cwd and silently resolves to nothing from
          # `alp-workspace/my-app` two steps later.
          for key in ("sdkRoot", "workspaceDir", "venvDir", "zephyrBase"):
              if not os.path.isabs(d[key]):
                  print(f"::error::tan bootstrap reported a RELATIVE data.{key}={d[key]} "
                        "-- the tan-cli#217 regression. A consumer reading it from any "
                        "other directory resolves nothing.")
                  sys.exit(1)
          with open(os.environ["GITHUB_ENV"], "a") as fh:
              fh.write("ZEPHYR_BASE=%s\n" % d["zephyrBase"])
              # Captured for section 10's dirty-host steps below, so they can
              # locate (and selectively scrub/restore) the venv's bin dir
              # without a second parse of this same envelope.
              fh.write("TAN_VENV_DIR=%s\n" % d["venvDir"])
          # The workflow equivalent of the `source <venv>/bin/activate` line
          # `tan bootstrap --print-env` prints -- a customer runs it, so this job
          # runs it. It is not here to cover for tan's own venv discovery; that
          # has its own tests (`python/tests/`; the retired Rust oracle's lived in
          # `crates/tan-cli/src/venv.rs`), and the subject of
          # THIS job is the documented customer path.
          with open(os.environ["GITHUB_PATH"], "a") as fh:
              fh.write(os.path.join(d["venvDir"], "bin") + "\n")
          print("bootstrap ok -- workspace", d["workspaceDir"])
          PY

      # `--print-env` is the documented way to learn what to export, and nothing
      # ran it either. This asserts the block tan tells customers to paste into
      # their shell profile actually parses as a shell script; the
      # venv-activation line it emits is a comment, so the venv is sourced from
      # `venvDir` below rather than from here.
      - name: tan bootstrap --print-env is a parseable shell block
        working-directory: alp-workspace
        run: |
          set -euo pipefail
          # A PLAIN pipe, deliberately -- no `2>&1`. The block is on stdout as
          # of tan-cli#227, so this step is now that fix's gate: if it ever
          # returns to stderr, the capture is empty again and the size check
          # below fails. It was that empty capture -- with `sh -n` passing,
          # because an empty file is a valid shell script -- that had this step
          # reporting green while asserting nothing at all. Never assert on a
          # file without first proving something reached it.
          tan bootstrap --sdk-root ./alp-sdk --print-env | tee /tmp/gs-print-env.sh
          if [ ! -s /tmp/gs-print-env.sh ]; then
            echo "::error::tan bootstrap --print-env produced no output at all."
            exit 1
          fi
          sh -n /tmp/gs-print-env.sh
          # tan-cli#217: these exports are what a customer pastes into a shell
          # profile, which is sourced from $HOME -- a relative path there is
          # silently wrong. Every value must be absolute.
          if grep -E '^export [A-Z_]+="\.' /tmp/gs-print-env.sh; then
            echo "::error::--print-env emitted a relative export (lines above). A shell profile is sourced from \$HOME, where a './...' path resolves to nothing -- this is the tan-cli#217 regression."
            exit 1
          fi

      # ---- 7. the Zephyr SDK, via tan's own printed remedy ------------------

      # tan does not run this itself -- `west sdk install` needs an initialised
      # west workspace, and build_readiness.rs prints it as the `fix` string
      # instead (`west sdk install --version <v> -t arm-zephyr-eabi`). Running
      # exactly that command here is the only way the printed remedy gets tested.
      #
      # The version comes from the SDK's own metadata/toolchains.json, the same
      # read parity.yml's seam2 does and the same file
      # tests/parity/toolchain_lock_parity.py holds host_env.rs's
      # ZEPHYR_SDK_INSTALL_VERSION against. Hardcoding it here would be a third
      # copy of a pin that already has one authority.
      - name: install the Zephyr SDK (west sdk install, the printed remedy)
        working-directory: alp-workspace
        env:
          # `west sdk install` lists the SDK releases through the GitHub API, and
          # unauthenticated calls are rate-limited PER IP -- shared across every
          # hosted runner in the region, so this fails on someone else's traffic,
          # not ours. Observed on this job:
          #
          #   fetch_releases API rate limit exceeded. Try executing install
          #   script with --personal-access-token argument or use a .netrc file
          #
          # followed by a traceback out of `sdk.py`'s `fetch_releases`, and four
          # skipped steps behind it. The workflow's own GITHUB_TOKEN lifts the
          # limit to the authenticated per-repo quota and needs no new secret --
          # `contents: read` is enough to list public releases.
          #
          # Passed via env rather than inlined into the command so the token is
          # not part of an argv that gets echoed.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # bootstrap's venv is already on PATH (see the step above), so this is
          # the venv's own west -- the one the printed remedy means.
          command -v west
          version="$(python3 -c 'import json; print(json.load(open("alp-sdk/metadata/toolchains.json"))["zephyrSdk"]["version"])')"
          echo "Zephyr SDK pin from alp-sdk metadata/toolchains.json: ${version}"
          # NOTE: `--personal-access-token` is an authentication detail of THIS
          # runner, not part of the remedy tan prints. The command under test is
          # still `west sdk install --version <v> -t arm-zephyr-eabi`; a customer
          # on a home IP has their own unauthenticated quota and needs no token.
          # Retry the whole install (tan-cli#689). The GH_TOKEN above lifts the
          # API rate limit on `fetch_releases`, but that is only the FIRST
          # network call this makes. `setup.sh -t arm-zephyr-eabi` then fetches
          # the GNU toolchain separately, and no token affects that leg:
          #
          #   Installing 'arm-zephyr-eabi' GNU toolchain ...
          #   ERROR: GNU toolchain download failed
          #   FATAL ERROR: command ".../setup.sh -t arm-zephyr-eabi -h" failed
          #
          # observed 2026-08-12 on PR #688 (`gh pr view 688 --repo
          # alplabai/tan-cli --json files`: python/tan/planner/{kconfig,
          # libraries,validate}.py, the ci.yml and parity.yml SDK-ref pins,
          # and test_planner_relocation_freshness.py's matching hash re-pin)
          # -- nothing in that diff reaches a toolchain download.
          #
          # Same reasoning this repo already applied to `sdk list --online` in
          # clean-host.yml: "A gate that goes red for a reason unrelated to its
          # subject stops being read." Three attempts, backing off; still fails
          # loudly if the network is genuinely unavailable.
          for attempt in 1 2 3; do
            if west sdk install --version "${version}" -t arm-zephyr-eabi \
                   --personal-access-token "${GH_TOKEN}"; then
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "::error::west sdk install failed 3 times -- this is a real \
          failure, not a transient fetch." >&2
              exit 1
            fi
            echo "::warning::west sdk install attempt ${attempt}/3 failed; \
          retrying in $((attempt * 15))s" >&2
            sleep $((attempt * 15))
          done

      # ---- 8. tan init ------------------------------------------------------

      # README Quickstart line 2. No `--template`, no `--som`: the point is that
      # the DEFAULTS work (zephyr-app / E1M-AEN801) on a runner with no TTY to
      # prompt on -- the #187/#198 hang class.
      - name: tan init --name my-app (defaults, no TTY)
        working-directory: alp-workspace
        run: |
          set -euo pipefail
          tan init --name my-app
          if [ ! -f my-app/board.yaml ]; then
            echo "::error::tan init reported success but wrote no my-app/board.yaml. Tree:"
            find my-app -maxdepth 2 || true
            exit 1
          fi
          echo "----- generated board.yaml -----"
          cat my-app/board.yaml

      # README Quickstart line 3 (`tan validate`), run from the scaffolded
      # project -- still with no `--sdk-root`, deliberately: sibling
      # `../alp-sdk` DISCOVERY, the same resolution the `tan build` step below
      # depends on.
      #
      # tan-cli#376: the SDK-validator spawn path is ported now, so this runs
      # the DEFAULT path. Before this change the ONLY `tan validate` invocation
      # anywhere under `.github` passed `--offline`, and this is the only job
      # that checks out a real alp-sdk -- so the ported spawn was never
      # exercised against one, which is exactly the gap #376's verifier found.
      #
      # `--offline` keeps its own coverage in
      # `python/tests/commands/test_validate_command.py`
      # (`test_offline_still_never_spawns_the_sdk_validator`); re-running it
      # here would only repeat the unit suite on a runner that paid for a real
      # checkout.
      - name: tan validate (SDK-backed; the spawn path, against the pinned alp-sdk)
        working-directory: alp-workspace/my-app
        run: tan validate

      # ---- 9. tan build -----------------------------------------------------

      - name: tan build (real ARM build of the scaffolded project)
        working-directory: alp-workspace/my-app
        run: |
          set -euo pipefail
          tan build 2>&1 | tee /tmp/gs-build.log
          # `tee` would mask a non-zero tan exit without this.
          rc="${PIPESTATUS[0]}"
          if [ "$rc" -ne 0 ]; then
            echo "::error::first-install: tan build exited ${rc}."
            exit "$rc"
          fi

      # `tan build` reporting ok while producing no ELF is the tan-cli#97 defect
      # class; a HOST binary where an ARM one belongs is that same defect
      # reaching the artefact. Both are assertions parity.yml's seam2 already
      # makes -- on an example that shipped in the SDK. This makes them on the
      # project `tan init` wrote sixty seconds earlier, which is the part no gate
      # covered.
      - name: the scaffolded project produced an ARM ELF
        working-directory: alp-workspace/my-app
        run: |
          set -euo pipefail
          ELF="build/m55_hp-zephyr/build/zephyr/zephyr.elf"
          if [ ! -f "${ELF}" ]; then
            echo "::error::first-install: tan build reported success but produced no ${ELF}. Tree:"
            find build -maxdepth 3 -type d || true
            find build -name 'zephyr.elf' || true
            exit 1
          fi
          file "${ELF}"
          if ! file "${ELF}" | grep -q "ARM"; then
            echo "::error::first-install: ${ELF} is not an ARM image -- a zephyr slice produced a host binary."
            exit 1
          fi
          echo "first-install: install.sh -> bootstrap -> init -> validate -> build -> ARM ELF, all asserted."

      # ---- 10. dirty-host coverage (the reason this job exists) -------------
      # See the file header for why these are extra steps here and not a
      # second job with its own bootstrap.

      # tan-cli#299 (the false-refusal v0.5.0-rc2 shipped): straight after a
      # real `tan bootstrap`, with `west` off bare PATH, a host that provably
      # builds used to get `tan doctor` exit 4. Asserts the FIX: exit 0, and a
      # real `tan build` -- forced through a fresh CMake configure via `tan
      # clean`, so this cannot pass by reusing the ELF section 9 already built
      # -- still resolves `west` through the venv with none of it on PATH.
      - name: "dirty host 1/3: west in the venv, absent from bare PATH (tan-cli#299)"
        working-directory: alp-workspace/my-app
        run: |
          set -euo pipefail
          VENV_BIN="${TAN_VENV_DIR}/bin"
          if [ ! -x "${VENV_BIN}/west" ]; then
            echo "::error::expected an executable west at ${VENV_BIN}/west after a real bootstrap -- nothing to scrub PATH of."
            exit 1
          fi
          # Exact-line match (grep -x), not a substring: a differently-named
          # directory sharing a prefix with $VENV_BIN must survive the scrub.
          SCRUBBED_PATH="$(printf '%s' "$PATH" | tr ':' '\n' | grep -vxF "${VENV_BIN}" | paste -sd: -)"
          if PATH="$SCRUBBED_PATH" command -v west >/dev/null 2>&1; then
            echo "::error::west is still resolvable on bare PATH after scrubbing ${VENV_BIN} -- this step is not exercising the state it claims to."
            PATH="$SCRUBBED_PATH" command -v west
            exit 1
          fi

          set +e
          PATH="$SCRUBBED_PATH" tan doctor --format json > /tmp/gs-dirty-doctor-venv-only.json
          rc=$?
          set -e
          cat /tmp/gs-dirty-doctor-venv-only.json
          if [ "$rc" -ne 0 ]; then
            echo "::error::tan doctor exited ${rc} with west resolvable only through the bootstrap venv (bare PATH scrubbed of it) -- expected exit 0. A host that builds must not be refused (tan-cli#299)."
            exit 1
          fi

          python3 - <<'PY'
          import json, sys
          e = json.load(open("/tmp/gs-dirty-doctor-venv-only.json"))
          if e.get("exitCode") != 0 or e.get("ok") is not True:
              sys.exit(f"::error::tan doctor's envelope disagrees with its own process exit 0: exitCode={e.get('exitCode')} ok={e.get('ok')}")
          checks = {c["name"]: c for c in (e.get("data") or {}).get("checks", [])}
          for name in ("westResolved", "west"):
              if name not in checks:
                  sys.exit(f"::error::tan doctor reported no `{name}` check at all -- renamed or removed since this job was written.")
          if checks["westResolved"]["status"] != "pass":
              sys.exit("::error::westResolved is " + checks["westResolved"]["status"] +
                        ", not pass, with west resolvable through the venv: " +
                        checks["westResolved"]["detail"])
          if checks["west"]["status"] == "fail":
              sys.exit("::error::`west` (the bare-PATH check) is FAIL, not warn, on a host that "
                        "provably builds -- the exact tan-cli#299 false-refusal: " +
                        checks["west"]["detail"])
          print("westResolved:", checks["westResolved"]["status"], "-- west:", checks["west"]["status"])
          PY

          # `tan clean` needs no PATH-resolved tool (filesystem-only), so it
          # runs before the scrub is re-applied for the build below.
          tan clean
          set +e
          PATH="$SCRUBBED_PATH" tan build 2>&1 | tee /tmp/gs-dirty-build-venv-only.log
          brc="${PIPESTATUS[0]}"
          set -e
          if [ "$brc" -ne 0 ]; then
            echo "::error::tan build exited ${brc} with west resolvable only through the venv (bare PATH scrubbed of it) -- tan-cli#289 exists precisely so this works."
            exit 1
          fi
          ELF="build/m55_hp-zephyr/build/zephyr/zephyr.elf"
          if [ ! -f "${ELF}" ]; then
            echo "::error::tan build reported success with PATH scrubbed of the venv, but produced no ${ELF}."
            exit 1
          fi
          echo "confirmed: tan build resolved west from ${VENV_BIN} with bare PATH scrubbed of it."

      # tan-cli#299's own false-pass (found only by a real run, per
      # `exit_code_for`'s own docstring: "Never 0 on an unhealthy host"): the
      # fix for dirty-host-1 above, taken too far, turned "west absent
      # everywhere -- nothing can execute a single build slice" into a WARN
      # and an exit-0 report. Asserts that regression stays fixed: with the
      # venv's own `west` moved aside too (not just off PATH), `tan doctor`
      # must exit 4 and `westResolved` must be `fail`.
      - name: "dirty host 2/3: west absent EVERYWHERE, doctor must exit 4 (tan-cli#299 false-pass)"
        working-directory: alp-workspace/my-app
        run: |
          set -uo pipefail
          VENV_BIN="${TAN_VENV_DIR}/bin"
          if [ ! -x "${VENV_BIN}/west" ]; then
            echo "::error::expected an executable west at ${VENV_BIN}/west before moving it aside -- nothing to remove."
            exit 1
          fi
          mv "${VENV_BIN}/west" "${VENV_BIN}/west.moved-aside-by-ci"
          restore_west() { mv -f "${VENV_BIN}/west.moved-aside-by-ci" "${VENV_BIN}/west" 2>/dev/null || true; }
          trap restore_west EXIT

          SCRUBBED_PATH="$(printf '%s' "$PATH" | tr ':' '\n' | grep -vxF "${VENV_BIN}" | paste -sd: -)"
          if PATH="$SCRUBBED_PATH" command -v west >/dev/null 2>&1; then
            echo "::error::west is STILL resolvable somewhere on this scrubbed PATH even with the venv's own west moved aside -- this step is not exercising 'west absent everywhere'."
            PATH="$SCRUBBED_PATH" command -v west
            exit 1
          fi

          set +e
          PATH="$SCRUBBED_PATH" tan doctor --format json > /tmp/gs-dirty-doctor-no-west.json
          rc=$?
          set -e
          cat /tmp/gs-dirty-doctor-no-west.json
          if [ "$rc" -ne 4 ]; then
            echo "::error::tan doctor exited ${rc} with west absent everywhere -- expected exit 4 (exit_code_for's own docstring: 'Never 0 on an unhealthy host'). This is the false-pass tan-cli#299's own fix for dirty-host-1 introduced."
            exit 1
          fi

          python3 - <<'PY'
          import json, sys
          e = json.load(open("/tmp/gs-dirty-doctor-no-west.json"))
          if e.get("exitCode") != 4 or e.get("ok") is not False:
              sys.exit(f"::error::envelope disagrees with the process exit 4: exitCode={e.get('exitCode')} ok={e.get('ok')}")
          checks = {c["name"]: c for c in (e.get("data") or {}).get("checks", [])}
          if "westResolved" not in checks:
              sys.exit("::error::no `westResolved` check in the report -- renamed or removed since this job was written.")
          if checks["westResolved"]["status"] != "fail":
              sys.exit("::error::westResolved is " + checks["westResolved"]["status"] +
                        ", not fail, with west absent everywhere -- exit_code_for must never report "
                        "success here: " + checks["westResolved"]["detail"])
          print("westResolved: fail (as expected) --", checks["westResolved"]["detail"])
          PY

      # tan-cli#301: a stale `$ZEPHYR_BASE` (Zephyr's own docs, and `tan
      # bootstrap`'s own next-steps text, both tell a customer to export it)
      # and a stale `~/.alp/sdk-default` (left by an earlier `tan sdk switch`)
      # used to leak into a report that was supposed to describe THIS tree --
      # `tan doctor`/`tan bootstrap` naming three different roots in one
      # report and disagreeing about which SDK a bare invocation meant. Both
      # stale pointers here are fabricated, not real checkouts: only their
      # SHAPE matters (a loader-script marker for the SDK, a
      # PYTHON_MINIMUM_REQUIRED for the Zephyr tree) and a value nothing in
      # this real toolchain would coincidentally match (3.99).
      - name: "dirty host 3/3: stale $ZEPHYR_BASE + stale ~/.alp/sdk-default must not leak into the report (tan-cli#301)"
        working-directory: alp-workspace/my-app
        run: |
          set -euo pipefail
          STALE_ZEPHYR="/tmp/unrelated-zephyr-tree/zephyr"
          STALE_SDK="/tmp/unrelated-alp-sdk"
          mkdir -p "${STALE_ZEPHYR}/cmake/modules" "${STALE_SDK}/scripts"
          printf 'set(PYTHON_MINIMUM_REQUIRED 3.99)\n' > "${STALE_ZEPHYR}/cmake/modules/python.cmake"
          touch "${STALE_SDK}/scripts/alp_project.py"

          HOME_ALP="${HOME}/.alp"
          mkdir -p "${HOME_ALP}"
          BACKUP=""
          if [ -f "${HOME_ALP}/sdk-default" ]; then
            BACKUP="${HOME_ALP}/sdk-default.bak-gs"
            mv "${HOME_ALP}/sdk-default" "${BACKUP}"
          fi
          printf '{"sdkPath": "%s", "updatedAt": "1970-01-01T00:00:00Z"}\n' "${STALE_SDK}" > "${HOME_ALP}/sdk-default"
          restore_default() {
            rm -f "${HOME_ALP}/sdk-default"
            if [ -n "${BACKUP}" ]; then mv -f "${BACKUP}" "${HOME_ALP}/sdk-default"; fi
          }
          trap restore_default EXIT

          ZEPHYR_BASE="${STALE_ZEPHYR}" tan doctor --format json > /tmp/gs-dirty-doctor-stale.json
          cat /tmp/gs-dirty-doctor-stale.json

          python3 - "$STALE_ZEPHYR" "$STALE_SDK" <<'PY'
          import json, sys
          stale_zephyr, stale_sdk = sys.argv[1], sys.argv[2]
          e = json.load(open("/tmp/gs-dirty-doctor-stale.json"))
          checks = {c["name"]: c for c in (e.get("data") or {}).get("checks", [])}
          for name in ("sdk", "workspace", "hostPython"):
              if name not in checks:
                  sys.exit(f"::error::no `{name}` check in the report -- renamed or removed since this job was written.")

          sdk_detail = checks["sdk"]["detail"]
          if stale_sdk in sdk_detail:
              sys.exit("::error::`sdk` check named the STALE ~/.alp/sdk-default "
                        f"({stale_sdk}) instead of the real project-pinned alp-sdk -- "
                        f"tan-cli#301: {sdk_detail}")
          if "alp-workspace/alp-sdk" not in sdk_detail:
              sys.exit(f"::error::`sdk` check does not name the real alp-workspace/alp-sdk "
                        f"checkout at all: {sdk_detail}")

          workspace_detail = checks["workspace"]["detail"]
          if stale_zephyr in workspace_detail:
              sys.exit(f"::error::`workspace` check named the STALE $ZEPHYR_BASE tree instead of "
                        f"the real resolved workspace: {workspace_detail}")

          python_detail = checks["hostPython"]["detail"]
          floor_check = checks.get("pythonFloor")
          to_check = [("hostPython", python_detail)]
          if floor_check is not None:
              to_check.append(("pythonFloor", floor_check["detail"]))
          for label, detail in to_check:
              if stale_zephyr in detail:
                  sys.exit(f"::error::`{label}` names the STALE $ZEPHYR_BASE tree ({stale_zephyr}) "
                            f"instead of the real resolved workspace's Zephyr -- tan-cli#301: {detail}")
              if "3.99" in detail:
                  sys.exit(f"::error::`{label}` picked up the fabricated 3.99 floor from the STALE "
                            f"$ZEPHYR_BASE tree -- tan-cli#301: {detail}")

          print("sdk/workspace/hostPython all describe the real tree, not the stale ZEPHYR_BASE/sdk-default:")
          print(" sdk:", sdk_detail)
          print(" workspace:", workspace_detail)
          print(" hostPython:", python_detail)
          PY

      - name: upload first-install logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: first-install-logs
          path: |
            /tmp/gs-bootstrap.json
            /tmp/gs-bootstrap.stderr
            /tmp/gs-print-env.sh
            /tmp/gs-badflag.log
            /tmp/gs-build.log
            /tmp/gs-dirty-doctor-venv-only.json
            /tmp/gs-dirty-build-venv-only.log
            /tmp/gs-dirty-doctor-no-west.json
            /tmp/gs-dirty-doctor-stale.json
          if-no-files-found: warn
