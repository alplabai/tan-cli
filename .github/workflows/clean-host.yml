# SPDX-License-Identifier: Apache-2.0
#
# The clean-host / shipped-artefact gate (tan-cli#278, escalated to a
# v0.5.0-rc3 release-blocker).
#
# ===========================================================================
# WHY THIS FILE EXISTS
# ===========================================================================
#
# Six defects were found by downloading the published v0.5.0-rc2 asset
# `tan-aarch64-apple-darwin` and running four commands on a clean macOS host:
# no alp-sdk checkout, `~/.alp` removed, empty cwd.
#
#   | defect | command that exposes it            |
#   |---|---|
#   | #304 no CA bundle in the freeze          | tan sdk list --online       |
#   | #305 sdk install/switch refuse           | tan sdk install/switch      |
#   | #299 west/westResolved disagree in doctor| tan doctor --format json    |
#   | #292 an unrelated $ZEPHYR_BASE adopted   | tan doctor --format json    |
#   | #302 bootstrap refuses the quickstart layout | tan bootstrap           |
#   | #301 hostPython/pythonFloor read $ZEPHYR_BASE while zephyrWorkspace reads the resolved workspace | tan doctor --format json |
#
# Every one of them would have been caught by the job below, had it existed.
# `getting-started.yml` (tan-cli#207) exercises `tan bootstrap` / `tan init` /
# `tan build` too, but its own header explains why that is a DIFFERENT gate:
# it proves the documented first-install PATH works, from an install.sh
# download plus a real `tan bootstrap`, which by definition never runs on a
# CLEAN host with no SDK reachable at all -- the exact state a customer is in
# for their first three commands, and the state #292/#301/#302 need to
# reproduce. Neither job in that file ever calls a network-dependent tan
# command either, which is why #304 (a CA-trust defect, only visible from a
# PyInstaller freeze, never from a developer's own interpreter) was
# structurally invisible to any CI in this repo until now.
#
# Three of the six are invisible from source and from every unit test:
#
#   * #304 cannot reproduce outside the freeze. A developer's interpreter has
#     OS CA trust; only the frozen binary can lack it.
#   * #292 and #301 depend on AMBIENT HOST STATE ($ZEPHYR_BASE exported by a
#     shell profile, a pre-existing unrelated Zephyr workspace). A hermetic
#     fixture that plants exactly the state the code expects is #286's
#     recorded failure mode -- a probe that passed 77 tests because the
#     helper planted the same wrong layout the probe looked for. See
#     `python/scripts/clean_host_smoke.py`'s own docstring for how the two
#     `$ZEPHYR_BASE` variants below avoid that trap (a genuinely BARE,
#     marker-less directory, not a fabricated Zephyr-shaped fixture).
#
# ===========================================================================
# JUDGEMENT CALLS MADE HERE (the issue asked for them to be argued, not just
# made)
# ===========================================================================
#
# 1. ASSET SOURCE -- build vs. download. The issue says "downloaded release
#    asset", but a pull request has no published release to download.
#    CHOSEN: both, on different triggers.
#      - `freeze-and-smoke` builds the freeze per-platform (exactly what
#        `getting-started.yml` and `release.yml`'s `build` job already do) and
#        runs on every PR/push/manual dispatch -- available PRE-TAG, which is
#        when a defect like these six needs to be caught, before a customer
#        ever sees the tag.
#      - `release-asset-smoke` downloads the actual uploaded asset and runs
#        the identical smoke test, on `release: published` + manual dispatch.
#        COST: this job runs only AFTER `release.yml` has already published
#        the release -- it cannot block the tag, only confirm (or, on
#        failure, signal a retraction -- see the v0.4.0->v0.3.1 precedent in
#        `docs/release-contract.md`) what was already shipped. It is real
#        coverage the build-based job does not have (an upload/download round
#        trip through GitHub Releases, and the EXACT bytes a customer's
#        `install.sh` fetches), but it is confirmation, not a gate on the tag
#        itself.
#
# 2. `sdk list --online` HITS THE REAL GITHUB API, unmocked, deliberately --
#    a mock stops testing CA trust and starts testing the mock. `tan sdk_cmd`
#    has NO auth/token hook for this specific call (`_fetch_releases` sends no
#    Authorization header; unlike `west sdk install --personal-access-token`,
#    which is a DIFFERENT tool's DIFFERENT endpoint and is not this call), so
#    this workflow cannot authenticate it. CHOSEN: retry (see
#    `clean_host_smoke.py:assert_sdk_list_online`, 3 attempts with backoff)
#    against the anonymous per-IP rate limit; if every attempt still comes
#    back an HTTP 403 `rate limit exceeded`, WARN and continue. Any other
#    failure still fails the job.
#
#    REVERSED, on measurement, from this file's original "FAIL LOUDLY, not
#    skip". That call red-X'd three separate runs of PR #303 while nothing was
#    wrong with the artefact: 60 requests/hour is per SOURCE IP, shared across
#    GitHub's runner pool, so what trips it is other tenants' traffic. A gate
#    that goes red for a reason unrelated to its subject stops being read.
#    The exclusion is ONE narrowly-matched condition (403 AND the literal
#    `rate limit`), announced as a workflow warning that names what went
#    unverified -- a `CERTIFICATE_VERIFY_FAILED` (the #304 shape) cannot
#    produce that pair and still fails.
#
#    A token is NOT the fix. `tan` sends no Authorization header, so a
#    workflow-side `GH_TOKEN` is inert; and teaching the CLI to read one is a
#    customer-facing change to a public tool, made for CI convenience, in a
#    job that runs PR-authored code on `pull_request` -- forks included.
#
# 3. "No check both passes and fails on the same subject" (the #299
#    invariant, generalised) is implemented in
#    `clean_host_smoke.py:doctor_check_problems` as a real self-consistency
#    assertion over the parsed envelope -- not a grep for the literal names
#    `westResolved`/`west`. See that function's docstring for exactly what it
#    catches, what it does not, and the false positive an earlier, looser
#    version of this rule produced on THIS repo's real checks (`sdk` matching
#    inside `zephyrSdk`/`zephyrSdkAvailableForHost` -- a different subject
#    that legitimately disagrees on a fresh host) before being tightened.
#
# ===========================================================================
# PLATFORM COVERAGE -- macOS is mandatory, Windows proves nothing about CA
# ===========================================================================
#
# `macos-15` / `macos-15-intel` are where #304 manifested and are mandatory
# here for that reason. `windows-latest` and `ubuntu-latest` are included too
# (cheap, and cover the other five defects on those hosts), but a Windows
# PASS on `sdk list --online` must NOT be read as CA-trust coverage: CPython's
# `ssl` on win32 already calls into the Windows certificate store inside
# `create_default_context()`, a fallback macOS and Linux do not have --
# measured directly on a real Windows freeze with NEITHER `truststore` nor
# `certifi` bundled, `sdk list --online` still succeeded there. That
# discrimination gap is exactly why the shipped v0.5.0-rc2 defect was a macOS
# asset and why `python/tests/conformance/test_packaged_binary.py`'s own CA
# check (structural, not live) says the same thing about the same
# measurement. Windows here proves #299/#301/#302/#305-shaped defects; it
# proves nothing about #304.
#
# ===========================================================================
# WHAT A GREEN RUN OF THIS JOB DOES NOT PROVE
# ===========================================================================
#
#   * That `sdk install`/`sdk switch` work -- #305 says they are REFUSED
#     outright in this build (tracked separately, `sdk_cmd._run_not_ported`);
#     asserting a coded refusal here would test a decision already made
#     elsewhere, not new coverage.
#   * That `sdk list --online` verifies a REAL certificate chain rather than
#     an attacker's -- only that the call succeeds against the real endpoint
#     with the freeze's real trust anchors, on whatever CA infrastructure this
#     runner already trusts.
#   * Anything about `$ZEPHYR_BASE` state that is NOT either "absent" or "a
#     bare directory with zero Zephyr markers" -- `getting-started.yml`
#     section 10's dirty-host-3 step covers the STALE-BUT-ZEPHYR-SHAPED
#     variant (a fabricated `python.cmake` + `sdk-default` pointer) on an
#     already-bootstrapped host; this job's version is deliberately the
#     opposite end of that spectrum (see judgement call 3 above and #286).
#   * `freeze-and-smoke`'s PASS proves nothing about the bytes a customer's
#     `install.sh` actually downloads -- only `release-asset-smoke`, which
#     runs after the tag is already published, does that (see judgement call
#     1).
#   * CA trust, on a run where the anonymous API quota was exhausted. That
#     case now WARNS instead of failing (judgement call 2), so a green X on
#     such a run means "every other assertion passed and the canary did not
#     run" -- the warning, not the checkmark, is what says so. Only an HTTP
#     403 carrying the literal `rate limit` takes that path; every other
#     `sdk list --online` failure is still red.

name: clean-host

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "release-asset-smoke only: tag to test (defaults to the latest published release)"
        required: false
        default: ""
  release:
    types: [published]

# Same rule as ci.yml/getting-started.yml: a newer push to a PR supersedes the
# run in flight; a push-to-main or a release-publish run is never cancelled.
concurrency:
  group: clean-host-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  # Least privilege by default (tan-cli#435). `contents: read` is what the
  # published-asset job actually needs: `gh release view` + `gh release
  # download` against this public repository, reached through `GH_TOKEN` in
  # the step env -- not through a persisted git credential.
  contents: read

jobs:
  # PRE-TAG coverage: builds the freeze itself, exactly like getting-started.yml
  # and release.yml's `build` job do, then runs the four-command clean-host
  # sequence against it. Never runs on `release: published` -- that commit
  # already went through this job as a PR/push, and re-freezing it here would
  # be a second, differently-built lookalike, not new coverage (see the header:
  # only `release-asset-smoke` proves anything about the uploaded bytes).
  freeze-and-smoke:
    if: github.event_name != 'release'
    name: "clean host (freeze): ${{ matrix.asset }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: tan-x86_64-pc-windows-msvc.exe
            ext: .exe
          # Same two macOS labels release.yml uses (macOS 13 is retired, 14 is
          # deprecated) -- keeps the Intel/Apple-silicon pair comparable.
          - os: macos-15-intel
            asset: tan-x86_64-apple-darwin
            ext: ""
          - os: macos-15
            asset: tan-aarch64-apple-darwin
            ext: ""
          - os: ubuntu-latest
            asset: tan-x86_64-unknown-linux-gnu
            ext: ""
            container: python:3.12-slim-bullseye
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Fail fast on the CHECKER's own logic, before spending a freeze on it.
      # No binary, no network -- see clean_host_smoke.py's `selftest()`.
      - name: clean_host_smoke.py selftest (assertion logic only)
        shell: bash
        run: python python/scripts/clean_host_smoke.py --selftest

      # A CLEAN venv, not the runner's shared interpreter -- PyInstaller
      # bundles whatever its hooks can see (measured 34349423 B dirty vs
      # ~13.7 MB clean in release.yml's own header). `.[monitor]` matches
      # release.yml/getting-started.yml: an extra a frozen binary advertises
      # in --help must actually be bundled.
      - name: freeze tan (clean venv)
        if: ${{ !matrix.container }}
        shell: bash
        working-directory: python
        run: |
          set -euo pipefail
          python -m venv .venv-build
          VENV_PY=.venv-build/bin/python
          [ -x "$VENV_PY" ] || VENV_PY=.venv-build/Scripts/python.exe
          "$VENV_PY" -m pip install --quiet --upgrade pip
          "$VENV_PY" -m pip install --quiet ".[monitor]" "pyinstaller>=6.10"
          PYTHON="$VENV_PY" bash scripts/build_binary.sh

      # Old-glibc container, same reasoning as release.yml: freezing on bare
      # ubuntu-latest links its glibc and ships a floor no supported distro
      # meets. `docker run` from a normal job (not a job-level `container:`)
      # so checkout/setup-python keep working on the host.
      - name: freeze tan (python:3.12-slim-bullseye)
        if: ${{ matrix.container }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/python:/src" -v "$PWD/scripts:/scripts:ro" -w /src "${{ matrix.container }}" bash -euc '
            bash /scripts/ci/apt-bounded.sh update -qq
            bash /scripts/ci/apt-bounded.sh install -y -qq --no-install-recommends binutils
            python -m venv /tmp/venv
            /tmp/venv/bin/pip install --quiet --upgrade pip
            /tmp/venv/bin/pip install --quiet ".[monitor]" "pyinstaller>=6.10"
            PYTHON=/tmp/venv/bin/python bash scripts/build_binary.sh
          '

      # The actual gate: --version / doctor / sdk list --online / bootstrap
      # --dry-run, on a genuinely clean HOME + empty cwd, both with and
      # without $ZEPHYR_BASE. See clean_host_smoke.py's module docstring for
      # the full contract; it is the CONSUMER of build_binary.sh's onedir
      # output at dist/tan/tan (or dist/tan/tan.exe), never a rebuild of it.
      # tan-cli#349 moved the executable one level deeper (dist/tan/tan[.exe],
      # not dist/tan[.exe]) -- this job runs it straight out of that folder
      # rather than unpacking the sibling dist/tan.zip/.tar.gz archive, since
      # both are byte-identical to what the archive contains and skipping the
      # unpack step is one less thing that could go wrong here (the archive
      # itself IS covered, separately, by release-asset-smoke below, which has
      # no unpacked folder to fall back to since it starts from the download).
      #
      # `matrix.ext` picks the exact name, NOT `[ -f python/dist/tan/tan ] ||
      # BIN=python/dist/tan/tan.exe` (what this used to be one level up):
      # this step's `shell:` is Git Bash/MSYS on the Windows runner, and
      # MSYS's `[ -f ]` reports TRUE for an extension-less name whenever a
      # same-stem `.exe` exists -- it resolves the PE lookup transparently,
      # the same way `CreateProcess` would. So `[ -f "python/dist/tan/tan" ]`
      # was true with ONLY `tan.exe` on disk, the `||` fallback never ran, and
      # the extension-less path was handed to `clean_host_smoke.py`, whose
      # `Path.is_file()` has no such magic and correctly reported it missing
      # (tan-cli#303 CI finding). The matrix already knows the platform at
      # schedule time -- deriving the name from it is exact and
      # shell-independent; release.yml uses the same `matrix.ext` field for
      # the same reason.
      - name: clean-host smoke (--version / doctor / sdk list --online / bootstrap --dry-run)
        shell: bash
        env:
          TAN_BIN: python/dist/tan/tan${{ matrix.ext }}
        run: |
          set -euo pipefail
          if [ ! -f "$TAN_BIN" ]; then
            echo "::error::expected the freeze at ${TAN_BIN} (matrix ext '${{ matrix.ext }}') but it is missing. Checked only that exact name -- not a [ -f tan ] || [ -f tan.exe ] probe, which MSYS/Git-Bash cannot answer correctly (see the comment above this step)."
            ls -la python/dist/tan 2>/dev/null || ls -la python/dist || echo "python/dist does not exist at all -- the freeze step above did not run or did not produce it."
            exit 1
          fi
          python python/scripts/clean_host_smoke.py --tan "$TAN_BIN"

      # tan-cli#349: the onefile freeze re-extracted ~14 MB per invocation, so
      # EVERY command paid 13-19 s on macOS arm64 (~1.1 s Windows, ~0.4 s
      # Linux) before doing any work. --onedir moved that to install time.
      # This step is how that stays fixed on the platform it was filed
      # against: macOS arm64 is in this matrix and is NOT a host the
      # maintainer can measure by hand -- which is precisely why the fix
      # shipped unverified there. Runs against the same freeze the smoke test
      # above just used, so it costs one process per run and nothing else.
      - name: startup timing (tan-cli#349 onefile regression gate)
        shell: bash
        env:
          TAN_BIN: python/dist/tan/tan${{ matrix.ext }}
        run: python python/scripts/measure_startup.py --tan "$TAN_BIN"

  # POST-PUBLISH confirmation: downloads the asset `install.sh`/`install.ps1`
  # actually fetch and runs the identical smoke test against those exact
  # bytes. Cannot block the tag (release.yml has already published by the
  # time `release: published` fires) -- see the header's judgement call 1 for
  # what this buys over `freeze-and-smoke` and what it costs.
  release-asset-smoke:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    name: "clean host (published asset): ${{ matrix.asset }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          # Asset names mirror release.yml's contract exactly (tan-cli#349):
          # one archive per target, not a raw binary.
          - os: windows-latest
            asset: tan-x86_64-pc-windows-msvc.zip
            ext: .exe
          - os: macos-15-intel
            asset: tan-x86_64-apple-darwin.tar.gz
            ext: ""
          - os: macos-15
            asset: tan-aarch64-apple-darwin.tar.gz
            ext: ""
          - os: ubuntu-latest
            asset: tan-x86_64-unknown-linux-gnu.tar.gz
            ext: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: clean_host_smoke.py selftest (assertion logic only)
        shell: bash
        run: python python/scripts/clean_host_smoke.py --selftest

      # `gh release download`, not a raw curl of a hardcoded URL: the asset
      # NAMES here already mirror release.yml's own contract, and `gh` resolves
      # "latest" the same way `install.sh` does (excludes prereleases unless
      # asked). GH_TOKEN lifts the anonymous rate limit; `contents: read` is
      # enough to list/download public releases.
      - name: download the published asset (${{ matrix.asset }})
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tag="${REQUESTED_TAG:-}"
          if [ -z "$tag" ]; then
            tag="$(gh release view --repo alplabai/tan-cli --json tagName -q .tagName)"
          fi
          echo "testing published asset ${{ matrix.asset }} from tag ${tag}"
          mkdir -p dl
          gh release download "$tag" --repo alplabai/tan-cli \
              --pattern "${{ matrix.asset }}" --dir dl --clobber

      # tan-cli#349: the published asset is now an archive of a --onedir
      # freeze, not a raw executable -- unpack it before the smoke test can
      # run anything. `shutil.unpack_archive` (stdlib, already have Python
      # 3.12 from the setup-python step above) picks zip vs tar.gz from the
      # extension itself, so this one call covers every leg in the matrix
      # without a platform-specific unzip/tar branch. The archive's own
      # top-level entry is `tan/` (see build_binary.sh), so the unpacked
      # binary lands at dl/unpacked/tan/tan[.exe].
      - name: unpack the downloaded archive
        shell: bash
        run: |
          set -euo pipefail
          python -c "import shutil; shutil.unpack_archive('dl/${{ matrix.asset }}', 'dl/unpacked')"
          chmod +x "dl/unpacked/tan/tan${{ matrix.ext }}"

      - name: clean-host smoke against the downloaded asset
        shell: bash
        run: python python/scripts/clean_host_smoke.py --tan "dl/unpacked/tan/tan${{ matrix.ext }}"
