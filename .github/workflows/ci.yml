# SPDX-License-Identifier: Apache-2.0
#
# tan CI — the four cargo gates, plus the two promises nothing else checks:
# that `tan` still builds and passes on every host platform it ships a release
# asset for, and that the declared MSRV is real.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  # Called by release.yml so a tag cannot publish binaries the gates never ran
  # against. Keep this the single definition of the gate set.
  workflow_call:
    inputs:
      sdk_parity:
        description: >
          Also run the python tests that need an alp-sdk checkout (planner
          byte-parity and the planner-binding suite). They SKIP without one --
          282 of 1163 tests, measured -- so a bare run is green while the
          port's most valuable comparison never executes. Off for PRs because
          the parity family shells the SDK orchestrator per example and takes
          minutes; release.yml passes true, where a tag is rare and the minutes
          are the cheapest insurance in the pipeline.
        type: boolean
        default: false

# A newer push to a PR supersedes the run in flight. Never cancel a push-to-main
# run: a rapid second merge would leave the first commit with no CI status.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Platform-independent gates — run once, not per-OS.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          # The action otherwise exports RUSTFLAGS=-D warnings, which would also
          # deny warnings in registry deps and diverge from the local gates. The
          # clippy step below denies warnings explicitly, where it belongs.
          rustflags: ""
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  # tan is a cross-platform CLI whose path handling (os.pathsep env append,
  # .venv discovery, `.exe` suffixes) differs per host — test all three.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: "" # keep parity with the local gates (see the lint job)
      - name: build
        run: cargo build --all-targets --locked
      - name: test
        run: cargo test --locked

  # The PYTHON package is what the 0.5.0 release assets are frozen from, and
  # until this job existed NOTHING in CI ran it: release.yml's `gates` job calls
  # this workflow, so a tag published a PyInstaller freeze of code no CI step had
  # ever imported, let alone tested. The cargo jobs above cannot see it -- they
  # compile a different language in a different directory.
  #
  # Zero failures is the gate, not a count. The suite is still growing as ports
  # land (~1149 passed / 81 skipped / 4 xfailed at the time of writing), and
  # pytest's exit status already means exactly "nothing failed" -- skips and
  # xfails are green. Pinning a number would turn every landed port into a red
  # build.
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # pyproject's requires-python floor
      # `pip install -e ./python` and NOT a hand-listed dependency set: this job
      # must fail when the DECLARED dependencies are wrong, which is the defect
      # that shipped (`tan/cli.py` imports `click.testing`, typer stopped
      # depending on click, and a clean install therefore died at import while
      # every developer machine passed). Installing the package resolves exactly
      # what a customer's `pip install alp-tan` resolves. Extras stay out: the
      # `monitor` extra is optional at runtime by definition, and installing it
      # here would hide a module-scope `import serial` from the gate below.
      - name: install the declared package
        run: pip install -e ./python
      - name: install the test runner
        run: pip install pytest
      # Public repo, so the default token is enough. Only on the release path:
      # see the `sdk_parity` input for why PRs skip it.
      - uses: actions/checkout@v4
        if: ${{ inputs.sdk_parity }}
        with:
          repository: alplabai/alp-sdk
          path: alp-sdk
      - name: enable the SDK-dependent tests
        if: ${{ inputs.sdk_parity }}
        run: echo "ALP_SDK_ROOT=$PWD/alp-sdk" >> "$GITHUB_ENV"
      # The three files that carry a version must agree BEFORE a tag exists,
      # not at tag time -- a mismatch found by release.yml costs a re-tag.
      - name: versions agree
        run: python python/scripts/version_check.py --selftest --self
      # `tests/gates/test_declared_dependencies.py` is the one that makes a
      # broken `pip install` fail CI instead of failing a customer, and
      # `tests/conformance/test_packaged_binary.py` mirrors the frozen
      # artifact's size ceiling. Both are inside `python/tests`, so the whole
      # suite is the selection -- named here so a future narrowing cannot drop
      # them silently.
      - name: pytest
        working-directory: python
        run: python -m pytest tests -q

  # The npm shim's platform -> asset table is DATA in a postinstall script, so
  # nothing compiled it, tested it, or noticed when it drifted: it served the
  # `-gnu` assets while install.sh and the VS Code extension both served `-musl`,
  # which made `npm i -g @alplabai/tan` on a musl distro download a binary that
  # cannot execute -- and the comment beside it claimed all three agreed. The
  # value is fixed; this job is what keeps the three from separating again.
  # Node's own test runner, so there is nothing to install.
  shim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24" # same major release.yml's publish_npm job packs with
      # The FILE, not the directory: `--test <dir>` resolves its argument as a
      # module on node 26 and dies with MODULE_NOT_FOUND, so the directory form
      # would make this job's result depend on the runner image's node.
      - name: pin the platform -> asset mapping
        run: node --test npm-shim/test/libc-mapping.test.js

  # `rust-version` in Cargo.toml is a promise to anyone building from source;
  # a dependency bump can silently break it. Check, don't hope.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: read rust-version from Cargo.toml
        id: msrv
        shell: bash
        run: |
          v="$(grep -m1 '^rust-version = ' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          # An unmatched grep exits 0 through the pipe; without this the job would
          # silently fall back to stable and report green having checked no MSRV.
          [ -n "$v" ] || { echo "::error::no rust-version found in Cargo.toml"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "declared MSRV: $v"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
          rustflags: "" # keep parity with the local gates (see the lint job)
      - name: check on MSRV
        run: cargo check --workspace --all-targets --locked
