# SPDX-License-Identifier: Apache-2.0
#
# tan CI — the Python package job (installs the declared package + runs
# `python/tests`, `ALP_SDK_ROOT`-gated via `sdk_parity`), the npm-shim
# platform-mapping check, and the sdist/wheel build-floor proof.
#
# BRANCH PROTECTION (tan-cli#392, tan-cli#269 -- DONE; tan-cli#439)
# =================================================================
# The repoint this block used to demand has happened. Do not act on an older
# copy of it: it named six contexts, five of which (`lint`, the three
# `test (*)` legs, `msrv`) were cargo jobs on `crates/` that tan-cli#269
# deleted, and it listed the replacements as work still to do.
#
# Re-measured 2026-08-18, `gh api
# repos/alplabai/tan-cli/branches/<b>/protection`. `main` and `dev` require the
# IDENTICAL FIVE contexts, all of which run today:
#
#     seam1 -- plan-shape parity
#     python -- pytest across python/ (ubuntu-latest)
#     python -- pytest across python/ (windows-latest)
#     python -- pytest across python/ (macos-latest)
#     zizmor · workflow security
#
# Four come from parity.yml; `zizmor · workflow security` is THIS file's
# `workflow-security` job. `enforce_admins` is true on both.
#
# ONE INTENTIONAL DIFFERENCE, and it is not cosmetic: `strict` is **true on
# `main`, false on `dev`**. On `main` a PR must be up to date with the base
# before it can merge, so each merge sends the others back for a rebase and a
# full re-run; on `dev` it does not, which is what makes several open PRs
# workable there. Anyone quoting "strict: true" for this repo is quoting
# `main`.
#
# `python` -- this file's own job below -- is deliberately NOT required. It is
# one OS and, on a `pull_request`, `sdk_parity` is false, so it runs with no
# alp-sdk bound and the SDK-gated modules are not even collected. Requiring it
# would gate merges on the weaker half of the suite; the parity.yml trio binds
# `ALP_SDK_ROOT` on all three platforms tan ships assets for. Measure the gap
# rather than trusting a number written here: `python -m pytest --collect-only
# -q` from `python/`, with and without `ALP_SDK_ROOT`.
#
# Re-measure rather than trusting this block; it is a snapshot and this is the
# second time it went stale:
#
#     gh api repos/alplabai/tan-cli/branches/main/protection \
#       --jq '.required_status_checks | {strict, contexts}'
#     gh api repos/alplabai/tan-cli/branches/dev/protection \
#       --jq '.required_status_checks | {strict, contexts}'
#
# Those strings are each job's EVALUATED `name:`; a job with no `name:` reports
# under its job id. Renaming a required job changes the required context and
# blocks every merge until protection is edited to match -- treat them as API.
# Branch protection is a repo SETTING, not a file, and cannot be fixed here.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  # A `dev` merge queue is coming online: without this
  # trigger, a queued PR would wait forever on required contexts
  # (`python -- pytest across python/ (*)`, `zizmor · workflow security`) that
  # `merge_group` events never fire -- this workflow only ran on `push`/
  # `pull_request`/`workflow_call` before, none of which GitHub raises for a
  # merge-queue entry. No job below is gated to `pull_request` specifically
  # (`python` and `workflow-security` carry no job-level `if:` at all), so
  # both required contexts this file produces run unchanged on a
  # `merge_group` event -- verified by reading every `if:` in this file, not
  # assumed.
  merge_group:
  # Called by release.yml so a tag cannot publish binaries the gates never ran
  # against. Keep this the single definition of the gate set.
  workflow_call:
    inputs:
      sdk_parity:
        description: >
          Also run the python tests that need an alp-sdk checkout (planner
          byte-parity and the planner-binding suite). They SKIP without one --
          282 of 1163 tests, measured -- so a bare run is green while the
          port's most valuable comparison never executes. Off for PRs because
          the parity family shells the SDK orchestrator per example and takes
          minutes; release.yml passes true, where a tag is rare and the minutes
          are the cheapest insurance in the pipeline.
        type: boolean
        default: false

# A newer push to a PR supersedes the run in flight. Never cancel a push-to-main
# run: a rapid second merge would leave the first commit with no CI status.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  # Least privilege by default (tan-cli#435). No job here needs a token at
  # all: they check out, build, and run tests. Declared anyway rather than
  # inherited, because the repository default is a SETTING -- it can be
  # widened for an unrelated reason, and this workflow would silently widen
  # with it. `zizmor` reported all three jobs as `excessive-permissions`
  # (medium) for exactly that reason before this block existed.
  contents: read

jobs:
  # The PYTHON package is what the release assets are frozen from, and until
  # this job existed NOTHING in CI ran it: release.yml's `gates` job calls this
  # workflow, so a tag published a PyInstaller freeze of code no CI step had
  # ever imported, let alone tested. The cargo jobs that used to sit above it
  # could not see it -- they compiled a different language in a different
  # directory -- and tan-cli#269 has since deleted them outright. THIS job and
  # parity.yml's `python-tests` matrix are now the whole of the correctness
  # gate; there is nothing else left to hide behind.
  #
  # Zero failures is the gate, not a count. The suite is still growing as ports
  # land (~1149 passed / 81 skipped / 4 xfailed at the time of writing), and
  # pytest's exit status already means exactly "nothing failed" -- skips and
  # xfails are green. Pinning a number would turn every landed port into a red
  # build.
  #
  # tan-cli#372: this is also the ONLY place in CI that runs `python/tests/gates`
  # (which includes the frozen-issue-code delegate `test_frozen_issue_codes.py`)
  # on a non-Linux host -- and it does not, since this job is `ubuntu-latest`
  # only. `parity.yml`'s cross-OS `python-tests` job explicitly
  # `--ignore=tests/gates` (that suite already runs, always, in `parity.yml`'s
  # `seam1-plan-shape` job -- also `ubuntu-latest` only). Recorded as a
  # decision, not an oversight: `tests/gates` is pure source parsing (`ast`
  # over `python/tan/**`, text scans over the same), with no OS-dependent
  # behaviour to lose by staying single-platform -- the path handling it does
  # do is verified platform-clean (`_rel` in `test_frozen_issue_codes.py`
  # normalises `\`->`/`; every cross-file assembled suffix resolves via
  # `_ASSEMBLED_SUFFIXES` regardless of host). Adding a second or third OS here
  # would cost real CI minutes for zero coverage this scan can lose on Windows
  # or macOS specifically. Revisit if a future gate under `tests/gates` reads
  # something host-dependent (a real path separator, a subprocess, PATH
  # resolution) -- that gate would need its own cross-OS run, not a blanket
  # widening of this job.
  python:
    runs-on: ubuntu-latest
    # Two numbers, because this job has two workloads and one flat cap has to
    # be wrong for one of them.
    #
    # `sdk_parity` (declared above, `type: boolean, default: false`) is the
    # whole difference: it switches on the planner byte-parity and
    # planner-binding suites, which SKIP without an alp-sdk checkout -- 282 of
    # 1163 tests. `release.yml`'s `gates` job (which calls this workflow with
    # `sdk_parity: true`) passes true; nothing else does.
    #
    #   PR / merge_group  6-11 min   measured across the last 25 successful
    #                                runs (min 6m; p100 11m, run 32174278683)
    #   release tag         23 min   run 31834718564, `v0.6.0-rc1`
    #                                (1422s = 23.7m)
    #
    # A flat cap taken from the PR measurement passes every PR and then fails
    # the tag, which is the most expensive place in this repo to be wrong. A
    # flat 60 avoids that but leaves the >99% of runs that are PRs held for an
    # hour against an 11-minute p100. The expression gets both: `inputs` is
    # null on `pull_request`/`push`/`merge_group`, so `inputs.sdk_parity` is
    # falsy there and this reads 30; on the `workflow_call` from release.yml it
    # reads 60.
    #
    # 30 rather than 20 on the PR leg: p100 is 11m and trending up (the same
    # trend visible on the release leg, 633s -> 1422s), so 20 is 1.8x headroom
    # on a number that has moved. Both legs stay far under GitHub's own
    # 360-minute default, which is what a hang catcher has to beat.
    #
    # NOTE for tan-cli#854, which generalises `parity.yml`'s timeout gate to
    # every PR-triggered workflow: this value is a STRING expression, not an
    # int. That gate's `isinstance(timeout, int)` assertion has to learn about
    # expressions or it will red on this line.
    timeout-minutes: ${{ inputs.sdk_parity && 60 || 30 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12" # pyproject's requires-python floor
      # tan-cli#503: `tests/commands/test_completion_command.py`'s zsh-driven
      # cases (`test_zsh_format_completion_*`) are `skipif(not zsh on PATH)` --
      # a skip, not a failure, so a runner image that happens to lack zsh
      # would silently stop exercising the real emitted `_zsh_subcmd_scan_snippet`
      # loop and no one would see red for it. Installed explicitly rather than
      # assumed present, so this job's `pytest` run is the thing that actually
      # runs that loop, not a hope about the ubuntu-latest image's contents.
      - name: ensure zsh is on PATH (zsh-driven completion tests)
        run: |
          if ! command -v zsh >/dev/null 2>&1; then
            bash scripts/ci/apt-bounded.sh update
            bash scripts/ci/apt-bounded.sh install -y --no-install-recommends zsh
          fi
      # `pip install -e ./python` and NOT a hand-listed dependency set: this job
      # must fail when the DECLARED dependencies are wrong, which is the defect
      # that shipped (`tan/cli.py` imports `click.testing`, typer stopped
      # depending on click, and a clean install therefore died at import while
      # every developer machine passed). Installing the package resolves exactly
      # what a customer's `pip install alp-tan` resolves. Extras stay out: the
      # `monitor` extra is optional at runtime by definition, and installing it
      # here would hide a module-scope `import serial` from the gate below.
      #
      # Deliberately ASYMMETRIC with python-binaries.yml, which installs
      # `-e ".[monitor]"`: the release artifact carries the extra because a frozen
      # binary cannot gain pyserial later, while this job must keep testing the
      # extras-LESS shape, which is what `pip install alp-tan` gives a customer
      # and the only shape in which `test_declared_dependencies.py` can catch an
      # extras-only import escaping to module scope. Do not "fix" one to match
      # the other.
      - name: install the declared package
        run: pip install -e ./python
      # `pytest-xdist` alongside the runner, not extra: `tests/gates/
      # test_home_preflight.py::test_pytest_configure_skips_the_check_on_an_
      # xdist_worker` needs it PRESENT to prove the `config.workerinput`
      # worker-skip guard at all (it `importorskip`s otherwise) -- this job
      # is one of the two `tests/gates` legs in CI (the other is parity.yml's
      # `seam1-plan-shape`), and before this line neither installed xdist, so
      # that test SKIPPED in every CI leg while reading as covered (#916
      # review, Major 2). Installing it here does not turn `-n`/parallelism
      # on for the rest of this job's `pytest` step below -- xdist only
      # activates under `-n`/`--dist`, neither of which this job passes.
      - name: install the test runner
        run: pip install pytest pytest-xdist
      # Public repo, so the default token is enough. Only on the release path:
      # see the `sdk_parity` input for why PRs skip it.
      #
      # PINNED, and that is the whole point. With no `ref:` this cloned
      # alp-sdk's DEFAULT BRANCH (`dev`), which made the release gate compare a
      # frozen tag against a moving target in ANOTHER repo: the same commit
      # passes today and fails tomorrow because someone landed an alp-sdk
      # change, with nothing here altered. That is exactly how `v0.5.0-rc3`
      # died -- `gates / python` went red on `tan/planner/` drift against
      # alp-sdk `dev`, so `build` and `release` skipped and the tag was spent
      # with no Release behind it (#319).
      #
      # `parity.yml` already pins this same dependency (`PINNED_SDK_TAG`) for
      # exactly this reason. The two MUST be bumped together, or the release
      # gate and the parity gate silently measure different alp-sdks.
      #
      # Bumped from `v0.15.0-rc1` (#319) to `f4d87a1f` for tan-cli#320, and from
      # `f4d87a1f` to THIS commit for tan-cli#485 (#320 recurred) --
      # `parity.yml`'s own `PINNED_SDK_TAG` bumped to the identical
      # `53557a6030c4f90a5525d29c142190e7e91f2bbb` in the same tan-cli#485
      # change, so the "MUST be bumped together" rule two paragraphs up holds
      # again after a brief, deliberate divergence mid-review (an earlier pass
      # of #485 left `PINNED_SDK_TAG` at `f4d87a1f` while moving THIS ref and
      # `python/tests/gates/test_planner_relocation_freshness.py`'s
      # `PINNED_SDK_COMMIT` to `53557a60` together -- correct for the
      # freshness-gate hash check this ref exists to satisfy, but it left
      # `parity.yml`'s `python-tests`/`seam1` jobs, which resolve
      # `ALP_SDK_ROOT` from `PINNED_SDK_TAG` on every `pull_request`/`push`,
      # testing tan against the OLDER `f4d87a1f` -- and alp-sdk `53557a60` is
      # also where `examples/multicore/rpmsg-aen/board.yaml` dropped
      # `cacheable: true`, the exact field tan-cli#485's `loader.py` refusal
      # now rejects, so every non-dispatch parity run went red: 31 failures,
      # all tracing to that one fixture, alp-sdk's own repo unchanged).
      # Re-verified empirically before this final bump: `test_relocated_
      # planner_modules_match_the_pinned_sdk_audit` PASSES bound to
      # `53557a60` (FAILS bound to the old `f4d87a1f`, hash mismatch, since
      # `PINNED_HASHES` moved), and the `test_the_breadth_layer_still_
      # covers_every_board` artefact-count floor (`>= 2900`) is NOT hit at
      # `53557a60` (766 passed / 1 failed / 8 skipped across the whole
      # `test_planner_emit_parity.py` module) -- unlike the `2bc6b400` bump
      # #425 tried and reverted for exactly that floor.
      #
      # `test_an_unresolvable_board_preset_is_a_coded_envelope` in
      # `python/tests/parity/test_planner_emit_parity.py`, which surfaced
      # during this same review (its OWN fixture appended a second `preset:`
      # key onto a board.yaml that already declared one, tripping the new
      # duplicate-key refusal before reaching its intended "unresolvable
      # preset" assertion), is FIXED in the same tan-cli#485 change -- the
      # fixture now substitutes the existing `preset:` value instead of
      # appending a second one. `python/tests/parity/` carried no repo-level
      # freeze (that applied to `crates/`, `contract/`, and `test_oracle_
      # parity.py`'s `CASES` table specifically -- of those three only
      # `contract/` still exists, tan-cli#269), so this was in scope to fix
      # directly rather than route around.
      #
      # Not a tag -- alp-sdk had not cut one past v0.15.0-rc1 at the time of
      # the #320 port; re-pin to a real tag once alp-sdk cuts one at or after
      # this SHA, the same deferred-tag pattern `parity.yml`'s own
      # `PINNED_SDK_TAG` history used while waiting on v0.14.0.
      #
      # `a317330595f744d35f4d785869517110f3678f70` -> `d00dbdc124491c89f6
      # 8f404cd7ac9d26127f038f` for tan-cli#560, in the SAME change as
      # `parity.yml`'s `PINNED_SDK_TAG` and both freshness pins. Carries
      # alp-sdk#1360/#1401: a zephyr slice's six `artifacts` paths now
      # carry the `build/` level `west build` actually writes (`_slice_
      # artifacts` in `buildplan.py`; `orchestrator.py`'s change is
      # comment-only). Also picks up two HAND_PORT deltas that landed in
      # this same range: alp-sdk#1373/#1407 (AEN `choice LOG_MODE /
      # default LOG_MODE_MINIMAL`, `gen_zephyr_board.py`, tan-cli#690) and
      # alp-sdk#1394/#1399 + #1400 (`_derive_pin_doc_renames`'s doc:
      # collision guard, and `_scaffold_cmakelists`'s stale-comment
      # rewrite, both `alp_template.py` -- the latter forces a re-vendor
      # of `python/tan/templates/vendored/`, see its own MANIFEST.md
      # entry). Bound to the OLD ref after this port lands, both
      # `test_planner_relocation_freshness.py` halves fail on the hash of
      # the four moved files, and `test_planner_emit_parity.py`'s
      # scaffold-mode cases diff the ported planner against the pre-fix
      # `scripts/alp_template.py`.
      #
      # Still not a tag, for the same reason as above.
      #
      # Bumped `1a9f753c` -> `a317330595f744d35f4d785869517110f3678f70` for
      # tan-cli#639, in the SAME change as `parity.yml`'s `PINNED_SDK_TAG`.
      # An earlier revision of that PR moved only `parity.yml` and left THIS
      # ref behind -- precisely the divergence the "MUST be bumped together"
      # rule above exists to prevent, and the second time it has happened
      # mid-review (the first is recorded above, during #485). Caught by human
      # review both times; NOTHING asserts the two SHAs match, which is the
      # actual gap and is worth its own gate.
      #
      # `53557a60` -> `f30f4d4b` for tan-cli#543/#425, moved in the SAME change
      # as `parity.yml`'s `PINNED_SDK_TAG`, which is the whole point of the
      # "MUST be bumped together" rule above -- the mid-review divergence that
      # rule was written after (31 red tests, both repos correct) is exactly
      # what a one-sided bump reproduces. That change also carries the
      # `tan/planner/` port these refs exist to measure: alp-sdk#1241's
      # `_chip_has_driver` filter (the `CONFIG_ALP_SDK_CHIP_DP83825=y` divergence
      # that reddened `parity` on eight consecutive dispatch runs), #1331's
      # storage-region bounds check, #1289's SE-owned ATOC reservation, #1278's
      # dead-`cmake-args.txt` removal, and the `template.py`/`hw_info.py`
      # hand-port deltas. Bound to the OLD `53557a60` after that port lands,
      # `test_relocated_planner_modules_match_the_pinned_sdk_audit` fails on the
      # hash of six upstream files, and the emit-parity cases diff the ported
      # planner against the pre-fix `scripts/alp_orchestrate/`.
      #
      # Still not a tag: alp-sdk's newest tag is `v0.15.0` (`e2928b9f`), which
      # PREDATES the six contract-surface commits this bump exists to pick up.
      #
      # `f30f4d4b` -> `ccd34f06` for tan-cli#552/#553/#554/#555/#557/#558/#559/
      # #562/#563, moved in the SAME change as `parity.yml`'s `PINNED_SDK_TAG`
      # and `test_planner_relocation_freshness.py`'s `PINNED_SDK_COMMIT` /
      # `HAND_PORT_PINNED_SDK_COMMIT` -- the "MUST be bumped together" rule
      # above, applied to all four pin sites at once. That change carries the
      # `tan/planner/` port these refs exist to measure: alp-sdk#1345's
      # two-pass carve-out/partition placement + `access_windows:`, #1347's
      # refusing family-table reader + per-family `boot.method:` default, and
      # #1348's Hawkbit URI/units split, log-level choice-symbol form and
      # core-scoped library layer. Bound to the OLD `f30f4d4b` after that port
      # lands, `test_relocated_planner_modules_match_the_pinned_sdk_audit`
      # fails on the hash of six upstream files (and the hand-port test on
      # `scripts/alp_project_loader.py`), and the emit-parity cases diff the
      # ported planner against the pre-fix `scripts/alp_orchestrate/`.
      #
      # `ccd34f06` -> `7d58ef32` for tan-cli#493/#591, again in the SAME change
      # as `parity.yml`'s `PINNED_SDK_TAG` and both freshness pins. It carries
      # alp-sdk#1352 (the #493/#591 fix: AEN board facts read from the SoC
      # JSON's `part` / `family` / the new `zephyr_peripherals_dtsi`, four
      # fail-open paths turned into refusals, and the `atoc`-absent message
      # naming the alp-sdk vintage instead of the consumer's SoM preset) and,
      # unavoidably, alp-sdk#1344's PLANNER half -- #1352 is its child and the
      # `zephyr_peripherals_dtsi` metadata exists nowhere before it. #1344's
      # CONSUMER half (a plan's `postCommands` actually being RUN) is NOT
      # ported: tan-cli#550/#551 stay open.
      #
      # Still not a tag, for the same reason as above.
      #
      # `7d58ef32` -> `1a9f753c` for tan-cli#657/#661/#662, again in the SAME
      # change as `parity.yml`'s `PINNED_SDK_TAG` and both freshness pins.
      # It carries alp-sdk#1362 (the read-only SW-DP IDR wrong-board
      # preflight pair, `expect_dpidr`/`jlink_device`), #1364 (the
      # helper_mcu three-axis projection -- `flash_method`/`flash_args`,
      # `update_channel`, and `flash_policy` no longer suppress one
      # another), and #1374 (`flash_args.slot0_load_address`, tan-cli#353) --
      # see `tests/gates/test_planner_relocation_freshness.py`'s
      # `PINNED_SDK_COMMIT` comment for the full per-commit breakdown of
      # what was ported into `tan/planner/loader.py` / `manifest.py` /
      # `models.py` / `orchestrator.py`.
      #
      # `88318e75` -> `94378a05` for tan-cli#846, again in the SAME change as
      # `parity.yml`'s `PINNED_SDK_TAG` and `PINNED_SDK_COMMIT`. It carries
      # alp-sdk#1535, which is the RETIREMENT CONDITION the `88318e75` hold
      # was written against: that hold existed only because a pin past the
      # `v0.16.0` version bump made the scaffold emit
      # `https://github.com/alplabai/alp-sdk/blob/v0.16.0/docs/...` links
      # while no `v0.16.0` tag exists. #1535 makes `_docs_ref()` require the
      # tag to RESOLVE before pinning to it, so those links degrade to `main`
      # instead of 404ing, and the hold has nothing left to protect. The seven
      # scaffold READMEs the hold's own comment named are re-vendored in this
      # same change. `HAND_PORT_PINNED_SDK_COMMIT` deliberately does NOT move
      # with it -- see that pin's own comment (alp-sdk#1471's
      # `scripts/alp_cli/doctor.py` delta is unported).
      #
      # `94378a05` -> `ac38a069` for tan-cli#868, in the SAME change as
      # `parity.yml`'s `PINNED_SDK_TAG` and `test_planner_relocation_
      # freshness.py`'s `PINNED_SDK_COMMIT` -- the three MUST be bumped
      # together, and `tests/conftest.py`'s tan-cli#691 warning fires when
      # they are not. What moved is an AUDIT: alp-sdk#1485/#1484/#1556 are
      # ported into `tan/planner/` and alp-sdk#1487's chip -> subsystem
      # entries into `slugs.py` (that last one is `HAND_PORT_HASHES`
      # territory, which is why nothing here caught it -- see
      # `PINNED_SDK_COMMIT`'s comment). `HAND_PORT_PINNED_SDK_COMMIT` still
      # does not move.
      #
      # `ac38a069` -> `eb96112b` (tan-cli#891): NOT an audit move this time --
      # the vendored fixtures (`contract/fixtures/toolchains/toolchains.json`,
      # re-vendored from alp-sdk `v0.16.0` by tan-cli#888) and this checkout
      # have to name the same commit, and `eb96112b` is the `v0.16.0` release
      # merge itself. See `parity.yml`'s `PINNED_SDK_TAG` comment for the full
      # per-fixture re-measurement (toolchain-lock/kconfig/bootstrap/scaffold)
      # and the `scripts/alp_orchestrate/**` byte-identity check that keeps
      # this a non-behavioural move for `PINNED_HASHES`.
      # `fetch-tags: true`, not the default no-tags checkout -- same trap and
      # same fix as `parity.yml`'s `clone alp-sdk` step (see that step's
      # comment for the full measurement). This checkout feeds `pytest tests
      # -q` under `ALP_SDK_ROOT`, and any test that reaches
      # `tan.planner.template._docs_ref()` against this bound root sees a
      # `blob/main/`/`tree/main/` degrade instead of `blob/v0.16.0/`/
      # `tree/v0.16.0/` unless the checkout can resolve the `v0.16.0` tag from
      # its LOCAL refs -- `_tag_resolves()` (issue #1508 / alp-sdk#1535) makes
      # no network call, by design, so a tagless clone here silently disagrees
      # with the vendored scaffold tree `parity.yml` already proved matches a
      # tagged one. `fetch-depth: 0` is not needed for the same reason it
      # is not needed there: `git fetch --tags` pulls every tag regardless of
      # depth, and `v0.16.0` points AT this commit.
      #
      # OWED MOVE, STILL NOT MAKEABLE (tan-cli#791). None of the three bumps
      # above carry ADR-0028's artefacts -- they moved this pin for reasons
      # unrelated to the model-engine relocation. This checkout still predates
      # every artefact ADR-0028 publishes on the alp-sdk side -- `npu_toolchain.
      # vela` in `metadata/socs/**` (alp-sdk `fff41087`), the `metadata/
      # npu_ops/**` op-support tables, the deletion of `scripts/alp_model/`
      # with the regenerated C fixtures that names (`ab6968e2`), and the
      # public `tests/fixtures/models/person_detect_int8.tflite` real-model
      # fixture (`4fd5fab5`). All four land together in alplabai/alp-sdk#1470,
      # which is still OPEN, so there is no post-merge SHA to move this `ref:`
      # to yet. Until there is, twelve tests under `python/tests/model/` SKIP
      # against this checkout instead of failing against it, each naming the
      # one artefact it is missing (`python/tests/conftest.py`'s capability
      # predicates). Move this `ref:` -- in the same change as `parity.yml`'s
      # `PINNED_SDK_TAG` and both freshness pins, as always -- onto an alp-sdk
      # commit carrying `npu_toolchain.vela`, in the SAME merge window as
      # alp-sdk#1470. A pin left behind after #1470 merges leaves the whole
      # relocated model engine unmeasured while this job still reports green,
      # which is the one outcome this job exists to prevent.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ inputs.sdk_parity }}
        with:
          persist-credentials: false
          repository: alplabai/alp-sdk
          ref: eb96112ba7d1cc3b4084c985962ea31772177d74
          fetch-tags: true
          path: alp-sdk
      # The binding is ASSERTED, not assumed (tan-cli#392). `tests/conftest.py`
      # `sdk_root()` accepts a root only when `scripts/alp_project.py` is a
      # file under it, and returns `None` for every other outcome -- an
      # unreachable path, a partial clone, a checkout that landed elsewhere.
      # `None` is a per-module SKIP, which pytest reports as green: this whole
      # `sdk_parity` input exists to stop the SDK-gated tests self-skipping,
      # and without this line a broken checkout would silently restore exactly
      # the state it was added to fix, on the release path, where it costs a
      # tag. Same shape as parity.yml's own node-id PASSED assertion
      # (tan-cli#308) -- a skip has to be a hard failure wherever the job is
      # the one place arming the root.
      - name: enable the SDK-dependent tests
        if: ${{ inputs.sdk_parity }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$PWD/alp-sdk/scripts/alp_project.py" ]; then
            echo "::error::sdk_parity is on, but $PWD/alp-sdk has no scripts/alp_project.py -- tests/conftest.py::sdk_root() would return None and every SDK-gated test would SKIP while this job still reported green. Fix the alp-sdk checkout step above."
            exit 1
          fi
          echo "ALP_SDK_ROOT=$PWD/alp-sdk" >> "$GITHUB_ENV"
      # The three files that carry a version must agree BEFORE a tag exists,
      # not at tag time -- a mismatch found by release.yml costs a re-tag.
      - name: versions agree
        run: python python/scripts/version_check.py --selftest --self
      # `tests/gates/test_declared_dependencies.py` is the one that makes a
      # broken `pip install` fail CI instead of failing a customer, and
      # `tests/conformance/test_packaged_binary.py` mirrors the frozen
      # artifact's size ceiling. Both are inside `python/tests`, so the whole
      # suite is the selection -- named here so a future narrowing cannot drop
      # them silently.
      - name: pytest
        working-directory: python
        run: python -m pytest tests -q

  # The npm shim's platform -> asset table is DATA in a postinstall script, so
  # nothing compiled it, tested it, or noticed when it drifted. It has drifted
  # in BOTH directions: it once served `-gnu` while install.sh and the VS Code
  # extension served `-musl` (a musl host downloaded a binary that could not
  # execute), and from v0.5.0 the correct answer reversed -- PyInstaller cannot
  # produce the static `-musl` artefact the retired Rust target did, so Linux is
  # `-gnu` again. This job is what keeps the shim, install.sh and the contract
  # doc from separating, whichever direction is currently correct.
  # Node's own test runner, so there is nothing to install.
  shim:
    runs-on: ubuntu-latest
    # Under a minute on every run sampled, PR and release tag alike. 10 is a
    # hang catcher for the pip install, not a budget.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24" # same major release.yml's publish_npm job packs with
      # The FILE, not the directory: `--test <dir>` resolves its argument as a
      # module on node 26 and dies with MODULE_NOT_FOUND, so the directory form
      # would make this job's result depend on the runner image's node.
      - name: pin the platform -> asset mapping
        run: node --test npm-shim/test/libc-mapping.test.js

  # `build-system.requires` is a promise to anyone building the sdist/wheel
  # themselves -- a downstream packager, a distro, an offline mirror -- and
  # until this job existed NOTHING in CI stood behind it. Every other Python
  # step in every workflow here installs WITH build isolation, which makes pip
  # fetch that day's newest setuptools and ignore the declared floor entirely,
  # so `requires = ["setuptools>=68"]` sat green for two years while setuptools
  # 68 could not parse this project's own `license = "Apache-2.0"` at all
  # (tan-cli#382). Same shape as the `msrv` job below: read the declared floor,
  # install exactly it, and prove the promise instead of hoping.
  #
  # `--no-build-isolation` is the whole point -- with isolation this job would
  # measure PyPI's newest setuptools, which is what every other job already
  # measures.
  wheel-floor:
    runs-on: ubuntu-latest
    # Under a minute on every run sampled. Same reasoning as `shim` above.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12" # pyproject's requires-python floor
      # Derived, never hardcoded: a pin written here would be a SECOND place to
      # update, and the pair going stale is the same class of defect as the
      # untested bound itself. tomllib rather than grep so reformatting
      # `requires` across lines cannot silently stop matching.
      - name: read the declared setuptools floor
        id: floor
        shell: bash
        run: |
          v="$(python -c 'import re,tomllib;r=tomllib.load(open("python/pyproject.toml","rb"))["build-system"]["requires"];s=next(x for x in r if x.startswith("setuptools"));m=re.search(r">=\s*([0-9][0-9.]*)",s);print(m.group(1) if m else "")')"
          # A floor with no `>=` (an unpinned `"setuptools"`, or a `~=`/`>` form)
          # would leave $v empty and `pip install setuptools==` would then be a
          # syntax error blamed on pip. Fail here, where the cause is legible.
          [ -n "$v" ] || { echo "::error::no >= bound for setuptools in python/pyproject.toml build-system.requires"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "declared setuptools floor: $v"
      - name: build the wheel at the declared floor
        shell: bash
        run: |
          pip install "setuptools==${{ steps.floor.outputs.version }}" wheel
          pip wheel --no-deps --no-build-isolation -w dist-floor ./python
      # Anti-tautology guard. Without it the step above proves only "some
      # setuptools works", and would stay green if `--no-build-isolation` were
      # ever dropped, if the pin silently failed to downgrade, or if the license
      # metadata were quietly reverted to the `{ text = ... }` form that needs no
      # floor at all. 68.1.2 is the exact version tan-cli#382 was reported
      # against; it predates PEP 639 permanently, so unlike a "floor minus one"
      # pin it never needs re-deriving when the floor moves.
      #
      # The failure MESSAGE is asserted, not just the exit code: a missing
      # `wheel` module or a network blip also exits non-zero, and a negative
      # check that passes for the wrong reason is worse than no check.
      - name: and that floor is not decorative
        shell: bash
        run: |
          pip install "setuptools==68.1.2" wheel
          if pip wheel --no-deps --no-build-isolation -w dist-below ./python >below.log 2>&1; then
            cat below.log
            echo "::error::setuptools 68.1.2 built the wheel -- the declared floor is higher than it needs to be, or the license metadata no longer needs one"
            exit 1
          fi
          grep -q 'project.license' below.log || {
            cat below.log
            echo "::error::the below-floor build failed, but not on project.license -- this check is no longer measuring what it claims"
            exit 1
          }
          echo "setuptools 68.1.2 rejects project.license, as it must"

  # The workflows audit themselves (tan-cli#435). Nothing else in this
  # repository reads `.github/workflows/`, so before this job a security
  # regression there -- a `uses:` back on a mutable tag, a checkout that leaves
  # its credential behind, a job that inherits write, a `client_payload` field
  # interpolated into a shell -- landed green and stayed until someone thought
  # to look.
  #
  # THE VERDICT IS FALSIFIABLE, which is the part worth checking before
  # trusting it. Same rule set, zizmor 1.29.0, `--no-config` (NOT this job's
  # own `run:` invocation below -- that one loads `.github/zizmor.yml`, and
  # since tan-cli#899 the workflows themselves also carry two inline
  # `# zizmor: ignore[...]` comments). `--no-config` strips the CONFIG FILE
  # ONLY -- it does NOT strip inline ignores, measured: `--no-config
  # --min-severity medium --no-online-audits .github/workflows/` on this
  # tree is `rc=0, 18 ignored, 58 suppressed` (re-run for the current count,
  # don't trust this one -- it drifts with the tree; only the with/without
  # `--no-config` agreement is load-bearing), the inline ignores still
  # honoured. The `dev @ 01374d4` snapshot below is comparable for a
  # different reason: it PRE-DATES tan-cli#899, so it carries neither the
  # config-file ignores nor the inline ones -- not because `--no-config`
  # would strip the inline ones if it were run on this tree. Stripping
  # inline ignores too needs `--no-ignores`, per `.github/zizmor.yml`'s own
  # NON-VACUITY recipe:
  #
  #   this tree      rc=0    no finding at or above medium
  #   dev @ 01374d4  rc=14   63 unpinned-uses, 26 artipacked,
  #                          12 excessive-permissions, 6 template-injection
  #
  # So it fails on every class the PR that introduced it fixed, not merely on
  # nothing. This is `.github/zizmor.yml`'s own NON-VACUITY measurement, not
  # a second one taken here -- and it is NOT the recipe for checking whether
  # THIS file's own suppressions (the `run:` step below, with its config and
  # inline ignores loaded) are still catching something real. For that,
  # `.github/zizmor.yml`'s header names `--no-ignores`.
  workflow-security:
    name: zizmor · workflow security
    runs-on: ubuntu-latest
    # This job's `name:` IS the fifth required context, and it was the one
    # tan-cli#812 left unbounded while closing the other four (all of which
    # come from parity.yml). A wedged run here holds the PR for GitHub's
    # 360-minute default. Measured under a minute: pip install plus a
    # hermetic `--no-online-audits` pass over .github/workflows/.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # PINNED, for the same reason the actions above are: a linter that
      # resolves live decides this gate's verdict on its own schedule, and a
      # new audit landing upstream would redden an unrelated PR. Moving it is
      # a reviewed edit here -- Dependabot does not see a version inside a
      # `run:` step.
      - name: install zizmor
        run: pip install "zizmor==1.29.0"
      # `--min-severity medium`, and NOT also `--min-confidence medium`: all 26
      # `artipacked` findings are Low confidence, so adding that flag silently
      # drops the whole credential-persistence audit. Measured, not assumed.
      #
      # `--no-online-audits` keeps the gate hermetic: no token, no API, no
      # rate limit deciding whether CI is green. Verified to reach the same
      # verdict as a networked run on this tree.
      #
      # That agreement does NOT extend to the two `artipacked` sites this
      # gate must still catch if their suppression ever slipped --
      # `planner-resync.yml`'s and `release.yml`'s `dev` checkouts, each
      # carrying its own inline `# zizmor: ignore[artipacked]` comment
      # (tan-cli#899). Measured, with both comments removed:
      # `--no-online-audits` reports `rc=13` (the two now-unsuppressed
      # `artipacked` findings, at medium), while a real networked run reports
      # `rc=0` -- opposite verdicts at exactly those sites, not the same one.
      # Offline being the STRICTER direction there is the safe way for a
      # hermetic gate to err, so it does not undermine this job running
      # without a token; it does mean "same verdict as networked" is a
      # property of the reviewed, suppressed tree, not a guarantee that
      # survives a suppression going missing.
      #
      # The baseline is `.github/zizmor.yml`, picked up automatically. Since
      # tan-cli#899 it holds no `rules.*.ignore` entries of its own -- `rules:
      # {}` is a required stub, not policy. Both suppressions now live inline,
      # at the steps they excuse; the reviewed count is kept current in
      # `.github/zizmor.yml`'s own header, under INVENTORY (not this file's --
      # this job only runs the audit `.github/zizmor.yml` configures).
      - name: audit .github/workflows
        run: zizmor --min-severity medium --no-online-audits .github/workflows/
      # `.github/zizmor.yml`'s header keeps a hand-maintained INVENTORY of
      # the inline `artipacked` suppressions (tan-cli#899) so a reviewer can
      # audit both in one place. That INVENTORY can drift from the tree in
      # TWO different ways -- tan-cli#919 round 3 found the guard against a
      # COUNT drift itself disagreeing with zizmor, in BOTH directions, no
      # matter how it was patched: three prior rounds each closed three
      # evasions and opened five more, because
      # `python/tests/gates/test_zizmor_inventory_count.py` modelled a step
      # by YAML INDENTATION while zizmor actually associates an inline
      # `# zizmor: ignore[...]` comment with the finding's LINE RANGE (the
      # whole step, indentation irrelevant) -- a different model of what a
      # step is, not a fixable regex bug. That gate is deleted;
      # `python/scripts/check_zizmor_inventory.py` (below) asks zizmor
      # itself instead of re-implementing its comment association, so it
      # cannot disagree with zizmor's verdict -- it IS zizmor's verdict.
      # tan-cli#929 then found the COUNT check alone still passes when a
      # step is simply RENAMED (two renamed-past-each-other sites count the
      # same) -- see that script's own docstring and `.github/zizmor.yml`'s
      # `DRIFT THIS INVENTORY CATCHES, AND HOW` section for the `id:`-keyed
      # fix.
      #
      # `--no-ignores` strips every inline ignore and re-surfaces the
      # `artipacked` findings they were suppressing (`.github/zizmor.yml`'s
      # own NON-VACUITY recipe). On a tree with real suppressions to strip
      # that exits 14 by design -- findings at or above `--min-severity
      # medium` is the expected SUCCESS path for this probe, not a failure,
      # so the step does not fail on zizmor's exit code; it fails only on
      # `check_zizmor_inventory.py`'s own exit status.
      - name: inline artipacked suppressions match the zizmor.yml INVENTORY
        run: |
          set +e
          zizmor --min-severity medium --no-online-audits --no-ignores --format json .github/workflows/ \
              >"$RUNNER_TEMP/no-ignores.json" 2>"$RUNNER_TEMP/no-ignores.log"
          rc=$?
          set -e
          cat "$RUNNER_TEMP/no-ignores.log"
          python3 python/scripts/check_zizmor_inventory.py \
              "$RUNNER_TEMP/no-ignores.json" .github/zizmor.yml "$rc"
