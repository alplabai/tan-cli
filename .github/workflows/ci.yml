      #
      # `eb96112b` -> `722320a1` (tan-cli#996/#1001), moved in the SAME
      # change as `parity.yml`'s `PINNED_SDK_TAG` and
      # `PINNED_PLANNER_ORACLE_SDK_REF` and `test_planner_relocation_
      # freshness.py`'s `PINNED_SDK_COMMIT` / `HAND_PORT_PINNED_SDK_COMMIT` --
      # see `parity.yml`'s `PINNED_SDK_TAG` comment for the full
      # per-fixture re-measurement.
      #
      # `f1b1c9df` -> `0914da38` (tan-cli#1103), moved in the SAME change as
      # `parity.yml`'s `PINNED_SDK_TAG` / `PINNED_PLANNER_ORACLE_SDK_REF` and
      # `test_planner_relocation_freshness.py`'s `PINNED_SDK_COMMIT` /
      # `HAND_PORT_PINNED_SDK_COMMIT` -- see `parity.yml`'s `PINNED_SDK_TAG`
      # comment for the full per-fixture re-measurement. `tests/fixtures/
      # planner_oracle/` WAS re-captured against `0914da38` (required to
      # keep `PINNED_PLANNER_ORACLE_SDK_REF` and `PROVENANCE.txt` in the
      # lockstep `test_planner_oracle_ref_tracks_pinned_sdk_tag.py`
      # enforces), but this move's own
      # `scripts/alp_orchestrate/{kconfig,topology,validate}.py` delta is
      # NOT a byte-emission change: no `test_planner_emit_parity` board
      # exercises the new `os: baremetal` stock-token refusal
      # (`validate.py`) or the `isinstance` guards (`kconfig.py`/
      # `topology.py`, already present on tan's side via `tan.core.os_class`,
      # tan-cli#870/#914/#957/#962), so the recapture is a zero-file diff --
      # only `PROVENANCE.txt`'s own `alp-sdk ref` line moved.
      # `0914da38` -> `ff27f179` (tan-cli#1151, the #1118 re-sync), moved in
      # the SAME change as `parity.yml`'s `PINNED_SDK_TAG` /
      # `PINNED_PLANNER_ORACLE_SDK_REF` and
      # `test_planner_relocation_freshness.py`'s `PINNED_SDK_COMMIT` /
      # `HAND_PORT_PINNED_SDK_COMMIT` -- see `parity.yml`'s `PINNED_SDK_TAG`
      # comment for the full per-fixture re-measurement. Unlike the two
      # moves above, this one IS a byte-emission change: alp-sdk#1855
      # rewrites bare alp-sdk-tree paths in `--emit scaffold` output, so
      # `python/tan/templates/vendored/` was re-vendored (9 files) and 17
      # `DELIBERATE_EDITS` retired in the same change. The planner oracle
      # recapture is still a zero-file diff -- that fixture does not capture
      # the scaffold emit.
      #
      # KEEP THE `ref:` LINE DIRECTLY UNDER `repository:` -- no comment
      # between them. `python/scripts/pin_move_verify.py`'s
      # `_CI_SDK_PARITY_REF` matches the two lines as an adjacent pair and
      # refuses ("found 0 readable") rather than guessing if anything is
      # inserted; putting this note between them is exactly how that broke
      # in tan-cli#1151's first cut, caught by
      # `tests/scripts/test_pin_move_verify.py::
      # test_extract_ci_sdk_parity_ref_against_the_real_file`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ inputs.sdk_parity }}
        with:
          persist-credentials: false
          repository: alplabai/alp-sdk
          ref: ff27f179c3baa9e04e8b6a536a4e0b8cee7be7b2
          fetch-tags: true
          path: alp-sdk
      # The binding is ASSERTED, not assumed (tan-cli#392). `tests/conftest.py`
      # `sdk_root()` accepts a root only when `scripts/alp_project.py` is a
      # file under it, and returns `None` for every other outcome -- an
      # unreachable path, a partial clone, a checkout that landed elsewhere.
      # `None` is a per-module SKIP, which pytest reports as green: this whole
      # `sdk_parity` input exists to stop the SDK-gated tests self-skipping,
      # and without this line a broken checkout would silently restore exactly
      # the state it was added to fix, on the release path, where it costs a
      # tag. Same shape as parity.yml's own node-id PASSED assertion
      # (tan-cli#308) -- a skip has to be a hard failure wherever the job is
      # the one place arming the root.
      - name: enable the SDK-dependent tests
        if: ${{ inputs.sdk_parity }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$PWD/alp-sdk/scripts/alp_project.py" ]; then
            echo "::error::sdk_parity is on, but $PWD/alp-sdk has no scripts/alp_project.py -- tests/conftest.py::sdk_root() would return None and every SDK-gated test would SKIP while this job still reported green. Fix the alp-sdk checkout step above."
            exit 1
          fi
          echo "ALP_SDK_ROOT=$PWD/alp-sdk" >> "$GITHUB_ENV"
      # The three files that carry a version must agree BEFORE a tag exists,
      # not at tag time -- a mismatch found by release.yml costs a re-tag.
      - name: versions agree
        run: python python/scripts/version_check.py --selftest --self
      # `tests/gates/test_declared_dependencies.py` is the one that makes a
      # broken `pip install` fail CI instead of failing a customer, and
      # `tests/conformance/test_packaged_binary.py` mirrors the frozen
      # artifact's size ceiling. Both are inside `python/tests`, so the whole
      # suite is the selection -- named here so a future narrowing cannot drop
      # them silently.
      - name: pytest
        working-directory: python
        env:
          # `test_module_size_budget_log_append_only.py`'s base-ref
          # discovery (tan-cli#970 review, blocker 2): this job triggers on
          # `merge_group` (see the `on:` block above), and GitHub Actions
          # does not populate `GITHUB_BASE_REF` for that event (only
          # `pull_request`/`pull_request_target`) -- without this, a
          # `merge_group` run would hit that gate's `BaseRefUnresolved` and
          # fail loudly (by design) instead of resolving a real base. Empty
          # on every other trigger (`push`, `workflow_call`), which is
          # exactly when that gate's own fallback -- no PR/merge-queue base
          # applies to this run -- is the correct answer.
          TAN_MERGE_GROUP_BASE_REF: ${{ github.event.merge_group.base_ref }}
        run: python -m pytest tests -q

  # THE OTHER HALF OF THE INTERPRETER POLICY (tan-cli#1126). The `python` job
  # above pins `"3.12"`, the `requires-python` FLOOR; `parity.yml`'s
  # `seam1-plan-shape` floats `"3.x"`, the CEILING -- see that job's own
  # `python-version` block for why the spread is deliberate and what it has
  # caught. This job closes the hole the spread had: seam1's selection is
  # `tests/gates` plus two `tests/parity` seam files (`test_seam1_field_diff`,
  # `test_seam1_tan_reconciliation`) and the SDK emit/kconfig/bootstrap parity
  # steps -- NOT the whole suite, and in particular not `tests/core`. So for
  # two tests the full suite was RED on 3.14.7 while every required context
  # stayed green, and it stayed that way until somebody happened to run the
  # whole suite on the newer interpreter by hand. A check that cannot report
  # the thing it exists to catch is the shape this milestone has spent a week
  # removing.
  #
  # So: the same floating `"3.x"`, the WHOLE suite, one ubuntu leg. Not a
  # matrix -- the cross-OS dimension is already covered at the floor by
  # parity.yml's 15-leg `python-tests-shard`, and this job is answering a
  # different question ("does the newest interpreter agree with the floor?"),
  # which one host answers as well as three for a repo whose interpreter-
  # dependent surface is pure `pathlib`/`ntpath` string logic. Three of the
  # FOUR known divergences to date (`_IGNORED_ERRNOS`, `Path.resolve
  # (strict=False)` symlink loops, `ntpath.isabs`, and -- found in PR #1137's
  # review -- `tan/core/bootstrap.py`'s `resolve_workspace_target`, where a
  # rooted-but-driveless `--workspace` relocates a checkout on 3.12.3 and
  # raises from 3.13.15 on) were measured identically on POSIX for exactly
  # that reason. The fourth is a real, user-visible product divergence with no
  # test pinning it, filed separately; this job cannot report what nothing
  # asserts, which is the standing limit on what any interpreter leg buys.
  #
  # ON THE RELEASE PATH THIS JOB DOES NOT RUN -- `if:` below, and the
  # `skip_ceiling_interpreter` input at the top of this file, which
  # `release.yml`'s `gates` call passes `true`. The float's cost is paid on
  # PRs and in the merge queue, where a red is re-runnable and a fix is
  # cheap; on a tag the same red spends the tag (`v0.5.0-rc3` / #319 is the
  # precedent, for the same shape with alp-sdk `dev` in place of CPython).
  # A tag therefore ships tested at the FLOOR, which is the interpreter the
  # `requires-python` promise is anchored on -- and the ceiling verdict for
  # that same code already exists, from the PR and merge-queue runs that
  # merged it.
  #
  # NOT `continue-on-error`, and deliberately so. A non-blocking divergence
  # reporter is the same silent shape in a new costume: it would go orange in
  # a corner of the checks list and be scrolled past. When a new CPython minor
  # ships and reds this job on an unrelated PR, that is the policy working --
  # fix the code, or record an explicit exception with a reason. Do not pin
  # this to a version to make it quiet; pinning is a decision that belongs in
  # `python/tests/gates/test_interpreter_policy.py`, where it has to be stated.
  #
  # Kept deliberately CLOSE to the `python` job's shape -- same zsh install,
  # same `pip install -e ./python`, same whole-`tests` selection -- because a
  # divergence reporter that runs a DIFFERENT selection than the job it is
  # compared against cannot tell "3.14 disagrees" from "these two jobs do not
  # run the same thing".
  #
  # WHAT IT DOES NOT COVER, stated plainly rather than implied by the word
  # "whole". The SELECTION is the whole suite (`pytest tests`), but this job
  # binds no fixture roots, so measured on 3.14.7: 7673 collected, 1365
  # skipped (17.8%), which splits into THREE groups, not two:
  #
  #     696 (9.1%)  name `ALP_PLANNER_ORACLE_ROOT`
  #     572 (7.5%)  name `ALP_SDK_ROOT`/`ALP_SDK_PARITY_ROOT` (or "a real
  #                 alp-sdk checkout")
  #      97 (1.3%)  ordinary host/toolchain gates -- Windows-only
  #                 `install.ps1`, vela, tflite, a not-yet-built binary,
  #                 `ALP_SDK_INTERNAL`, `ALP_DRPAI_TVM_HOME`, `ALP_E2E_ROOT`
  #                 -- which every leg skips alike, at every interpreter
  #
  # (Classification rule, so the number is reproducible: `pytest -rs`, oracle
  # first, then SDK, then everything else. An earlier draft of this comment
  # said "1268 SDK-gated", which merged the first two groups and made
  # `ALP_SDK_ROOT` look like it closes 16.5% when it closes 7.5%. It also
  # called them "tests about another repository", which was wrong in a
  # different way: they exercise `tan/planner/`'s OWN relocated code and need
  # a bound checkout only as DATA.)
  #
  # So the honest claim is: the ceiling runs the fixture-free ~82%, and the
  # planner families are measured at the FLOOR only.
  #
  # Not fixed here, deliberately, and NOT for the reason an earlier draft
  # gave. That draft said binding would add "a THIRD copy of the alp-sdk pin",
  # which is false twice over: there are already three literal SHAs
  # (`ci.yml:535`, `parity.yml:683`, `parity.yml:779`), and binding needs NO
  # copy at all -- `getting-started.yml:318-328` and
  # `unsharded-python-canary.yml:170` read `PINNED_SDK_TAG` out of
  # `parity.yml` with `sed` at runtime, and the first of those even errors
  # with "do NOT add a second copy of the SHA here". The real reasons:
  #
  #   * a single `ALP_SDK_ROOT` bind buys 7.5%, not the 18% the merged number
  #     suggested. The BIGGER half needs `ALP_PLANNER_ORACLE_ROOT`, and that
  #     one wants a checkout at `PINNED_PLANNER_ORACLE_SDK_REF` specifically
  #     -- a SECOND pin. (`parity.yml:697-698` names both pins and the
  #     lockstep rule between them; `parity.yml:2377` and `:2897` are the
  #     checkouts that consume the oracle one. NOT
  #     `tests/fixtures/planner_oracle/PROVENANCE.txt`, which an earlier
  #     draft cited: that file records the resolved SHA and names
  #     `PINNED_SDK_TAG`, never `PINNED_PLANNER_ORACLE_SDK_REF`.) So closing
  #     the gap properly is two roots and two pins, not one env var.
  #   * a ceiling job wired to both doubles this job's coupling to alp-sdk
  #     state, for families the floor already covers -- and a red arriving
  #     from that coupling is, at a glance, indistinguishable from the
  #     interpreter verdict this job exists to deliver. That is the failure
  #     `clean-host.yml:86-87` names: "A gate that goes red for a reason
  #     unrelated to its subject stops being read." This job's whole value is
  #     that its red means one thing.
  #
  #     Stated at its real size, because an earlier draft of this bullet
  #     overclaimed: the specific tan-cli#895 failure it leaned on -- the two
  #     pins DISAGREEING, which cost 19 cases across 19 boards on all three
  #     OSes after two sign-offs -- is now caught unconditionally by #895's
  #     own fix, `tests/gates/test_planner_oracle_ref_tracks_pinned_sdk_tag
  #     .py`, measured at `28 passed` with neither root bound. A pin
  #     disagreement therefore reds in the plain local bar before any job
  #     sees it, and a two-root ceiling job would never be the first or only
  #     place it surfaced. Bullets 1 and 3 carry this decision on their own;
  #     this one is the smaller point that the ceiling job's red should mean
  #     one thing, not the historical incident.
  #   * the families are also the slow ones -- `parity.yml` shards them four
  #     ways per OS with a dedicated `parity, whole` leg beside that -- and
  #     they already run per push at the floor, `ALP_SDK_ROOT`-bound, on
  #     three OSes. Unmeasured on the CEILING, not unmeasured.
  #
  # Revisit if a planner-family divergence is ever found across interpreters;
  # that changes the trade, and nothing here should be read as claiming it
  # cannot happen.
  #
  # The size-ratchet/version checks are omitted for a different and settled
  # reason: they are genuinely interpreter-independent (`ast` over source,
  # JSON compare), measured `already matches the measured tree` under 3.12.3,
  # 3.13.15 and 3.14.7 alike, and they already run in the `python` job.
  #
  # This job's first real signal was worth reading, and it has since been
  # acted on. 3.14.7 emits `DeprecationWarning: pathlib.PurePath.as_uri() is
  # deprecated and scheduled for removal in Python 3.19`, and the same for
  # `nturl2path`. Both were filed rather than hidden in a `filterwarnings`
  # (tan-cli#1140), and the halves resolved differently:
  #
  #   * `PurePath.as_uri()` WAS the exporter `tan/core/uri_reference.py` is
  #     built on -- its output is the SARIF `artifactLocation.uri` -- so the
  #     removal would have broken the envelope surface. That module now
  #     carries the body itself (`_absolute_path_to_file_uri`); the emitted
  #     bytes are pinned identical per input, on whichever interpreter runs.
  #   * `nturl2path` STAYS, in one test, deliberately. It is the only
  #     spelling that performs the Windows conversion from a POSIX host, and
  #     two of the three platforms that suite runs on are POSIX
  #     (`parity.yml:2284`); `urllib.request` -- the replacement the message
  #     names -- would do the POSIX conversion on those two legs and leave a
  #     test that passes and covers nothing.
  #
  # NOT "this repo has no Windows host". An earlier draft of this comment said
  # that and it is false: `parity.yml`'s `python-tests-shard` (`:2279`) runs
  # `python/tests` on `[ubuntu-latest, windows-latest, macos-latest]`
  # (`:2284`, `runs-on: ${{ matrix.os }}` at `:2302`) on every
  # `pull_request`, and that is what the three required `python -- pytest
  # across python/ (<os>)` contexts roll up. The true premise, and the one the
  # reasoning above actually rests on, is that no Windows host is available
  # for LOCAL development -- Windows behaviour is established against
  # `ntpath`/`PureWindowsPath` oracles and CI only speaks after a push.
  #
  # One consequence lands on THIS job specifically. The Windows shard pins
  # `python-version: "3.12"` (`parity.yml:2382`), where `Path.as_uri()` is not
  # host-dispatched at all, so no required context can catch a future PR that
  # "finishes the migration" by taking the replacement the deprecation names:
  # that mutation is `37 passed` on 3.12.3 and 3.13.15 and reds only at the
  # ceiling. This advisory job is the only one that can see it -- which is an
  # argument for reading its log, not for trusting the required five alone.
  #
  # So both warnings are still REPORTED in this log, now from two documented
  # test-side oracles rather than from product code, and no `filterwarnings`
  # hides either. See `tests/core/test_uri_reference.py`'s header.
  python-newest:
    name: "python · pytest on the newest CPython"
    # PRs and the merge queue only -- see `skip_ceiling_interpreter` at the top
    # of this file for why a floating interpreter must not be able to decide a
    # tag's outcome, and why the polarity is a SKIP rather than a RUN.
    # `inputs` is null off the `workflow_call` path, so this reads
    # `!null` == true on `pull_request`/`push`/`merge_group`.
    if: ${{ !inputs.skip_ceiling_interpreter }}
    runs-on: ubuntu-latest
    # The `python` job measures 6-11 min for the same selection at the floor
    # (see its own comment). 30 is the same hang catcher it uses on the PR leg,
    # not a budget.
    timeout-minutes: 30
    steps:
      # `fetch-depth: 0` for the same reason the `python` job takes it:
      # `tests/gates/test_module_size_budget_log_append_only.py` walks real git
      # ancestry and SKIPS silently on a depth-1 graft.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # THE INTERPRETER POLICY, ceiling half -- see this job's header comment
      # above, parity.yml's seam1 block, and the gate that enforces the pair,
      # python/tests/gates/test_interpreter_policy.py.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x" # ceiling -- NOT the floor every other job pins
      # Reported, not assumed: `"3.x"` resolves on GitHub's schedule, so the
      # run log has to say which interpreter this verdict is about, or a red
      # here is un-diagnosable six weeks later. Also the fail-fast on the
      # degenerate case -- if `"3.x"` ever resolved to the floor itself, this
      # job would be a duplicate of `python` and would report agreement it
      # never tested.
      - name: report (and require) an interpreter above the floor
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import sys; print("resolved interpreter:", sys.version)'
          floor="$(python -c 'import re,tomllib;print(re.search(r">=\s*([0-9]+\.[0-9]+)",tomllib.load(open("python/pyproject.toml","rb"))["project"]["requires-python"]).group(1))')"
          have="$(python -c 'import sys;print("%d.%d" % sys.version_info[:2])')"
          echo "requires-python floor: ${floor}; this job: ${have}"
          if [ "${have}" = "${floor}" ]; then
            echo "::error::\"3.x\" resolved to ${have}, which IS the declared floor -- this job would duplicate the \`python\` job and report agreement it never tested. Either a newer CPython is not yet available to setup-python (wait), or the floor has been raised to meet the ceiling, in which case the spread is over and python/tests/gates/test_interpreter_policy.py is where that decision gets recorded."
            exit 1
          fi
      # Same reason as the `python` job: without zsh the zsh-driven completion
      # cases SKIP, and a skip on this leg against a run on the other is a
      # difference in SELECTION masquerading as agreement.
      - name: ensure zsh is on PATH (zsh-driven completion tests)
        run: |
          if ! command -v zsh >/dev/null 2>&1; then
            bash scripts/ci/apt-bounded.sh update
            bash scripts/ci/apt-bounded.sh install -y --no-install-recommends zsh
          fi
      - name: install the declared package
        run: pip install -e ./python
      - name: install the test runner
        run: pip install pytest pytest-xdist
      - name: pytest
        working-directory: python
        env:
          # `merge_group` does not populate `GITHUB_BASE_REF` -- same binding
          # the `python` job makes, same gate depending on it.
          TAN_MERGE_GROUP_BASE_REF: ${{ github.event.merge_group.base_ref }}
        run: python -m pytest tests -q

  # The npm shim's platform -> asset table is DATA in a postinstall script, so
  # nothing compiled it, tested it, or noticed when it drifted. It has drifted
  # in BOTH directions: it once served `-gnu` while install.sh and the VS Code
  # extension served `-musl` (a musl host downloaded a binary that could not
  # execute), and from v0.5.0 the correct answer reversed -- PyInstaller cannot
  # produce the static `-musl` artefact the retired Rust target did, so Linux is
  # `-gnu` again. This job is what keeps the shim, install.sh and the contract
  # doc from separating, whichever direction is currently correct.
  # Node's own test runner, so there is nothing to install.
  shim:
    runs-on: ubuntu-latest
    # Under a minute on every run sampled, PR and release tag alike. 10 is a
    # hang catcher for the pip install, not a budget.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24" # same major release.yml's publish_npm job packs with
      # The FILE, not the directory: `--test <dir>` resolves its argument as a
      # module on node 26 and dies with MODULE_NOT_FOUND, so the directory form
      # would make this job's result depend on the runner image's node.
      - name: pin the platform -> asset mapping
        run: node --test npm-shim/test/libc-mapping.test.js

  # `build-system.requires` is a promise to anyone building the sdist/wheel
  # themselves -- a downstream packager, a distro, an offline mirror -- and
  # until this job existed NOTHING in CI stood behind it. Every other Python
  # step in every workflow here installs WITH build isolation, which makes pip
  # fetch that day's newest setuptools and ignore the declared floor entirely,
  # so `requires = ["setuptools>=68"]` sat green for two years while setuptools
  # 68 could not parse this project's own `license = "Apache-2.0"` at all
  # (tan-cli#382). Same shape as the `msrv` job below: read the declared floor,
  # install exactly it, and prove the promise instead of hoping.
  #
  # `--no-build-isolation` is the whole point -- with isolation this job would
  # measure PyPI's newest setuptools, which is what every other job already
  # measures.
  wheel-floor:
    runs-on: ubuntu-latest
    # Under a minute on every run sampled. Same reasoning as `shim` above.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12" # pyproject's requires-python floor
      # Derived, never hardcoded: a pin written here would be a SECOND place to
      # update, and the pair going stale is the same class of defect as the
      # untested bound itself. tomllib rather than grep so reformatting
      # `requires` across lines cannot silently stop matching.
      - name: read the declared setuptools floor
        id: floor
        shell: bash
        run: |
          v="$(python -c 'import re,tomllib;r=tomllib.load(open("python/pyproject.toml","rb"))["build-system"]["requires"];s=next(x for x in r if x.startswith("setuptools"));m=re.search(r">=\s*([0-9][0-9.]*)",s);print(m.group(1) if m else "")')"
          # A floor with no `>=` (an unpinned `"setuptools"`, or a `~=`/`>` form)
          # would leave $v empty and `pip install setuptools==` would then be a
          # syntax error blamed on pip. Fail here, where the cause is legible.
          [ -n "$v" ] || { echo "::error::no >= bound for setuptools in python/pyproject.toml build-system.requires"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "declared setuptools floor: $v"
      - name: build the wheel at the declared floor
        shell: bash
        run: |
          pip install "setuptools==${{ steps.floor.outputs.version }}" wheel
          pip wheel --no-deps --no-build-isolation -w dist-floor ./python
      # Anti-tautology guard. Without it the step above proves only "some
      # setuptools works", and would stay green if `--no-build-isolation` were
      # ever dropped, if the pin silently failed to downgrade, or if the license
      # metadata were quietly reverted to the `{ text = ... }` form that needs no
      # floor at all. 68.1.2 is the exact version tan-cli#382 was reported
      # against; it predates PEP 639 permanently, so unlike a "floor minus one"
      # pin it never needs re-deriving when the floor moves.
      #
      # The failure MESSAGE is asserted, not just the exit code: a missing
      # `wheel` module or a network blip also exits non-zero, and a negative
      # check that passes for the wrong reason is worse than no check.
      - name: and that floor is not decorative
        shell: bash
        run: |
          pip install "setuptools==68.1.2" wheel
          if pip wheel --no-deps --no-build-isolation -w dist-below ./python >below.log 2>&1; then
            cat below.log
            echo "::error::setuptools 68.1.2 built the wheel -- the declared floor is higher than it needs to be, or the license metadata no longer needs one"
            exit 1
          fi
          grep -q 'project.license' below.log || {
            cat below.log
            echo "::error::the below-floor build failed, but not on project.license -- this check is no longer measuring what it claims"
            exit 1
          }
          echo "setuptools 68.1.2 rejects project.license, as it must"

  # The workflows audit themselves (tan-cli#435). Nothing else in this
  # repository reads `.github/workflows/`, so before this job a security
  # regression there -- a `uses:` back on a mutable tag, a checkout that leaves
  # its credential behind, a job that inherits write, a `client_payload` field
  # interpolated into a shell -- landed green and stayed until someone thought
  # to look.
  #
  # THE VERDICT IS FALSIFIABLE, which is the part worth checking before
  # trusting it. Same rule set, zizmor 1.29.0, `--no-config` (NOT this job's
  # own `run:` invocation below -- that one loads `.github/zizmor.yml`, and
  # since tan-cli#899 the workflows themselves also carry two inline
  # `# zizmor: ignore[...]` comments). `--no-config` strips the CONFIG FILE
  # ONLY -- it does NOT strip inline ignores, measured: `--no-config
  # --min-severity medium --no-online-audits .github/workflows/` on this
  # tree is `rc=0, 18 ignored, 58 suppressed` (re-run for the current count,
  # don't trust this one -- it drifts with the tree; only the with/without
  # `--no-config` agreement is load-bearing), the inline ignores still
  # honoured. The `dev @ 01374d4` snapshot below is comparable for a
  # different reason: it PRE-DATES tan-cli#899, so it carries neither the
  # config-file ignores nor the inline ones -- not because `--no-config`
  # would strip the inline ones if it were run on this tree. Stripping
  # inline ignores too needs `--no-ignores`, per `.github/zizmor.yml`'s own
  # NON-VACUITY recipe:
  #
  #   this tree      rc=0    no finding at or above medium
  #   dev @ 01374d4  rc=14   63 unpinned-uses, 26 artipacked,
  #                          12 excessive-permissions, 6 template-injection
  #
  # So it fails on every class the PR that introduced it fixed, not merely on
  # nothing. This is `.github/zizmor.yml`'s own NON-VACUITY measurement, not
  # a second one taken here -- and it is NOT the recipe for checking whether
  # THIS file's own suppressions (the `run:` step below, with its config and
  # inline ignores loaded) are still catching something real. For that,
  # `.github/zizmor.yml`'s header names `--no-ignores`.
  workflow-security:
    name: zizmor · workflow security
    runs-on: ubuntu-latest
    # This job's `name:` IS the fifth required context, and it was the one
    # tan-cli#812 left unbounded while closing the other four (all of which
    # come from parity.yml). A wedged run here holds the PR for GitHub's
    # 360-minute default. Measured under a minute: pip install plus a
    # hermetic `--no-online-audits` pass over .github/workflows/.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # PINNED, for the same reason the actions above are: a linter that
      # resolves live decides this gate's verdict on its own schedule, and a
      # new audit landing upstream would redden an unrelated PR. Moving it is
      # a reviewed edit here -- Dependabot does not see a version inside a
      # `run:` step.
      - name: install zizmor
        run: pip install "zizmor==1.29.0"
      # `--min-severity medium`, and NOT also `--min-confidence medium`: all 26
      # `artipacked` findings are Low confidence, so adding that flag silently
      # drops the whole credential-persistence audit. Measured, not assumed.
      #
      # `--no-online-audits` keeps the gate hermetic: no token, no API, no
      # rate limit deciding whether CI is green. Verified to reach the same
      # verdict as a networked run on this tree.
      #
      # That agreement does NOT extend to the two `artipacked` sites this
      # gate must still catch if their suppression ever slipped --
      # `planner-resync.yml`'s and `release.yml`'s `dev` checkouts, each
      # carrying its own inline `# zizmor: ignore[artipacked]` comment
      # (tan-cli#899). Measured, with both comments removed:
      # `--no-online-audits` reports `rc=13` (the two now-unsuppressed
      # `artipacked` findings, at medium), while a real networked run reports
      # `rc=0` -- opposite verdicts at exactly those sites, not the same one.
      # Offline being the STRICTER direction there is the safe way for a
      # hermetic gate to err, so it does not undermine this job running
      # without a token; it does mean "same verdict as networked" is a
      # property of the reviewed, suppressed tree, not a guarantee that
      # survives a suppression going missing.
      #
      # The baseline is `.github/zizmor.yml`, picked up automatically. Since
      # tan-cli#899 it holds no `rules.*.ignore` entries of its own -- `rules:
      # {}` is a required stub, not policy. Both suppressions now live inline,
      # at the steps they excuse; the reviewed count is kept current in
      # `.github/zizmor.yml`'s own header, under INVENTORY (not this file's --
      # this job only runs the audit `.github/zizmor.yml` configures).
      - name: audit .github/workflows
        run: zizmor --min-severity medium --no-online-audits .github/workflows/
      # `.github/zizmor.yml`'s header keeps a hand-maintained INVENTORY of
      # the inline `artipacked` suppressions (tan-cli#899) so a reviewer can
      # audit both in one place. That INVENTORY can drift from the tree in
      # TWO different ways -- tan-cli#919 round 3 found the guard against a
      # COUNT drift itself disagreeing with zizmor, in BOTH directions, no
      # matter how it was patched: three prior rounds each closed three
      # evasions and opened five more, because
      # `python/tests/gates/test_zizmor_inventory_count.py` modelled a step
      # by YAML INDENTATION while zizmor actually associates an inline
      # `# zizmor: ignore[...]` comment with the finding's LINE RANGE (the
      # whole step, indentation irrelevant) -- a different model of what a
      # step is, not a fixable regex bug. That gate is deleted;
      # `python/scripts/check_zizmor_inventory.py` (below) asks zizmor
      # itself instead of re-implementing its comment association, so it
      # cannot disagree with zizmor's verdict -- it IS zizmor's verdict.
      # tan-cli#929 then found the COUNT check alone still passes when a
      # step is simply RENAMED (two renamed-past-each-other sites count the
      # same) -- see that script's own docstring and `.github/zizmor.yml`'s
      # `DRIFT THIS INVENTORY CATCHES, AND HOW` section for the `id:`-keyed
      # fix.
      #
      # `--no-ignores` strips every inline ignore and re-surfaces the
      # `artipacked` findings they were suppressing (`.github/zizmor.yml`'s
      # own NON-VACUITY recipe). On a tree with real suppressions to strip
      # that exits 14 by design -- findings at or above `--min-severity
      # medium` is the expected SUCCESS path for this probe, not a failure,
      # so the step does not fail on zizmor's exit code; it fails only on
      # `check_zizmor_inventory.py`'s own exit status.
      - name: inline artipacked suppressions match the zizmor.yml INVENTORY
        run: |
          set +e
          zizmor --min-severity medium --no-online-audits --no-ignores --format json .github/workflows/ \
              >"$RUNNER_TEMP/no-ignores.json" 2>"$RUNNER_TEMP/no-ignores.log"
          rc=$?
          set -e
          cat "$RUNNER_TEMP/no-ignores.log"
          python3 python/scripts/check_zizmor_inventory.py \
              "$RUNNER_TEMP/no-ignores.json" .github/zizmor.yml "$rc"
