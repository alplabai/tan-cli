# SPDX-License-Identifier: Apache-2.0
#
# The released-tan x released-alp-sdk gate (tan-cli#639).
#
# THE HOLE THIS CLOSES. Every other gate in this repo binds a PINNED COMMIT:
# `parity.yml`'s `PINNED_SDK_TAG`, `python/tests/gates/
# test_planner_relocation_freshness.py`'s `PINNED_SDK_COMMIT`. A pinned commit
# is the one axis tan and alp-sdk can never disagree on -- each repo tests
# itself against a fixed point it fully controls. What a customer actually
# runs is `install.sh`'s LATEST tan RELEASE against alp-sdk's LATEST RELEASE
# TAG, and nothing anywhere tested that combination. Three real defects
# shipped through the gap:
#
#   * tan-cli#320 / #485 / #639 ("too old"): `tan/planner/` falls behind
#     `scripts/alp_orchestrate/`, alp-sdk cuts a release carrying the fix, tan
#     does not. #639 was live for real: tan v0.5.1 (2026-08-05) predated the
#     alp-sdk e6928625 driver-status fix that v0.15.0 (2026-08-07) carries, so
#     `tan build` aborted Zephyr's Kconfig configure on every Renesas SKU with
#     `CONFIG_ALP_SDK_CHIP_NONE=y` -- a symbol that does not exist. Fixed by
#     #688 (`6901280b`, merged 2026-08-12) and shipped stable in v0.6.0
#     (2026-08-24); #639 closed 2026-08-13. tan v0.5.1 still reproduces it
#     today (proof below is still live), it is only the *default* `latest`
#     combination that has moved past it.
#   * tan-cli#591 ("too new"): a `tan/planner/` re-sync ports a requirement
#     (the AEN `zephyr_peripherals_dtsi` SoC-JSON key) that only EXISTS on
#     alp-sdk `dev`, past `7d58ef32`. No published alp-sdk tag contains it
#     (`git tag --contains 7d58ef32` is empty against v0.15.0), so a tan built
#     from that `dev` would refuse every AEN board against every release that
#     exists. Not shipped today (the released tan predates the re-sync), but
#     the class recurs and needs a gate, not a diary entry.
#
# `test_planner_relocation_freshness.py` cannot see either: it SKIPS without
# `ALP_SDK_ROOT` (never bound in a release context) and even bound, it compares
# against its own pinned commit -- never "has alp-sdk's latest RELEASE moved
# past what tan shipped".
#
# THE SECOND HOLE (tan-cli#767): "released tan" is not one version, it is TWO.
# `install.sh`'s own default resolves the newest **non-prerelease** tan
# release. But alp-sdk-vscode does not run that -- it runs whatever
# `SUPPORTED_CLI_VERSION` in `src/alpCli/service.ts` names, and that pin has
# deliberately been a PRERELEASE before (`v0.6.0-rc1`, moved there specifically
# because tan-cli#639's fix (#688) was not yet in any stable release and no
# stable tan could build a Renesas SoM). Any time the extension needs a fix
# that has only landed in a prerelease, `install.sh`'s "latest" and the
# extension's pin MUST diverge, by construction -- so testing only the former
# is structural blindness to the combination alp-sdk-vscode's users actually
# run, not a one-off gap.
#
# WHAT THIS RUNS. The documented customer journey, verbatim, on stock
# ubuntu-latest, for one SKU per SoM family:
#
#   install.sh (a tan release)  ->  clone alp-sdk @ latest release tag
#     ->  tan init  ->  tan generate  ->  tan build
#
#   * E1M-AEN801  (Alif Ensemble)  -- full journey, ELF asserted.
#   * E1M-V2N101  (Renesas RZ/V2N) -- full journey, ELF asserted. This is the
#     leg tan-cli#639 reddened when it was open, and does still redden if you
#     force a pre-fix tan onto it -- see "how to prove this gate can fail"
#     below for the current, dispatch-based proof.
#   * E1M-NX9101  (NXP i.MX 93)    -- genuinely a placeholder right now
#     (`silicon_variant: TBD`, `hw_revisions.r1.status: tbd`) and CORRECTLY
#     refuses at `tan generate` (`SdkRevisionNotBuildable`, alp-sdk#1025).
#     Matrixed as `expect-refuse`, not excluded: an unexpected `ok:true` here
#     is itself a signal (the SoM went live and this gate's matrix is stale),
#     and so is a crash where a controlled refusal belongs.
#
# THE THIRD HOLE (tan-cli#1050): "the consumer's pin" is not one version
# either, it is TWO -- one per alp-sdk-vscode branch. #767 read only `dev`,
# which is what #767 itself proposed, but `dev` is structurally the one branch
# whose pin CANNOT stay diverged from tan's `latest`: it moves to the newest
# pin as soon as one is cut. `main` carries the pin alp-sdk-vscode actually
# SHIPS. Measured 2026-08-31: `dev` = `0.6.0` (== `latest`, so the whole #767
# leg skipped on every scheduled run) while `main` = `0.5.1`, and PR #1047's
# own dispatched proof (run 33397989209) shows `0.5.1` x alp-sdk `v0.16.0` is
# RED on both buildable SKUs -- a gate that never ran, hiding a shipped
# combination that was broken. (`main` caught up to `0.6.0` on 2026-09-01 via
# alp-sdk-vscode#647, so all three agree again TODAY and this job skips
# loudly; the divergence is structural and recurs on every release, which is
# why it needs a mechanism rather than a diary entry.)
#
# ...so the journey runs across ONE TO THREE combinations, all against the
# SAME alp-sdk latest-release-tag axis:
#
#   * `latest`               -- install.sh's own default (or the `tan_version`
#                               workflow_dispatch override). Unchanged from
#                               before #767; the ORIGINAL axis tan-cli#639
#                               added. ALWAYS runs.
#   * `consumer-pin-<...>`   -- alp-sdk-vscode's live `SUPPORTED_CLI_VERSION`,
#                               resolved by fetching `src/alpCli/service.ts`
#                               off BOTH its `dev` and its `main` branch and
#                               grep'ing the constant (the exact pattern
#                               alp-sdk-vscode's own CI uses, widened to keep
#                               a prerelease suffix rather than truncate it),
#                               or the `consumer_tan_version` workflow_dispatch
#                               override.
#
# THE DEDUP. At most three versions are ever in play (`dev`'s pin, `main`'s
# pin, the `latest` leg's effective version) and the journey runs ONCE PER
# DISTINCT VERSION not already covered by the `latest` leg:
#
#   * all three equal      -> no extra leg. `skip=true`, ONE `::notice::`
#                             saying so -- loud absence, never silence. This
#                             is the common day (and today).
#   * `dev` == `main`, both != `latest`
#                          -> ONE extra leg, `consumer-pin-dev+main`,
#                             crediting both branches. Not two identical
#                             journeys for one tan binary.
#   * all three differ     -> TWO extra legs, `consumer-pin-dev` and
#                             `consumer-pin-main`. This is the 2026-08-31
#                             shape: `main` still on the shipped pin while
#                             `dev` has already moved to the next one.
#   * (one-sided) `dev` == `latest` != `main`
#                          -> just `consumer-pin-main`; and symmetrically
#                             `main` == `latest` != `dev` -> just
#                             `consumer-pin-dev`.
#
# The `resolve-consumer-pin` job resolves both pins, does the dedup, and emits
# the surviving set as JSON; the `build-matrix` job turns SKU list x
# combination list into the single JSON matrix `journey` runs -- one job body,
# parameter-driven by `matrix.tan_version` / `matrix.alp_sdk_ref` /
# `matrix.combination`, not N copies of the same ~250 lines of steps.
# Resolution failure ON EITHER BRANCH (the constant renamed, the file moved,
# the branch renamed, or the fetch itself failing) is a hard `::error::` +
# non-zero exit that fails the whole job -- never a silent fall-through to
# "latest" and never a silent skip of just the branch that failed. Continuing
# with a partial pin set would recreate tan-cli#1050 exactly: a leg that does
# not run, hiding a shipped combination.
#
# NOT a required PR check -- it depends on tags neither repo controls the
# timing of (plus, now, a THIRD repo's pin), and a red run here is often
# "alp-sdk cut a release tan has not caught up to yet" or "alp-sdk-vscode
# moved its pin", not a bug in the PR under review. VISIBLE regardless:
# `schedule` (daily) + `workflow_dispatch`, both of which show up in the
# Actions tab and can page/notify independently of branch protection.
#
# HOW TO PROVE THIS GATE CAN FAIL (superpowers:verification-before-completion
# -- a gate never observed to go red is not a gate). No edit needed:
#
#   1. Today, for real, on the LATEST axis: dispatch this workflow with
#      `tan_version: v0.5.1` and `alp_sdk_ref` empty (alp-sdk's real latest
#      release, which carries the e6928625 fix). The E1M-V2N101 leg reproduces
#      tan-cli#639 exactly -- `tan build` aborts Zephyr's configure on the
#      undefined `ALP_SDK_CHIP_NONE` symbol. This is not a drill; it is the
#      same defect the workflow header above describes, forced back onto the
#      LATEST axis by pinning `tan_version` to the pre-fix release.
#   2. Dispatching with all inputs empty is GREEN today: `install.sh`'s
#      `latest` resolves v0.6.0 (2026-08-24, stable), which carries #639's
#      fix. That is expected, not proof of anything by itself -- it only
#      confirms the fixed tan still builds; step 1 above is what proves the
#      mechanism can fail.
#   3. Prove the CONSUMER-PIN axis's mechanism (tan-cli#767/#1050),
#      independent of whatever alp-sdk-vscode's live pins happen to be today
#      -- as of 2026-09-01 BOTH branches read `0.6.0` (alp-sdk-vscode#647
#      promoted `dev` to `main`), so the dedup collapses to one and the
#      scheduled run legitimately skips: dispatch with
#      `consumer_tan_version: v0.5.1` (and `alp_sdk_ref` empty, i.e. alp-sdk's
#      real latest release, which by now carries the e6928625 fix). The
#      override forces one leg to run regardless of the live pins' values, and
#      the E1M-V2N101 journey reproduces tan-cli#639's exact abort a second
#      time -- through the consumer-pin leg's wiring this time, proving it
#      actually executes `tan build` rather than being a check that is
#      satisfied no matter what it reads.
#   4. Prove the DEDUP/BOTH-BRANCHES half (tan-cli#1050) without waiting for
#      alp-sdk-vscode to diverge: dispatch with `tan_version: v0.5.1` and
#      `consumer_tan_version` empty. That moves the `latest` leg's effective
#      version off both live pins, so `0.6.0` survives the dedup on both
#      branches and collapses into ONE extra leg named
#      `consumer-pin-dev+main` -- the "both branches agree, neither equals
#      latest" case, visibly running rather than skipping. The static half of
#      this (all three dedup cases, the fetch-failure verdict, the matrix
#      shape) is pinned hermetically by
#      `python/tests/gates/test_release_combination_consumer_pin.py`, which
#      executes this job's own `run:` body under a stubbed `curl`/`gh`.

name: release-combination

on:
  schedule:
    # Daily, offset from planner-resync.yml's 05:23 UTC cron so the two don't
    # contend for the same runner minute.
    - cron: "40 6 * * *"
  workflow_dispatch:
    inputs:
      tan_version:
        description: >-
          tan release to install for the `latest` combination via install.sh's
          --version (e.g. v0.5.1). Empty = install.sh's own default (the
          latest non-prerelease release). Does NOT affect the `consumer-pin-*`
          combinations below -- use consumer_tan_version for that.
        required: false
        default: ""
      consumer_tan_version:
        description: >-
          tan-cli#767/#1050: override for the `consumer-pin-*` combinations --
          the tan release to install in place of alp-sdk-vscode's live
          SUPPORTED_CLI_VERSION pins. Empty = resolve the pins live from BOTH
          alp-sdk-vscode's dev and main branches, dedup them against the
          `latest` combination's version, and run the journey once per
          distinct survivor (skipping entirely, loudly, when none survive).
          Set this to a deliberately old release (e.g. v0.5.1) to force one
          leg to run -- neither branch is fetched then -- and prove the
          mechanism can still fail (see the file header).
        required: false
        default: ""
      alp_sdk_ref:
        description: >-
          alp-sdk ref to clone (tag, branch, or SHA), shared by BOTH
          combinations. Empty = alp-sdk's latest release tag, resolved live
          via the GitHub API. Set this to a deliberately old tag to prove the
          `latest` combination's mechanism can still fail (see the file
          header).
        required: false
        default: ""

# Not ref-scoped: this workflow only ever runs from the default branch's own
# copy (GitHub's rule for `schedule`), so every trigger already targets the
# same ref. A scheduled run and a manual proof-dispatch should not cancel
# each other -- losing the scheduled run's evidence to a manual one (or vice
# versa) is a worse outcome than two runs overlapping.
concurrency:
  group: release-combination
  cancel-in-progress: false

permissions:
  # Least privilege (tan-cli#435). The token is used only to lift the
  # unauthenticated per-IP rate limit on GitHub API reads (alp-sdk's latest
  # release, tan-cli's own latest release for the consumer-pin dedup,
  # `west sdk install`'s release listing) -- never to write anything. The
  # `src/alpCli/service.ts` fetches (one per alp-sdk-vscode branch) are plain
  # raw.githubusercontent.com GETs against a public repo and need no token at
  # all.
  contents: read

jobs:
  resolve-refs:
    name: resolve the alp-sdk ref under test
    runs-on: ubuntu-latest
    # tan-cli#855: a single `gh api` call and nothing else -- no checkout, no
    # build. Lighter than e2e-container.yml's `shellcheck` (5, which actually
    # lints a tree of scripts), so 5 is generous headroom for one HTTP call
    # plus the GitHub Actions runner's own startup/checkout-less overhead.
    timeout-minutes: 5
    outputs:
      alp_sdk_ref: ${{ steps.resolve.outputs.alp_sdk_ref }}
    steps:
      # `env:` indirection for the workflow_dispatch input rather than
      # interpolating `${{ github.event.inputs.alp_sdk_ref }}` straight into
      # the script -- zizmor's template-injection audit flags the latter even
      # for a write-gated trigger like workflow_dispatch.
      - name: resolve alp-sdk ref (dispatch override, else latest release tag)
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          OVERRIDE_REF: ${{ github.event.inputs.alp_sdk_ref }}
        run: |
          set -euo pipefail
          if [ -n "${OVERRIDE_REF}" ]; then
            echo "alp_sdk_ref=${OVERRIDE_REF}" >> "$GITHUB_OUTPUT"
            echo "::notice::alp-sdk ref OVERRIDDEN via workflow_dispatch input: ${OVERRIDE_REF} -- this run is not testing the real released combination unless that happens to equal the latest release tag."
            exit 0
          fi
          ref="$(gh api repos/alplabai/alp-sdk/releases/latest -q .tag_name)"
          if [ -z "${ref}" ]; then
            echo "::error::could not resolve alp-sdk's latest release tag via the GitHub API."
            exit 1
          fi
          echo "alp_sdk_ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "::notice::alp-sdk latest release tag: ${ref}"

  resolve-consumer-pin:
    name: resolve alp-sdk-vscode's pinned tan versions (tan-cli#767, #1050)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # tan-cli#1050: no longer ONE version. A JSON array of the deduped
      # extra combinations to run (possibly empty) -- see the step below.
      consumer_matrix: ${{ steps.resolve.outputs.consumer_matrix }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      # Same `env:` indirection reasoning as resolve-refs above.
      - name: resolve SUPPORTED_CLI_VERSION on dev AND main (dispatch override, else the live pins)
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          OVERRIDE_VERSION: ${{ github.event.inputs.consumer_tan_version }}
          TAN_VERSION_OVERRIDE: ${{ github.event.inputs.tan_version }}
        run: |
          set -euo pipefail

          latest_tan="$(gh api repos/alplabai/tan-cli/releases/latest -q .tag_name)"
          if [ -z "${latest_tan}" ]; then
            echo "::error::could not resolve tan-cli's own latest release tag via the GitHub API (needed to decide whether either consumer pin differs from the latest combination)."
            exit 1
          fi
          echo "install.sh's own default (tan-cli's latest release): ${latest_tan}"

          # The `latest` combination's `journey` leg installs
          # `matrix.tan_version`, which is `TAN_VERSION_OVERRIDE` when the
          # caller set it -- not always `latest_tan` above. Comparing the
          # consumer pins against `latest_tan` unconditionally would drop a
          # leg (one tan version tested) on a dispatch that pinned
          # `tan_version` to something else while a pin happens to equal
          # `latest_tan`, silently dropping a version the operator asked
          # for. Compare against what the `latest` leg will actually install.
          if [ -n "${TAN_VERSION_OVERRIDE}" ]; then
            effective_latest="${TAN_VERSION_OVERRIDE}"
            echo "latest leg's effective version (tan_version dispatch override): ${effective_latest}"
          else
            effective_latest="${latest_tan}"
          fi

          if [ -n "${OVERRIDE_VERSION}" ]; then
            # The override names one version explicitly, so there is nothing
            # to resolve and nothing to dedup -- neither branch is fetched.
            printf 'consumer_matrix=[{"combination":"consumer-pin-override","tan_version":"%s","label":"overridden consumer pin","branches":"override"}]\n' \
              "${OVERRIDE_VERSION}" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "::notice::consumer-pin OVERRIDDEN via workflow_dispatch input: ${OVERRIDE_VERSION} -- forced to run regardless of ${effective_latest}, to prove this leg's mechanism can fail (tan-cli#767)."
            exit 0
          fi

          # tan-cli#1050: BOTH branches, not just `dev`. `dev` carries the pin
          # alp-sdk-vscode will ship NEXT; `main` carries the pin it ships
          # TODAY, and #767's original single-branch read never looked at it
          # -- so on 2026-08-31 `dev` (`0.6.0`) equalled `latest` and made
          # this whole leg skip on every scheduled run, while `main`
          # (`0.5.1`) named a combination PR #1047's own dispatched proof had
          # already measured RED on both buildable SKUs.
          #
          # RESOLVED_PIN is a global set by the function rather than the
          # function's stdout captured through `$(...)`: the `::error::`
          # workflow commands below must reach the runner's log on stdout,
          # and command substitution would swallow them into the caller's
          # variable instead of the log.
          RESOLVED_PIN=""
          resolve_pin() {
            local branch="$1"
            RESOLVED_PIN=""
            # `|| true` on both pipelines below: a legitimate "the fetch
            # failed" / "the pattern matched nothing" (curl exit 22, grep exit
            # 1) must NOT kill this step via `pipefail` before the explicit
            # `-z` checks turn it into a deliberate `::error::` naming the
            # branch. Writing the failure ourselves, unconditionally, is the
            # tan-cli#1013/#1014 lesson: a `grep` that legitimately finds
            # nothing exits 1 under restored `set -e` and the step dies with
            # no message anyone can act on.
            #
            # `--retry 3 --retry-connrefused`: the verdict below is fatal for
            # the WHOLE job -- including the `latest` axis, which is
            # tan-cli#639's original gate and has nothing to do with the
            # consumer pin -- and this job now makes TWO of these fetches, so
            # one transient raw.githubusercontent.com blip would red the
            # entire daily run twice as often as before tan-cli#1050. A 404
            # or a renamed constant is real signal and must stay fatal; a
            # network flake is not signal at all. curl's `--retry` covers
            # exactly that split: it retries transient failures (connection
            # errors, 408/429/5xx) and, with `--retry-connrefused`, a refused
            # connection -- but it does NOT retry a 404, so a genuinely
            # renamed branch or moved file still fails fast on the first try.
            raw="$(curl -fsSL --retry 3 --retry-connrefused "https://raw.githubusercontent.com/alplabai/alp-sdk-vscode/${branch}/src/alpCli/service.ts" || true)"
            if [ -z "${raw}" ]; then
              # Deliberately fatal, not a silent skip of this branch. A
              # renamed branch or a moved file that quietly dropped one of
              # the two pins would recreate tan-cli#1050 exactly: a leg that
              # never runs, hiding a shipped combination.
              echo "::error::could not fetch src/alpCli/service.ts from alp-sdk-vscode@${branch} (branch renamed, file moved, or the fetch itself failed). Refusing to continue with a partial pin set -- resolving only one of the two branches is the tan-cli#1050 blind spot."
              return 1
            fi
            # The exact pattern alp-sdk-vscode's own CI uses (its
            # `test/cliPin.prerelease.test.js` pins every site that resolves
            # this constant), widened to keep a prerelease suffix rather than
            # truncate it (an earlier narrower regex silently turned
            # `0.5.0-rc1` into `0.5.0`, downloading a different tan than the
            # pin names).
            pin="$(printf '%s\n' "${raw}" \
                | grep -oE 'SUPPORTED_CLI_VERSION = "[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?"' \
                | grep -oE '[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?' || true)"
            if [ -z "${pin}" ]; then
              echo "::error::could not resolve alp-sdk-vscode's SUPPORTED_CLI_VERSION from src/alpCli/service.ts on its ${branch} branch -- the constant may have been renamed or moved. Refusing to fall back to 'latest' silently (that fall-through is exactly the blind spot tan-cli#767 closes)."
              return 1
            fi
            # `service.ts` is not just the assignment: the block a few lines
            # up quotes pin values verbatim in comments (e.g.
            # `RENESAS_BUILD_CLI_VERSION`'s `0.6.0-rc1`). If a future comment
            # ever reads `SUPPORTED_CLI_VERSION = "..."` too, both greps
            # match twice and `pin` becomes multi-line -- write that straight
            # to `$GITHUB_OUTPUT` and the runner rejects the file command
            # with "Invalid format" instead of the deliberate `::error::`
            # every other failure mode here gets. Assert exactly one match.
            # `|| true` is the tan-cli#1013-class hardening on THIS line: the
            # original had none, and `grep -c` exits 1 when it counts zero.
            # That zero is unreachable today (the `-z "${pin}"` check above
            # already returned), so the guard is for the next edit that
            # loosens or reorders that check -- without it, a zero-count
            # `grep` dies under `pipefail` mid-assignment with no `::error::`
            # at all, which is exactly how #1013 shipped. The comparison is a
            # string `!=` rather than `-ne` for the same reason: `-ne` on an
            # empty `pin_count` would be a `unary operator expected` crash
            # instead of the message below.
            pin_count="$(printf '%s\n' "${pin}" | grep -c . || true)"
            if [ "${pin_count}" != "1" ]; then
              echo "::error::resolved ${pin_count} candidate SUPPORTED_CLI_VERSION values from src/alpCli/service.ts on its ${branch} branch (expected exactly 1) -- refusing to guess which one is the real pin: ${pin}"
              return 1
            fi
            RESOLVED_PIN="v${pin}"
          }

          resolve_pin dev
          pin_dev="${RESOLVED_PIN}"
          resolve_pin main
          pin_main="${RESOLVED_PIN}"
          echo "alp-sdk-vscode@dev  SUPPORTED_CLI_VERSION: ${pin_dev}"
          echo "alp-sdk-vscode@main SUPPORTED_CLI_VERSION: ${pin_main}"

          # THE DEDUP (tan-cli#1050). At most three versions are in play --
          # `dev`'s pin, `main`'s pin, and the `latest` leg's effective
          # version -- and the journey runs ONCE PER DISTINCT VERSION that is
          # not already covered by the `latest` leg:
          #
          #   * all three equal (the common day, and today):
          #     nothing survives -> `skip=true`, one `::notice::`, only the
          #     `latest` combination runs.
          #   * `dev` == `main` != `latest` (the extension has shipped a pin
          #     tan's `latest` has moved past, or not yet reached): ONE extra
          #     leg, `consumer-pin-dev+main`, crediting both branches -- not
          #     two identical journeys for one tan binary.
          #   * all three differ (`main` still on the shipped pin while `dev`
          #     has already moved to the next one -- the 2026-08-31
          #     measurement in tan-cli#1050): TWO extra legs,
          #     `consumer-pin-dev` and `consumer-pin-main`.
          #
          # (And the two one-sided cases: `dev` == `latest` != `main` gives
          # just `consumer-pin-main`; `main` == `latest` != `dev` gives just
          # `consumer-pin-dev`.)
          export PIN_DEV="${pin_dev}" PIN_MAIN="${pin_main}" EFFECTIVE_LATEST="${effective_latest}"
          python3 - <<'PY'
          import json
          import os

          effective_latest = os.environ["EFFECTIVE_LATEST"]
          resolved = [("dev", os.environ["PIN_DEV"]), ("main", os.environ["PIN_MAIN"])]

          # Insertion-ordered so `dev` sorts before `main` deterministically;
          # a version seen on both branches collapses into one entry that
          # credits both, rather than a second identical journey.
          by_version: dict[str, list[str]] = {}
          for branch, version in resolved:
              if version == effective_latest:
                  continue
              by_version.setdefault(version, []).append(branch)

          entries = []
          for version, branches in by_version.items():
              joined = "+".join(branches)
              entries.append(
                  {
                      "combination": f"consumer-pin-{joined}",
                      "tan_version": version,
                      "label": f"alp-sdk-vscode@{joined}'s pinned tan",
                      "branches": joined,
                  }
              )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("consumer_matrix=" + json.dumps(entries) + "\n")
              fh.write("skip=" + ("true" if not entries else "false") + "\n")

          if not entries:
              print(
                  "::notice::alp-sdk-vscode's SUPPORTED_CLI_VERSION is "
                  f"{os.environ['PIN_DEV']} on dev and {os.environ['PIN_MAIN']} on main, "
                  f"both == the latest leg's effective version ({effective_latest}) -- "
                  "consumer-pin combinations == latest combination, nothing extra to test today."
              )
          else:
              for entry in entries:
                  print(
                      f"::notice::alp-sdk-vscode@{entry['branches']}'s SUPPORTED_CLI_VERSION "
                      f"({entry['tan_version']}) diverges from the latest leg's effective version "
                      f"({effective_latest}) -- running combination {entry['combination']}."
                  )
          print("resolved consumer combinations:")
          print(json.dumps(entries, indent=2))
          PY

  build-matrix:
    name: build the SKU x combination matrix
    needs: [resolve-refs, resolve-consumer-pin]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      # One SKU catalogue, one place it is written down. Before #767 that
      # catalogue lived directly in `journey`'s `strategy.matrix.include:`;
      # now that the same three SKUs need to run once per combination (one or
      # two combinations, decided above), it is built here instead so there
      # is exactly one definition to keep in sync, not two copies of the
      # journey's ~250 steps that could quietly drift apart (tan-cli#1008 /
      # #1035's dominant defect shape).
      - name: build the matrix
        id: build
        env:
          ALP_SDK_REF: ${{ needs.resolve-refs.outputs.alp_sdk_ref }}
          TAN_VERSION_OVERRIDE: ${{ github.event.inputs.tan_version }}
          CONSUMER_MATRIX: ${{ needs.resolve-consumer-pin.outputs.consumer_matrix }}
          CONSUMER_SKIP: ${{ needs.resolve-consumer-pin.outputs.skip }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os

          alp_sdk_ref = os.environ["ALP_SDK_REF"]
          tan_override = os.environ.get("TAN_VERSION_OVERRIDE", "")
          consumer_entries = json.loads(os.environ["CONSUMER_MATRIX"])
          consumer_skip = os.environ["CONSUMER_SKIP"] == "true"

          # The two outputs must agree, or one of the two branches' pins got
          # dropped between the jobs. `skip` is the human-readable half; the
          # array is what actually drives the matrix.
          if consumer_skip != (not consumer_entries):
              raise SystemExit(
                  f"::error::resolve-consumer-pin disagreed with itself: skip={consumer_skip} "
                  f"but {len(consumer_entries)} consumer combination(s) were resolved."
              )

          skus = [
              {"sku": "E1M-AEN801", "template": "zephyr-app", "core": "m55_hp", "expect_refuse": False},
              {"sku": "E1M-V2N101", "template": "zephyr-app", "core": "m33_sm", "expect_refuse": False},
              {
                  "sku": "E1M-NX9101",
                  # `zephyr-app`'s vendored scaffold only has AEN and V2N/V2M
                  # trees; at a released tan under test here an unrecognised
                  # family such as E1M-NX9* can silently fall back to the
                  # Alif tree instead of refusing (`scaffold._family_bucket`)
                  # -- a mismatched scaffold, not the hw_rev refusal this leg
                  # exists to prove. `minimal-app` is vendor-neutral and
                  # scaffolds any SoM, which is what actually reaches
                  # `tan generate` far enough to hit `SdkRevisionNotBuildable`.
                  "template": "minimal-app",
                  "core": "m33",
                  "expect_refuse": True,
              },
          ]

          combinations = [
              # install.sh's own default (or the `tan_version` dispatch
              # override) x alp-sdk's latest release tag -- the original axis
              # tan-cli#639 added.
              {"combination": "latest", "tan_version": tan_override, "label": "released tan"},
          ]
          # tan-cli#767 + #1050: one entry per DISTINCT tan version
          # alp-sdk-vscode pins on `dev` or `main` that the `latest` leg does
          # not already cover -- the version a consumer of the extension
          # actually runs, not install.sh's "latest". Zero entries (every pin
          # already == `latest`), one (both branches agree, or only one
          # diverges), or two (the branches disagree AND both differ from
          # `latest`). The dedup itself happens in `resolve-consumer-pin`,
          # which is where the pins are read; this job only fans it out.
          for entry in consumer_entries:
              combinations.append(
                  {
                      "combination": entry["combination"],
                      "tan_version": entry["tan_version"],
                      "label": entry["label"],
                  }
              )

          include = []
          for combo in combinations:
              for s in skus:
                  entry = dict(s)
                  entry["alp_sdk_ref"] = alp_sdk_ref
                  entry["combination"] = combo["combination"]
                  entry["tan_version"] = combo["tan_version"]
                  entry["combination_label"] = combo["label"]
                  include.append(entry)

          matrix = {"include": include}
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("matrix=" + json.dumps(matrix) + "\n")
          print("resolved matrix:")
          print(json.dumps(matrix, indent=2))
          PY

  journey:
    needs: build-matrix
    name: "${{ matrix.sku }} (${{ matrix.combination_label }}) -- x alp-sdk@${{ matrix.alp_sdk_ref }}"
    runs-on: ubuntu-latest
    # `fail-fast: false` -- the whole point is that these legs can disagree
    # (AEN green, V2N red; `latest` green, `consumer-pin-main` red) and each
    # verdict must be visible on its own, not cancelled because a sibling leg
    # failed first.
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build-matrix.outputs.matrix) }}
    # The full legs pay for a real `tan bootstrap` + `west sdk install` +
    # ARM Zephyr build (getting-started.yml's own budget is 60 minutes for
    # one SKU); the expect-refuse leg never reaches a toolchain at all.
    timeout-minutes: 60
    env:
      SKU: ${{ matrix.sku }}
      CORE: ${{ matrix.core }}
    steps:
      - name: checkout tan-cli (install.sh only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Skipped for the expect-refuse leg: `tan generate`'s in-process
      # planner needs no system toolchain at all (tan.planner_emit runs
      # in-process inside the frozen tan binary), and NX9101 never reaches
      # `tan build`.
      - name: host prerequisites (ninja/dtc/gperf for the Zephyr configure+build)
        if: ${{ !matrix.expect_refuse }}
        run: |
          set -euo pipefail
          bash scripts/ci/apt-bounded.sh update
          bash scripts/ci/apt-bounded.sh install -y --no-install-recommends \
              ninja-build device-tree-compiler gperf xz-utils

      - name: python (west needs it; the released tan binary does not)
        if: ${{ !matrix.expect_refuse }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # THE COMBINATION UNDER TEST, half one: a real release download +
      # sha256 verify, exactly like a customer's shell -- not a source build
      # of this checkout. `matrix.tan_version` carries either the `latest`
      # combination's dispatch override (or "" for install.sh's own default)
      # or a `consumer-pin-*` combination's resolved/overridden version --
      # see build-matrix above.
      - name: install tan via install.sh (released binary)
        env:
          TAN_VERSION: ${{ matrix.tan_version }}
        run: |
          set -euo pipefail
          if [ -n "${TAN_VERSION}" ]; then
            ./install.sh --version "${TAN_VERSION}"
          else
            ./install.sh
          fi
          if [ ! -x "$HOME/.local/bin/tan" ]; then
            echo "::error::[${SKU}] install.sh reported success but \$HOME/.local/bin/tan is missing or not executable."
            ls -la "$HOME/.local/bin" || true
            exit 1
          fi
          "$HOME/.local/bin/tan" --version

      - name: put the installed tan on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # THE COMBINATION UNDER TEST, half two: alp-sdk at its latest RELEASE
      # TAG (resolved in the job above), not a `dev`/`main` tip and not a
      # commit pin. Shared by both combinations -- only the tan half varies.
      - name: clone alp-sdk @ ${{ matrix.alp_sdk_ref }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: alplabai/alp-sdk
          ref: ${{ matrix.alp_sdk_ref }}
          path: release-workspace/alp-sdk
          persist-credentials: false

      # ---- tan bootstrap + the Zephyr SDK (full legs only) -----------------

      - name: tan bootstrap (venv + west workspace + SDK python deps)
        if: ${{ !matrix.expect_refuse }}
        working-directory: release-workspace
        env:
          # tan-cli#1163, the third site. Same asymmetry the other two had, and
          # the sharpest instance of it: the printed-remedy step immediately
          # below already carries `GH_TOKEN` -- it runs unconditionally on
          # every full leg, under the same `if:` as this one, because it is
          # what a customer who followed `tan doctor`'s printed remedy does --
          # while this step, the real download, ran anonymous. A 403 on
          # someone else's traffic raises `bootstrap.toolchain-install`, which
          # is WORKSPACE_BLOCKING (`bootstrap_cmd.py:245-247`), so `take_issues`
          # escalates it to `severity: "error"` and `ok:false` and this step's
          # own `if not e.get("ok")` exits 1 -- reddening the pre-release
          # combination gate for a reason that has nothing to do with the
          # release. `github.token` rather than `secrets.GITHUB_TOKEN` to match
          # the sibling step below; identical value.
          TAN_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # stderr is captured AND echoed (getting-started.yml's own bootstrap
          # step does the same): in `--format json` the envelope is the only
          # thing on stdout, so when the process dies before it can write one,
          # the reason is on stderr or nowhere.
          set +e
          tan bootstrap --sdk-root ./alp-sdk --format json \
              > /tmp/rc-bootstrap-${SKU}.json 2> >(tee /tmp/rc-bootstrap-${SKU}.stderr >&2)
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::[${SKU}] 'tan bootstrap' exited ${rc} -- see the stderr tee above for the reason."
            cat /tmp/rc-bootstrap-${SKU}.json 2>/dev/null || true
            exit "$rc"
          fi
          cat /tmp/rc-bootstrap-${SKU}.json
          python3 - "$SKU" <<'PY'
          import json, os, sys
          sku = sys.argv[1]
          e = json.load(open(f"/tmp/rc-bootstrap-{sku}.json"))
          if not e.get("ok"):
              print(f"::error::[{sku}] 'tan bootstrap' reported not-ok:",
                    json.dumps(e.get("issues"), indent=2))
              sys.exit(1)
          d = e.get("data") or {}
          for key in ("venvDir", "zephyrBase"):
              if not d.get(key) or not os.path.isdir(d[key]):
                  print(f"::error::[{sku}] 'tan bootstrap' reported ok but data.{key}={d.get(key)!r} does not exist.")
                  sys.exit(1)
          with open(os.environ["GITHUB_ENV"], "a") as fh:
              fh.write("ZEPHYR_BASE=%s\n" % d["zephyrBase"])
          with open(os.environ["GITHUB_PATH"], "a") as fh:
              fh.write(os.path.join(d["venvDir"], "bin") + "\n")
          print(f"[{sku}] bootstrap ok -- zephyrBase", d["zephyrBase"])
          PY

      # tan's own build-readiness check prints this exact command as the
      # remedy for a missing toolchain; running it here is what a customer
      # who followed that remedy actually does. Version comes from alp-sdk's
      # own `metadata/toolchains.json` -- the single source `tan doctor`'s
      # hardcoded fallback is measured against elsewhere (parity.yml) -- not
      # a second hand-typed pin here.
      - name: install the Zephyr SDK (west sdk install, arm-zephyr-eabi)
        if: ${{ !matrix.expect_refuse }}
        working-directory: release-workspace
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json; print(json.load(open("alp-sdk/metadata/toolchains.json"))["zephyrSdk"]["version"])')"
          echo "Zephyr SDK pin (alp-sdk metadata/toolchains.json): ${version}"
          west sdk install --version "${version}" -t arm-zephyr-eabi \
              --personal-access-token "${GH_TOKEN}"

      # ---- init -> generate -> build ---------------------------------------

      - name: "tan init --som ${{ matrix.sku }}"
        working-directory: release-workspace
        env:
          MATRIX_TEMPLATE: ${{ matrix.template }}
        run: |
          set -euo pipefail
          set +e
          tan init --name my-app --template "${MATRIX_TEMPLATE}" --som "${SKU}" \
              --sdk-root ./alp-sdk --format json > /tmp/rc-init-${SKU}.json
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::[${SKU}] 'tan init' exited ${rc} -- see /tmp/rc-init-${SKU}.json above for the envelope."
            cat /tmp/rc-init-${SKU}.json 2>/dev/null || true
            exit "$rc"
          fi
          cat /tmp/rc-init-${SKU}.json
          python3 - "$SKU" <<'PY'
          import json, sys
          sku = sys.argv[1]
          e = json.load(open(f"/tmp/rc-init-{sku}.json"))
          if not e.get("ok"):
              print(f"::error::[{sku}] 'tan init' exited {e.get('exitCode')}:",
                    json.dumps(e.get("issues"), indent=2))
              sys.exit(e.get("exitCode") or 1)
          if not e.get("data", {}).get("written"):
              print(f"::error::[{sku}] 'tan init' reported ok but wrote no files -- the silent-pass shape this gate exists to catch.")
              sys.exit(1)
          print(f"[{sku}] init ok -- wrote", e["data"]["written"])
          PY

      # Bare `tan generate` -- the documented command (README's own table:
      # "Generate configuration files | `tan generate`"), not a diagnostic
      # invocation aimed at one target. It renders the default target set
      # (zephyr-conf among them), which is exactly where tan-cli#639's bad
      # `CONFIG_ALP_SDK_CHIP_NONE=y` line lands, and exactly where
      # E1M-NX9101's `SdkRevisionNotBuildable` refusal fires.
      - name: "tan generate"
        working-directory: release-workspace/my-app
        env:
          MATRIX_EXPECT_REFUSE: ${{ matrix.expect_refuse }}
        run: |
          set -euo pipefail
          set +e
          tan generate --format json > /tmp/rc-generate-${SKU}.json
          rc=$?
          set -e
          cat /tmp/rc-generate-${SKU}.json
          if [ ! -s /tmp/rc-generate-${SKU}.json ]; then
            echo "::error::[${SKU}] 'tan generate' exited ${rc} without writing an envelope at all (nothing on stdout)."
            exit "$(( rc == 0 ? 1 : rc ))"
          fi
          python3 - "$SKU" "$rc" "${MATRIX_EXPECT_REFUSE}" <<'PY'
          import json, sys
          sku, rc, expect_refuse = sys.argv[1], int(sys.argv[2]), sys.argv[3] == "true"
          path = f"/tmp/rc-generate-{sku}.json"
          try:
              e = json.load(open(path))
          except json.JSONDecodeError as exc:
              # The file is non-empty (the `-s` check above already ruled out
              # "wrote nothing"), but what landed on stdout isn't a JSON
              # envelope at all -- e.g. a raw Python/Rust crash trace. Without
              # this guard `json.load` throws and the step still fails the
              # job, but with an unhandled traceback instead of the
              # ::error:: this gate promises for every 'tan' invocation.
              print(f"::error::[{sku}] 'tan generate' exited {rc} but did not write a valid JSON envelope ({exc}).")
              sys.exit(rc or 1)
          ok = e.get("ok")
          issues = e.get("issues") or []

          if expect_refuse:
              # E1M-NX9101 is a genuine placeholder (silicon_variant: TBD) --
              # a CONTROLLED refusal is the pass condition here, and an
              # unexpected `ok:true` is itself news: either the SoM went
              # live and this matrix entry is stale, or the refusal broke.
              if ok:
                  print(f"::error::[{sku}] expected a controlled refusal (this SKU's hw_rev is `status: tbd`) but 'tan generate' reported ok:true -- either the SoM shipped for real (update this matrix's `expect_refuse`) or the SdkRevisionNotBuildable refusal regressed.")
                  sys.exit(1)
              messages = " ".join(i.get("message", "") for i in issues)
              if "not buildable" not in messages or "tbd" not in messages.lower():
                  print(f"::error::[{sku}] 'tan generate' refused, but not with the expected SdkRevisionNotBuildable reason (hw_rev exists but is not buildable / status tbd). Got:", json.dumps(issues, indent=2))
                  sys.exit(1)
              print(f"[{sku}] expected refusal confirmed:", json.dumps(issues, indent=2))
              sys.exit(0)

          if not ok:
              print(f"::error::[{sku}] 'tan generate' exited {rc}:", json.dumps(issues, indent=2))
              sys.exit(rc or 1)
          print(f"[{sku}] generate ok -- targets:", e.get("data", {}).get("targets"))
          PY

      # NX9101 stops here (matches the docs contract: buildable SKUs get the
      # full journey, this genuine placeholder is exercised only up to its
      # own documented refusal).
      - name: "tan build"
        if: ${{ !matrix.expect_refuse }}
        working-directory: release-workspace/my-app
        run: |
          set -euo pipefail
          set +e
          tan build --format json > /tmp/rc-build-${SKU}.json
          rc=$?
          set -e
          cat /tmp/rc-build-${SKU}.json
          if [ "$rc" -ne 0 ]; then
            echo "::error::[${SKU}] 'tan build' exited ${rc} -- see /tmp/rc-build-${SKU}.json above for the envelope (tan-cli#639's exact failure mode: a Kconfig configure abort on an undefined symbol)."
            exit "$rc"
          fi
          python3 - "$SKU" <<'PY'
          import json, sys
          sku = sys.argv[1]
          e = json.load(open(f"/tmp/rc-build-{sku}.json"))
          if not e.get("ok"):
              print(f"::error::[{sku}] 'tan build' exited 0 but the envelope reports ok:false:", json.dumps(e.get("issues"), indent=2))
              sys.exit(1)
          print(f"[{sku}] build ok")
          PY

      # `tan build` reporting ok while producing no ELF is the tan-cli#97
      # defect class. Located by CORE rather than a hardcoded
      # `<core>-zephyr/...` path: that directory-naming convention is an
      # implementation detail this gate should not have to track a second
      # copy of (getting-started.yml's own hardcoded m55_hp path is the
      # thing to keep in sync if this ever needs tightening, not duplicate).
      - name: the built ELF exists and is ARM
        if: ${{ !matrix.expect_refuse }}
        working-directory: release-workspace/my-app
        run: |
          set -euo pipefail
          ELF="$(find build -type f -name zephyr.elf -path "*${CORE}*" | head -1)"
          if [ -z "${ELF}" ]; then
            echo "::error::[${SKU}] 'tan build' reported success but no zephyr.elf under a '*${CORE}*' build directory exists. Tree:"
            find build -maxdepth 3 -type d || true
            find build -name 'zephyr.elf' || true
            exit 1
          fi
          file "${ELF}"
          if ! file "${ELF}" | grep -q "ARM"; then
            echo "::error::[${SKU}] ${ELF} is not an ARM image -- a Zephyr slice produced a host binary."
            exit 1
          fi
          echo "[${SKU}] confirmed: ${ELF}"

      - name: upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-combination-${{ matrix.sku }}-${{ matrix.combination }}
          path: |
            /tmp/rc-bootstrap-*.json
            /tmp/rc-bootstrap-*.stderr
            /tmp/rc-init-*.json
            /tmp/rc-generate-*.json
            /tmp/rc-build-*.json
          if-no-files-found: warn
